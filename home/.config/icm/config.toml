# ICM — CODE profile (DEFAULT). Per-machine overrides merged over baked
# config/default.toml. Loaded whenever ICM_CONFIG is unset.
#
# Two embedding profiles are configured on this host:
#   • CODE profile (THIS FILE, default)
#       jinaai/jina-embeddings-v2-base-code (768d, code-optimized)
#       corpus: /home/flexnetos/meta/var/lib/icm/memories.db
#   • FAST profile → ~/.config/icm/config.fast.toml
#       Xenova/bge-small-en-v1.5 (384d, English-only, fastest)
#       corpus: /home/flexnetos/meta/var/lib/icm/memories-fast.db
#       select with (needs BOTH — the CLI reads the DB only from --db):
#         ICM_CONFIG=~/.config/icm/config.fast.toml \
#           icm --db /home/flexnetos/meta/var/lib/icm/memories-fast.db <cmd>
#
# This is a code-heavy deployment, so the DEFAULT uses the code-optimized model
# instead of the general multilingual default.

[embeddings]
model = "jinaai/jina-embeddings-v2-base-code"  # 768d, code-optimized

# Full-feature: enable the async LLM extraction + consolidation summarizers.
# Providers only fire on explicit `icm extract-pending` / `icm consolidate`
# (auto_consolidate stays OFF to avoid collapsing in-flight working memories).
[extraction.summarizer]
provider = "auto"

[consolidate.summarizer]
provider = "auto"
