# ICM — FAST profile (English-only, lowest latency, 384d).
#
# One of two ICM embedding profiles on this host:
#   • CODE profile (DEFAULT) → ~/.config/icm/config.toml
#       jinaai/jina-embeddings-v2-base-code (768d, code-optimized)
#       corpus: /home/flexnetos/meta/var/lib/icm/memories.db   (plain `icm ...`)
#   • FAST profile (THIS FILE)
#       Xenova/bge-small-en-v1.5 (384d, English-only, fastest)
#       corpus: /home/flexnetos/meta/var/lib/icm/memories-fast.db
#
# ── HOW TO SELECT THIS PROFILE ────────────────────────────────────────────
# This file supplies the *model*. The CLI resolves the *database* ONLY from
# the --db flag (config [store].path and the ICM_DB env var are NOT honored
# by icm 0.10.57 — verified). So the fast profile needs BOTH overrides:
#
#   ICM_CONFIG=~/.config/icm/config.fast.toml \
#     icm --db /home/flexnetos/meta/var/lib/icm/memories-fast.db recall "query"
#
#   ICM_CONFIG=~/.config/icm/config.fast.toml \
#     icm serve --db /home/flexnetos/meta/var/lib/icm/memories-fast.db      # MCP, fast corpus
#
# A 384d index cannot share the code profile's 768d store; each model owns its
# own DB. Topics/memories do NOT sync between the two corpora.

[embeddings]
model = "Xenova/bge-small-en-v1.5"  # 384d, English-only (fastest)

# Full-feature parity with the code profile: async LLM extraction +
# consolidation summarizers. Providers fire only on explicit
# `icm extract-pending` / `icm consolidate`.
[extraction.summarizer]
provider = "auto"

[consolidate.summarizer]
provider = "auto"
