# kasetto — GLOBAL personal baseline (follows you into every project).
#
# Layering: this is the agent layer that applies everywhere; per-project kasetto.yaml files
# (e.g. envctl) layer repo-specific skills on top. The OS/toolchain layer is envctl.
#
# Source of truth = the IN-META agent-skills (envctl owns it at ~/Desktop/meta/envctl/agent-skills),
# consumed by the built-in `envctl agent sync` (external kasetto binary retired, TASK-0018/0040 —
# config resolution is now agent-env.yaml/agent-env.lock; this global overlay file keeps its
# kasetto/ path as a managed runtime OUTPUT). No remote FlexNetOS/agent-skills coupling.
#
# ⚠️ SAFETY — read before enabling `mcps:` below:
#   Your global agent already has hand-configured MCP servers (broker, repowire, weave).
#   A global `envctl agent sync` MANAGES the global MCP destination; before enabling any `mcps:`
#   here, run `envctl agent sync --global --dry-run` and confirm it ADDS servers without REMOVING
#   broker/repowire/weave. If it would remove them, list them here too (or keep mcps disabled
#   and let the agent-env engine manage skills only). Skills install additively into /run/user/1001/yazelix/profile-runtime/claude/skills and
#   are safe.

scope: global
agent:
  - claude-code
  - codex

# --- Skills: add GENERAL, cross-project skills here (NOT envctl-specific ones). ---
# The current agent-skills are envctl-grounded, so they belong in envctl's project config,
# not globally. Point this at the shared repo and curate which skills are global-worthy.
# skills:
#   - source: $META_ROOT/var/lib/agent-skills
#     skills:
#       - <a-general-skill>

# --- MCP baseline (general-purpose servers useful in every repo). ---
# Enabled after dry-run confirmed kasetto ADDS these without touching broker/repowire/weave.
# Source = the IN-META agent-skills (envctl owns it at ~/Desktop/meta/envctl/agent-skills), so a
# sync resolves the MCP defs locally — no network, no remote FlexNetOS/agent-skills coupling.
# Consumed by the built-in `envctl agent sync` (external kasetto binary retired, TASK-0018/0040).
mcps:
  - source: ~/Desktop/meta/envctl/agent-skills
    mcps:
      - context7
      - exa
      - sequential-thinking
