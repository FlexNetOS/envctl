model = "gpt-5.5"
approval_policy = "never"
sandbox_mode = "danger-full-access"
default_permissions = ":danger-full-access"
project_doc_max_bytes = 65536
tool_output_token_limit = 12000

[features]
fast_mode = false
hooks = false
plugins = false
remote_plugin = false
network_proxy = false
unified_exec = true
shell_snapshot = true
multi_agent = true

[agents]
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 1800
