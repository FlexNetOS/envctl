model = "gpt-5.5"
default_permissions = "harness-local-models"
project_doc_max_bytes = 65536
tool_output_token_limit = 12000

[features]
fast_mode = false
hooks = true
plugins = false
remote_plugin = false
network_proxy = false
unified_exec = true
shell_snapshot = true
multi_agent = true

[agents]
max_threads = 3
max_depth = 1
job_max_runtime_seconds = 1800
