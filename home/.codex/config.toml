# FlexNetOS policy:
# - /home/flexnetos/FlexNetOS is the Codex session root.
# - src/meta and its FlexNetOS original project set are additive-only upgrade
#   targets. Downgrade/reset/delete/remove/overwrite operations must archive
#   affected state first and write a compressed artifact before continuing.
# - Full filesystem access is not the harness default. Named permission
#   profiles restrict reads/writes, and project hooks enforce archive-first
#   and additive-only gates.

[permissions.harness-read-only]
description = "Read-only envctl harness profile with no network table, so sandboxed network is disabled."

[permissions.harness-read-only.filesystem]
glob_scan_max_depth = 4
":minimal" = "read"
"/home/flexnetos/lifeos/src/envctl" = "read"
"/home/flexnetos/lifeos/src/envctl/home" = "read"
"/home/flexnetos/lifeos/src/envctl/home/agent-env" = "read"
"/home/flexnetos/.codex/auth.json" = "deny"
"/home/flexnetos/.ssh" = "deny"
"/home/flexnetos/.gnupg" = "deny"

[permissions.harness-read-only.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/*token*" = "deny"
"**/*secret*" = "deny"

[permissions.harness-workspace]
description = "Write-limited envctl harness profile with no network table, so sandboxed network is disabled."

[permissions.harness-workspace.filesystem]
glob_scan_max_depth = 4
":minimal" = "read"
"/home/flexnetos/lifeos/src/envctl" = "read"
"/home/flexnetos/lifeos/src/envctl/home/.codex" = "write"
"/home/flexnetos/lifeos/src/envctl/home/AGENTS.md" = "write"
"/home/flexnetos/lifeos/src/envctl/home/agent-env" = "write"
"/home/flexnetos/lifeos/src/envctl/home/agent-env/worktrees" = "write"
"/home/flexnetos/.codex/auth.json" = "deny"
"/home/flexnetos/.ssh" = "deny"
"/home/flexnetos/.gnupg" = "deny"

[permissions.harness-workspace.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/*token*" = "deny"
"**/*secret*" = "deny"

[permissions.harness-local-models]
description = "Envctl harness local-model profile with localhost-only Ollama access."

[permissions.harness-local-models.filesystem]
glob_scan_max_depth = 4
":minimal" = "read"
"/home/flexnetos/lifeos/src/envctl" = "read"
"/home/flexnetos/lifeos/src/envctl/home/agent-env" = "write"
"/home/flexnetos/.codex/auth.json" = "deny"
"/home/flexnetos/.ssh" = "deny"
"/home/flexnetos/.gnupg" = "deny"

[permissions.harness-local-models.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/*token*" = "deny"
"**/*secret*" = "deny"

[permissions.harness-local-models.network]
enabled = true
allow_local_binding = true

[permissions.harness-local-models.network.domains]
"127.0.0.1" = "allow"
"localhost" = "allow"
"::1" = "allow"

[permissions.harness-research]
description = "Read-only research profile. Network remains disabled unless a narrower docs network profile is approved."

[permissions.harness-research.filesystem]
glob_scan_max_depth = 4
":minimal" = "read"
