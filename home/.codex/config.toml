# FlexNetOS policy:
# - /home/flexnetos/.codex/config.toml is the active Codex runtime config.
# - /home/flexnetos/meta/src/envctl is the envctl source of truth.
# - /home/flexnetos/meta and its original project set are additive-only upgrade targets.
#   Downgrade/reset/delete/remove/overwrite operations must archive affected
#   state first and write evidence before continuing.
# - Retired clean-room lifecycle hooks stay disabled until deliberately rebuilt.
# - The active emergency repair lane is full-access local execution. Historical
#   named read-only/workspace profiles below are retained only for explicit,
#   future opt-in runs; they are not the default and must not be used as a
#   refusal/blocking excuse.

[permissions.harness-read-only]
description = "Read-only envctl harness profile with no network table, so sandboxed network is disabled."

[permissions.harness-read-only.filesystem]
glob_scan_max_depth = 4
":minimal" = "read"
"/home/flexnetos/meta/src/envctl" = "read"
"/home/flexnetos/meta/src/envctl/home" = "read"
"/home/flexnetos/meta/src/envctl/home/agent-env" = "read"
"/home/flexnetos/.codex/auth.json" = "deny"
"/home/flexnetos/.ssh" = "deny"
"/home/flexnetos/.gnupg" = "deny"

[permissions.harness-read-only.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/*token*" = "deny"
"**/*secret*" = "deny"

[permissions.harness-workspace]
description = "Write-limited envctl harness profile with no network table, so sandboxed network is disabled."

[permissions.harness-workspace.filesystem]
glob_scan_max_depth = 4
":minimal" = "read"
"/home/flexnetos/meta/src/envctl" = "read"
"/home/flexnetos/meta/src/envctl/home/.codex" = "write"
"/home/flexnetos/meta/src/envctl/home/AGENTS.md" = "write"
"/home/flexnetos/meta/src/envctl/home/agent-env" = "write"
"/home/flexnetos/meta/src/envctl/home/agent-env/worktrees" = "write"
"/home/flexnetos/.codex/auth.json" = "deny"
"/home/flexnetos/.ssh" = "deny"
"/home/flexnetos/.gnupg" = "deny"

[permissions.harness-workspace.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/*token*" = "deny"
"**/*secret*" = "deny"

[permissions.harness-local-models]
description = "Envctl harness local-model profile with localhost-only Ollama access."

[permissions.harness-local-models.filesystem]
glob_scan_max_depth = 4
":minimal" = "read"
"/home/flexnetos/meta/src/envctl" = "read"
"/home/flexnetos/meta/src/envctl/home/agent-env" = "write"
"/home/flexnetos/.codex/auth.json" = "deny"
"/home/flexnetos/.ssh" = "deny"
"/home/flexnetos/.gnupg" = "deny"

[permissions.harness-local-models.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/*token*" = "deny"
"**/*secret*" = "deny"

[permissions.harness-local-models.network]
enabled = true
allow_local_binding = true

[permissions.harness-local-models.network.domains]
"127.0.0.1" = "allow"
"localhost" = "allow"
"::1" = "allow"

[permissions.harness-research]
