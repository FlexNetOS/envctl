[task.openrouter]
model = "tencent/hy3:free"
provider = "openrouter"
profile = "envctl-openrouter-gpt"
network_required = true
privacy_class = "external-provider"

[task.claude_bridge]
model = "claude-sonnet-5"
provider = "claude-bridge"
profile = "envctl-claude-bridge"
network_required = true
privacy_class = "external-provider"

[task.browser_computer]
model = "gpt-5.6-terra"
provider = "openai"
profile = "envctl-browser-computer"
network_required = true
privacy_class = "screenshot-risk"

[task.github]
model = "gpt-5.6-sol"
provider = "openai"
profile = "envctl-github-full-access"
network_required = true
privacy_class = "repo-mutation"

[task.model_access_proof]
model = "gpt-5.6-terra"
provider = "openai"
profile = "envctl-gpt56-terra"
proof_tool = "codex-harness-model-access probe"
required_models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna"]
network_required = true
privacy_class = "codex-account"
