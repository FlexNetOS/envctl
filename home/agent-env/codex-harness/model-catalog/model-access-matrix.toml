# Harness model access matrix generated from official docs plus live Codex probes.
# account_access values are evidence, not wishful availability.

[groups.codex_chatgpt_proved]
models = ["gpt-5.5", "gpt-5.4", "gpt-5.4-mini", "gpt-5.3-codex-spark"]
proof = "codex exec --ephemeral --json --color never -m <model> exact-marker prompt"

[groups.codex_chatgpt_denied]
models = ["gpt-5.6-sol", "gpt-5.6-terra", "gpt-5.6-luna", "gpt-5.4-nano", "gpt-5.3-codex", "o3", "o4-mini"]
error_contains = "model is not supported when using Codex with a ChatGPT account"

[groups.tracked_needs_probe]
models = ["o3-pro", "o3-mini", "gpt-4.1", "gpt-4.1-mini", "gpt-4.1-nano", "gpt-4o", "gpt-4o-mini"]
reason = "API/legacy catalog entries tracked for routing audits; do not use for work until codex-harness-model-access proves access."

[models."gpt-5.6-sol"]
provider = "openai"
profile = "envctl-gpt56-sol"
account_access = "denied_by_live_codex_chatgpt_probe"
source = "OpenAI Help GPT-5.6 preview: limited trusted partners/orgs; ChatGPT not included during preview"

[models."gpt-5.6-terra"]
provider = "openai"
profile = "envctl-gpt56-terra"
