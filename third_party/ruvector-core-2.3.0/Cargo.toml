[dependencies.crossbeam]
version = "0.8"
optional = true

[dependencies.dashmap]
version = "6.1"

[dependencies.hf-hub]
version = "0.4"
optional = true

[dependencies.hnsw_rs]
version = "0.3"
optional = true

[dependencies.lattice-embed]
version = "0.6"
optional = true

[dependencies.memmap2]
version = "0.9"
optional = true

[dependencies.ndarray]
