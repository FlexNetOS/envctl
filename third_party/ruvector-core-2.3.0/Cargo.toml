[package]
edition = "2021"
rust-version = "1.77"
name = "ruvector-core"
version = "2.3.0"
authors = ["Ruvector Team"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "High-performance Rust vector database core with HNSW indexing"
readme = "README.md"
license = "MIT"
repository = "https://github.com/ruvnet/ruvector"

[features]
api-embeddings = ["reqwest"]
default = [
    "simd",
    "simd-avx512",
    "storage",
    "hnsw",
    "api-embeddings",
    "parallel",
]
hnsw = ["hnsw_rs"]
lattice-embeddings = [
    "dep:lattice-embed",
    "dep:tokio",
]
memory-only = []
onnx-embeddings = [
    "ort",
    "tokenizers",
    "hf-hub",
]
parallel = [
    "rayon",
    "crossbeam",
]
real-embeddings = []
simd = ["simsimd"]
simd-avx512 = []
storage = [
    "redb",
    "memmap2",
]
uuid-support = []

[lib]
name = "ruvector_core"
crate-type = ["rlib"]
path = "src/lib.rs"
bench = false

[[example]]
