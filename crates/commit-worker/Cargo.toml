[package]
name = "envctl-commit-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[features]
default = []
pg-integration = []

[dependencies]
# `with-serde_json-1` lets jsonb parameters and columns cross the boundary as
# `serde_json::Value`, which the substrate producers pass to the canonical
# envelope functions. serde_json is already a dependency; this adds no crates.
postgres = { version = "0.19", features = ["with-serde_json-1"] }
reqwest = { workspace = true, features = ["blocking"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha3 = { workspace = true }
# CLI entry point only (src/bin/envctl-commit-worker.rs); the library itself
# stays CLI-agnostic. Already a pinned workspace dependency elsewhere, so this
# adds zero new crates to the lockfile.
clap = { workspace = true }
