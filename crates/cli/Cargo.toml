[package]
name = "envctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "envctl"

[[bin]]
name = "envctl"
path = "src/main.rs"

[dependencies]
envctl-engine = { workspace = true }
clap = { workspace = true }
# Pure-Rust shell-completion generation for the CLI-only `completions <shell>` verb (TASK-0019).
clap_complete = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
# self-update CLI half (TASK-0019): download/extract/atomic-replace of the running binary.
# Reuses the agent-env blocking HTTP client; tar + flate2(rust_backend) + sha2 are pure-Rust
# (no new C — proven by ci/gates/no-c.sh).
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
envctl-agent-env = { path = "../agent-env" }
reqwest = { workspace = true }
# Meta plugin: envctl ships the `meta-env` subprocess plugin (src/bin/meta-env.rs) so
# `meta env <verb>` dispatches into envctl — native meta_plugin_protocol adoption. The
# protocol is pure-Rust (serde only); indexmap is pure-Rust (hashbrown) — ZERO C
# (no-c.sh unaffected). Path dep into the meta tree (envctl is meta-tree-resident).
meta_plugin_protocol = { path = "../../../meta_plugin_protocol" }
indexmap = "2"
