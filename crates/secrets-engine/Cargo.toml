[package]
name = "envctl-secrets-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "envctl_secrets"
path = "src/lib.rs"

[features]
default = ["inmem-store", "mitm-ca"]   # default store is inmem until OI-1 is ruled (no C dep ships)
inmem-store = []                       # RAM-only vault for tests/CI (envctl DryRunRunner analogue)
mitm-ca = ["dep:rcgen", "dep:x509-parser", "dep:rustls", "dep:rustls-pki-types", "dep:time"]
provider-github = [
  "dep:base64",
  "dep:const-num-traits",
  "dep:fixed-bigint",
  "dep:pkcs1",
  "dep:pkcs8",
  "dep:rsa-ct",
  "dep:sha2-rs256",
] # fixed-width Ct/blinded RS256 App-JWT → installation token (src/mint_github.rs)
sqld-auth = ["dep:base64"]                    # one-shot Ed25519 SPKI + EdDSA JWT bootstrap
provider-openai = []
seed-factor = ["dep:rustls", "dep:rustls-pki-types"]   # Cognitum Seed USB possession factor (ring is now an unconditional engine dep — see [dependencies]) (opt-in). Direct pure-Rust HTTPS to the Seed's REST custody API, TLS validated against the PINNED Cognitum CA (ring-only rustls — already in the resolved graph, so no-C gate stays green) + ring Ed25519 verify for Profile S. No `ssh`/subprocess; the Yazelix process boundary remains closed. See PLAN-cognitum-seed-envctl-vault-factor.md
# TEST-SPEED ONLY (TASK-0032): lowers the Argon2 floor + Default params so the CI `test` job's
# argon2id derivations cost ~8 KiB×t1 instead of 256 MiB-1 GiB. NOT in `default`, NEVER ship — a
# release build with this feature trips a compile_error! (see keyslot.rs). Production crypto is
# byte-for-byte unchanged on default/release builds.
low-cost-kdf-tests = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
which = { workspace = true }
rustix = { workspace = true }
# crypto (pure-Rust, no C/SQLCipher)
chacha20poly1305 = { workspace = true }
argon2 = { workspace = true }
hkdf = { workspace = true }
sha2 = { workspace = true }
blake3 = { workspace = true }
zeroize = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
getrandom = { workspace = true }
# tls/ca — OPTIONAL, only under mitm-ca (a CA-less engine build drops TLS entirely)
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }
# Sub-day (hours-granular) cert validity windows for mitm-ca leaves. Pure-Rust, no C; already in the
# resolved graph transitively (via x509-parser's asn1-rs). default-features=false drops std/macros.
time = { version = "0.3", optional = true, default-features = false }
# GitHub App-JWT mint (provider-github). The RSA package is exact-pinned, no-alloc, and exposes
# only its fixed-width modmath backend; ci/gates/no-c.sh locks this feature graph fail-closed.
base64 = { workspace = true, optional = true }
rsa-ct = { workspace = true, optional = true }
fixed-bigint = { workspace = true, optional = true }
const-num-traits = { workspace = true, optional = true }
pkcs1 = { workspace = true, optional = true }
pkcs8 = { workspace = true, optional = true }
sha2-rs256 = { workspace = true, optional = true }
# ring is the sanctioned RNG/verifier (same crate rustls already pins on); already in the resolved
# graph, so no-C stays green. Non-optional because the broker's anti-replay nonce store
# (broker::nonce, TASK-0031-PR2) injects `ring::rand::SecureRandom` on its always-built `issue` path;
# the seed-factor Ed25519 verify path also relies on it.
ring = { version = "0.17" }
# the one async seam
async-trait = { workspace = true }

[dev-dependencies]
# Pure-Rust executor to drive the single async method (`relay_swap`) from sync integration tests via
# `block_on`. NO runtime in [dependencies]; tokio stays banned from the engine crate.
futures-executor = "0.3"
