[package]
name = "envctl-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "envctl_engine"
path = "src/lib.rs"

[dependencies]
# The pure-Rust agent-env provisioning core (kasetto absorption, Epic C). No C in the trust
# boundary: gzip via miniz_oxide, tar pure-Rust, reqwest→rustls→ring. The ONLY new dep.
envctl-agent-env = { path = "../agent-env" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
which = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
rustix = { workspace = true }
# self-update / update-notifier (TASK-0019): reuse the agent-env blocking HTTP client
# (envctl_agent_env::source::http_client — reqwest→rustls→ring). tar + flate2(rust_backend)
# + sha2 are the same pure-Rust deps the agent-env crate already links — ZERO new C
# (proven by ci/gates/no-c.sh). The engine half is the non-printing decision/data core.
reqwest = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
# TASK-0028: zeroize the secret stdin buffer (revoke token) the engine pipes to `secretctl`.
# Pure-Rust, already a workspace dep used by the secrets crates — links NO C (no-c.sh unaffected).
zeroize = { workspace = true }
# migration_db: event-sourced migration automation store (targets/recipes/runs/operations/events/
# evidence/artifacts/approvals/validations/checkpoints/rollbacks/sessions). Pure-Rust redb — the
# fleet ledger store family (handoff ADR-0017, CodeDB) — NOT SQLite; no-c.sh boundary holds.
redb = { workspace = true }
# Meta wiring: loop_lib is meta's shared command-construction substrate. The engine's hook
# runner delegates std::process::Command *construction* to `loop_lib::build_command` while
# keeping its own supervision (setsid/timeout/streaming/tee). If loop_lib lacks a needed API,
# upgrade loop_lib first — never bypass or remove it from envctl.
loop_lib = { path = "../../../loop_lib" }
# RuVector system (slice 0): optional, feature-gated — default builds unchanged. The semantic
# store client layer for the Database-Hosted Codebase (Gemini-session architecture): vectors +
# HNSW (ruvector-core), edge LLM runtime (ruvllm), AgentDB .rvf store (rvf-runtime/-types).
# Registry pins only (see workspace table). Enable with `--features ruvector`.
ruvector-core = { workspace = true, optional = true }
ruvllm = { workspace = true, optional = true }
rvf-runtime = { workspace = true, optional = true }
rvf-types = { workspace = true, optional = true }
# pgrx-based Postgres extension crate — heaviest, needs pg headers; its own feature.
ruvector-postgres = { workspace = true, optional = true }

[features]
default = []
# Client-side RuVector stack (pure-Rust default features; no-c.sh proven).
ruvector = ["dep:ruvector-core", "dep:ruvllm", "dep:rvf-runtime", "dep:rvf-types"]
# Server-side extension crate on top (pgrx; requires pg headers at build time).
ruvector-pg = ["ruvector", "dep:ruvector-postgres"]
