[package]
name = "envctl-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "envctl_engine"
path = "src/lib.rs"

[dependencies]
# The pure-Rust agent-env provisioning core (kasetto absorption, Epic C). No C in the trust
# boundary: gzip via miniz_oxide, tar pure-Rust, reqwest→rustls→ring. The ONLY new dep.
envctl-agent-env = { path = "../agent-env" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
which = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
rustix = { workspace = true }
# self-update / update-notifier (TASK-0019): reuse the agent-env blocking HTTP client
# (envctl_agent_env::source::http_client — reqwest→rustls→ring). tar + flate2(rust_backend)
# + sha2 are the same pure-Rust deps the agent-env crate already links — ZERO new C
# (proven by ci/gates/no-c.sh). The engine half is the non-printing decision/data core.
reqwest = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
