[package]
name = "envctl-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "envctl_engine"
path = "src/lib.rs"

[dependencies]
# The pure-Rust agent-env provisioning core (kasetto absorption, Epic C). No C in the trust
# boundary: gzip via miniz_oxide, tar pure-Rust, reqwest→rustls→ring. The ONLY new dep.
envctl-agent-env = { path = "../agent-env" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
sysinfo = { workspace = true }
which = { workspace = true }
chrono = { workspace = true }
glob = { workspace = true }
rustix = { workspace = true }
# self-update / update-notifier (TASK-0019): reuse the agent-env blocking HTTP client
# (envctl_agent_env::source::http_client — reqwest→rustls→ring). tar + flate2(rust_backend)
# + sha2 are the same pure-Rust deps the agent-env crate already links — ZERO new C
# (proven by ci/gates/no-c.sh). The engine half is the non-printing decision/data core.
reqwest = { workspace = true }
tar = { workspace = true }
flate2 = { workspace = true }
sha2 = { workspace = true }
# TASK-0028: zeroize the secret stdin buffer (revoke token) the engine pipes to `secretctl`.
# Pure-Rust, already a workspace dep used by the secrets crates — links NO C (no-c.sh unaffected).
zeroize = { workspace = true }
# Meta wiring: loop_lib is meta's shared command-construction substrate. The engine's hook
# runner delegates std::process::Command *construction* to `loop_lib::build_command` while
# keeping its own supervision (setsid/timeout/streaming/tee). loop_lib is pure-Rust
# (anyhow/rayon/serde/serde_json/colored/indicatif/is-terminal) — ZERO C; enforced by the new
# envctl-engine gate in ci/gates/no-c.sh. Path dep into the meta tree (envctl lives in meta).
loop_lib = { path = "../../../loop_lib" }
