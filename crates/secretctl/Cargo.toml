[package]
name = "envctl-secretctl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "secretctl"
path = "src/main.rs"

[dependencies]
envctl-secrets-proto = { workspace = true }
# The engine edge: `env-ctl run` calls `Engine::run_child` in-process to spawn the child with the
# daemon-built env injection (bearer-only). The `provider-github` feature is enabled so the TASK-0026
# `github-app enroll` path can VALIDATE the App PEM client-side via `build_app_jwt` and reference the
# `GITHUB_APP_KEY_NAME` const VERBATIM (no literal-drift from the mint reader). Pure-Rust (rsa +
# base64, RustCrypto) — adds no banned C to the trust boundary.
envctl-secrets-engine = { workspace = true, features = ["provider-github"] }
tonic = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }
# tower (service_fn) + hyper-util (TokioIo) build the classic UDS client connector for tonic's
# Channel (which cannot bind a UDS directly). Both are workspace-pinned — no NEW workspace dep.
tower = { workspace = true }
hyper-util = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }
# Wrap the App PEM bytes in `Zeroizing` from read until they cross the wire (never logged/echoed).
zeroize = { workspace = true }
# TASK-0033 `authorizer serve` (operator-box presence-token signer over mTLS, Profile B / OI-SM-2).
# All ring-only + workspace-pinned and ALREADY in the resolved graph (secretd/engine pull them), so
# promoting them to direct secretctl deps adds NO new lockfile crate and keeps the no-c / one-rustls
# (ring) gate green. The signer reuses `engine::sign_presence_token` (the engine owns the signing
# primitive); this crate adds only the thin mTLS server I/O.
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
ring = { version = "0.17" }
sha2 = { workspace = true }
