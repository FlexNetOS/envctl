[workspace]
resolver = "2"
members = [
  "crates/agent-env",
  "crates/engine",
  "crates/cli",
  "crates/commit-worker",
  "crates/gui",
  "crates/secrets-engine",
  "crates/secrets-proto",
  "crates/secretd",
  "crates/secretctl",
  "crates/secrets-store-libsql",
]
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# --- shared rows: keep envctl's tighter pins (superset of env-ctl's caret) ---
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.135"
# pure-Rust YAML (already in the resolved graph via protox/prost-reflect build path);
# the engine dashboard module reads `.meta.yaml`. Links no C (proven by ci/gates/no-c.sh).
serde_yaml = "0.9.34"
toml = "0.8.19"
# Pure-Rust Rust-source parser for the db_symbols syn extraction pass (crate/
# module/item/import/clap). syn→proc-macro2→quote→unicode-ident are all pure Rust
# (no C in the trust boundary; no-c.sh unaffected). proc-macro2 carries
# `span-locations` so extracted items get real line spans in the runtime fallback.
syn = { version = "2.0.117", features = ["full"] }
proc-macro2 = { version = "1.0.106", features = ["span-locations"] }
anyhow = "1.0.103"
thiserror = "2.0.11"
chrono = { version = "0.4.39", default-features = false, features = ["clock"] }
clap = { version = "4.5.27", features = ["derive"] }
# Pure-Rust shell-completion generation (clap + clap_lex only; no C). Proven C-free by
# ci/gates/no-c.sh. Used by the CLI-only `envctl completions <shell>` verb.
clap_complete = "4.5"
which = "7.0.1"
# --- CONFLICT 1 (HF-17 + OI-6): rustix feature delta. envctl=["process"],
# --- env-ctl=["process","net","time"]. UNION wins (`time` = CLOCK_BOOTTIME for the
# --- OI-6 monotonic clock-rollback fence on the 24h relay window). All pure-Rust on Linux. ---
rustix = { version = "0.38", features = ["process", "net", "time", "fs"] }
# Pure-Rust FFI bindings (extern "C" decls only — compiles no C, links no new C lib) used solely by
# secretd for the in-process `mlockall` syscall (FS-S4). Already resolved transitively in secretd's
# tree (tokio -> signal-hook-registry -> errno -> libc), so this pin adds ZERO new lockfile crates.
# NOT on the no-c banned list (aws-lc/openssl/sqlite/mimalloc) — ci/gates/no-c.sh stays green.
libc = "0.2"
# --- envctl-only rows (unchanged) ---
sysinfo = "0.33.1"
glob = "0.3.1"
# Keep the GUI on the MSRV-compatible egui API line without eframe's full
# default feature set: accesskit pulls the unmaintained `paste` proc macro on
# Windows. Both native Linux display backends remain supported. The local
# wayland-scanner and epaint patches below remove their advisory-only parser
# paths without changing the stock eframe/egui 0.33 API or the MSRV.
eframe = { version = "0.33.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.33.2"
egui_extras = "0.33.2"
# --- env-ctl-only rows (added verbatim; no conflict — none of these names exist in envctl today) ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pure-Rust systemd readiness protocol (Type=notify). Writes the READY=1/STOPPING=1 datagram to
# $NOTIFY_SOCKET; a no-op when the env var is unset (safe in tests/non-systemd). Links no C — it is a
# tiny std-only UDS writer (proven by ci/gates/no-c.sh). Closes the secretd crash-loop (no READY=1 =>
# Type=notify 90s timeout => restart storm).
# Keep the systemd notify helper on the MSRV-compatible line. 0.5.x raises
# rust-version above the workspace floor (1.89) without changing envctl's use
# of READY=1 / STOPPING=1 datagrams.
sd-notify = "0.4.5"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "sync", "fs", "process", "signal", "time", "io-util"] }
# CVE-2024-47609 / GHSA-4jwc-w2hc-78qv: 0.12.3 is the first tonic 0.12 release with
# the accept-loop DoS fix. Keep the floor explicit so a stale lockfile cannot drift below it.
tonic = "0.12.3"
tonic-build = "0.12.3"
prost = "0.13"
tower = "0.5"
# Paired with the tonic floor above for the public relay listener; Cargo.lock currently resolves
# the workspace hyper line to 1.10.1 and ci/gates/cargo-audit.sh fails on vulnerable regressions.
hyper = { version = "1.10.1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "client-legacy"] }
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "stream"] }
webpki-roots = "0.26"
# agent-env (kasetto absorption, Epic C): pure-Rust gzip via miniz_oxide — NEVER zlib/zlib-ng C
# (`rust_backend`). `tar` is pure-Rust. Both proven C-free by ci/gates/no-c.sh Gate 3.5.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tar = "0.4"
# store backend (OI-1 (a)): libSQL `remote` only — default-features=false drops the bundled
# C-SQLite `core` (libsql-ffi/libsql-sys) so nothing C is linked (proven by ci/gates/no-c.sh Gate 3a).
libsql = { version = "0.9.30", default-features = false, features = ["remote"] }
# crypto (engine; pure-Rust, no C/SQLCipher)
chacha20poly1305 = { version = "0.10", features = ["alloc", "getrandom", "rand_core"] }
argon2 = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
# SHA-256 primitives used by the vault and agent-env identity paths.
sha2 = "0.10"
sha3 = "0.10"
# GitHub App JWT RS256 signer. This is a young fork/backend line, so exact pins, the fail-closed
# feature gate, the 2048..=8192 test matrix, and independent ring verification are compensating
# controls. `rsa_heapless` is intentionally pinned to its fixed-width, no-alloc `modmath` backend:
# enabling its defaults would restore the advisory-affected allocating RustCrypto backend.
# `fixed-bigint`'s Ct personality supplies fixed-iteration arithmetic and its
# zeroize/CIOS features wipe owned secret buffers while keeping the private operation pure Rust.
# `use-unsafe` is required on stable/MSRV because generic fixed-width array↔byte conversion cannot
# use nightly generic_const_exprs; its audited unsafe scope is only slice views over its own fixed
# `[u64; N]` arrays (no allocation, FFI, raw ownership transfer, or native code).
# Direct ref-only PKCS parsers preserve both GitHub PKCS#1 and operator PKCS#8 inputs without
# enabling rsa_heapless's alloc/encoding/std/keygen feature family.
rsa-ct = { package = "rsa_heapless", version = "=0.4.1", default-features = false, features = ["modmath"] }
fixed-bigint = { version = "=0.5.2", default-features = false, features = ["cios", "use-unsafe", "zeroize"] }
const-num-traits = { version = "=0.2.0", default-features = false, features = ["ct"] }
pkcs1 = { version = "=0.8.0-rc.4", default-features = false }
pkcs8 = { version = "=0.11.0", default-features = false }
sha2-rs256 = { package = "sha2", version = "=0.11.0", default-features = false, features = ["oid"] }
blake3 = "1.5"
# migration-db store (engine): pure-Rust embedded B-tree store — the same store family as the
# fleet's handoff ledger (ADR-0017) and CodeDB (which tracks the same major). Links NO C
# (no-c.sh unaffected); NOT SQLite. 4.x uses file format v3 exclusively: databases written by
# redb <= 2.x (format v2) must be migrated via redb 2.6's Database::upgrade() BEFORE a 4.x
# binary touches them. Requires rust_version 1.89 (workspace MSRV raised in step).
redb = "4.1"
zeroize = { version = "1.8", features = ["derive"] }
subtle = "2.6"
rand = "0.8"
getrandom = "0.2"
# GitHub App-JWT PEM/base64 support. RSA arithmetic is the pinned fixed-width Ct stack above;
# ring remains the independent post-sign verifier and OS-RNG provider.
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
# TLS / local CA: pin ONE rustls on the RING path (NOT aws-lc-rs)
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# MITM TLS termination (PR-3b, secretd `mitm-ca` only). default-features=false is MANDATORY: a bare
# `tokio-rustls = "0.26"` pulls aws-lc-rs and FAILS no-c. ring-only keeps the single pinned rustls 0.23.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
x509-parser = "0.16"
async-trait = "0.1"
# --- RuVector system (slice 0 + all-features upgrade, 2026-07-09): crates.io registry pins —
# --- NEVER the local meta-ruvector checkout (stale vs registry; operator directive
# --- "registries not repo"). Operator directive 2026-07-09: "we want ALL features so we need
# --- all dependents" — every Linux-viable feature is ON. None of the pulled deps is on the
# --- no-c.sh ban list (aws-lc/openssl/C-SQLite/mimalloc family): simsimd/onig compile C via
# --- build-time cc (gate-accepted); reqwest/hf-hub ride rustls-tls. Excluded:
# --- target-foreign features (macOS accelerate/coreml/metal/hybrid-ane, wasm/wasm-simd) and
# --- cuda/inference-cuda (needs nvcc at build; tracked follow-up), plus 2.3.0's
# --- lattice-embeddings because lattice-embed/lattice-inference 0.6.1 require Rust 1.93 and
# --- envctl's tested MSRV is 1.89. Still consumed by the
# --- engine behind the optional `ruvector` feature (default OFF) — default builds untouched.
# `onnx-embeddings` (ort) is the ONE exclusion: ort-sys's build-time binary downloader is
# ureq→native-tls→openssl-sys — on the no-c.sh HARD BAN list. Every other feature compatible
# with the target and the workspace MSRV is ON
# (default = simd+simd-avx512+storage+hnsw+api-embeddings+parallel). Embedding generation
# still flows via ruvllm hub-download/candle and the bun runtime. Re-adding ort requires an
# operator decision on the no-c ban list, not a manifest edit.
ruvector-core = { version = "2.3.0", features = ["real-embeddings", "uuid-support"] }
# Full profile: default (async-runtime, candle inference, routing-metrics, quantize,
# hub-download) + every additive Linux feature. `ruvector-full` = attention+gnn+graph stack.
# CUDA (fused-act/inference-cuda → cudarc + nvcc at build) is NOT here: it lives behind the
# engine's `ruvector-cuda` feature — CI runners have no nvcc; this workstation does
# (/usr/local/cuda-13.3, RTX 5090) and enables it explicitly.
# ruvllm's `parallel` is aarch64-only as published (gemv_parallel is arch-gated but
# re-exported unconditionally — E0432 on x86_64); rayon parallelism still arrives via
# ruvector-core's `parallel` and candle. Everything else additive is ON.
ruvllm = { version = "2.3.0", features = ["attention", "gnn", "graph", "gguf-mmap", "mmap", "ruvector-full"] }
# Maintained, wire-compatible serialization forks used by the exact crates.io-source patches
# below. Exact pins and old-byte fixtures prevent an advisory cleanup from changing persisted data.
bincode_reloaded = { version = "=3.1.10", features = ["serde"] }
fugue-bincode = "=1.3.4"
serde_cbor_2 = "=0.13.0"
ruvector-graph = { version = "=2.2.3", default-features = false }
# AgentDB's Rust surface is the RVF crate family — ruvnet publishes NO `agentdb` crate
# (crates.io `agentdb` 0.2.0 is a different author; never use it).
rvf-runtime = { version = "0.3.0", features = ["ed25519", "qr"] }
# rvf-types' `serde` feature is broken as published (serde derives on >32-byte arrays,
# E0277 ×20 — upstream never compiled it); std + ed25519 are the working full set.
rvf-types = { version = "0.2.1", features = ["std", "ed25519"] }
# Postgres extension crate (pgrx-based; needs pg headers at build) — separate engine feature
# `ruvector-pg`, default OFF: it is a server-side extension, not a client library.
ruvector-postgres = { version = "2.0.5", default-features = false, features = ["pg17"] }
# --- internal path deps: keep envctl's + add the three secrets path deps ---
envctl-engine = { path = "crates/engine" }
envctl-secrets-engine = { path = "crates/secrets-engine" }
envctl-secrets-proto = { path = "crates/secrets-proto" }
envctl-secrets-store-libsql = { path = "crates/secrets-store-libsql" }

# wayland-scanner 0.31.10 is the newest crates.io release compatible with the
# workspace's eframe 0.33/MSRV 1.89 line, but it pins vulnerable quick-xml 0.39.
# This exact-source local patch carries only the two already-merged upstream
# fixes documented in ENVCTL-PATCH.md; it preserves the GUI/Wayland capability
# without raising the workspace MSRV or importing unreleased breaking changes.
[patch.crates-io]
wayland-scanner = { path = "third_party/wayland-scanner-0.31.10" }
# Exact crates.io epaint 0.33.3 plus only the upstream Skrifa/vello_cpu font
# migration and traversal correction. ENVCTL-PATCH.md records the archive
# checksum, commit IDs, licenses, and stock-0.33 compatibility shim.
epaint = { path = "third_party/epaint-0.33.3" }
# Exact crates.io release sources with narrow maintained-dependency substitutions. The complete
# archive checksums, upstream commits, license inventory, and wire-compatibility evidence live in
# third_party/ADVISORY-PATCHES.md. These are never sourced from the stale meta-ruvector checkout.
gemm = { path = "third_party/gemm-0.19.0" }
gemm-0-18 = { package = "gemm", path = "third_party/gemm-0.18.2" }
gemm-c32 = { path = "third_party/gemm-c32-0.19.0" }
gemm-c32-0-18 = { package = "gemm-c32", path = "third_party/gemm-c32-0.18.2" }
gemm-c64 = { path = "third_party/gemm-c64-0.19.0" }
gemm-c64-0-18 = { package = "gemm-c64", path = "third_party/gemm-c64-0.18.2" }
gemm-common = { path = "third_party/gemm-common-0.19.0" }
gemm-common-0-18 = { package = "gemm-common", path = "third_party/gemm-common-0.18.2" }
gemm-f16 = { path = "third_party/gemm-f16-0.19.0" }
gemm-f16-0-18 = { package = "gemm-f16", path = "third_party/gemm-f16-0.18.2" }
gemm-f32 = { path = "third_party/gemm-f32-0.19.0" }
gemm-f32-0-18 = { package = "gemm-f32", path = "third_party/gemm-f32-0.18.2" }
gemm-f64 = { path = "third_party/gemm-f64-0.19.0" }
gemm-f64-0-18 = { package = "gemm-f64", path = "third_party/gemm-f64-0.18.2" }
hf-hub = { path = "third_party/hf-hub-0.4.3" }
hnsw_rs = { path = "third_party/hnsw_rs-0.3.4" }
macro_rules_attribute = { path = "third_party/macro_rules_attribute-0.2.2" }
pgrx = { path = "third_party/pgrx-0.12.9" }
pulp = { path = "third_party/pulp-0.22.3" }
ruvector-core = { path = "third_party/ruvector-core-2.3.0" }
ruvector-graph = { path = "third_party/ruvector-graph-2.2.3" }
ruvector-postgres = { path = "third_party/ruvector-postgres-2.0.5" }
ruvllm = { path = "third_party/ruvllm-2.3.0" }
tokenizers = { path = "third_party/tokenizers-0.20.4" }

# Build all crates in release for a snappy GUI.
[profile.release]
opt-level = 2
