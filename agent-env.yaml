# agent-env.yaml — agent environment for the envctl workspace.
# (Renamed from kasetto.yaml; the external kasetto binary was retired in TASK-0018/#98 and the
# absorbed engine is now `envctl agent`. The absorbed CLI resolves this filename by default.)
# Provisions a curated, locked agent toolkit (skills + MCP baseline) into the Codex environment.
# The retired root `.claude/skills` projection is deliberately not an agent-env destination;
# current Claude lifecycle settings are owned separately under `home/.claude/`. This is the source
# of truth for the agent config; it supersedes ECC-generated mirrors. Lock-of-record:
# agent-env.lock (was kasetto.lock).
#
# Stabilize/refresh:
#   envctl agent lock --check --locked --color never # read-only, zero-network
#   envctl agent sync --json --color never          # preview; writes nothing
#   envctl agent sync --apply --color never         # only after review/approval
# CI enforcement:
#   envctl agent lock --check --locked              # zero-network; exits 1 on drift
#
# Navigation invariant:
#   /home/flexnetos/.codex/config.toml is the active runtime config.
#   /home/flexnetos/.codex/RULES.md, /home/flexnetos/.codex/RTK.md,
#   /home/flexnetos/.codex/AGENTS.rtk.md, /home/flexnetos/AGENTS.md, and
#   /home/flexnetos/AGENTS.rtk.md are the active home instruction surfaces;
#   their envctl-owned source copies live under home/.codex/ and home/.
#   /home/flexnetos/lifeos/.codex and /home/flexnetos/FlexNetOS/.codex are
#   retired mirrors; do not use them as inputs or fallback outputs.

scope: project

# The only active user runtime is the Yazelix-managed Nushell route.  Agent sync/lock/doctor
# refuse to bless a duplicate RTK wrapper, a second Nix profile frontdoor, or a profile that
# does not contain exactly the foundation package.
runtime: yazelix-nushell

agent:
  - codex

skills:
  # Meta's narrow shared review policy; envctl-specific skills remain below.
  - source: https://github.com/FlexNetOS/meta
    ref: fb7273a7c8d05dce0bac649ded940a86ad41e107
    sub-dir: agent-env/skills
    skills:
      - meta-gitkb-review

  # Curated, envctl-grounded dev skills (correct Rust conventions).
  - source: ./agent-skills
    skills: "*"

mcps:
  # Yazelix is the normative runtime model. Only MCP entries that do not launch
  # non-profile local binaries may be generated here; local MCPs return only
  # after they have profile-owned frontdoors that mirror Yazelix ownership.
  - source: ./agent-skills
    mcps:
      - exa
