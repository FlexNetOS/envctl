skills:
  skill::v3|14:./agent-skills|13:env-stabilize:
    destination: .codex/skills/env-stabilize
    hash: acd9f3cbba1c05ee78b9c4dac8e788667f0dc03eb845221579fcf141166a71d7
    skill: env-stabilize
    description: '"How to keep the environment reproducible and drift-free — the detect/drift, doctor-diagnostic, and content-hashed lock discipline envctl uses, plus how the built-in agent-env engine (envctl agent) provisions and locks the agent config. Use when checking environment health, diagnosing drift, regenerating or verifying a lock, or making the agent environment reproducible. Triggers: ''is the environment stable'', ''check for drift'', ''run doctor'', ''the lock is stale'', ''make this reproducible'', ''env is inconsistent'', ''sync the agents''."'
    source: ./agent-skills
    source_revision: local
    scope: project
  skill::v3|14:./agent-skills|15:agent-env-codex:
    destination: .codex/skills/agent-env-codex
    hash: 0ae07ddd84d10ecb52d789df95582229a131ffdd4c1b8f02b43dd3fc551c27a0
    skill: agent-env-codex
    description: Rebuild, edit, repair, or upgrade the complete envctl Codex agent harness under home/agent-env/codex-harness from the polished CODEX-GPT-HARNESS prompt, including prompts, Rust harness code, agents, teams, policies, rules, model routing, session capabilities, agent-env projections, tests, and active-skill materialization. Use when the user says /agent-env-codex, rebuild the Codex harness, edit the entire Codex agent environment, update the agent-env Codex harness, convert the harness prompt into the implementation, repair harness drift, or upgrade all Codex harness surfaces.
    source: ./agent-skills
    source_revision: local
    scope: project
  skill::v3|14:./agent-skills|16:agent-env-config:
    destination: .codex/skills/agent-env-config
    hash: 1c4c698e421692c7682ebefcb7e02e97305057e90ae0fce9cb8b3a06021b152f
    skill: agent-env-config
    description: '"The CORRECT conventions and agent-environment configuration for the envctl Rust workspace — supersedes the broken ECC-auto-generated skill/instincts that assert JavaScript conventions. Use whenever writing or reviewing envctl code, naming files/types, writing tests, composing commits, or configuring the .claude/.codex agent setup (skills, MCP servers, multi-agent roles). Triggers: ''what conventions'', ''how do I name this'', ''write a test'', ''commit message'', ''configure the agents'', ''MCP setup'', ''is camelCase right''."'
    source: ./agent-skills
    source_revision: local
    scope: project
  skill::v3|14:./agent-skills|20:codedb-config-tables:
    destination: .codex/skills/codedb-config-tables
    hash: 40417b259ed04caefde2f1a6cded9b5daecf4f55943b40a67d2fc1f27c2974cd
    skill: codedb-config-tables
    description: Transform config files, settings trees, environment/runtime state, and file inventories into CodeDB tables through `codedb` and `nu_plugin_codedb`, with full semantic rows, blob references, structured-row extraction, and explicit gap/error reporting. Use when Codex needs to catalog or query repo configs, Yazelix-generated state, Nushell/plugin surfaces, or envctl-exported files as database-like tables rather than ad hoc text parsing.
    source: ./agent-skills
    source_revision: local
    scope: project
  skill::v3|14:./agent-skills|21:env-toolchain-install:
    destination: .codex/skills/env-toolchain-install
    hash: 8320a7870746a248e896bc0f9d9caf0d188787acc7aef60e740d2c82dbdfc08b
    skill: env-toolchain-install
    description: '"How to install and configure environment tooling the way this box does it — the nix profile owns every toolchain binary; envctl''s declarative components (detect→install→verify→fix→remove lifecycle per manifest/*.toml) own the meta-local install/wiring layer. Use whenever installing, repairing, or configuring environment tooling or authoring a new component. Triggers: ''install the toolchain'', ''set up the environment'', ''add a component'', ''why is X not on PATH'', ''repair the environment'', ''the install isn''t idempotent''."'
    source: ./agent-skills
    source_revision: local
    scope: project
  skill::v3|33:https://github.com/FlexNetOS/meta|17:meta-gitkb-review:
