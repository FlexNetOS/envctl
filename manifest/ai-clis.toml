# AI coding CLIs are installed only by the merged Yazelix/Nix profile. Envctl
# validates the installed contract and never creates wrappers, home-state trees,
# or alternate package-manager installations.

[[component]]
id = "claude-code-cli"
name = "Claude Code CLI (profile-owned)"
description = "Validates profile bin/toolbin identity, immutable store provenance, reviewed profile configuration inputs, and volatile Claude materialization."
requires = ["yazelix"]
[component.detect]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-claude-cleanup.sh"
args = ["detect"]
[component.install]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-claude-cleanup.sh"
args = ["install"]
[component.verify]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-claude-cleanup.sh"
args = ["verify"]
[component.fix]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-claude-cleanup.sh"
args = ["fix"]
[component.remove]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-claude-cleanup.sh"
args = ["remove"]

