# AI coding CLIs (yazelix-setup.sh section 2, lines 89-94).
# Native installers (claude/kimi/devin) are Node-independent; Codex prefers the meta Rust source build with Bun fallback, while Gemini runs via Bun.
# Post-install auth (`/login`) is interactive and NOT automatable.

[[component]]
id = "claude-code-cli"
name = "Claude Code CLI"
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/claude/bin/claude\" ] && [ \"$(readlink -f \"$HOME/.local/bin/claude\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/claude/bin/claude\")\" ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/claude"
# Upstream's installer may stage under ~/.local/share/claude; mirror the resulting
# executable into the meta-owned prefix and expose only a thin ~/.local/bin symlink.
curl -fsSL https://claude.ai/install.sh | bash
src="$(readlink -f "$HOME/.local/bin/claude" 2>/dev/null || true)"
if [ -z "$src" ] || [ ! -x "$src" ]; then
  src="$(command -v claude)"
fi
install -d -m 755 "$DEST/bin"
install -m 755 "$src" "$DEST/bin/claude"
ln -sfn "$DEST/bin/claude" "$HOME/.local/bin/claude"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; export PATH=\"$HOME/.local/bin:$PATH\"; [ \"$(readlink -f \"$(command -v claude)\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/claude/bin/claude\")\" ] && claude --version"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/claude"
curl -fsSL https://claude.ai/install.sh | bash
src="$(readlink -f "$HOME/.local/bin/claude" 2>/dev/null || true)"
if [ -z "$src" ] || [ ! -x "$src" ]; then
  src="$(command -v claude)"
fi
install -d -m 755 "$DEST/bin"
install -m 755 "$src" "$DEST/bin/claude"
ln -sfn "$DEST/bin/claude" "$HOME/.local/bin/claude"
'''


[[component]]
id = "codex-cli"
name = "Codex CLI (meta source build; bun fallback)"
requires = ["rustup", "bun", "wild-linker"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; source_root=\"$M/codex/codex-rs/cli\"; src=\"$M/codex/codex-rs/target/release/codex\"; bun_src=\"$M/.toolchains/.bun/bin/codex\"; if [ -d \"$source_root\" ]; then [ -x \"$src\" ] && [ \"$(readlink -f \"$HOME/.local/bin/codex\" 2>/dev/null)\" = \"$(readlink -f \"$src\")\" ]; else [ -x \"$bun_src\" ] && [ \"$(readlink -f \"$HOME/.local/bin/codex\" 2>/dev/null)\" = \"$(readlink -f \"$bun_src\")\" ]; fi"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
if [ -d "$M/codex/codex-rs/cli" ]; then
  export CARGO_HOME="$M/.toolchains/cargo"
  export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
  jobs="${CODEX_CARGO_JOBS:-$(nproc --all)}"
  export CARGO_BUILD_JOBS="$jobs"
  export CARGO_PROFILE_RELEASE_LTO="${CARGO_PROFILE_RELEASE_LTO:-false}"
  export CARGO_PROFILE_RELEASE_CODEGEN_UNITS="${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-$jobs}"
  export CARGO_PROFILE_RELEASE_INCREMENTAL="${CARGO_PROFILE_RELEASE_INCREMENTAL:-true}"
  # Linker acceleration is provided by the wild-linker component (Epic H TASK-0054): it wires
  # clang + --ld-path=wild via the meta-root $M/.cargo/config.toml, which this cargo build
  # (run under the meta tree) inherits automatically. mold dropped (TASK-0070) — setting a
  # -fuse-ld=mold RUSTFLAGS here would override (and conflict with) that wild config.
  cargo build --release -p codex-cli --jobs "$jobs" --timings --manifest-path "$M/codex/codex-rs/Cargo.toml"
  src="$M/codex/codex-rs/target/release/codex"
else
  export BUN_INSTALL="$M/.toolchains/.bun"
  export PATH="$BUN_INSTALL/bin:$PATH"
  bun install -g @openai/codex
  src="$BUN_INSTALL/bin/codex"
fi
mkdir -p "$HOME/.local/bin"
dst="$HOME/.local/bin/codex"
ARCH="$HOME/Desktop/_archives/home-links-$(date +%Y-%m-%d)"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then mkdir -p "$ARCH/.local/bin"; mv "$dst" "$ARCH/.local/bin/codex"; echo "archived copy: codex"; fi
[ -L "$dst" ] && rm "$dst"
ln -s "$src" "$dst"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; export CARGO_HOME=\"$M/.toolchains/cargo\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$HOME/.local/bin:$CARGO_HOME/bin:$BUN_INSTALL/bin:$PATH\"; codex --version"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
if [ -d "$M/codex/codex-rs/cli" ]; then
  export CARGO_HOME="$M/.toolchains/cargo"
  export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
  jobs="${CODEX_CARGO_JOBS:-$(nproc --all)}"
  export CARGO_BUILD_JOBS="$jobs"
  export CARGO_PROFILE_RELEASE_LTO="${CARGO_PROFILE_RELEASE_LTO:-false}"
  export CARGO_PROFILE_RELEASE_CODEGEN_UNITS="${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-$jobs}"
  export CARGO_PROFILE_RELEASE_INCREMENTAL="${CARGO_PROFILE_RELEASE_INCREMENTAL:-true}"
  # Linker acceleration is provided by the wild-linker component (Epic H TASK-0054): it wires
  # clang + --ld-path=wild via the meta-root $M/.cargo/config.toml, which this cargo build
  # (run under the meta tree) inherits automatically. mold dropped (TASK-0070) — setting a
  # -fuse-ld=mold RUSTFLAGS here would override (and conflict with) that wild config.
  cargo build --release -p codex-cli --jobs "$jobs" --timings --manifest-path "$M/codex/codex-rs/Cargo.toml"
  src="$M/codex/codex-rs/target/release/codex"
else
  export BUN_INSTALL="$M/.toolchains/.bun"
  export PATH="$BUN_INSTALL/bin:$PATH"
  bun install -g @openai/codex
  src="$BUN_INSTALL/bin/codex"
fi
mkdir -p "$HOME/.local/bin"
ln -sfn "$src" "$HOME/.local/bin/codex"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$BUN_INSTALL/bin:$PATH\"; bun remove -g @openai/codex || true; [ -L \"$HOME/.local/bin/codex\" ] && rm \"$HOME/.local/bin/codex\" || true"]


