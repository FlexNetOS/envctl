[[component]]
id = "group-ai-clis"
name = "All profile-owned AI CLIs"
description = "Compatibility group over Claude, Codex, Gemini, Kimi, and Devin profile validators."
requires = ["claude-code-cli", "codex-cli", "gemini-cli", "kimi-cli", "devin-cli"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
ROOT="${ENVCTL_SOURCE_ROOT:-${META_ROOT:?META_ROOT required}/src/envctl}"
"$ROOT/assets/scripts/envctl-claude-cleanup.sh" detect
"$ROOT/assets/scripts/envctl-codex-profile-lifecycle.sh" detect
for command_name in gemini kimi devin; do
  "$ROOT/assets/scripts/envctl-profile-command-lifecycle.sh" "$command_name" detect
done
''']
