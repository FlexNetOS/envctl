# AI coding CLIs (yazelix-setup.sh section 2, lines 89-94).
# Native installers (claude/kimi/devin) are Node-independent; Codex prefers the meta Rust source build with Bun fallback, while Gemini runs via Bun.
# Post-install auth (`/login`) is interactive and NOT automatable.

[[component]]
id = "claude-code-cli"
name = "Claude Code CLI"
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/claude/bin/claude\" ] && [ \"$(readlink -f \"$META_ROOT/usr/bin/claude\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/claude/bin/claude\")\" ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/claude"
# Upstream's installer may stage under $META_ROOT/.local/share/claude; mirror the resulting
# executable into the meta-owned prefix and expose only a thin $META_ROOT/usr/bin symlink.
curl -fsSL https://claude.ai/install.sh | bash
src="$(readlink -f "$META_ROOT/usr/bin/claude" 2>/dev/null || true)"
if [ -z "$src" ] || [ ! -x "$src" ]; then
  src="$(command -v claude)"
fi
install -d -m 755 "$DEST/bin"
install -m 755 "$src" "$DEST/bin/claude"
ln -sfn "$DEST/bin/claude" "$META_ROOT/usr/bin/claude"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$META_ROOT/usr/bin:$PATH\"; [ \"$(readlink -f \"$(command -v claude)\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/claude/bin/claude\")\" ] && claude --version"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/claude"
curl -fsSL https://claude.ai/install.sh | bash
src="$(readlink -f "$META_ROOT/usr/bin/claude" 2>/dev/null || true)"
if [ -z "$src" ] || [ ! -x "$src" ]; then
  src="$(command -v claude)"
fi
install -d -m 755 "$DEST/bin"
install -m 755 "$src" "$DEST/bin/claude"
ln -sfn "$DEST/bin/claude" "$META_ROOT/usr/bin/claude"
'''


[[component]]
id = "codex-cli"
name = "Codex CLI (meta toolchain; pinned upstream release rust-v0.142.0, source-build opt-in)"
requires = ["rustup", "bun", "wild-linker"]
# Pinned, VERSIONED install into $META_ROOT/.toolchains/openai-codex/<version>/ with a stable
# `current -> <version>` indirection, exposed as `codex` via the canonical $META_ROOT/usr/bin
# front door. The DEFAULT install path downloads the pinned upstream release (static musl tarball)
# so the version is deterministic and portable. Set CODEX_BUILD_FROM_SOURCE=1 to instead build
# from a local $M/codex/codex-rs checkout (wild-linker-accelerated) — the opt-in path for future
# in-place upgrades. Override the pin with CODEX_VERSION=<x.y.z>. The install/fix hooks perform a
# strict-upgrade swap: the legacy flat $M/.toolchains/codex install is archived (never deleted)
# only AFTER the new pinned binary verifies with `--version`.
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; VER="${CODEX_VERSION:-0.142.0}"; vdir="$M/.toolchains/openai-codex/${VER}"; dest="$vdir/bin/codex"; cur="$M/.toolchains/openai-codex/current/bin/codex"; link="$META_ROOT/usr/bin/codex"; rd() { readlink -f "$1" 2>/dev/null; }; [ -x "$dest" ] && [ "$(rd "$cur")" = "$(rd "$dest")" ] && [ "$(rd "$link")" = "$(rd "$dest")" ]''']
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ROOT="$M/envctl"; source "$ROOT/assets/scripts/envctl-gh-fetch.sh"
VER="${CODEX_VERSION:-0.142.0}"
BASE="$M/.toolchains/openai-codex"
CUR="$BASE/current"
LINK="$META_ROOT/usr/bin/codex"
if [ "${CODEX_BUILD_FROM_SOURCE:-0}" = "1" ] && [ -d "$M/codex/codex-rs/cli" ]; then
  # Opt-in: build from the local checkout (future portable in-place upgrade path). Linker
  # acceleration is provided by the wild-linker component (Epic H TASK-0054): it wires
  # clang + --ld-path=wild via the meta-root $M/.cargo/config.toml, which this cargo build
  # (run under the meta tree) inherits automatically. mold dropped (TASK-0070).
  export CARGO_HOME="$M/.toolchains/cargo"
  export PATH="$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH"
  jobs="${CODEX_CARGO_JOBS:-$(nproc --all)}"
  export CARGO_BUILD_JOBS="$jobs"
  export CARGO_PROFILE_RELEASE_LTO="${CARGO_PROFILE_RELEASE_LTO:-false}"
  export CARGO_PROFILE_RELEASE_CODEGEN_UNITS="${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-$jobs}"
  export CARGO_PROFILE_RELEASE_INCREMENTAL="${CARGO_PROFILE_RELEASE_INCREMENTAL:-true}"
  cargo build --release -p codex-cli --jobs "$jobs" --timings --manifest-path "$M/codex/codex-rs/Cargo.toml"
  VER="src-$(git -C "$M/codex" rev-parse --short HEAD 2>/dev/null || echo unknown)"
  src="$M/codex/codex-rs/target/release/codex"
else
  # Default: pinned upstream release (static musl) via the authenticated gh-fetch resolver. The
  # explicit pinned URL is used directly (NOT envctl_gh_release_download, whose fallback resolves
  # `latest` and would defeat the pin).
  tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
  URL="https://github.com/openai/codex/releases/download/rust-v${VER}/codex-x86_64-unknown-linux-musl.tar.gz"
  envctl_gh_curl "$URL" -o "$tmp/codex.tgz"
  tar -xzf "$tmp/codex.tgz" -C "$tmp"
  src="$(find "$tmp" -type f \( -name codex -o -name 'codex-*-linux-musl' \) | head -1)"
  [ -n "$src" ] && [ -f "$src" ] || { echo "codex: no binary found in release tarball" >&2; exit 1; }
fi
VDIR="$BASE/${VER}"
install -d -m 755 "$VDIR/bin"
install -m 755 "$src" "$VDIR/bin/codex"
ln -sfn "$VER" "$CUR"
install -d -m 755 "$META_ROOT/usr/bin"
# Canonical front door is $META_ROOT/usr/bin. The real-home .local bridge is provided by the
# home-local-single-link component, so this component must not create a per-tool real-home link.
# Archive a pre-existing non-symlink (a copied binary) before replacing it.
if [ -e "$LINK" ] && [ ! -L "$LINK" ]; then
  ARCH="$META_ROOT/var/lib/envctl/legacy-archives/usr-bin-$(date -u +%Y-%m-%d)/usr/bin"
  install -d -m 755 "$ARCH"
  mv "$LINK" "$ARCH/codex"
  echo "archived copy: codex"
fi
ln -sfn "$CUR/bin/codex" "$LINK"
# Strict-upgrade swap: retire the legacy flat install ONLY after the new pinned binary runs.
if "$VDIR/bin/codex" --version >/dev/null 2>&1; then
  if [ -d "$M/.toolchains/codex" ]; then
    FLATARCH="$META_ROOT/var/lib/envctl/legacy-archives/codex-flat-$(date -u +%Y-%m-%d)"
    install -d -m 755 "$FLATARCH"
    mv "$M/.toolchains/codex" "$FLATARCH/codex"
    echo "archived legacy flat install: .toolchains/codex -> $FLATARCH/codex"
  fi
  BUN_INSTALL="$M/.toolchains/.bun"
  [ -x "$BUN_INSTALL/bin/bun" ] && PATH="$BUN_INSTALL/bin:$PATH" bun remove -g @openai/codex >/dev/null 2>&1 || true
else
  echo "codex: new pinned binary failed --version; legacy install left in place" >&2
  exit 1
fi
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; export PATH="$META_ROOT/usr/bin:$M/usr/bin:$PATH"; cur="$M/.toolchains/openai-codex/current/bin/codex"; [ -x "$cur" ] && [ "$(readlink -f "$(command -v codex)" 2>/dev/null)" = "$(readlink -f "$cur")" ] && codex --version''']
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ROOT="$M/envctl"; source "$ROOT/assets/scripts/envctl-gh-fetch.sh"
VER="${CODEX_VERSION:-0.142.0}"
BASE="$M/.toolchains/openai-codex"
CUR="$BASE/current"
LINK="$META_ROOT/usr/bin/codex"
if [ "${CODEX_BUILD_FROM_SOURCE:-0}" = "1" ] && [ -d "$M/codex/codex-rs/cli" ]; then
  export CARGO_HOME="$M/.toolchains/cargo"
  export PATH="$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH"
  jobs="${CODEX_CARGO_JOBS:-$(nproc --all)}"
  export CARGO_BUILD_JOBS="$jobs"
  export CARGO_PROFILE_RELEASE_LTO="${CARGO_PROFILE_RELEASE_LTO:-false}"
  export CARGO_PROFILE_RELEASE_CODEGEN_UNITS="${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-$jobs}"
  export CARGO_PROFILE_RELEASE_INCREMENTAL="${CARGO_PROFILE_RELEASE_INCREMENTAL:-true}"
  cargo build --release -p codex-cli --jobs "$jobs" --timings --manifest-path "$M/codex/codex-rs/Cargo.toml"
  VER="src-$(git -C "$M/codex" rev-parse --short HEAD 2>/dev/null || echo unknown)"
  src="$M/codex/codex-rs/target/release/codex"
else
  tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
  URL="https://github.com/openai/codex/releases/download/rust-v${VER}/codex-x86_64-unknown-linux-musl.tar.gz"
  envctl_gh_curl "$URL" -o "$tmp/codex.tgz"
  tar -xzf "$tmp/codex.tgz" -C "$tmp"
  src="$(find "$tmp" -type f \( -name codex -o -name 'codex-*-linux-musl' \) | head -1)"
  [ -n "$src" ] && [ -f "$src" ] || { echo "codex: no binary found in release tarball" >&2; exit 1; }
fi
VDIR="$BASE/${VER}"
install -d -m 755 "$VDIR/bin"
install -m 755 "$src" "$VDIR/bin/codex"
ln -sfn "$VER" "$CUR"
install -d -m 755 "$META_ROOT/usr/bin"
if [ -e "$LINK" ] && [ ! -L "$LINK" ]; then
  ARCH="$META_ROOT/var/lib/envctl/legacy-archives/usr-bin-$(date -u +%Y-%m-%d)/usr/bin"
  install -d -m 755 "$ARCH"; mv "$LINK" "$ARCH/codex"; echo "archived copy: codex"
fi
ln -sfn "$CUR/bin/codex" "$LINK"
if "$VDIR/bin/codex" --version >/dev/null 2>&1 && [ -d "$M/.toolchains/codex" ]; then
  FLATARCH="$META_ROOT/var/lib/envctl/legacy-archives/codex-flat-$(date -u +%Y-%m-%d)"
  install -d -m 755 "$FLATARCH"
  mv "$M/.toolchains/codex" "$FLATARCH/codex"
  echo "archived legacy flat install: .toolchains/codex -> $FLATARCH/codex"
fi
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; BUN_INSTALL="$M/.toolchains/.bun"; [ -x "$BUN_INSTALL/bin/bun" ] && PATH="$BUN_INSTALL/bin:$PATH" bun remove -g @openai/codex >/dev/null 2>&1 || true; for t in "$META_ROOT/usr/bin/codex" "$M/usr/bin/codex" "$META_ROOT/.local/bin/codex" "$M/.local/bin/codex"; do [ -L "$t" ] && rm -f "$t"; done; rm -rf "$M/.toolchains/openai-codex"''']

[[component]]
id = "gemini-cli"
name = "Gemini CLI (via bun)"
requires = ["bun"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/.bun/bin/gemini\" ] && [ \"$(readlink -f \"$META_ROOT/usr/bin/gemini\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/.bun/bin/gemini\")\" ]"]
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun install -g @google/gemini-cli
mkdir -p "$META_ROOT/usr/bin"
dst="$META_ROOT/usr/bin/gemini"
src="$BUN_INSTALL/bin/gemini"
ARCH="$META_ROOT/var/lib/envctl/legacy-archives/home-links-$(date +%Y-%m-%d)"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then mkdir -p "$ARCH/.local/bin"; mv "$dst" "$ARCH/.local/bin/gemini"; echo "archived copy: gemini"; fi
[ -L "$dst" ] && rm "$dst"
ln -s "$src" "$dst"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$META_ROOT/usr/bin:$BUN_INSTALL/bin:$PATH\"; gemini --version"]
[component.fix]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun install -g @google/gemini-cli
mkdir -p "$META_ROOT/usr/bin"
ln -sfn "$BUN_INSTALL/bin/gemini" "$META_ROOT/usr/bin/gemini"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$BUN_INSTALL/bin:$PATH\"; bun remove -g @google/gemini-cli; [ -L \"$META_ROOT/usr/bin/gemini\" ] && rm \"$META_ROOT/usr/bin/gemini\" || true"]


