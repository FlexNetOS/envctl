# Group/meta: install the whole AI-CLI set in one target. No hooks of its own —
# its `requires` closure installs the members in dependency order; detect aggregates.
[[component]]
id = "group-ai-clis"
name = "All AI CLIs"
description = "Meta: claude + codex + gemini + kimi + devin (Codex source-build preferred; Gemini via Bun)."
requires = ["claude-code-cli", "codex-cli", "gemini-cli", "kimi-cli", "devin-cli"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$META_ROOT/usr/bin:$M/.toolchains/.bun/bin:$PATH\"; for c in claude codex gemini kimi devin; do command -v $c >/dev/null || exit 1; done"]
