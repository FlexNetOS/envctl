# AI coding CLIs (yazelix-setup.sh section 2, lines 89-94).
# Native installers (claude/kimi/devin) are Node-independent; Codex prefers the meta Rust source build with Bun fallback, while Gemini runs via Bun.
# Post-install auth (`/login`) is interactive and NOT automatable.

[[component]]
id = "claude-code-cli"
name = "Claude Code CLI"
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/claude/bin/claude\" ] && [ \"$(readlink -f \"$META_ROOT/.local/bin/claude\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/claude/bin/claude\")\" ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/claude"
# Upstream's installer may stage under $META_ROOT/.local/share/claude; mirror the resulting
# executable into the meta-owned prefix and expose only a thin $META_ROOT/.local/bin symlink.
curl -fsSL https://claude.ai/install.sh | bash
src="$(readlink -f "$META_ROOT/.local/bin/claude" 2>/dev/null || true)"
if [ -z "$src" ] || [ ! -x "$src" ]; then
  src="$(command -v claude)"
fi
install -d -m 755 "$DEST/bin"
install -m 755 "$src" "$DEST/bin/claude"
ln -sfn "$DEST/bin/claude" "$META_ROOT/.local/bin/claude"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$META_ROOT/.local/bin:$PATH\"; [ \"$(readlink -f \"$(command -v claude)\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/claude/bin/claude\")\" ] && claude --version"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/claude"
curl -fsSL https://claude.ai/install.sh | bash
src="$(readlink -f "$META_ROOT/.local/bin/claude" 2>/dev/null || true)"
if [ -z "$src" ] || [ ! -x "$src" ]; then
  src="$(command -v claude)"
fi
install -d -m 755 "$DEST/bin"
install -m 755 "$src" "$DEST/bin/claude"
ln -sfn "$DEST/bin/claude" "$META_ROOT/.local/bin/claude"
'''


[[component]]
id = "codex-cli"
name = "Codex CLI (meta toolchain install; source build preferred)"
requires = ["rustup", "bun", "wild-linker"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; dest="$M/.toolchains/codex/bin/codex"; meta_link="$M/.local/bin/codex"; user_link="$META_ROOT/.local/bin/codex"; [ -x "$dest" ] && [ "$(readlink -f "$meta_link" 2>/dev/null)" = "$(readlink -f "$dest")" ] && [ "$(readlink -f "$user_link" 2>/dev/null)" = "$(readlink -f "$dest")" ]''']
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/codex"
META_BIN="$M/.local/bin"
USER_BIN="$META_ROOT/.local/bin"
if [ -d "$M/codex/codex-rs/cli" ]; then
  export CARGO_HOME="$M/.toolchains/cargo"
  export PATH="$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH"
  jobs="${CODEX_CARGO_JOBS:-$(nproc --all)}"
  export CARGO_BUILD_JOBS="$jobs"
  export CARGO_PROFILE_RELEASE_LTO="${CARGO_PROFILE_RELEASE_LTO:-false}"
  export CARGO_PROFILE_RELEASE_CODEGEN_UNITS="${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-$jobs}"
  export CARGO_PROFILE_RELEASE_INCREMENTAL="${CARGO_PROFILE_RELEASE_INCREMENTAL:-true}"
  # Linker acceleration is provided by the wild-linker component (Epic H TASK-0054): it wires
  # clang + --ld-path=wild via the meta-root $M/.cargo/config.toml, which this cargo build
  # (run under the meta tree) inherits automatically. mold dropped (TASK-0070) — setting a
  # -fuse-ld=mold RUSTFLAGS here would override (and conflict with) that wild config.
  cargo build --release -p codex-cli --jobs "$jobs" --timings --manifest-path "$M/codex/codex-rs/Cargo.toml"
  src="$M/codex/codex-rs/target/release/codex"
  install -d -m 755 "$DEST/bin"
  install -m 755 "$src" "$DEST/bin/codex"
else
  export BUN_INSTALL="$M/.toolchains/.bun"
  export PATH="$BUN_INSTALL/bin:$PATH"
  bun install -g @openai/codex
  src="$BUN_INSTALL/bin/codex"
  install -d -m 755 "$DEST/bin"
  ln -sfn "$src" "$DEST/bin/codex"
fi
install -d -m 755 "$META_BIN" "$USER_BIN"
ln -sfn "$DEST/bin/codex" "$META_BIN/codex"
ARCH="$M/.local/archive/home-links-$(date -u +%Y-%m-%d)"
if [ -e "$USER_BIN/codex" ] && [ ! -L "$USER_BIN/codex" ]; then
  install -d -m 755 "$ARCH/.local/bin"
  mv "$USER_BIN/codex" "$ARCH/.local/bin/codex"
  echo "archived copy: codex"
fi
ln -sfn "$META_BIN/codex" "$USER_BIN/codex"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; export CARGO_HOME="$M/.toolchains/cargo"; export BUN_INSTALL="$M/.toolchains/.bun"; export PATH="$META_ROOT/.local/bin:$M/.local/bin:$CARGO_HOME/bin:$BUN_INSTALL/bin:$PATH"; dest="$M/.toolchains/codex/bin/codex"; [ -x "$dest" ] && [ "$(readlink -f "$(command -v codex)" 2>/dev/null)" = "$(readlink -f "$dest")" ] && codex --version''']
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/codex"
META_BIN="$M/.local/bin"
USER_BIN="$META_ROOT/.local/bin"
if [ -d "$M/codex/codex-rs/cli" ]; then
  export CARGO_HOME="$M/.toolchains/cargo"
  export PATH="$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH"
  jobs="${CODEX_CARGO_JOBS:-$(nproc --all)}"
  export CARGO_BUILD_JOBS="$jobs"
  export CARGO_PROFILE_RELEASE_LTO="${CARGO_PROFILE_RELEASE_LTO:-false}"
  export CARGO_PROFILE_RELEASE_CODEGEN_UNITS="${CARGO_PROFILE_RELEASE_CODEGEN_UNITS:-$jobs}"
  export CARGO_PROFILE_RELEASE_INCREMENTAL="${CARGO_PROFILE_RELEASE_INCREMENTAL:-true}"
  # Linker acceleration is provided by the wild-linker component (Epic H TASK-0054): it wires
  # clang + --ld-path=wild via the meta-root $M/.cargo/config.toml, which this cargo build
  # (run under the meta tree) inherits automatically. mold dropped (TASK-0070) — setting a
  # -fuse-ld=mold RUSTFLAGS here would override (and conflict with) that wild config.
  cargo build --release -p codex-cli --jobs "$jobs" --timings --manifest-path "$M/codex/codex-rs/Cargo.toml"
  src="$M/codex/codex-rs/target/release/codex"
  install -d -m 755 "$DEST/bin"
  install -m 755 "$src" "$DEST/bin/codex"
else
  export BUN_INSTALL="$M/.toolchains/.bun"
  export PATH="$BUN_INSTALL/bin:$PATH"
  bun install -g @openai/codex
  src="$BUN_INSTALL/bin/codex"
  install -d -m 755 "$DEST/bin"
  ln -sfn "$src" "$DEST/bin/codex"
fi
install -d -m 755 "$META_BIN" "$USER_BIN"
ln -sfn "$DEST/bin/codex" "$META_BIN/codex"
ln -sfn "$META_BIN/codex" "$USER_BIN/codex"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; export BUN_INSTALL="$M/.toolchains/.bun"; export PATH="$BUN_INSTALL/bin:$PATH"; bun remove -g @openai/codex || true; [ -L "$META_ROOT/.local/bin/codex" ] && rm "$META_ROOT/.local/bin/codex" || true; [ -L "$M/.local/bin/codex" ] && rm "$M/.local/bin/codex" || true; rm -f "$M/.toolchains/codex/bin/codex"''']


[[component]]
id = "gemini-cli"
name = "Gemini CLI (via bun)"
requires = ["bun"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/.bun/bin/gemini\" ] && [ \"$(readlink -f \"$META_ROOT/.local/bin/gemini\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/.bun/bin/gemini\")\" ]"]
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun install -g @google/gemini-cli
mkdir -p "$META_ROOT/.local/bin"
dst="$META_ROOT/.local/bin/gemini"
src="$BUN_INSTALL/bin/gemini"
ARCH="$META_ROOT/.local/state/envctl/legacy-archives/home-links-$(date +%Y-%m-%d)"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then mkdir -p "$ARCH/.local/bin"; mv "$dst" "$ARCH/.local/bin/gemini"; echo "archived copy: gemini"; fi
[ -L "$dst" ] && rm "$dst"
ln -s "$src" "$dst"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$META_ROOT/.local/bin:$BUN_INSTALL/bin:$PATH\"; gemini --version"]
[component.fix]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun install -g @google/gemini-cli
mkdir -p "$META_ROOT/.local/bin"
ln -sfn "$BUN_INSTALL/bin/gemini" "$META_ROOT/.local/bin/gemini"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$BUN_INSTALL/bin:$PATH\"; bun remove -g @google/gemini-cli; [ -L \"$META_ROOT/.local/bin/gemini\" ] && rm \"$META_ROOT/.local/bin/gemini\" || true"]


