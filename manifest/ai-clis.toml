command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; BUN_INSTALL="$M/.toolchains/.bun"; [ -x "$BUN_INSTALL/bin/bun" ] && PATH="$BUN_INSTALL/bin:$PATH" bun remove -g @openai/codex >/dev/null 2>&1 || true; for t in "$M/usr/bin/codex" "$M/.local/bin/codex"; do if { [ -L "$t" ] || grep -q "envctl codex wrapper" "$t" 2>/dev/null; }; then rm -f "$t"; fi; done; rm -rf "$M/.toolchains/openai-codex"''']

[[component]]
id = "gemini-cli"
name = "Gemini CLI (via bun)"
requires = ["bun"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/.bun/bin/gemini\" ] && [ \"$(readlink -f \"$META_ROOT/usr/bin/gemini\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/.bun/bin/gemini\")\" ]"]
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun install -g @google/gemini-cli
mkdir -p "$META_ROOT/usr/bin"
dst="$META_ROOT/usr/bin/gemini"
src="$BUN_INSTALL/bin/gemini"
ARCH="$META_ROOT/var/lib/envctl/legacy-archives/home-links-$(date +%Y-%m-%d)"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then mkdir -p "$ARCH/.local/bin"; mv "$dst" "$ARCH/.local/bin/gemini"; echo "archived copy: gemini"; fi
[ -L "$dst" ] && rm "$dst"
ln -s "$src" "$dst"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$META_ROOT/usr/bin:$BUN_INSTALL/bin:$PATH\"; gemini --version"]
[component.fix]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun install -g @google/gemini-cli
mkdir -p "$META_ROOT/usr/bin"
ln -sfn "$BUN_INSTALL/bin/gemini" "$META_ROOT/usr/bin/gemini"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$BUN_INSTALL/bin:$PATH\"; bun remove -g @google/gemini-cli; [ -L \"$META_ROOT/usr/bin/gemini\" ] && rm \"$META_ROOT/usr/bin/gemini\" || true"]


