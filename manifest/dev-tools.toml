# Extra dev toolchains (yazelix-setup.sh section 3e, lines 193-222).

[[component]]
id = "gh"
name = "GitHub CLI (official apt repo)"
description = "Newer than apt's gh; auth: gh auth login."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v gh"]
[component.install]
kind = "script"
script = '''
set -e
sudo install -dm 755 /etc/apt/keyrings
curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg >/dev/null
sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
sudo apt-get update -y
sudo apt-get install -y gh
'''
[component.verify]
kind = "command"
command = "gh"
args = ["--version"]
[component.fix]
kind = "script"
script = "sudo apt-get update -y && sudo apt-get install --reinstall -y gh"
[component.remove]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["remove", "-y", "gh"]
# The repo .list + keyring are now declarative wiring (reset reverts them in the
# safe order: .list first, then keyring), instead of a hand-rolled rm in remove.
[[component.wiring.apt_repos]]
list_file = "github-cli.list"
list_line = "deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main"
keyring_path = "/etc/apt/keyrings/githubcli-archive-keyring.gpg"
keyring_url = "https://cli.github.com/packages/githubcli-archive-keyring.gpg"
dearmor = false


[[component]]
id = "vite"
name = "Vite (via bun add -g)"
requires = ["bun"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/.bun/bin/vite\" ] && [ \"$(readlink -f \"$HOME/.local/bin/vite\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/.bun/bin/vite\")\" ]"]
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:-$HOME/Desktop/meta}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun add -g vite
mkdir -p "$HOME/.local/bin"
dst="$HOME/.local/bin/vite"
src="$BUN_INSTALL/bin/vite"
ARCH="$HOME/Desktop/_archives/home-links-$(date +%Y-%m-%d)"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then mkdir -p "$ARCH/.local/bin"; mv "$dst" "$ARCH/.local/bin/vite"; echo "archived copy: vite"; fi
[ -L "$dst" ] && rm "$dst"
ln -s "$src" "$dst"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$BUN_INSTALL/bin:$PATH\"; vite --version"]
[component.fix]
kind = "script"
script = '''
set -e
M="${META_ROOT:-$HOME/Desktop/meta}"
export BUN_INSTALL="$M/.toolchains/.bun"
export PATH="$BUN_INSTALL/bin:$PATH"
bun add -g vite
mkdir -p "$HOME/.local/bin"
ln -sfn "$BUN_INSTALL/bin/vite" "$HOME/.local/bin/vite"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$BUN_INSTALL/bin:$PATH\"; bun remove -g vite; [ -L \"$HOME/.local/bin/vite\" ] && rm \"$HOME/.local/bin/vite\" || true"]


[[component]]
id = "cargo-nextest"
name = "cargo-nextest (Rust test runner)"
description = "Repo-required Rust test runner for Codex and other Rust workspaces; installed through meta-owned CARGO_HOME."
requires = ["rustup"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/cargo/bin/cargo-nextest\" ] && [ \"$(readlink -f \"$HOME/.local/bin/cargo-nextest\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/cargo/bin/cargo-nextest\")\" ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
export CARGO_HOME="$M/.toolchains/cargo"
export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
cargo install cargo-nextest --version 0.9.137 --locked
mkdir -p "$HOME/.local/bin"
dst="$HOME/.local/bin/cargo-nextest"
src="$CARGO_HOME/bin/cargo-nextest"
ARCH="$HOME/Desktop/_archives/home-links-$(date +%Y-%m-%d)"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then mkdir -p "$ARCH/.local/bin"; mv "$dst" "$ARCH/.local/bin/cargo-nextest"; echo "archived copy: cargo-nextest"; fi
[ -L "$dst" ] && rm "$dst"
ln -s "$src" "$dst"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; export CARGO_HOME=\"$M/.toolchains/cargo\"; export PATH=\"$CARGO_HOME/bin:$PATH\"; cargo nextest --version"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
export CARGO_HOME="$M/.toolchains/cargo"
export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
cargo install cargo-nextest --version 0.9.137 --force --locked
mkdir -p "$HOME/.local/bin"
ln -sfn "$CARGO_HOME/bin/cargo-nextest" "$HOME/.local/bin/cargo-nextest"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; export CARGO_HOME=\"$M/.toolchains/cargo\"; export PATH=\"$CARGO_HOME/bin:$PATH\"; cargo uninstall cargo-nextest || true; [ -L \"$HOME/.local/bin/cargo-nextest\" ] && rm \"$HOME/.local/bin/cargo-nextest\" || true"]


# mold-linker REMOVED (Epic H TASK-0070): the apt mold linker is superseded by the meta-owned
# `wild-linker` component (Epic H TASK-0054), which is wired as the local cargo linker via the
# meta-root .cargo/config.toml. The apt package itself is removed by the owner separately
# (`sudo apt-get remove -y mold`) — a sudo step kept out of any autonomous hook.


[[component]]
id = "wasmer"
name = "Wasmer (WASM runtime)"
description = "Self-wires its own PATH block into ~/.bashrc (installer-owned)."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v wasmer || [ -x \"$HOME/.wasmer/bin/wasmer\" ]"]
[component.install]
kind = "script"
script = "curl -fsSL https://get.wasmer.io | sh"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.wasmer/bin:$PATH\"; wasmer --version"]
[component.fix]
kind = "script"
script = "curl -fsSL https://get.wasmer.io | sh"
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "rm -rf \"$HOME/.wasmer\""]


[[component]]
id = "uv"
name = "uv (Python toolchain)"
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v uv || [ -x \"$HOME/.local/bin/uv\" ]"]
[component.install]
kind = "script"
script = "curl -LsSf https://astral.sh/uv/install.sh | sh"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.local/bin:$PATH\"; uv --version"]
[component.fix]
kind = "script"
script = "export PATH=\"$HOME/.local/bin:$PATH\"; uv self update || curl -LsSf https://astral.sh/uv/install.sh | sh"
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "uv self uninstall 2>/dev/null || rm -f \"$HOME/.local/bin/uv\" \"$HOME/.local/bin/uvx\""]


# mlua — Lua-in-Rust scripting substrate (vendored Lua 5.4, pure rust-native, ZERO system-depth).
# The portable scriptable layer for the Rust+mlua automation vision (see .codex/prompts/codex-rust-forge.md)
# and the Northstar edge targets (mobile / pi-zero / ai-glasses): a Rust core stays small + static while
# remaining runtime-customizable via Lua, in one binary that cross-compiles to aarch64. Lua already runs in
# the stack via yazi's embedded mlua; this puts mlua on the env tool list as a first-class meta-owned tool.
# Built meta-owned (NOT apt, no system liblua) — `vendored` compiles Lua from source in the cargo build
# (clang/llvm-21 supplies the C compiler; the C is a build artifact, nothing is linked from the system).
[[component]]
id = "mlua"
name = "mlua (Lua-in-Rust, vendored Lua 5.4)"
description = "Meta-owned mlua-backed Lua 5.4 interpreter (lua-mlua) built vendored into .toolchains/mlua — rust-native, zero system-depth. The scriptable substrate for the Rust+mlua automation layer."
requires = ["rustup", "llvm-clang"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/mlua/target/release/lua-mlua\" ]"]
[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/mlua"; SRC="$DEST/src"
install -d -m 755 "$SRC/src"
cat > "$SRC/Cargo.toml" <<'TOML'
[package]
name = "lua_mlua"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "lua-mlua"
path = "src/main.rs"

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored"] }

[profile.release]
strip = true
opt-level = "z"

# Standalone: keep this out of the parent meta Cargo workspace (it lives under $META_ROOT).
[workspace]
TOML
cat > "$SRC/src/main.rs" <<'RS'
//! Minimal mlua-backed Lua 5.4 interpreter (vendored, zero system-depth).
//! Usage: lua-mlua -e "<code>" | lua-mlua <file.lua> | echo "<code>" | lua-mlua
use std::io::Read;
fn main() -> mlua::Result<()> {
    let lua = mlua::Lua::new();
    let args: Vec<String> = std::env::args().skip(1).collect();
    // Name the chunk so Lua errors point at the user's source, not the loader call site.
    // Lua convention: `@path` renders as the file path; `=label` renders verbatim.
    let (code, name) = if args.first().map(|s| s == "-e").unwrap_or(false) {
        (args.get(1).cloned().unwrap_or_default(), "=(command line)".to_string())
    } else if let Some(path) = args.first() {
        (std::fs::read_to_string(path)?, format!("@{path}"))
    } else {
        let mut s = String::new();
        std::io::stdin().read_to_string(&mut s)?;
        (s, "=stdin".to_string())
    };
    lua.load(&code).set_name(name).exec()
}
RS
export CARGO_HOME="$M/.toolchains/cargo"
export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
cargo build --release --manifest-path "$SRC/Cargo.toml" --target-dir "$DEST/target"
install -d -m 755 "$HOME/.local/bin"
ln -sfn "$DEST/target/release/lua-mlua" "$HOME/.local/bin/lua-mlua"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; \"$M/.toolchains/mlua/target/release/lua-mlua\" -e 'assert(6*7==42); print(\"mlua ok\")'"]
[component.fix]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
export CARGO_HOME="$M/.toolchains/cargo"
export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
cargo build --release --manifest-path "$M/.toolchains/mlua/src/Cargo.toml" --target-dir "$M/.toolchains/mlua/target"
ln -sfn "$M/.toolchains/mlua/target/release/lua-mlua" "$HOME/.local/bin/lua-mlua"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -L \"$HOME/.local/bin/lua-mlua\" ] && rm -f \"$HOME/.local/bin/lua-mlua\"; rm -rf \"$M/.toolchains/mlua\"; true"]
[component.wiring]
path_entries = ["~/.local/bin"]
