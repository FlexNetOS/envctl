    [ -x "$managed_exec" ] && [ -f "$managed_exec" ] && [ ! -L "$managed_exec" ] \
      && canonical_is_lexical "$managed_exec" && [ "$(stat -c '%u' "$managed_exec")" = "$uid" ] \
      && [ "$(stat -c '%a' "$managed_exec")" = 755 ] \
      || { echo "FATAL: required META-owned Rust toolchain executable is unsafe or missing: $managed_exec" >&2; exit 1; }
  done
  validate_toolchain_resource_tree
  helper_owned_or_absent
  key_exists=0
  token_exists=0
  { [ -e "$key" ] || [ -L "$key" ]; } && key_exists=1
  { [ -e "$token_file" ] || [ -L "$token_file" ]; } && token_exists=1
  if [ "$key_exists" = 1 ] || [ "$token_exists" = 1 ]; then
    [ "$key_exists" = 1 ] && [ "$token_exists" = 1 ] && auth_file_ok "$key" && auth_file_ok "$token_file" \
      || { echo "FATAL: partial or unsafe existing sqld auth pair" >&2; exit 1; }
  fi
  key_source="${SQLD_AUTH_JWT_KEY_SOURCE:-}"
  token_source="${SQLD_CLIENT_JWT_SOURCE:-}"
  if [ -n "$key_source" ] || [ -n "$token_source" ]; then
    [ -n "$key_source" ] && [ -n "$token_source" ] && auth_file_ok "$key_source" && auth_file_ok "$token_source" \
      || { echo "FATAL: both sqld auth overrides must be safe canonical 0600 files" >&2; exit 1; }
  fi
  frontdoor_owned_or_absent \
    || { echo "FATAL: refusing to replace foreign frontdoor $front" >&2; exit 1; }
}

wrapper_body() {
  printf '%s\n' '#!/bin/sh' '# managed-by: envctl component sqld' "exec \"$payload\" \"\$@\""
}
legacy_wrapper_body() {
  printf '%s\n' '#!/bin/sh' "exec \"$payload\" \"\$@\""
}
frontdoor_owned_or_absent() {
  if [ ! -e "$front" ] && [ ! -L "$front" ]; then
    return 0
  fi
  [ -f "$front" ] && [ ! -L "$front" ] || return 1
  current="$(cat "$front")"
  [ "$current" = "$(wrapper_body)" ] || [ "$current" = "$(legacy_wrapper_body)" ]
}
payload_ok() {
  "$probe" internal-sqld-verify-sha256 \
    --file "$1" --expected-sha256 "$expected_payload_sha256" --expected-mode 0755
}
auth_file_ok() {
  [ -s "$1" ] && [ -f "$1" ] && [ ! -L "$1" ] \
    && canonical_is_lexical "$1" \
    && [ "$(stat -c '%a' "$1")" = 600 ] \
    && [ "$(stat -c '%u' "$1")" = "$uid" ]
}
ensure_auth_dir() {
  if [ -e "$auth_dir" ] || [ -L "$auth_dir" ]; then
    [ -d "$auth_dir" ] && [ ! -L "$auth_dir" ] && [ "$(stat -c '%u' "$auth_dir")" = "$(id -u)" ] \
      || { echo "FATAL: sqld auth path must be a current-user-owned real directory" >&2; exit 1; }
  else
    install -d -m700 "$auth_dir"
  fi
  chmod 700 "$auth_dir"
}
adopt_auth_pair() {
  key_source="$1"
  token_source="$2"
  auth_file_ok "$key_source" \
    || { echo "FATAL: refusing unsafe sqld JWT verification-key source (must be nonempty, current-user-owned, regular 0600)" >&2; exit 1; }
  auth_file_ok "$token_source" \
    || { echo "FATAL: refusing unsafe sqld client-JWT source (must be nonempty, current-user-owned, regular 0600)" >&2; exit 1; }
  staged_key="$(mktemp "$auth_dir/.key.XXXXXX")"
  staged_token="$(mktemp "$auth_dir/.token.XXXXXX")"
  install -m600 "$key_source" "$staged_key"
  install -m600 "$token_source" "$staged_token"
  cmp -s "$key_source" "$staged_key" && cmp -s "$token_source" "$staged_token" \
    || { echo "FATAL: staged sqld auth pair differs from its source" >&2; exit 1; }
  ln "$staged_key" "$key" \
    || { echo "FATAL: refusing to overwrite sqld JWT verification key" >&2; exit 1; }
  if ! ln "$staged_token" "$token_file"; then
    [ "$key" -ef "$staged_key" ] && rm -f "$key"
    echo "FATAL: refusing to overwrite sqld client JWT" >&2
    exit 1
  fi
  rm -f "$staged_key" "$staged_token"
  staged_key=""
  staged_token=""
}
helper_owned_or_absent() {
  probe_exists=0
  digest_exists=0
  source_exists=0
  { [ -e "$probe" ] || [ -L "$probe" ]; } && probe_exists=1
  { [ -e "$probe_digest" ] || [ -L "$probe_digest" ]; } && digest_exists=1
  { [ -e "$probe_source" ] || [ -L "$probe_source" ]; } && source_exists=1
  if [ "$probe_exists" = 0 ] && [ "$digest_exists" = 0 ] && [ "$source_exists" = 0 ]; then
    return 0
  fi
  [ "$probe_exists" = 1 ] && [ "$digest_exists" = 1 ] && [ "$source_exists" = 1 ] \
    || { echo "FATAL: partial/unowned sqld readiness-helper state" >&2; exit 1; }
  [ -x "$probe" ] && [ -f "$probe" ] && [ ! -L "$probe" ] \
    && [ "$(stat -c '%a' "$probe")" = 755 ] && [ "$(stat -c '%u' "$probe")" = "$(id -u)" ] \
    || { echo "FATAL: refusing unsafe or foreign sqld readiness helper" >&2; exit 1; }
  [ -s "$probe_digest" ] && [ -f "$probe_digest" ] && [ ! -L "$probe_digest" ] \
    && [ "$(stat -c '%a' "$probe_digest")" = 600 ] && [ "$(stat -c '%u' "$probe_digest")" = "$(id -u)" ] \
    || { echo "FATAL: refusing unsafe or foreign sqld readiness-helper digest" >&2; exit 1; }
  [ -s "$probe_source" ] && [ -f "$probe_source" ] && [ ! -L "$probe_source" ] \
    && [ "$(stat -c '%a' "$probe_source")" = 600 ] && [ "$(stat -c '%u' "$probe_source")" = "$(id -u)" ] \
    || { echo "FATAL: refusing unsafe or foreign sqld readiness-helper source identity" >&2; exit 1; }
  recorded_source="$(cat "$probe_source")"
  case "$recorded_source" in ''|*[!0-9a-f]*) echo "FATAL: invalid sqld helper source identity" >&2; exit 1 ;; esac
  [ "${#recorded_source}" = 64 ] \
    || { echo "FATAL: invalid sqld helper source-identity length" >&2; exit 1; }
}
install_probe() {
  source_root="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
  [ -f "$source_root/Cargo.toml" ] \
    || { echo "FATAL: envctl source checkout not found for Rust-native sqld helper" >&2; exit 1; }
  helper_owned_or_absent
  build_parent="$M/var/tmp/envctl"
  if [ -e "$build_parent" ] || [ -L "$build_parent" ]; then
    [ -d "$build_parent" ] && [ ! -L "$build_parent" ] \
      && [ "$(stat -c '%a' "$build_parent")" = 700 ] \
      && [ "$(stat -c '%u' "$build_parent")" = "$(id -u)" ] \
      || { echo "FATAL: unsafe sqld helper build directory" >&2; exit 1; }
  else
    install -d -m700 "$build_parent"
  fi
  build_root="$(mktemp -d "$build_parent/sqld-install.XXXXXX")"
  cargo_target_dir="$build_root/target"
  sanitize_cargo_environment
  stage_hermetic_cargo_home "$build_root"
  run_hermetic_cargo_build "$build_root" "$target" "$cargo_target_dir"
  collect_used_crate_archives
  built="$cargo_target_dir/release/secretctl"
  [ -x "$built" ] || { echo "FATAL: Rust-native sqld helper build produced no binary" >&2; exit 1; }
  install -d -m755 "$probe_root"
  stage_dir="$(mktemp -d "$probe_root/.next.XXXXXX")"
  chmod 755 "$stage_dir"
  staged_probe="$stage_dir/secretctl"
  staged_digest="$stage_dir/secretctl.sha256"
  staged_source="$stage_dir/secretctl.source.sha256"
  contract_digest="$build_root/secretctl.contract.sha256"
  install -m755 "$built" "$staged_probe"
  "$staged_probe" internal-sqld-self-digest --output "$contract_digest" \
    || { echo "FATAL: built sqld helper could not authenticate its staged bytes" >&2; exit 1; }
  [ "$($staged_probe internal-sqld-readiness-contract --helper-digest "$contract_digest" 2>/dev/null)" = "$probe_contract" ] \
    || { echo "FATAL: built sqld helper has the wrong authenticated contract" >&2; exit 1; }
  rm -f "$contract_digest"
  if [ "$probe_exists" = 1 ]; then
    if ! "$staged_probe" internal-sqld-verify-current-helper --file "$probe" --digest "$probe_digest"; then
      echo "refreshing sqld readiness helper from the fresh current-source build" >&2
    fi
  fi
  "$staged_probe" internal-sqld-self-digest \
    --output "$staged_digest" --installed-path "$probe" \
    || { echo "FATAL: built sqld helper could not record its owned bytes" >&2; exit 1; }
  "$staged_probe" internal-sqld-source-digest \
    --source-root "$source_root" \
    --toolchain-file "$rustup_bin" --toolchain-file "$cargo_bin" \
    --toolchain-file "$rustc_bin" --toolchain-file "$rustdoc_bin" \
    --toolchain-file "$rust_lld_bin" --toolchain-file "$clang_bin" \
    --toolchain-file "$clangxx_bin" --toolchain-file "$llvm_ar_bin" \
    --toolchain-file "$llvm_ranlib_bin" \
    --toolchain-root "$clang_resource_root" \
    --toolchain-root "$rust_toolchain_lib_root" \
    --toolchain-root "$llvm_generation_root" \
    --toolchain-root "$private_cargo_home/registry/index/$registry_id" \
    "${crate_archive_args[@]}" --output "$staged_source" \
    || { echo "FATAL: built sqld helper could not record its Rust/build inputs" >&2; exit 1; }
  helper_fallback="$stage_dir"
  helper_was_initial=0
  if [ "$probe_exists" = 1 ]; then
    sqld_mv -T --exchange --no-copy -- "$stage_dir" "$probe_dir" \
      || { echo "FATAL: atomic sqld helper-generation exchange failed" >&2; exit 1; }
  else
    helper_was_initial=1
    sqld_mv -T --no-copy -- "$stage_dir" "$probe_dir" \
      || { echo "FATAL: initial sqld helper-generation activation failed" >&2; exit 1; }
  fi
  helper_activation=1
  stage_dir=""
  if ! sqld_sync -f "$probe_root"; then
    rollback_helper_activation \
      || { echo "FATAL: sqld helper-generation fsync failed and rollback was incomplete" >&2; exit 1; }
    echo "FATAL: sqld helper-generation fsync failed; activation was rolled back" >&2
    exit 1
  fi
  rm -rf "$build_root"
  build_root=""
}
bootstrap_auth_pair() {
  "$probe" internal-sqld-auth-bootstrap --public-key "$key" --client-token "$token_file"
}
ensure_auth_pair() {
  created_pair=0
  key_exists=0
  token_exists=0
  { [ -e "$key" ] || [ -L "$key" ]; } && key_exists=1
  { [ -e "$token_file" ] || [ -L "$token_file" ]; } && token_exists=1
  if [ "$key_exists" = 1 ] || [ "$token_exists" = 1 ]; then
    [ "$key_exists" = 1 ] && [ "$token_exists" = 1 ] \
      || { echo "FATAL: partial sqld auth state; refusing to overwrite either credential" >&2; exit 1; }
  else
    key_source="${SQLD_AUTH_JWT_KEY_SOURCE:-}"
    token_source="${SQLD_CLIENT_JWT_SOURCE:-}"
    if [ -n "$key_source" ] || [ -n "$token_source" ]; then
      [ -n "$key_source" ] && [ -n "$token_source" ] \
        || { echo "FATAL: both sqld auth source overrides are required together" >&2; exit 1; }
      adopt_auth_pair "$key_source" "$token_source"
    else
      bootstrap_auth_pair
    fi
    created_pair=1
  fi
  auth_file_ok "$key" \
    || { echo "FATAL: managed sqld JWT verification key must be a nonempty, current-user-owned 0600 regular file" >&2; exit 1; }
  auth_file_ok "$token_file" \
    || { echo "FATAL: managed sqld client JWT must be a nonempty, current-user-owned 0600 regular file" >&2; exit 1; }
  auth_created="$created_pair"
}
write_frontdoor() {
  staged_front="$(mktemp "$M/usr/bin/.sqld.XXXXXX")"
  wrapper_body >"$staged_front"
  chmod 755 "$staged_front"
  front_fallback="$staged_front"
  front_was_initial=0
  if [ -e "$front" ] || [ -L "$front" ]; then
    if ! sqld_mv -T --exchange --no-copy -- "$staged_front" "$front"; then
      /usr/bin/rm -f -- "$staged_front"
      front_fallback=""
      return 1
    fi
  else
    front_was_initial=1
    if ! sqld_mv -T --no-copy -- "$staged_front" "$front"; then
      /usr/bin/rm -f -- "$staged_front"
      front_fallback=""
      return 1
    fi
  fi
  front_activation=1
  staged_front=""
  sqld_sync -f "$M/usr/bin"
}
revalidate_active_service() {
  unit="$M/.config/systemd/user/sqld.service"
  load_state="$(systemctl --user show --property=LoadState --value sqld.service)" \
    || { echo "FATAL: could not query sqld.service LoadState during activation" >&2; return 1; }
  active_state="$(systemctl --user show --property=ActiveState --value sqld.service)" \
    || { echo "FATAL: could not query sqld.service ActiveState during activation" >&2; return 1; }
  if [ "$load_state" = not-found ] && [ "$active_state" = inactive ]; then
    return 0
  fi
  if [ "$load_state" = loaded ] && [ "$active_state" = inactive ]; then
    return 0
  fi
  [ "$load_state" = loaded ] && [ "$active_state" = active ] \
    || { echo "FATAL: sqld.service is not in a proven active, inactive, or absent state" >&2; return 1; }
  # An older materialized unit is rewritten/restarted by the engine wiring phase. When the unit
  # already owns the current barrier, however, a helper-only upgrade would otherwise leave the
  # active service unproved by the new bytes. Run those bytes against the exact active MainPID now.
  [ -f "$unit" ] && [ ! -L "$unit" ] || return 0
  grep -Fq 'internal-sqld-readiness-probe' "$unit" || return 0
  grep -Fq -- '--helper-digest ' "$unit" || return 0
  main_pid="$(systemctl --user show --property=MainPID --value sqld.service)"
  case "$main_pid" in ''|0|*[!0-9]*) echo "FATAL: active sqld.service has no valid MainPID" >&2; return 1 ;; esac
  if "$probe" internal-sqld-readiness-probe \
    --pid "$main_pid" --expected-executable "$payload" --port 8080 \
    --client-token "$token_file" --helper-digest "$probe_digest" --timeout-seconds 5
  then
    return 0
  fi
  if service_enabled_state="$(systemctl --user is-enabled sqld.service 2>/dev/null)"; then
    [ "$service_enabled_state" = enabled ] \
      || { echo "FATAL: unexpected successful sqld.service enable state" >&2; return 1; }
  else
    [ "$service_enabled_state" = disabled ] \
      || { echo "FATAL: could not prove sqld.service enable state before restart" >&2; return 1; }
  fi
  service_restore_needed=1
  # `restart` is synchronous through ExecStartPost, so success proves the replacement helper and
  # the restarted payload/auth/listener before the component hook returns.
  if systemctl --user restart sqld.service; then
    service_restore_needed=0
    return 0
  fi
  echo "FATAL: replacement sqld failed readiness; runtime bytes will roll back before restoring the incumbent service state" >&2
  return 1
}
fetch_payload() {
  asset="libsql-server-${target}.tar.xz"
  url="https://github.com/tursodatabase/libsql/releases/download/libsql-server-v${version}/${asset}"
  tmp="$(mktemp -d "$DEST/.download.XXXXXX")"
  archive="$tmp/$asset"
  staged_payload="$(mktemp "$DEST/.sqld.XXXXXX")"
  echo "fetching sqld v${version} for ${target}"
  curl --proto '=https' --tlsv1.2 --location --fail --silent --show-error "$url" -o "$archive"
  chmod 0600 "$archive"
  "$probe" internal-sqld-verify-sha256 \
    --file "$archive" --expected-sha256 "$expected_sha256" --expected-mode 0600
  tar -xJf "$archive" -C "$tmp"
  bin="$(find "$tmp" -type f -name sqld -print -quit)"
  [ -n "$bin" ] || { echo "FATAL: sqld binary not found in $asset" >&2; exit 1; }
  install -m755 "$bin" "$staged_payload"
  payload_ok "$staged_payload" \
    || { echo "FATAL: downloaded sqld does not match exact release v${version}" >&2; exit 1; }
  payload_fallback="$staged_payload"
  payload_was_initial=0
  if [ -e "$payload" ] || [ -L "$payload" ]; then
    sqld_mv -T --exchange --no-copy -- "$staged_payload" "$payload" \
      || { echo "FATAL: atomic sqld payload exchange failed" >&2; exit 1; }
  else
    payload_was_initial=1
    sqld_mv -T --no-copy -- "$staged_payload" "$payload" \
      || { echo "FATAL: initial sqld payload activation failed" >&2; exit 1; }
  fi
  payload_activation=1
  staged_payload=""
  if ! sqld_sync -f "$DEST"; then
    rollback_payload_activation \
      || { echo "FATAL: sqld payload fsync failed and rollback was incomplete" >&2; exit 1; }
    echo "FATAL: sqld payload fsync failed; activation was rolled back" >&2
    exit 1
  fi
  rm -rf "$tmp"
  tmp=""
  staged_payload=""
}

preflight_layout
install -d -m755 "$M/.toolchains/sqld" "$DEST" "$M/usr/bin" \
  "$M/usr/libexec/envctl/sqld" "$probe_root"
install -d -m700 "$data"
ensure_auth_dir
runtime_transaction_open=1
runtime_transaction_exit() {
  rc="$?"
  /usr/bin/rm -rf --one-file-system -- "${tmp:-}" "${build_root:-}" "${stage_dir:-}"
  /usr/bin/rm -f -- "${staged_payload:-}" "${staged_front:-}" \
    "${staged_key:-}" "${staged_token:-}"
  if [ "$runtime_transaction_open" = 1 ]; then
    rollback_runtime_activation \
      || { echo "FATAL: sqld transaction abort left an incomplete runtime rollback" >&2; exit 1; }
  fi
  exit "$rc"
}
trap runtime_transaction_exit EXIT
install_probe
payload_ok "$payload" || fetch_payload
ensure_auth_pair
if ! { [ -f "$front" ] && [ ! -L "$front" ] && [ "$(cat "$front")" = "$(wrapper_body)" ]; }; then
  if ! write_frontdoor; then
    rollback_runtime_activation \
      || { echo "FATAL: sqld frontdoor activation failed and runtime rollback was incomplete" >&2; exit 1; }
    runtime_transaction_open=0
    echo "FATAL: sqld frontdoor activation failed; runtime activation was rolled back" >&2
    exit 1
  fi
fi
if ! revalidate_active_service; then
  rollback_runtime_activation \
    || { echo "FATAL: active-service proof failed and sqld runtime rollback was incomplete" >&2; exit 1; }
  runtime_transaction_open=0
  echo "FATAL: active-service proof failed; sqld runtime activation was rolled back" >&2
  exit 1
fi
if ! commit_runtime_activation; then
  runtime_transaction_open=0
  trap - EXIT
  echo "FATAL: sqld runtime activation committed but strict retired-state cleanup/fsync failed" >&2
  exit 1
fi
runtime_transaction_open=0
trap - EXIT
'''

# REMOVE: disable + drop the unit and the binary. The data dir is data_paths — touched only on --purge.
[component.remove]
kind = "script"
script = '''
set -euo pipefail
export PATH=/usr/bin:/bin
M="${META_ROOT:?META_ROOT required}"
uid="$(id -u)"
case "$(uname -m)" in
  x86_64) expected_payload_sha256="0863c3fbe68ac9714bca2cec1330def7a0ba5e4a29f199bf60ef46fa0c95b895" ;;
  aarch64) expected_payload_sha256="54039931c1088483706790e6cf73444ad88b843a9bb0ca8285b82fc309ad4810" ;;
  *) echo "FATAL: unsupported architecture for sqld removal" >&2; exit 1 ;;
esac
payload_dir="$M/.toolchains/sqld/bin"
payload="$payload_dir/sqld"
front="$M/usr/bin/sqld"
probe_root="$M/usr/libexec/envctl/sqld/bin"
probe_dir="$probe_root/current"
probe="$probe_dir/secretctl"
probe_digest="$probe_dir/secretctl.sha256"
probe_source="$probe_dir/secretctl.source.sha256"
canonical_is_lexical() { [ "$(readlink -f -- "$1" 2>/dev/null)" = "$1" ]; }
owned_dir() {
  [ -d "$1" ] && [ ! -L "$1" ] && canonical_is_lexical "$1" \
    && [ "$(stat -c '%u' "$1")" = "$uid" ] && [ "$(stat -c '%a' "$1")" = "$2" ]
}
owned_file() {
  [ -f "$1" ] && [ ! -L "$1" ] && canonical_is_lexical "$1" \
    && [ "$(stat -c '%u' "$1")" = "$uid" ] && [ "$(stat -c '%a' "$1")" = "$2" ]
}
exists() { [ -e "$1" ] || [ -L "$1" ]; }
runtime_nodes=0
for node in "$payload" "$front" "$probe" "$probe_digest" "$probe_source"; do
  exists "$node" && runtime_nodes=$((runtime_nodes + 1))
done
if [ "$runtime_nodes" = 0 ]; then
  [ ! -e "$payload_dir" ] && [ ! -L "$payload_dir" ] \
    && [ ! -e "$probe_root" ] && [ ! -L "$probe_root" ] \
    || { echo "FATAL: refusing partial sqld removal state with empty/foreign private directories" >&2; exit 1; }
else
  [ "$runtime_nodes" = 5 ] \
    || { echo "FATAL: refusing partial sqld runtime state during removal" >&2; exit 1; }
  owned_dir "$M/usr/bin" 755 && owned_dir "$M/.toolchains/sqld" 755 \
    && owned_dir "$M/usr/libexec/envctl/sqld" 755 \
    && owned_dir "$payload_dir" 755 && owned_dir "$probe_root" 755 && owned_dir "$probe_dir" 755 \
    || { echo "FATAL: refusing unsafe or foreign sqld private directories" >&2; exit 1; }
  [ "$(find "$payload_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)" = sqld ] \
    || { echo "FATAL: refusing sqld payload directory with unexpected entries" >&2; exit 1; }
  [ "$(find "$probe_root" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)" = current ] \
    || { echo "FATAL: refusing sqld helper root with unexpected entries" >&2; exit 1; }
  [ "$(find "$probe_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)" = \
    $'secretctl\nsecretctl.sha256\nsecretctl.source.sha256' ] \
    || { echo "FATAL: refusing sqld helper generation with unexpected entries" >&2; exit 1; }
  owned_file "$payload" 755 && owned_file "$front" 755 && owned_file "$probe" 755 \
    && owned_file "$probe_digest" 600 && owned_file "$probe_source" 600 \
    || { echo "FATAL: refusing unsafe or foreign sqld runtime files" >&2; exit 1; }
  /usr/bin/sha256sum --check --status "$probe_digest" \
    || { echo "FATAL: refusing sqld helper that differs from its owned-byte record" >&2; exit 1; }
  source_identity="$(cat "$probe_source")"
  case "$source_identity" in ''|*[!0-9a-f]*) echo "FATAL: invalid sqld helper source identity" >&2; exit 1 ;; esac
  [ "${#source_identity}" = 64 ] \
    || { echo "FATAL: invalid sqld helper source-identity length" >&2; exit 1; }
  [ "$(/usr/bin/sha256sum "$payload" | /usr/bin/awk '{print $1}')" = "$expected_payload_sha256" ] \
    || { echo "FATAL: refusing sqld payload that differs from the pinned release" >&2; exit 1; }
  managed="$(printf '%s\n' '#!/bin/sh' '# managed-by: envctl component sqld' "exec \"$payload\" \"\$@\"")"
  legacy="$(printf '%s\n' '#!/bin/sh' "exec \"$payload\" \"\$@\"")"
  current="$(cat "$front")"
  [ "$current" = "$managed" ] || [ "$current" = "$legacy" ] \
    || { echo "FATAL: refusing foreign sqld frontdoor during removal" >&2; exit 1; }
fi

sqld_remove_mv() { /usr/bin/mv "$@"; }
sqld_remove_sync() { /usr/bin/sync "$@"; }
sqld_remove_mktemp() { /usr/bin/mktemp "$@"; }
retired_origins=()
retired_backups=()
retired_parents=()
retire_node() {
  origin="$1"
  backup="$2"
  parent="$3"
  sqld_remove_mv -T --no-copy -- "$origin" "$backup" || return 1
  retired_origins+=("$origin")
  retired_backups+=("$backup")
  retired_parents+=("$parent")
  sqld_remove_sync -f "$parent"
}
rollback_removal() {
  failed=0
  for ((index=${#retired_backups[@]} - 1; index >= 0; index--)); do
    sqld_remove_mv -T --no-copy -- "${retired_backups[$index]}" "${retired_origins[$index]}" \
      || failed=1
    sqld_remove_sync -f "${retired_parents[$index]}" || failed=1
  done
  [ "$failed" = 0 ]
}
restore_service_state() {
  [ "$load_state" != not-found ] || return 0
  if [ "$enabled_state" = enabled ]; then
    if [ "$active_state" = active ]; then
      systemctl --user enable --now sqld.service
    else
      systemctl --user enable sqld.service
    fi
  elif [ "$active_state" = active ]; then
    systemctl --user start sqld.service
  fi
}

# Reserve every same-filesystem retirement name before service mutation. The successful prepared
# state contains no filesystem nodes (only collision-resistant names), so a preparation/query
# failure cannot leave the service stopped or a placeholder confused with managed runtime state.
front_retired=""
payload_retired=""
probe_retired=""
if [ "$runtime_nodes" = 5 ]; then
  prepare_failed=0
  front_retired="$(sqld_remove_mktemp "$M/usr/bin/.sqld.remove.XXXXXX")" || prepare_failed=1
  [ "$prepare_failed" = 1 ] || /usr/bin/rm -f -- "$front_retired" || prepare_failed=1
  if [ "$prepare_failed" = 0 ]; then
    payload_retired="$(sqld_remove_mktemp -d "$M/.toolchains/sqld/.bin.retired.XXXXXX")" \
      || prepare_failed=1
  fi
  [ "$prepare_failed" = 1 ] || /usr/bin/rmdir "$payload_retired" || prepare_failed=1
  if [ "$prepare_failed" = 0 ]; then
    probe_retired="$(sqld_remove_mktemp -d "$M/usr/libexec/envctl/sqld/.bin.retired.XXXXXX")" \
      || prepare_failed=1
  fi
  [ "$prepare_failed" = 1 ] || /usr/bin/rmdir "$probe_retired" || prepare_failed=1
  if [ "$prepare_failed" = 1 ]; then
    cleanup_failed=0
    [ -z "$front_retired" ] || /usr/bin/rm -f -- "$front_retired" || cleanup_failed=1
    [ -z "$payload_retired" ] || /usr/bin/rm -rf --one-file-system -- "$payload_retired" \
      || cleanup_failed=1
    [ -z "$probe_retired" ] || /usr/bin/rm -rf --one-file-system -- "$probe_retired" \
      || cleanup_failed=1
    [ "$cleanup_failed" = 0 ] \
      || { echo "FATAL: retirement-path preparation failed and placeholder cleanup was incomplete" >&2; exit 1; }
    echo "FATAL: could not reserve sqld runtime retirement paths before stopping the service" >&2
    exit 1
  fi
fi

# The remove hook runs before wiring teardown. Prove the complete runtime identity and prepare all
# rollback paths above before changing service state. A failed disable may already have stopped or
# disabled part of the unit, so restore the exact prior enabled/active state before returning.
load_state="$(systemctl --user show --property=LoadState --value sqld.service)" \
  || { echo "FATAL: could not query sqld.service LoadState" >&2; exit 1; }
active_state="$(systemctl --user show --property=ActiveState --value sqld.service)" \
  || { echo "FATAL: could not query sqld.service ActiveState" >&2; exit 1; }
service_restore_needed=0
if [ "$load_state" = not-found ]; then
  [ "$active_state" = inactive ] \
    || { echo "FATAL: absent sqld.service is not proven inactive" >&2; exit 1; }
  enabled_state=not-found
else
  [ "$load_state" = loaded ] && { [ "$active_state" = active ] || [ "$active_state" = inactive ]; } \
    || { echo "FATAL: sqld.service is not in a removable loaded state" >&2; exit 1; }
  if enabled_state="$(systemctl --user is-enabled sqld.service 2>/dev/null)"; then
    [ "$enabled_state" = enabled ] \
      || { echo "FATAL: unexpected successful sqld.service enable state" >&2; exit 1; }
  else
    [ "$enabled_state" = disabled ] \
      || { echo "FATAL: could not prove sqld.service enable state" >&2; exit 1; }
  fi
  service_restore_needed=1
  if ! systemctl --user disable --now sqld.service; then
    if ! restore_service_state; then
      echo "FATAL: sqld stop/disable failed and the prior service state could not be restored" >&2
      exit 1
    fi
    service_restore_needed=0
    echo "FATAL: sqld stop/disable failed; the prior service state was restored" >&2
    exit 1
  fi
fi
if [ "$runtime_nodes" = 5 ]; then
  if ! retire_node "$front" "$front_retired" "$M/usr/bin" \
    || ! retire_node "$payload_dir" "$payload_retired" "$M/.toolchains/sqld" \
    || ! retire_node "$probe_root" "$probe_retired" "$M/usr/libexec/envctl/sqld"; then
    rollback_failed=0
    rollback_removal || rollback_failed=1
    restore_service_state || rollback_failed=1
    [ "$rollback_failed" = 0 ] \
      || { echo "FATAL: sqld runtime retirement failed and rollback was incomplete" >&2; exit 1; }
    echo "FATAL: sqld runtime retirement failed; incumbent namespaces were restored" >&2
    exit 1
  fi
  # All active namespaces are gone. From here onward cleanup can fail, but restoring the service
  # would be unsafe because no executable/helper runtime remains at its active paths.
  service_restore_needed=0
  cleanup_failed=0
  /usr/bin/rm -f -- "$front_retired" || cleanup_failed=1
  /usr/bin/rm -rf --one-file-system -- "$payload_retired" "$probe_retired" || cleanup_failed=1
  sqld_remove_sync -f "$M/usr/bin" || cleanup_failed=1
  sqld_remove_sync -f "$M/.toolchains/sqld" || cleanup_failed=1
  sqld_remove_sync -f "$M/usr/libexec/envctl/sqld" || cleanup_failed=1
  [ "$cleanup_failed" = 0 ] \
    || { echo "FATAL: sqld removal committed and the service remains stopped/disabled, but retired-state cleanup/fsync failed; retry removal or inspect the retired paths" >&2; exit 1; }
fi
service_restore_needed=0
# $META_ROOT/.local/share/sqld is data_paths below — never deleted by remove(); --purge only (user data rule).
'''

# ---- WIRING: PATH + the loopback user service that secretd orders after ----
[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]

[[component.wiring.systemd_user]]
name = "sqld.service"
enable = true
content = '''
[Unit]
Description=sqld (libSQL server, loopback) — durable store backend for env-ctl secretd
After=default.target

[Service]
Type=exec
# Loopback-only (no remote exposure) and JWT-authenticated. Only the public verification key path is
# passed to sqld; the matching client JWT remains in a current-user-owned 0600 file read by secretd.
Environment="META_ROOT=${META_ROOT}"
ExecStart="${META_ROOT}/usr/bin/sqld" --http-listen-addr 127.0.0.1:8080 --auth-jwt-key-file "${META_ROOT}/.config/sqld/auth-jwt-key.pem" -d "${META_ROOT}/.local/share/sqld"
# systemd includes non-ignored ExecStartPost completion in Before=/After= ordering. The pure-Rust
# helper first hashes its already-open /proc/self/exe handle against the 0600 owned-byte record;
# only then may it open the token. It binds this exact $MAINPID + /proc/PID/exe to the listening
# socket, requires unauthenticated SQL to return exactly 401, and requires the file-fed bearer to
# return SELECT 1. The token bytes are never placed in argv, Environment=, or logs.
ExecStartPost="${META_ROOT}/usr/libexec/envctl/sqld/bin/current/secretctl" internal-sqld-readiness-probe --pid "${MAINPID}" --expected-executable "${META_ROOT}/.toolchains/sqld/bin/sqld" --port 8080 --client-token "${META_ROOT}/.config/sqld/client.jwt" --helper-digest "${META_ROOT}/usr/libexec/envctl/sqld/bin/current/secretctl.sha256" --timeout-seconds 20
TimeoutStartSec=30
Restart=on-failure
RestartSec=5
# Defense-in-depth sandbox (sqld is external; keep it boxed).
NoNewPrivileges=true
LimitCORE=0
ProtectSystem=strict
ProtectHome=read-only
ReadOnlyPaths="${META_ROOT}/.config/sqld/auth-jwt-key.pem" "${META_ROOT}/.config/sqld/client.jwt"
ReadOnlyPaths="${META_ROOT}/usr/libexec/envctl/sqld/bin/current/secretctl" "${META_ROOT}/usr/libexec/envctl/sqld/bin/current/secretctl.sha256" "${META_ROOT}/usr/libexec/envctl/sqld/bin/current/secretctl.source.sha256"
ReadWritePaths="${META_ROOT}/.local/share/sqld"
PrivateTmp=true
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true

[Install]
WantedBy=default.target
'''

# ---- DATA: the durable libSQL database — deleted ONLY by `envctl reset sqld --purge` ----
[[component.wiring.data_paths]]
path = "$META_ROOT/.local/share/sqld"
uuid = "runtime" # resolve + reverify at purge time; NotLiveDevice remains fail-closed

# Auth material is preserved by the remove hook. The engine only moves it to recoverable trash on a
# confirmed reset (and honors --keep-config); neither key nor token is ever rendered into a unit.
[[component.wiring.config_paths]]
path = "$META_ROOT/.config/sqld"
