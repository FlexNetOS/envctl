# manifest/sqld.toml — loopback sqld (libSQL server) as the DURABLE store backend for secretd.
#
# WHY a release binary, not a workspace crate / `cargo install`: sqld is an EXTERNAL tool that lives
# OUTSIDE the trust boundary. Building it from source pulls its C-SQLite (libsql-ffi/libsql-sys)
# bottom half, which `ci/gates/no-c.sh` forbids INSIDE the workspace. We therefore install the
# prebuilt release binary and run it as a separate process; secretd talks to it over the loopback
# libSQL `remote` (HTTP/Hrana) transport (`http://127.0.0.1:8080`). The trust boundary stays C-free:
# nothing C is LINKED into any envctl crate — sqld is a sibling daemon, not a dependency.
#
# Profile: loopback-only (binds 127.0.0.1) with Ed25519/EdDSA JWT authentication. On first install,
# a private Rust-native secretctl helper generates an in-memory Ed25519 key, writes sqld's
# SubjectPublicKeyInfo PUBLIC KEY PEM plus its matching client JWT as current-user 0600 files, and
# never prints secret bytes. The same helper is sqld.service's bounded ExecStartPost readiness
# barrier: it binds 127.0.0.1:8080 to systemd's exact MainPID/payload, requires unauthenticated SQL
# to return 401, and proves the file-fed bearer can execute SELECT 1. Existing safe 0600 material may instead be supplied through
# SQLD_AUTH_JWT_KEY_SOURCE + SQLD_CLIENT_JWT_SOURCE; both overrides are preflighted, staged, and
# committed with no-replace hardlinks. An ordinary second-link failure rolls the first back, while
# a crash/concurrent observer may see a fail-closed partial pair that requires operator recovery.
# remove() drops the binary but NEVER the auth or data; engine-owned config/data wiring handles
# their separately guarded lifecycle.

[[component]]
id = "sqld"
name = "sqld (libSQL server, loopback)"
description = "Prebuilt libSQL server (sqld) bound to 127.0.0.1:8080 as secretd's durable store backend. External binary OUTSIDE the trust boundary (installed from a release tarball, NOT built from source) so no C-SQLite is linked into the workspace."
requires = ["rustup", "llvm-clang"]
destructive = false
# The installed helper carries a zero-network fingerprint of its checked-in Rust/build inputs.
# Detect remains the physical-presence predicate; Verify rejects a stale fingerprint. This opt-in
# makes both `envctl install` and `auto-fix` run their repair hook on that verification drift.
refresh_on_verify_failure = true

# DETECT == physical managed shape only (fast; no execution/network). Verify freshly rebuilds the
# verifier and binds exact payload, source, META-owned Rust/LLVM/Cargo inputs, auth, and service.
# The GNU target still consumes Ubuntu's host headers, CRT, libc/libgcc, and compiler runtime DSOs;
# those OS/sysroot inputs are an explicit residual, not part of this component's source digest.
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
export PATH=/usr/bin:/bin
M="${META_ROOT:?META_ROOT required}"
payload="$M/.toolchains/sqld/bin/sqld"
front="$M/usr/bin/sqld"
key="$M/.config/sqld/auth-jwt-key.pem"
token_file="$M/.config/sqld/client.jwt"
probe="$M/usr/libexec/envctl/sqld/bin/current/secretctl"
probe_digest="$M/usr/libexec/envctl/sqld/bin/current/secretctl.sha256"
probe_source="$M/usr/libexec/envctl/sqld/bin/current/secretctl.source.sha256"
canonical_is_lexical() { [ "$(readlink -f -- "$1" 2>/dev/null)" = "$1" ]; }
expected_wrapper="$(printf '%s\n' '#!/bin/sh' '# managed-by: envctl component sqld' "exec \"$payload\" \"\$@\"")"
{ [ -x "$payload" ] && [ -f "$payload" ] && [ ! -L "$payload" ] && canonical_is_lexical "$payload" && [ "$(stat -c '%a' "$payload")" = 755 ] && [ "$(stat -c '%u' "$payload")" = "$(id -u)" ]; } || exit 1
{ [ -x "$probe" ] && [ -f "$probe" ] && [ ! -L "$probe" ] && canonical_is_lexical "$probe" && [ "$(stat -c '%a' "$probe")" = 755 ] && [ "$(stat -c '%u' "$probe")" = "$(id -u)" ]; } || exit 1
{ [ -s "$probe_digest" ] && [ -f "$probe_digest" ] && [ ! -L "$probe_digest" ] && canonical_is_lexical "$probe_digest" && [ "$(stat -c '%a' "$probe_digest")" = 600 ] && [ "$(stat -c '%u' "$probe_digest")" = "$(id -u)" ]; } || exit 1
{ [ -s "$probe_source" ] && [ -f "$probe_source" ] && [ ! -L "$probe_source" ] && canonical_is_lexical "$probe_source" && [ "$(stat -c '%a' "$probe_source")" = 600 ] && [ "$(stat -c '%u' "$probe_source")" = "$(id -u)" ]; } || exit 1
source_identity="$(cat "$probe_source")"
case "$source_identity" in ''|*[!0-9a-f]*) exit 1 ;; esac
[ "${#source_identity}" = 64 ] || exit 1
{ [ -x "$front" ] && [ -f "$front" ] && [ ! -L "$front" ] && canonical_is_lexical "$front"; } || exit 1
[ "$(cat "$front")" = "$expected_wrapper" ] || exit 1
{ [ -s "$key" ] && [ -f "$key" ] && [ ! -L "$key" ] && canonical_is_lexical "$key" && [ "$(stat -c '%a' "$key")" = 600 ] && [ "$(stat -c '%u' "$key")" = "$(id -u)" ]; } || exit 1
{ [ -s "$token_file" ] && [ -f "$token_file" ] && [ ! -L "$token_file" ] && canonical_is_lexical "$token_file" && [ "$(stat -c '%a' "$token_file")" = 600 ] && [ "$(stat -c '%u' "$token_file")" = "$(id -u)" ]; } || exit 1
unit="$M/.config/systemd/user/sqld.service"
{ [ -f "$unit" ] && [ ! -L "$unit" ] && canonical_is_lexical "$unit" && [ "$(stat -c '%u' "$unit")" = "$(id -u)" ]; } || exit 1
''']

# INSTALL: fetch and checksum the exact prebuilt release, atomically place the binary + wrapper,
# and create (but never clear) the loopback data dir. The version cannot be overridden.
[component.install]
kind = "script"
script = '''
set -euo pipefail
export PATH=/usr/bin:/bin
version="0.24.32"
arch="$(uname -m)"
case "$arch" in
  x86_64)
    target="x86_64-unknown-linux-gnu"
    expected_sha256="71720fc8648c19efef416efebd47145ef59b62e198770533530a858e1336879f"
    expected_payload_sha256="0863c3fbe68ac9714bca2cec1330def7a0ba5e4a29f199bf60ef46fa0c95b895"
    ;;
  aarch64)
    target="aarch64-unknown-linux-gnu"
    expected_sha256="37f9eee45b388a30192907ecf4565b93df945c079331657073b5b3caf8bb1cd0"
    expected_payload_sha256="54039931c1088483706790e6cf73444ad88b843a9bb0ca8285b82fc309ad4810"
    ;;
  *) echo "FATAL: unsupported arch $arch for sqld release binary"; exit 1 ;;
esac

M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/sqld/bin"
payload="$DEST/sqld"
front="$M/usr/bin/sqld"
data="$M/.local/share/sqld"
auth_dir="$M/.config/sqld"
key="$auth_dir/auth-jwt-key.pem"
token_file="$auth_dir/client.jwt"
probe_root="$M/usr/libexec/envctl/sqld/bin"
probe_dir="$probe_root/current"
probe="$probe_dir/secretctl"
probe_digest="$probe_dir/secretctl.sha256"
probe_source="$probe_dir/secretctl.source.sha256"
probe_contract='envctl-sqld-readiness-v1'
rustup_bin="$M/.toolchains/cargo/bin/rustup"
rust_toolchain_dir="$M/.toolchains/rustup/toolchains/1.89.0-${target}"
rustc_bin="$rust_toolchain_dir/bin/rustc"
cargo_bin="$rust_toolchain_dir/bin/cargo"
rustdoc_bin="$rust_toolchain_dir/bin/rustdoc"
rust_lld_bin="$rust_toolchain_dir/lib/rustlib/$target/bin/rust-lld"
rust_toolchain_lib_root="$rust_toolchain_dir/lib"
llvm_bin="$M/.toolchains/llvm/bin"
llvm_generation_root="$M/.toolchains/llvm"
clang_bin="$llvm_bin/clang"
clangxx_bin="$llvm_bin/clang++"
llvm_ar_bin="$llvm_bin/llvm-ar"
llvm_ranlib_bin="$llvm_bin/llvm-ranlib"
clang_resource_root="$M/.toolchains/llvm/lib/clang/21"
uid="$(id -u)"

canonical_is_lexical() {
  [ "$(readlink -f -- "$1" 2>/dev/null)" = "$1" ]
}
owned_real_dir() {
  [ -d "$1" ] && [ ! -L "$1" ] && [ "$(stat -c '%u' "$1")" = "$uid" ] \
    && canonical_is_lexical "$1"
}
validate_managed_chain() {
  target_path="$1"
  case "$target_path" in "$M"|"$M"/*) ;; *) echo "FATAL: managed sqld path escapes META_ROOT: $target_path" >&2; exit 1 ;; esac
  owned_real_dir "$M" \
    || { echo "FATAL: META_ROOT must be a canonical current-user-owned real directory" >&2; exit 1; }
  case "$(stat -c '%a' "$M")" in 700|755|775) ;; *) echo "FATAL: unsafe META_ROOT mode" >&2; exit 1 ;; esac
  relative="${target_path#"$M"}"
  relative="${relative#/}"
  current="$M"
  missing=0
  IFS='/' read -r -a components <<< "$relative"
  for component in "${components[@]}"; do
    [ -n "$component" ] || continue
    current="$current/$component"
    if [ -e "$current" ] || [ -L "$current" ]; then
      [ "$missing" = 0 ] && owned_real_dir "$current" \
        || { echo "FATAL: managed sqld parent chain is not canonical/current-user-owned: $current" >&2; exit 1; }
      case "$(stat -c '%a' "$current")" in 700|755|775) ;; *) echo "FATAL: unsafe managed sqld directory mode: $current" >&2; exit 1 ;; esac
    else
      missing=1
    fi
  done
}
validate_existing_dir_mode() {
  path="$1"
  expected_mode="$2"
  if [ -e "$path" ] || [ -L "$path" ]; then
    owned_real_dir "$path" && [ "$(stat -c '%a' "$path")" = "$expected_mode" ] \
      || { echo "FATAL: unsafe managed sqld directory: $path" >&2; exit 1; }
  fi
}
validate_existing_leaf() {
  path="$1"
  expected_mode="$2"
  if [ -e "$path" ] || [ -L "$path" ]; then
    [ -f "$path" ] && [ ! -L "$path" ] && canonical_is_lexical "$path" \
      && [ "$(stat -c '%u' "$path")" = "$uid" ] && [ "$(stat -c '%a' "$path")" = "$expected_mode" ] \
      || { echo "FATAL: unsafe managed sqld file: $path" >&2; exit 1; }
  fi
}
validate_build_config_file() {
  config="$1"
  if [ -e "$config" ] || [ -L "$config" ]; then
    [ -f "$config" ] && [ ! -L "$config" ] && canonical_is_lexical "$config" \
      && [ "$(stat -c '%u' "$config")" = "$uid" ] \
      || { echo "FATAL: unowned or symlinked Cargo config: $config" >&2; exit 1; }
  fi
}
reject_external_build_config() {
  config="$1"
  if [ -e "$config" ] || [ -L "$config" ]; then
    echo "FATAL: external Cargo config is forbidden for the sqld helper build: $config" >&2
    exit 1
  fi
}
validate_source_tree() {
  source_root="$1"
  case "$source_root" in /*) ;; *) echo "FATAL: envctl source root must be absolute" >&2; exit 1 ;; esac
  owned_real_dir "$source_root" \
    || { echo "FATAL: envctl source root must be canonical/current-user-owned" >&2; exit 1; }
  for required in Cargo.toml Cargo.lock rust-toolchain.toml assets/scripts/envctl-sqld-hermetic-cargo.sh crates/secretctl crates/secrets-engine crates/secrets-proto; do
    node="$source_root/$required"
    [ -e "$node" ] && [ ! -L "$node" ] && canonical_is_lexical "$node" \
      && [ "$(stat -c '%u' "$node")" = "$uid" ] && { [ -f "$node" ] || [ -d "$node" ]; } \
      || { echo "FATAL: unsafe or missing envctl build input: $node" >&2; exit 1; }
  done
  while IFS= read -r -d '' node; do
    [ ! -L "$node" ] && canonical_is_lexical "$node" \
      && [ "$(stat -c '%u' "$node")" = "$uid" ] && { [ -f "$node" ] || [ -d "$node" ]; } \
      || { echo "FATAL: unsafe envctl build-tree node: $node" >&2; exit 1; }
  done < <(find "$source_root/Cargo.toml" "$source_root/Cargo.lock" "$source_root/rust-toolchain.toml" \
    "$source_root/assets/scripts/envctl-sqld-hermetic-cargo.sh" \
    "$source_root/crates/secretctl" "$source_root/crates/secrets-engine" "$source_root/crates/secrets-proto" \
    -print0)
  validate_build_config_file "$source_root/.cargo/config.toml"
  validate_build_config_file "$source_root/.cargo/config"
  reject_external_build_config "/.cargo/config.toml"
  reject_external_build_config "/.cargo/config"
  reject_external_build_config "$M/.toolchains/cargo/config.toml"
  reject_external_build_config "$M/.toolchains/cargo/config"
}
sanitize_cargo_environment() {
  unset RUSTC RUSTDOC RUSTDOCFLAGS RUSTC_WRAPPER RUSTC_WORKSPACE_WRAPPER RUSTFLAGS \
    CARGO_ENCODED_RUSTFLAGS CARGO_BUILD_RUSTC CARGO_BUILD_RUSTDOC CARGO_BUILD_RUSTC_WRAPPER \
    CARGO_BUILD_RUSTC_WORKSPACE_WRAPPER CARGO_BUILD_RUSTFLAGS \
    CC CXX AR RANLIB CFLAGS CXXFLAGS CPPFLAGS LDFLAGS BINDGEN_EXTRA_CLANG_ARGS
  while IFS='=' read -r variable _; do
    case "$variable" in \
      CARGO_TARGET_*_LINKER|CARGO_TARGET_*_RUSTFLAGS|CARGO_TARGET_*_RUNNER|\
      CC_*|CXX_*|AR_*|RANLIB_*|CFLAGS_*|CXXFLAGS_*|CPPFLAGS_*|LDFLAGS_*|\
      *_CC|*_CXX|*_AR|*_RANLIB|*_CFLAGS|*_CXXFLAGS|*_CPPFLAGS|*_LDFLAGS) unset "$variable" ;;
    esac
  done < <(env)
}
load_hermetic_cargo_helpers() {
  local helper="$source_root/assets/scripts/envctl-sqld-hermetic-cargo.sh"
  local expected_sha256="e64615f3491225e9420572f196bcc4618a4d7cb031083e1f49a5bf3c5821cf53"
  [ -f "$helper" ] && [ ! -L "$helper" ] && canonical_is_lexical "$helper" \
    && [ "$(stat -c '%u' "$helper")" = "$uid" ] && [ "$(stat -c '%a' "$helper")" = 755 ] \
    || { echo "FATAL: unsafe sqld hermetic-Cargo helper" >&2; exit 1; }
  [ "$(/usr/bin/sha256sum "$helper" | /usr/bin/awk '{print $1}')" = "$expected_sha256" ] \
    || { echo "FATAL: sqld hermetic-Cargo helper SHA-256 mismatch" >&2; exit 1; }
  # shellcheck source=../../assets/scripts/envctl-sqld-hermetic-cargo.sh
  source "$helper"
}
sqld_mv() { /usr/bin/mv "$@"; }
sqld_sync() { /usr/bin/sync "$@"; }
payload_activation=0
payload_was_initial=0
payload_fallback=""
front_activation=0
front_was_initial=0
front_fallback=""
helper_activation=0
helper_was_initial=0
helper_fallback=""
auth_created=0
service_restore_needed=0
service_enabled_state=""
require_atomic_mv() {
  /usr/bin/mv --help 2>&1 | /usr/bin/grep -Fq -- '--exchange' \
    && /usr/bin/mv --help 2>&1 | /usr/bin/grep -Fq -- '--no-copy' \
    || { echo "FATAL: host mv lacks atomic --exchange/--no-copy support" >&2; exit 1; }
}
rollback_payload_activation() {
  [ "$payload_activation" = 1 ] || return 0
  failed=0
  if [ "$payload_was_initial" = 1 ]; then
    sqld_mv -T --no-copy -- "$payload" "$payload_fallback" || failed=1
  else
    sqld_mv -T --exchange --no-copy -- "$payload_fallback" "$payload" || failed=1
  fi
  if [ "$failed" = 0 ]; then
    sqld_sync -f "$DEST" || failed=1
    /usr/bin/rm -f -- "$payload_fallback" || failed=1
    sqld_sync -f "$DEST" || failed=1
  fi
  [ "$failed" = 0 ] || return 1
  payload_activation=0
  payload_fallback=""
}
rollback_front_activation() {
  [ "$front_activation" = 1 ] || return 0
  failed=0
  if [ "$front_was_initial" = 1 ]; then
    sqld_mv -T --no-copy -- "$front" "$front_fallback" || failed=1
  else
    sqld_mv -T --exchange --no-copy -- "$front_fallback" "$front" || failed=1
  fi
  if [ "$failed" = 0 ]; then
    sqld_sync -f "$M/usr/bin" || failed=1
    /usr/bin/rm -f -- "$front_fallback" || failed=1
    sqld_sync -f "$M/usr/bin" || failed=1
  fi
  [ "$failed" = 0 ] || return 1
  front_activation=0
  front_fallback=""
}
rollback_helper_activation() {
  [ "$helper_activation" = 1 ] || return 0
  failed=0
  if [ "$helper_was_initial" = 1 ]; then
    sqld_mv -T --no-copy -- "$probe_dir" "$helper_fallback" || failed=1
  else
    sqld_mv -T --exchange --no-copy -- "$helper_fallback" "$probe_dir" || failed=1
  fi
  if [ "$failed" = 0 ]; then
    sqld_sync -f "$probe_root" || failed=1
    /usr/bin/rm -rf --one-file-system -- "$helper_fallback" || failed=1
    sqld_sync -f "$probe_root" || failed=1
  fi
  [ "$failed" = 0 ] || return 1
  helper_activation=0
  helper_fallback=""
}
rollback_created_auth() {
  [ "$auth_created" = 1 ] || return 0
  auth_file_ok "$key" && auth_file_ok "$token_file" || return 1
  /usr/bin/rm -f -- "$key" "$token_file" || return 1
  sqld_sync -f "$auth_dir" || return 1
  auth_created=0
}
restore_service_after_rollback() {
  [ "$service_restore_needed" = 1 ] || return 0
  if [ "$service_enabled_state" = enabled ]; then
    systemctl --user enable --now sqld.service || return 1
  else
    systemctl --user start sqld.service || return 1
  fi
  [ "$(systemctl --user show --property=ActiveState --value sqld.service)" = active ] \
    || return 1
  service_restore_needed=0
}
rollback_runtime_activation() {
  failed=0
  rollback_front_activation || failed=1
  rollback_payload_activation || failed=1
  rollback_helper_activation || failed=1
  rollback_created_auth || failed=1
  restore_service_after_rollback || failed=1
  [ "$failed" = 0 ]
}
commit_runtime_activation() {
  failed=0
  if [ "$front_activation" = 1 ] && [ "$front_was_initial" = 0 ]; then
    /usr/bin/rm -f -- "$front_fallback" || failed=1
  fi
  if [ "$payload_activation" = 1 ] && [ "$payload_was_initial" = 0 ]; then
    /usr/bin/rm -f -- "$payload_fallback" || failed=1
  fi
  if [ "$helper_activation" = 1 ] && [ "$helper_was_initial" = 0 ]; then
    /usr/bin/rm -rf --one-file-system -- "$helper_fallback" || failed=1
  fi
  sqld_sync -f "$M/usr/bin" || failed=1
  sqld_sync -f "$DEST" || failed=1
  sqld_sync -f "$probe_root" || failed=1
  [ "$failed" = 0 ] || return 1
  front_activation=0
  payload_activation=0
  helper_activation=0
  auth_created=0
  front_fallback=""
  payload_fallback=""
  helper_fallback=""
}
preflight_layout() {
  source_root="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
  load_hermetic_cargo_helpers
  require_atomic_mv
  for managed_dir in "$DEST" "$M/usr/bin" "$data" "$auth_dir" "$probe_root" "$probe_dir" \
    "$M/var/tmp/envctl" "$M/.toolchains/cargo" "$M/.toolchains/rustup" "$rust_toolchain_dir/bin" \
    "$rust_toolchain_dir/lib/rustlib/$target/bin" "$rust_toolchain_lib_root" \
    "$llvm_generation_root" "$llvm_bin" "$clang_resource_root"; do
    validate_managed_chain "$managed_dir"
  done
  validate_existing_dir_mode "$DEST" 755
  validate_existing_dir_mode "$M/.toolchains/sqld" 755
  validate_existing_dir_mode "$M/usr/bin" 755
  validate_existing_dir_mode "$data" 700
  validate_existing_dir_mode "$auth_dir" 700
  validate_existing_dir_mode "$probe_root" 755
  validate_existing_dir_mode "$M/usr/libexec/envctl/sqld" 755
  validate_existing_dir_mode "$probe_dir" 755
  validate_existing_dir_mode "$M/var/tmp/envctl" 700
  validate_source_tree "$source_root"
  validate_existing_leaf "$payload" 755
  for managed_exec in "$rustup_bin" "$rustc_bin" "$cargo_bin" "$rustdoc_bin" "$rust_lld_bin" \
    "$clang_bin" "$clangxx_bin" "$llvm_ar_bin" "$llvm_ranlib_bin"; do
    [ -x "$managed_exec" ] && [ -f "$managed_exec" ] && [ ! -L "$managed_exec" ] \
      && canonical_is_lexical "$managed_exec" && [ "$(stat -c '%u' "$managed_exec")" = "$uid" ] \
      && [ "$(stat -c '%a' "$managed_exec")" = 755 ] \
      || { echo "FATAL: required META-owned Rust toolchain executable is unsafe or missing: $managed_exec" >&2; exit 1; }
  done
  validate_toolchain_resource_tree
  helper_owned_or_absent
  key_exists=0
  token_exists=0
  { [ -e "$key" ] || [ -L "$key" ]; } && key_exists=1
  { [ -e "$token_file" ] || [ -L "$token_file" ]; } && token_exists=1
  if [ "$key_exists" = 1 ] || [ "$token_exists" = 1 ]; then
    [ "$key_exists" = 1 ] && [ "$token_exists" = 1 ] && auth_file_ok "$key" && auth_file_ok "$token_file" \
      || { echo "FATAL: partial or unsafe existing sqld auth pair" >&2; exit 1; }
  fi
  key_source="${SQLD_AUTH_JWT_KEY_SOURCE:-}"
  token_source="${SQLD_CLIENT_JWT_SOURCE:-}"
  if [ -n "$key_source" ] || [ -n "$token_source" ]; then
    [ -n "$key_source" ] && [ -n "$token_source" ] && auth_file_ok "$key_source" && auth_file_ok "$token_source" \
      || { echo "FATAL: both sqld auth overrides must be safe canonical 0600 files" >&2; exit 1; }
  fi
  frontdoor_owned_or_absent \
    || { echo "FATAL: refusing to replace foreign frontdoor $front" >&2; exit 1; }
}

wrapper_body() {
  printf '%s\n' '#!/bin/sh' '# managed-by: envctl component sqld' "exec \"$payload\" \"\$@\""
}
legacy_wrapper_body() {
  printf '%s\n' '#!/bin/sh' "exec \"$payload\" \"\$@\""
}
frontdoor_owned_or_absent() {
  if [ ! -e "$front" ] && [ ! -L "$front" ]; then
    return 0
  fi
  [ -f "$front" ] && [ ! -L "$front" ] || return 1
  current="$(cat "$front")"
  [ "$current" = "$(wrapper_body)" ] || [ "$current" = "$(legacy_wrapper_body)" ]
}
payload_ok() {
  "$probe" internal-sqld-verify-sha256 \
    --file "$1" --expected-sha256 "$expected_payload_sha256" --expected-mode 0755
}
auth_file_ok() {
  [ -s "$1" ] && [ -f "$1" ] && [ ! -L "$1" ] \
    && canonical_is_lexical "$1" \
    && [ "$(stat -c '%a' "$1")" = 600 ] \
    && [ "$(stat -c '%u' "$1")" = "$uid" ]
}
ensure_auth_dir() {
  if [ -e "$auth_dir" ] || [ -L "$auth_dir" ]; then
    [ -d "$auth_dir" ] && [ ! -L "$auth_dir" ] && [ "$(stat -c '%u' "$auth_dir")" = "$(id -u)" ] \
      || { echo "FATAL: sqld auth path must be a current-user-owned real directory" >&2; exit 1; }
  else
    install -d -m700 "$auth_dir"
  fi
  chmod 700 "$auth_dir"
}
adopt_auth_pair() {
  key_source="$1"
  token_source="$2"
  auth_file_ok "$key_source" \
    || { echo "FATAL: refusing unsafe sqld JWT verification-key source (must be nonempty, current-user-owned, regular 0600)" >&2; exit 1; }
  auth_file_ok "$token_source" \
    || { echo "FATAL: refusing unsafe sqld client-JWT source (must be nonempty, current-user-owned, regular 0600)" >&2; exit 1; }
  staged_key="$(mktemp "$auth_dir/.key.XXXXXX")"
  staged_token="$(mktemp "$auth_dir/.token.XXXXXX")"
  install -m600 "$key_source" "$staged_key"
  install -m600 "$token_source" "$staged_token"
  cmp -s "$key_source" "$staged_key" && cmp -s "$token_source" "$staged_token" \
    || { echo "FATAL: staged sqld auth pair differs from its source" >&2; exit 1; }
  ln "$staged_key" "$key" \
    || { echo "FATAL: refusing to overwrite sqld JWT verification key" >&2; exit 1; }
