kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export BUN_INSTALL=\"$M/.toolchains/.bun\"; export PATH=\"$M/usr/bin:$BUN_INSTALL/bin:$PATH\"; bun --version >/dev/null && [ -x \"$M/usr/bin/bunx\" ] && grep -q 'envctl bunx wrapper' \"$M/usr/bin/bunx\" && [ -x \"$M/usr/bin/npx\" ] && grep -q 'envctl bunx wrapper' \"$M/usr/bin/npx\" && [ -x \"$M/usr/bin/npm\" ] && grep -q 'envctl bun package-manager wrapper' \"$M/usr/bin/npm\" && [ -x \"$M/usr/bin/pnpm\" ] && grep -q 'envctl bun package-manager wrapper' \"$M/usr/bin/pnpm\""]
