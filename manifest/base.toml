# Core dev base: fonts, JS runtime (+ node-via-bun), Rust toolchain, and the
# profile-owned RTK compatibility component.
# Maps the surviving declarative portions of yazelix-setup.sh sections 1-3.

[[component]]
id = "nerd-fonts"
name = "Nerd Fonts (JetBrainsMono, FiraCode)"
description = "Patched fonts for the terminal/editor UI."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "fc-list 2>/dev/null | grep -qiE 'JetBrainsMono Nerd|FiraCode Nerd'"]
[component.install]
kind = "script"
script = '''
set -e
FD="$META_ROOT/.local/share/fonts"; mkdir -p "$FD"; cd "$(mktemp -d)"
base="https://github.com/ryanoasis/nerd-fonts/releases/latest/download"
for f in JetBrainsMono FiraCode; do
  curl -fsSL -o "$f.zip" "$base/$f.zip"
  unzip -oq "$f.zip" -d "$FD/$f-NerdFont"
done
fc-cache -f >/dev/null
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "fc-list | grep -qiE 'JetBrainsMono Nerd Font|FiraCode Nerd Font'"]
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "rm -rf \"$META_ROOT/.local/share/fonts/JetBrainsMono-NerdFont\" \"$META_ROOT/.local/share/fonts/FiraCode-NerdFont\"; fc-cache -f >/dev/null"]


[[component]]
id = "bun"
name = "Bun JS runtime"
description = "JS runtime + package manager; exposes bun/bunx and package-manager frontdoors through regular $META_ROOT/usr/bin wrappers. npx/pnpx dispatch to bunx; npm/pnpm/yarn dispatch to bun so Node package-manager commands do not fall back to host npm/pnpm."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/.bun/bin/bun\" ] && [ -x \"$META_ROOT/usr/bin/bun\" ] && [ ! -L \"$META_ROOT/usr/bin/bun\" ] && grep -Fqx \"exec \\\"$M/.toolchains/.bun/bin/bun\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/bun\" && [ -x \"$META_ROOT/usr/bin/bunx\" ] && grep -q 'envctl bunx wrapper' \"$META_ROOT/usr/bin/bunx\" && [ -x \"$META_ROOT/usr/bin/npx\" ] && grep -q 'envctl bunx wrapper' \"$META_ROOT/usr/bin/npx\" && [ -x \"$META_ROOT/usr/bin/npm\" ] && grep -q 'envctl bun package-manager wrapper' \"$META_ROOT/usr/bin/npm\" && [ -x \"$META_ROOT/usr/bin/pnpm\" ] && grep -q 'envctl bun package-manager wrapper' \"$META_ROOT/usr/bin/pnpm\""]
[component.install]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -e
M="${META_ROOT:?META_ROOT required}"
export BUN_INSTALL="$M/.toolchains/.bun"
mkdir -p "$BUN_INSTALL" "$META_ROOT/usr/bin"
curl -fsSL https://bun.sh/install | bash
envctl_frontdoor "$BUN_INSTALL/bin/bun" "$META_ROOT/usr/bin/bun"
cat >"$META_ROOT/usr/bin/bunx" <<'BUNX'
#!/usr/bin/env bash
# envctl bunx wrapper
set -euo pipefail
self="${BASH_SOURCE[0]}"
while [ -L "$self" ]; do
  dir="$(cd -P "$(dirname "$self")" && pwd)"
  target="$(readlink "$self")"
  case "$target" in
    /*) self="$target" ;;
    *) self="$dir/$target" ;;
  esac
done
bindir="$(cd -P "$(dirname "$self")" && pwd)"
META_ROOT="$(cd "$bindir/../.." && pwd)"
export META_ROOT
export BUN_INSTALL="${BUN_INSTALL:-$META_ROOT/.toolchains/.bun}"
export HOME="${HOME:-$META_ROOT/.local}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$META_ROOT/.local/cache}"
exec "$BUN_INSTALL/bin/bun" x "$@"
BUNX
chmod 755 "$META_ROOT/usr/bin/bunx"
for b in npx pnpx; do
  cat >"$META_ROOT/usr/bin/$b" <<'BUNX'
#!/usr/bin/env bash
# envctl bunx wrapper
set -euo pipefail
self="${BASH_SOURCE[0]}"
while [ -L "$self" ]; do
  dir="$(cd -P "$(dirname "$self")" && pwd)"
  target="$(readlink "$self")"
  case "$target" in
    /*) self="$target" ;;
    *) self="$dir/$target" ;;
  esac
done
bindir="$(cd -P "$(dirname "$self")" && pwd)"
META_ROOT="$(cd "$bindir/../.." && pwd)"
export META_ROOT
export BUN_INSTALL="${BUN_INSTALL:-$META_ROOT/.toolchains/.bun}"
export HOME="${HOME:-$META_ROOT/.local}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$META_ROOT/.local/cache}"
exec "$BUN_INSTALL/bin/bun" x "$@"
BUNX
  chmod 755 "$META_ROOT/usr/bin/$b"
done
for b in npm pnpm yarn yarnpkg; do
  cat >"$META_ROOT/usr/bin/$b" <<'BUNPM'
#!/usr/bin/env bash
# envctl bun package-manager wrapper
set -euo pipefail
self="${BASH_SOURCE[0]}"
while [ -L "$self" ]; do
  dir="$(cd -P "$(dirname "$self")" && pwd)"
  target="$(readlink "$self")"
  case "$target" in
    /*) self="$target" ;;
    *) self="$dir/$target" ;;
  esac
done
bindir="$(cd -P "$(dirname "$self")" && pwd)"
META_ROOT="$(cd "$bindir/../.." && pwd)"
export META_ROOT
export BUN_INSTALL="${BUN_INSTALL:-$META_ROOT/.toolchains/.bun}"
export HOME="${HOME:-$META_ROOT/.local}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$META_ROOT/.local/cache}"
exec "$BUN_INSTALL/bin/bun" "$@"
BUNPM
  chmod 755 "$META_ROOT/usr/bin/$b"
done
'''
