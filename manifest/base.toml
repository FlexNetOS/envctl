args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$M/usr/bin/bun\"; src=\"$M/.toolchains/.bun/bin/bun\"; { [ -L \"$t\" ] && [ \"$(readlink -f \"$t\" 2>/dev/null)\" = \"$(readlink -f \"$src\" 2>/dev/null)\" ]; } || { [ -f \"$t\" ] && grep -Fqx \"exec \\\"$src\\\" \\\"\\$@\\\"\" \"$t\"; } && rm -f \"$t\" || true; for b in bunx npx pnpx; do if grep -q 'envctl bunx wrapper' \"$M/usr/bin/$b\" 2>/dev/null; then rm -f \"$M/usr/bin/$b\"; fi; done; for b in npm pnpm yarn yarnpkg; do if grep -q 'envctl bun package-manager wrapper' \"$M/usr/bin/$b\" 2>/dev/null; then rm -f \"$M/usr/bin/$b\"; fi; done; rm -rf \"$M/.toolchains/.bun\""]
[component.wiring]
path_entries = ["$META_ROOT/.toolchains/.bun/bin", "$META_ROOT/usr/bin"]
[[component.wiring.shell_rc]]
file = "$META_ROOT/.bashrc"
marker = "meta toolchain path"
content = 'eval "$(envctl env --toolchains)"'


[[component]]
id = "node-via-bun"
name = "node → bun symlink"
description = "Exposes `node` as a symlink to bun (node-compat mode)."
requires = ["bun"]
[component.detect]
kind = "command"
command = "bash"
# Truthful: node-compat is satisfied if EITHER ~/.bun/bin/node points at bun
# (the bun node shim) OR a real `node` resolves on PATH. On an n8n box the real
# node ($META_ROOT/usr/bin/node) precedes the inert bun symlink — that still counts.
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; { [ -x \"$M/.toolchains/.bun/bin/node\" ] && readlink -f \"$M/.toolchains/.bun/bin/node\" 2>/dev/null | grep -q bun; } || command -v node >/dev/null"]
[component.install]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; ln -sf \"$M/.toolchains/.bun/bin/bun\" \"$M/.toolchains/.bun/bin/node\""]
[component.verify]
kind = "command"
command = "bash"
# Bun's node shim runs `node <script>` but NOT `node --version`. A real node also
# runs `node -e`. So `node -e` is the honest node-compat smoke test for BOTH
# runtimes. Prefer a real node if one is on PATH; else fall back to the bun shim.
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$M/.toolchains/.bun/bin:$PATH\"; node -e 'process.exit(0)'"]
[component.fix]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; ln -sf \"$M/.toolchains/.bun/bin/bun\" \"$M/.toolchains/.bun/bin/node\""]
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; rm -f \"$M/.toolchains/.bun/bin/node\""]


[[component]]
id = "node-real"
name = "Real Node.js (n8n V8 runtime)"
description = "Real Node 20-24 for tools that need V8 (n8n's isolated-vm), installed into $META_ROOT/.toolchains/node with only node/corepack frontdoor wrappers. Bun (JSC) cannot satisfy V8; this is the narrow non-bun carve-out. Bun owns npm/npx/pnpm/yarn package-manager frontdoors."
[component.detect]
kind = "command"
command = "bash"
# A REAL node (not the bun shim) in n8n's supported range 20-24.
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/node/bin/node\" ] && [ -x \"$META_ROOT/usr/bin/node\" ] && [ ! -L \"$META_ROOT/usr/bin/node\" ] && grep -Fqx \"exec \\\"$M/.toolchains/node/bin/node\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/node\" && \"$META_ROOT/usr/bin/node\" -e 'const m=+process.versions.node.split(\".\")[0]; process.exit(m>=20 && m<=24 ? 0 : 1)'"]
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$M/usr/bin:$PATH\"; [ -x \"$M/usr/bin/node\" ] && [ ! -L \"$M/usr/bin/node\" ] && grep -Fqx \"exec \\\"$M/.toolchains/node/bin/node\\\" \\\"\\$@\\\"\" \"$M/usr/bin/node\" && node -e 'const m=+process.versions.node.split(\".\")[0]; process.exit(m>=20 && m<=24 ? 0 : 1)'"]
[component.install]
kind = "script"
# Install a real Node 22 LTS into the meta toolchain prefix without touching bun.
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -e
VER=v22.22.3
ARCH="$(uname -m)"; case "$ARCH" in x86_64) A=x64;; aarch64) A=arm64;; *) A="$ARCH";; esac
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/node"
cd "$(mktemp -d)"
curl -fsSL -o node.tar.xz "https://nodejs.org/dist/$VER/node-$VER-linux-$A.tar.xz"
rm -rf "$DEST"
mkdir -p "$DEST" "$META_ROOT/usr/bin"
tar -xJf node.tar.xz --strip-components=1 -C "$DEST"
for b in node corepack; do
  [ -x "$DEST/bin/$b" ] && envctl_frontdoor "$DEST/bin/$b" "$META_ROOT/usr/bin/$b"
done

'''
[component.fix]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -e
VER=v22.22.3
ARCH="$(uname -m)"; case "$ARCH" in x86_64) A=x64;; aarch64) A=arm64;; *) A="$ARCH";; esac
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/node"
cd "$(mktemp -d)"
curl -fsSL -o node.tar.xz "https://nodejs.org/dist/$VER/node-$VER-linux-$A.tar.xz"
rm -rf "$DEST"
mkdir -p "$DEST" "$META_ROOT/usr/bin"
tar -xJf node.tar.xz --strip-components=1 -C "$DEST"
for b in node corepack; do
  [ -x "$DEST/bin/$b" ] && envctl_frontdoor "$DEST/bin/$b" "$META_ROOT/usr/bin/$b"
done

'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; for b in node corepack; do t=\"$M/usr/bin/$b\"; src=\"$M/.toolchains/node/bin/$b\"; { [ -L \"$t\" ] && [ \"$(readlink -f \"$t\" 2>/dev/null)\" = \"$(readlink -f \"$src\" 2>/dev/null)\" ]; } || { [ -f \"$t\" ] && grep -Fqx \"exec \\\"$src\\\" \\\"\\$@\\\"\" \"$t\"; } && rm -f \"$t\" || true; done; rm -rf \"$M/.toolchains/node\""]
[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]


[[component]]
id = "rustup"
name = "rustup toolchain"
description = "Rust toolchain manager (cargo/rustc). Foundation for cuda-oxide and Rust development; RTK is owned separately by the Yazelix Nix profile."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export CARGO_HOME=\"$M/.toolchains/cargo\" RUSTUP_HOME=\"$M/.toolchains/rustup\" PATH=\"$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH\"; rustup --version >/dev/null 2>&1 && cargo --version >/dev/null 2>&1 && rustc --version >/dev/null 2>&1 && rustup default 2>/dev/null | grep -q '^nightly' && rustup toolchain list | grep -q '^1.89.0-' && cargo +1.89.0 --version >/dev/null"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
export CARGO_HOME="$M/.toolchains/cargo"
export RUSTUP_HOME="$M/.toolchains/rustup"
mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$META_ROOT/.toolchains/cargo/bin"
# Owner standing directive: the workstation/meta Rust default is ALWAYS nightly (latest).
# A repo with its own rust-toolchain.toml still overrides this for its own builds; envctl itself
# tracks nightly there while separately proving its Rust 1.89 MSRV. The global default does not
# override another repository's pinned channel.
curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain nightly
export PATH="$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH"
rustup toolchain install 1.89.0 --profile minimal
rustup default nightly
for tool in cargo cargo-clippy cargo-fmt cargo-miri clippy-driver rls rust-analyzer rust-gdb rust-gdbgui rust-lldb rustc rustdoc rustfmt; do
  ln -sfn rustup "$CARGO_HOME/bin/$tool"
done
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export CARGO_HOME=\"$M/.toolchains/cargo\" RUSTUP_HOME=\"$M/.toolchains/rustup\" PATH=\"$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH\"; rustup --version && rustup default | grep -q '^nightly' && rustc --version && cargo --version && cargo +1.89.0 --version"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
export CARGO_HOME="$M/.toolchains/cargo"
export RUSTUP_HOME="$M/.toolchains/rustup"
mkdir -p "$CARGO_HOME" "$RUSTUP_HOME" "$META_ROOT/.toolchains/cargo/bin"
if [ ! -x "$CARGO_HOME/bin/rustup" ]; then
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain nightly
fi
export PATH="$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH"
rustup self update
# Keep the meta default on the LATEST nightly (owner directive: always latest toolchain).
rustup update nightly
rustup toolchain install 1.89.0 --profile minimal
rustup default nightly
for tool in cargo cargo-clippy cargo-fmt cargo-miri clippy-driver rls rust-analyzer rust-gdb rust-gdbgui rust-lldb rustc rustdoc rustfmt; do
  ln -sfn rustup "$CARGO_HOME/bin/$tool"
done
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export CARGO_HOME=\"$M/.toolchains/cargo\" RUSTUP_HOME=\"$M/.toolchains/rustup\" PATH=\"$CARGO_HOME/bin:$META_ROOT/.toolchains/cargo/bin:$PATH\"; rustup self uninstall -y"]


[[component]]
id = "rtk"
name = "rtk (Yazelix profile-owned)"
description = "Compatibility component that validates one RTK payload in the real-home Yazelix Nix profile and archives parallel Cargo, META_ROOT, or user-bin shadows. It never installs a wrapper or a second RTK binary."
requires = ["yazelix"]
[component.detect]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-rtk-profile-lifecycle.sh"
args = ["detect"]
[component.install]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-rtk-profile-lifecycle.sh"
args = ["install"]
[component.verify]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-rtk-profile-lifecycle.sh"
args = ["verify"]
[component.fix]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-rtk-profile-lifecycle.sh"
args = ["fix"]
[component.remove]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-rtk-profile-lifecycle.sh"
args = ["remove"]
