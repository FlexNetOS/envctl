# Nix + yazelix stack (yazelix-setup.sh sections 4-8). Strict order:
#   nix -> nix-yazelix-cache (+restart daemon) -> home-manager -> yazelix
#   -> yazelix-desktop -> yazelix-config, plus the shell auto-enter + default terminal.

[[component]]
id = "nix"
name = "Nix (Determinate, flakes)"
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/nix/bin/nix\" ] && [ \"$(readlink -f \"$META_ROOT/.local/bin/nix\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/nix/bin/nix\")\" ] && [ -e /nix ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
if [ ! -e /nix ]; then
  curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --no-confirm
fi
install -d -m 755 "$M/.toolchains/nix/bin" "$META_ROOT/.local/bin"
src="$(readlink -f /nix/var/nix/profiles/default/bin/nix)"
install -m 755 "$src" "$M/.toolchains/nix/bin/nix"
ln -sfn "$M/.toolchains/nix/bin/nix" "$META_ROOT/.local/bin/nix"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$META_ROOT/.local/bin:$PATH\"; [ \"$(readlink -f \"$(command -v nix)\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/nix/bin/nix\")\" ] && nix --version"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
sudo systemctl restart nix-daemon 2>/dev/null || true
install -d -m 755 "$M/.toolchains/nix/bin" "$META_ROOT/.local/bin"
src="$(readlink -f /nix/var/nix/profiles/default/bin/nix)"
install -m 755 "$src" "$M/.toolchains/nix/bin/nix"
ln -sfn "$M/.toolchains/nix/bin/nix" "$META_ROOT/.local/bin/nix"
"$M/.toolchains/nix/bin/nix" --version
'''
[component.remove]
kind = "script"
script = "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$META_ROOT/.local/bin/nix\"; [ -L \"$t\" ] && readlink \"$t\" | grep -q \"$M/.toolchains/nix\" && rm -f \"$t\"; rm -rf \"$M/.toolchains/nix\""
[component.wiring]
path_entries = ["$META_ROOT/.local/bin"]


[[component]]
id = "nix-yazelix-cache"
name = "yazelix Cachix cache + eval-cores"
description = "Appends eval-cores + yazelix substituter to /etc/nix/nix.custom.conf."
requires = ["nix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "grep -q 'yazelix.cachix.org' /etc/nix/nix.custom.conf 2>/dev/null"]
[component.install]
kind = "script"
script = '''
set -e
sudo install -dm 755 /etc/nix
sudo touch /etc/nix/nix.custom.conf
add(){ grep -qF -- "$1" /etc/nix/nix.custom.conf || echo "$1" | sudo tee -a /etc/nix/nix.custom.conf >/dev/null; }
add "eval-cores = 0"
add "extra-substituters = https://yazelix.cachix.org"
add "extra-trusted-public-keys = yazelix.cachix.org-1:ZgxIjQvaP0VTWL8Racx27mpUNzDJ97xC2y7QWYjmGNM="
sudo systemctl restart nix-daemon 2>/dev/null || true
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; nix config show 2>/dev/null | grep -qE 'yazelix\\.cachix\\.org'"]
[component.fix]
kind = "script"
script = '''
set -e
add(){ grep -qF -- "$1" /etc/nix/nix.custom.conf || echo "$1" | sudo tee -a /etc/nix/nix.custom.conf >/dev/null; }
add "extra-substituters = https://yazelix.cachix.org"
sudo systemctl restart nix-daemon 2>/dev/null || true
'''
# Declarative: reset removes ONLY these exact owned lines from
# /etc/nix/nix.custom.conf (foreign lines survive) and restarts nix-daemon once.
[[component.wiring.nix_conf_lines]]
line = "eval-cores = 0"
[[component.wiring.nix_conf_lines]]
line = "extra-substituters = https://yazelix.cachix.org"
[[component.wiring.nix_conf_lines]]
line = "extra-trusted-public-keys = yazelix.cachix.org-1:ZgxIjQvaP0VTWL8Racx27mpUNzDJ97xC2y7QWYjmGNM="


[[component]]
id = "home-manager"
name = "home-manager"
requires = ["nix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; command -v home-manager"]
[component.install]
kind = "script"
script = ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; nix profile install nixpkgs#home-manager"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; home-manager --version"]
[component.fix]
kind = "script"
script = ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; nix profile upgrade home-manager || nix profile install nixpkgs#home-manager"
[component.remove]
kind = "script"
script = ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; nix profile remove home-manager"


[[component]]
id = "yazelix"
name = "yazelix (Ghostty variant)"
description = "nix profile github:FlexNetOS/yazelix#yazelix; bundles nushell+mise."
requires = ["nix", "nix-yazelix-cache", "home-manager", "ghostty"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; command -v yzx"]
[component.install]
kind = "script"
script = ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; nix profile add --refresh github:FlexNetOS/yazelix#yazelix"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; yzx --version 2>/dev/null || command -v yzx"]
[component.fix]
kind = "script"
script = ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; nix profile upgrade yazelix 2>/dev/null || nix profile add --refresh github:FlexNetOS/yazelix#yazelix; yzx doctor || true"
[component.remove]
kind = "script"
script = ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; nix profile remove yazelix"


[[component]]
id = "yazelix-desktop"
name = "yazelix desktop launcher"
requires = ["yazelix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "ls \"$META_ROOT/.local/share/applications/\"*[yY]azelix* >/dev/null 2>&1"]
[component.install]
kind = "script"
script = ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; yzx desktop install"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "ls \"$META_ROOT/.local/share/applications/\"*[yY]azelix* >/dev/null 2>&1"]
[component.fix]
kind = "script"
script = "export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; yzx desktop install"
[component.remove]
kind = "script"
script = "export PATH=\"$META_ROOT/.nix-profile/bin:$PATH\"; yzx desktop uninstall 2>/dev/null || rm -f \"$META_ROOT/.local/share/applications/\"*[yY]azelix*.desktop"


# Wiring-owned: the guarded $META_ROOT/.bashrc auto-enter block (Wiring::apply/revert owns
# the marker block — no hand-rolled sed). Makes yazelix the default everyday shell.
[[component]]
id = "yazelix-shell"
name = "yazelix auto-enter"
requires = ["yazelix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "grep -q 'BEGIN yazelix auto-enter' \"$META_ROOT/.bashrc\""]
[[component.wiring.shell_rc]]
file = "$META_ROOT/.bashrc"
marker = "yazelix auto-enter"
content = '''
if [ -e /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh ]; then
  . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
fi
export PATH="$META_ROOT/.nix-profile/bin:$PATH"
if [[ $- == *i* ]] && [[ -z "${ZELLIJ:-}" ]] && [[ -z "${YAZELIX_ACTIVE:-}" ]] && [[ "${TERM:-dumb}" != "dumb" ]] && command -v yzx >/dev/null 2>&1; then
  export YAZELIX_ACTIVE=1
  yzx enter
fi
'''


[[component]]
id = "ghostty-default-terminal"
name = "Ghostty as default terminal"
requires = ["ghostty"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "update-alternatives --query x-terminal-emulator 2>/dev/null | grep -qi ghostty"]
[component.install]
kind = "script"
script = "command -v ghostty >/dev/null && { sudo update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator \"$(command -v ghostty)\" 60 >/dev/null 2>&1 || true; sudo update-alternatives --set x-terminal-emulator \"$(command -v ghostty)\" >/dev/null 2>&1 || true; }"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "update-alternatives --query x-terminal-emulator 2>/dev/null | grep -qi ghostty"]
# Declarative: reset uses `update-alternatives --remove` (NOT --remove-all),
# excising only the ghostty slot envctl added (target resolved via `which`).
[[component.wiring.alternatives]]
link = "/usr/bin/x-terminal-emulator"
name = "x-terminal-emulator"
target = "ghostty"
priority = 60


[[component]]
id = "yazelix-config"
name = "yazelix settings.jsonc"
description = "Restores $META_ROOT/.config/yazelix/settings.jsonc via the shipped helper (install-if-missing)."
requires = ["yazelix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "[ -f \"$META_ROOT/.config/yazelix/settings.jsonc\" ]"]
[component.install]
kind = "shipped_script"
path = "$META_ROOT/envctl/assets/scripts/yazelix-config.sh"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "[ -f \"$META_ROOT/.config/yazelix/settings.jsonc\" ] && grep -q '\"default_shell\"' \"$META_ROOT/.config/yazelix/settings.jsonc\""]
[component.fix]
kind = "shipped_script"
path = "$META_ROOT/envctl/assets/scripts/yazelix-config.sh"
args = ["--force"]
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "mv \"$META_ROOT/.config/yazelix/settings.jsonc\" \"$META_ROOT/.config/yazelix/settings.jsonc.removed.$(date +%s)\" 2>/dev/null || true"]


# Group/meta: the whole Nix+yazelix stack in order.
[[component]]
id = "group-nix-yazelix"
name = "Full Nix + yazelix stack"
requires = ["nix", "nix-yazelix-cache", "home-manager", "yazelix", "yazelix-desktop", "yazelix-shell", "ghostty-default-terminal", "yazelix-config"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v nix >/dev/null && bash -lc 'command -v yzx' >/dev/null 2>&1"]
