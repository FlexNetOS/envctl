# Nix + Yazelix stack. Envctl validates the installed FlexNetOS foundation but
# never builds or switches it. Cutover belongs only to a clean, merged
# FlexNetOS/yazelix origin/main checkout.

[[component]]
id = "nix"
name = "Nix (Determinate, flakes)"
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/nix/bin/nix\" ] && [ -x \"$META_ROOT/usr/bin/nix\" ] && [ ! -L \"$META_ROOT/usr/bin/nix\" ] && grep -Fqx \"exec \\\"$M/.toolchains/nix/bin/nix\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/nix\" && [ -e /nix ]"]
[component.install]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
if [ ! -e /nix ]; then
  curl --proto '=https' --tlsv1.2 -sSf -L https://install.determinate.systems/nix | sh -s -- install --no-confirm
fi
install -d -m 755 "$M/.toolchains/nix/bin" "$META_ROOT/usr/bin"
src="$(readlink -f /nix/var/nix/profiles/default/bin/nix)"
install -m 755 "$src" "$M/.toolchains/nix/bin/nix"
envctl_frontdoor "$M/.toolchains/nix/bin/nix" "$META_ROOT/usr/bin/nix"

'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$M/usr/bin:$PATH\"; [ -x \"$M/usr/bin/nix\" ] && [ ! -L \"$M/usr/bin/nix\" ] && grep -Fqx \"exec \\\"$M/.toolchains/nix/bin/nix\\\" \\\"\\$@\\\"\" \"$M/usr/bin/nix\" && nix --version"]
[component.fix]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
sudo systemctl restart nix-daemon 2>/dev/null || true
install -d -m 755 "$M/.toolchains/nix/bin" "$META_ROOT/usr/bin"
src="$(readlink -f /nix/var/nix/profiles/default/bin/nix)"
install -m 755 "$src" "$M/.toolchains/nix/bin/nix"
envctl_frontdoor "$M/.toolchains/nix/bin/nix" "$META_ROOT/usr/bin/nix"
"$M/.toolchains/nix/bin/nix" --version

'''
[component.remove]
kind = "script"
script = "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$META_ROOT/usr/bin/nix\"; src=\"$M/.toolchains/nix/bin/nix\"; if { [ -L \"$t\" ] && [ \"$(readlink -f \"$t\" 2>/dev/null || true)\" = \"$(readlink -f \"$src\" 2>/dev/null || true)\" ]; } || { [ -f \"$t\" ] && grep -Fqx \"exec \\\"$src\\\" \\\"\\$@\\\"\" \"$t\"; }; then rm -f \"$t\"; fi; rm -rf \"$M/.toolchains/nix\""
[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]


[[component]]
id = "nix-yazelix-cache"
name = "yazelix Cachix cache + eval-cores"
description = "Appends eval-cores + yazelix substituter to /etc/nix/nix.custom.conf."
requires = ["nix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "grep -q 'yazelix.cachix.org' /etc/nix/nix.custom.conf 2>/dev/null"]
[component.install]
kind = "script"
needs_sudo = true
script = '''
set -eu
install -dm 755 /etc/nix
touch /etc/nix/nix.custom.conf
add(){ grep -qF -- "$1" /etc/nix/nix.custom.conf || echo "$1" | tee -a /etc/nix/nix.custom.conf >/dev/null; }
add "eval-cores = 0"
add "extra-substituters = https://yazelix.cachix.org"
add "extra-trusted-public-keys = yazelix.cachix.org-1:ZgxIjQvaP0VTWL8Racx27mpUNzDJ97xC2y7QWYjmGNM="
systemctl restart nix-daemon 2>/dev/null || true
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", ". /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh 2>/dev/null; nix config show 2>/dev/null | grep -qE 'yazelix\\.cachix\\.org'"]
[component.fix]
kind = "script"
needs_sudo = true
script = '''
set -eu
install -dm 755 /etc/nix
touch /etc/nix/nix.custom.conf
add(){ grep -qF -- "$1" /etc/nix/nix.custom.conf || echo "$1" | tee -a /etc/nix/nix.custom.conf >/dev/null; }
add "extra-substituters = https://yazelix.cachix.org"
systemctl restart nix-daemon 2>/dev/null || true
'''
# Declarative: reset removes ONLY these exact owned lines from
# /etc/nix/nix.custom.conf (foreign lines survive) and restarts nix-daemon once.
[[component.wiring.nix_conf_lines]]
line = "eval-cores = 0"
[[component.wiring.nix_conf_lines]]
line = "extra-substituters = https://yazelix.cachix.org"
[[component.wiring.nix_conf_lines]]
line = "extra-trusted-public-keys = yazelix.cachix.org-1:ZgxIjQvaP0VTWL8Racx27mpUNzDJ97xC2y7QWYjmGNM="


[[component]]
id = "home-manager"
name = "home-manager (Yazelix foundation capability)"
description = "Home Manager is bundled into the sole profile-owned Yazelix foundation. This compatibility component verifies that capability and never adds, upgrades, or removes an independent Nix profile element."
requires = ["yazelix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
ROOT="${ENVCTL_SOURCE_ROOT:-${META_ROOT:?META_ROOT required}/src/envctl}"
L="$ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
R="${ENVCTL_REAL_HOME:?ENVCTL_REAL_HOME required}"
[ -f "$L" ] && [ ! -L "$L" ] && [ -x "$L" ]
"$L" verify
[ -x "$R/.nix-profile/bin/home-manager" ]
''']
[component.install]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
args = ["fix"]
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
ROOT="${ENVCTL_SOURCE_ROOT:-${META_ROOT:?META_ROOT required}/src/envctl}"
L="$ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
R="${ENVCTL_REAL_HOME:?ENVCTL_REAL_HOME required}"
"$L" verify
exec "$R/.nix-profile/bin/home-manager" --version
''']
[component.fix]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
args = ["fix"]


[[component]]
id = "yazelix"
name = "FlexNetOS Yazelix foundation profile"
description = "Read-only validation of the sole profile-owned FlexNetOS Yazelix foundation; envctl never builds, installs, removes, or switches the profile."
requires = ["nix", "nix-yazelix-cache"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
ROOT="${ENVCTL_SOURCE_ROOT:-${META_ROOT:?META_ROOT required}/src/envctl}"
L="$ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
[ -f "$L" ] && [ ! -L "$L" ] && [ -x "$L" ]
exec "$L" detect
''']
[component.install]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
args = ["install"]
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
ROOT="${ENVCTL_SOURCE_ROOT:-${META_ROOT:?META_ROOT required}/src/envctl}"
L="$ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
[ -f "$L" ] && [ ! -L "$L" ] && [ -x "$L" ]
exec "$L" verify
''']
[component.fix]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
args = ["fix"]
[component.remove]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-yazelix-profile-lifecycle.sh"
args = ["remove"]


# Wiring-owned: the guarded $META_ROOT/.bashrc auto-enter block (Wiring::apply/revert owns
# the marker block — no hand-rolled sed). Makes yazelix the default everyday shell.
[[component]]
id = "yazelix-shell"
name = "yazelix auto-enter"
requires = ["yazelix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "grep -q 'BEGIN yazelix auto-enter' \"$META_ROOT/.bashrc\""]
[[component.wiring.shell_rc]]
file = "$META_ROOT/.bashrc"
marker = "yazelix auto-enter"
content = '''
YAZELIX_PROFILE_HOME="${ENVCTL_REAL_HOME:-$HOME}"
export PATH="$YAZELIX_PROFILE_HOME/.nix-profile/bin:$YAZELIX_PROFILE_HOME/.nix-profile/toolbin:$PATH"
if [[ $- == *i* ]] && [[ -z "${ZELLIJ:-}" ]] && [[ -z "${YAZELIX_ACTIVE:-}" ]] && [[ "${TERM:-dumb}" != "dumb" ]] && command -v yzx >/dev/null 2>&1; then
  export YAZELIX_ACTIVE=1
  # Bring the meta /usr mirror onto PATH/LD_LIBRARY_PATH BEFORE re-exec'ing into
  # zellij/nushell, so the yazelix panes inherit usr/bin regardless of where the
  # standalone `meta toolchain path` block lands in this file (it trails this one).
  command -v envctl >/dev/null 2>&1 && eval "$(envctl env --toolchains)"
  yzx enter
fi
'''


[[component]]
id = "ghostty-default-terminal"
name = "Ghostty as default terminal"
requires = ["ghostty"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "update-alternatives --query x-terminal-emulator 2>/dev/null | grep -qi ghostty"]
[component.install]
kind = "script"
script = "command -v ghostty >/dev/null && { sudo update-alternatives --install /usr/bin/x-terminal-emulator x-terminal-emulator \"$(command -v ghostty)\" 60 >/dev/null 2>&1 || true; sudo update-alternatives --set x-terminal-emulator \"$(command -v ghostty)\" >/dev/null 2>&1 || true; }"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "update-alternatives --query x-terminal-emulator 2>/dev/null | grep -qi ghostty"]
# Declarative: reset uses `update-alternatives --remove` (NOT --remove-all),
# excising only the ghostty slot envctl added (target resolved via `which`).
[[component.wiring.alternatives]]
link = "/usr/bin/x-terminal-emulator"
name = "x-terminal-emulator"
target = "ghostty"
priority = 60


[[component]]
id = "yazelix-config"
name = "yazelix settings.jsonc"
description = "Restores $META_ROOT/.config/yazelix/settings.jsonc via the shipped helper (install-if-missing)."
requires = ["yazelix"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "[ -f \"$META_ROOT/.config/yazelix/settings.jsonc\" ]"]
[component.install]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/yazelix-config.sh"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "[ -f \"$META_ROOT/.config/yazelix/settings.jsonc\" ] && grep -q '\"default_shell\"' \"$META_ROOT/.config/yazelix/settings.jsonc\""]
[component.fix]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/yazelix-config.sh"
args = ["--force"]
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "mv \"$META_ROOT/.config/yazelix/settings.jsonc\" \"$META_ROOT/.config/yazelix/settings.jsonc.removed.$(date +%s)\" 2>/dev/null || true"]


# Group/meta: the whole Nix+yazelix stack in order.
[[component]]
id = "group-nix-yazelix"
name = "Full Nix + yazelix stack"
requires = ["nix", "nix-yazelix-cache", "yazelix", "home-manager", "yazelix-shell", "ghostty-default-terminal", "yazelix-config"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v nix >/dev/null && bash -lc 'command -v yzx' >/dev/null 2>&1"]
