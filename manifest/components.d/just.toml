# generated by `envctl add-repo` (Phase 4)
#   strategy      = as-is
#   source        = https://github.com/casey/just
#   ref           = (default branch)
#   resolved_sha  = 5097d64c8b765f8f6bf0f19d13be199bb1d1769c
#   build_system  = cargo
#   build_cmd     = cargo build --release --locked || cargo build --release
#   artifacts     = /home/drdave/.local/bin/just

[[component]]
id = "just"
name = "just (add-repo)"
description = """
Built from source via envctl add-repo (build-from-source; only runs when named).
strategy=as-is source=https://github.com/casey/just ref=(default branch) sha=5097d64c8b765f8f6bf0f19d13be199bb1d1769c build_system=cargo
artifacts=/home/drdave/.local/bin/just
"""

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/src/just/target/release/just\" ] && [ \"$(readlink -f \"$HOME/.local/bin/just\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/src/just/target/release/just\")\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
install -d -m 700 "$M/.toolchains/src"
SRC="$M/.toolchains/src/just"
if [ -d "$SRC/.git" ]; then git -C "$SRC" remote set-url origin 'https://github.com/casey/just' || true; else git clone 'https://github.com/casey/just' "$SRC"; fi
git -C "$SRC" fetch --depth 1 origin 5097d64c8b765f8f6bf0f19d13be199bb1d1769c && git -C "$SRC" checkout --detach 5097d64c8b765f8f6bf0f19d13be199bb1d1769c
cd "$SRC"
cargo build --release --locked || cargo build --release
install -d -m 755 "$HOME/.local/bin"
ln -sfn "$SRC/target/release/just" "$HOME/.local/bin/just"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "just --version"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
STORE="$M/.toolchains/src"
for t in "$HOME/.local/bin/just"; do if [ -L "$t" ] && readlink "$t" | grep -q "$STORE/just"; then rm -f "$t"; fi; done
rm -rf "$STORE/just"
'''

[component.wiring]
path_entries = ["~/.local/bin"]
