# generated by `envctl add-repo` (Phase 4)
#   strategy      = as-is
#   source        = https://github.com/casey/just
#   ref           = (default branch)
#   resolved_sha  = 5097d64c8b765f8f6bf0f19d13be199bb1d1769c
#   build_system  = cargo
#   build_cmd     = cargo build --release --locked || cargo build --release
#   artifacts     = $META_ROOT/.local/bin/just

[[component]]
id = "just"
name = "just (add-repo)"
description = """
Built from source via envctl add-repo (build-from-source; only runs when named).
strategy=as-is source=https://github.com/casey/just ref=(default branch) sha=5097d64c8b765f8f6bf0f19d13be199bb1d1769c build_system=cargo
artifacts=$META_ROOT/.local/bin/just
"""

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$M/.local/bin/just\"; [ -x \"$M/.toolchains/src/just/target/release/just\" ] && [ -x \"$t\" ] && [ ! -L \"$t\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
install -d -m 700 "$M/.toolchains/src"
SRC="$M/.toolchains/src/just"
if [ -d "$SRC/.git" ]; then git -C "$SRC" remote set-url origin 'https://github.com/casey/just' || true; else git clone 'https://github.com/casey/just' "$SRC"; fi
git -C "$SRC" fetch --depth 1 origin 5097d64c8b765f8f6bf0f19d13be199bb1d1769c && git -C "$SRC" checkout --detach 5097d64c8b765f8f6bf0f19d13be199bb1d1769c
cd "$SRC"
cargo build --release --locked || cargo build --release
install -d -m 755 "$M/.local/bin"
install -m 755 "$SRC/target/release/just" "$M/.local/bin/just"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; PATH=\"$M/.local/bin:$PATH\"; p=\"$(command -v just)\"; [ \"$(realpath -e \"$p\")\" = \"$M/.local/bin/just\" ] && [ ! -L \"$M/.local/bin/just\" ] && just --version"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:?META_ROOT required}"
STORE="$M/.toolchains/src"
for t in "$M/.local/bin/just"; do if [ -L "$t" ] && readlink "$t" | grep -q "$STORE/just"; then rm -f "$t"; fi; done
rm -rf "$STORE/just"
'''

[component.wiring]
path_entries = ["$META_ROOT/.local/bin"]
