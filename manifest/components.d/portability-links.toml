# portability-links.toml — META_ROOT-hosted portability boundary.
#
# Current policy (2026-06-26): envctl lifecycle hooks execute with HOME=$META_ROOT
# and META_ROOT exported by the runner. Host-user/global installs are not a target.
# Yazelix owns the active Nix profile under the real home:
#   $ENVCTL_REAL_HOME/.nix-profile -> $ENVCTL_REAL_HOME/.local/state/nix/profile
# Never replace the whole real-home .local tree. Envctl may only archive known
# per-tool user-bin shadows after their profile/META_ROOT frontdoors are present. The same guard
# archives the known retired META_ROOT/usr/bin/git-kb staging symlink only when it is byte-identical
# to the exact current-profile GitKB 0.2.12; unknown or different frontdoor symlinks are refused.

[[component]]
id = "home-local-single-link"
name = "Yazelix real-home Nix profile guard"
description = "Compatibility id retained. Preserves the Yazelix-owned real-home Nix profile state, archives only proven real-home user-bin shadows, and removes only byte-identical known retired META_ROOT frontdoor symlinks instead of replacing the whole real-home .local tree."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:?ENVCTL_REAL_HOME required}"
[ "$R" != "$M" ] || { echo "real home must differ from META_ROOT" >&2; exit 1; }
MANIFEST_DIR="${ENVCTL_MANIFEST_DIR:-$M/src/envctl/manifest}"
ROOT="$(cd "$MANIFEST_DIR/.." && pwd -P)"
AUDIT="${ENVCTL_PORTABILITY_AUDIT:-$ROOT/scripts/audit-meta-local-paths.sh}"
[ -x "$AUDIT" ] || { echo "missing executable portability audit: $AUDIT" >&2; exit 1; }
exec "$AUDIT" --profile-shadow-guard-only --require-yazelix-profile \
  --meta-root "$M" --real-home "$R" --envctl-home-source "$ROOT/home"
''']
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:?ENVCTL_REAL_HOME required}"
[ "$R" != "$M" ] || { echo "real home must differ from META_ROOT" >&2; exit 1; }
MANIFEST_DIR="${ENVCTL_MANIFEST_DIR:-$M/src/envctl/manifest}"
ROOT="$(cd "$MANIFEST_DIR/.." && pwd -P)"
AUDIT="${ENVCTL_PORTABILITY_AUDIT:-$ROOT/scripts/audit-meta-local-paths.sh}"
[ -x "$AUDIT" ] || { echo "missing executable portability audit: $AUDIT" >&2; exit 1; }
exec "$AUDIT" --apply --profile-shadow-guard-only --require-yazelix-profile \
  --meta-root "$M" --real-home "$R" --envctl-home-source "$ROOT/home"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:?ENVCTL_REAL_HOME required}"
[ "$R" != "$M" ] || { echo "real home must differ from META_ROOT" >&2; exit 1; }
MANIFEST_DIR="${ENVCTL_MANIFEST_DIR:-$M/src/envctl/manifest}"
ROOT="$(cd "$MANIFEST_DIR/.." && pwd -P)"
AUDIT="${ENVCTL_PORTABILITY_AUDIT:-$ROOT/scripts/audit-meta-local-paths.sh}"
[ -x "$AUDIT" ] || { echo "missing executable portability audit: $AUDIT" >&2; exit 1; }
exec "$AUDIT" --profile-shadow-guard-only --require-yazelix-profile \
  --meta-root "$M" --real-home "$R" --envctl-home-source "$ROOT/home"
''']

[[component]]
id = "home-config-links"
name = "META_ROOT config links"
description = "Links META_ROOT-scoped config files from $META_ROOT/src/envctl/home into the META_ROOT home view. Hooks run with HOME=$META_ROOT; this never writes real-home config paths. Systemd user units are deliberately excluded: their component manifest wiring owns canonical content under $META_ROOT/.config/systemd/user, and the wiring engine owns the sole verified real-XDG discovery bridge."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
T="${ENVCTL_HOME_TREE:-$ROOT/home}"
[ "$(readlink -f "$M/.gitconfig" 2>/dev/null)" = "$(readlink -f "$T/.gitconfig" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
T="${ENVCTL_HOME_TREE:-$ROOT/home}"
ARCH="$M/var/lib/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
link() {
  src="$T/$1"
  dst="$M/$1"
  [ -e "$src" ] || { echo "SKIP (missing source): $1"; return 0; }
  if [ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ]; then return 0; fi
  mkdir -p "$(dirname "$dst")"
  if [ -e "$dst" ] && [ ! -L "$dst" ]; then
    mkdir -p "$ARCH/$(dirname "$1")"
    mv "$dst" "$ARCH/$1"
    echo "archived META_ROOT file: $1"
  elif [ -L "$dst" ]; then
    rm "$dst"
  fi
  ln -s "$src" "$dst"
  echo "linked META_ROOT file: $1"
}
link .gitconfig
link .config/ghostty/config.ghostty
link .config/nushell/config.nu
link .config/nushell/meta-usr-path.nu
link .config/kasetto/kasetto.yaml
link .config/yazelix/settings.jsonc
link .config/yazelix/shell_bash.sh
link .config/yazelix/shell_nu.nu
link .config/yazelix/terminal_ghostty.conf
link .config/yazelix/tombi.toml
link .config/yazelix/helix/steel_plugins/README.md
link .config/yazelix/configs/zellij/layouts/mission-control.kdl
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
T="${ENVCTL_HOME_TREE:-$ROOT/home}"
ok=1
for p in .gitconfig .config/nushell/config.nu .config/nushell/meta-usr-path.nu .config/kasetto/kasetto.yaml .config/yazelix/settings.jsonc; do
  [ "$(readlink -f "$M/$p" 2>/dev/null)" = "$(readlink -f "$T/$p" 2>/dev/null)" ] || { echo "NOT META_ROOT-LINKED: $p"; ok=0; }
done
[ $ok = 1 ]
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
for p in .gitconfig .config/ghostty/config.ghostty .config/nushell/config.nu .config/nushell/meta-usr-path.nu .config/kasetto/kasetto.yaml .config/yazelix/settings.jsonc .config/yazelix/shell_bash.sh .config/yazelix/shell_nu.nu .config/yazelix/terminal_ghostty.conf .config/yazelix/tombi.toml; do
  [ -L "$M/$p" ] && rm "$M/$p"
done
'''

[[component]]
id = "home-bin-links"
name = "retired per-tool home bin links"
description = "Compatibility id only. Per-tool real-home bin links are retired; tools must install under the Yazelix profile or META_ROOT-owned prefixes."
requires = ["home-local-single-link"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
script = '''
echo "home-bin-links retired: use the Yazelix profile or META_ROOT/usr/bin"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "rtk-config-links"
name = "RTK config -> META_ROOT home tree"
description = "Links META_ROOT/.config/rtk to $META_ROOT/src/envctl/home/.config/rtk. RTK state remains under META_ROOT-local state."
requires = ["home-config-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
T="${ENVCTL_HOME_TREE:-$ROOT/home}"
[ "$(readlink -f "$M/.config/rtk" 2>/dev/null)" = "$(readlink -f "$T/.config/rtk" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
T="${ENVCTL_HOME_TREE:-$ROOT/home}"
src="$T/.config/rtk"
dst="$M/.config/rtk"
ARCH="$M/var/lib/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
[ -d "$src" ] || { echo "SKIP rtk-config-links: missing $src"; exit 0; }
[ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ] && exit 0
mkdir -p "$(dirname "$dst")"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then
  mkdir -p "$ARCH/.config"
  mv "$dst" "$ARCH/.config/rtk"
  echo "archived META_ROOT .config/rtk"
elif [ -L "$dst" ]; then
  rm "$dst"
fi
ln -s "$src" "$dst"
echo "linked META_ROOT .config/rtk"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
T="${ENVCTL_HOME_TREE:-$ROOT/home}"
[ "$(readlink -f "$M/.config/rtk" 2>/dev/null)" = "$(readlink -f "$T/.config/rtk" 2>/dev/null)" ] && rtk gain >/dev/null
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
[ -L "$M/.config/rtk" ] && rm "$M/.config/rtk"
'''

