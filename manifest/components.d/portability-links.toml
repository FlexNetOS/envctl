kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "group-portability"
name = "META_ROOT portability layer"
requires = ["home-local-single-link", "home-config-links", "rtk-config-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -L "$M/.gitconfig" ] && [ -L "$M/.config/rtk" ] || exit 1
if [ -n "$R" ] && [ "$R" != "$M" ]; then
  target="$(readlink "$R/.nix-profile" 2>/dev/null || true)"
  printf '%s\n' "$target" | grep -Eq '^\.nix-profile-[1-9][0-9]*-link$' || exit 1
  [ -L "$R/$target" ] || exit 1
fi
''']
