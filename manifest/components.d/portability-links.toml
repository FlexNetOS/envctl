# portability-links.toml — META_ROOT-hosted portability boundary.
#
# Current policy (2026-06-26): envctl lifecycle hooks execute with HOME=$META_ROOT
# and META_ROOT exported by the runner. Host-user/global installs are not a target.
# The only sanctioned real-home bridge is one archive-first link:
#   $ENVCTL_REAL_HOME/.local -> $META_ROOT/.local
# Per-tool real-home local-bin/cargo-bin and system-bin link farms
# are retired/no-op compatibility component ids so older groups do not recreate them.

[[component]]
id = "home-local-single-link"
name = "single real-home .local link to META_ROOT"
description = "The only sanctioned real-home bridge: $ENVCTL_REAL_HOME/.local points at $META_ROOT/.local. Existing real-home .local content is archived under $META_ROOT/.local/state/envctl before the link is created."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
set -e
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -n "$R" ] && [ "$R" != "$M" ] || exit 0
[ "$(readlink -f "$R/.local" 2>/dev/null)" = "$(readlink -f "$M/.local" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -n "$R" ] && [ "$R" != "$M" ] || { echo "SKIP home-local-single-link: real home unavailable or already META_ROOT"; exit 0; }
TARGET="$M/.local"
LINK="$R/.local"
ARCH="$M/.local/state/envctl/archives/home-local-$(date +%Y%m%d-%H%M%S)"
mkdir -p "$TARGET" "$(dirname "$ARCH")"
if [ "$(readlink -f "$LINK" 2>/dev/null)" = "$(readlink -f "$TARGET" 2>/dev/null)" ]; then
  echo "home .local already linked to META_ROOT"
  exit 0
fi
if [ -e "$LINK" ] || [ -L "$LINK" ]; then
  mkdir -p "$ARCH"
  mv "$LINK" "$ARCH/.local"
  echo "archived prior real-home .local at $ARCH/.local"
fi
ln -s "$TARGET" "$LINK"
echo "linked $LINK -> $TARGET"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
set -e
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -n "$R" ] && [ "$R" != "$M" ] || exit 0
[ "$(readlink -f "$R/.local" 2>/dev/null)" = "$(readlink -f "$M/.local" 2>/dev/null)" ]
''']

[[component]]
id = "home-config-links"
name = "META_ROOT config links"
description = "Links META_ROOT-scoped config files from $META_ROOT/envctl/home into the META_ROOT home view. Hooks run with HOME=$META_ROOT; this never writes real-home config paths."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.gitconfig" 2>/dev/null)" = "$(readlink -f "$T/.gitconfig" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
ARCH="$M/.local/state/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
link() {
  src="$T/$1"
  dst="$M/$1"
  [ -e "$src" ] || { echo "SKIP (missing source): $1"; return 0; }
  if [ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ]; then return 0; fi
  mkdir -p "$(dirname "$dst")"
  if [ -e "$dst" ] && [ ! -L "$dst" ]; then
    mkdir -p "$ARCH/$(dirname "$1")"
    mv "$dst" "$ARCH/$1"
    echo "archived META_ROOT file: $1"
  elif [ -L "$dst" ]; then
    rm "$dst"
  fi
  ln -s "$src" "$dst"
  echo "linked META_ROOT file: $1"
}
link .gitconfig
link .config/ghostty/config.ghostty
link .config/nushell/config.nu
link .config/nushell/rtk-wrappers.nu
link .config/kasetto/kasetto.yaml
link .config/yazelix/settings.jsonc
link .config/yazelix/shell_bash.sh
link .config/yazelix/shell_nu.nu
link .config/yazelix/terminal_ghostty.conf
link .config/yazelix/tombi.toml
link .config/yazelix/helix/steel_plugins/README.md
link .config/yazelix/configs/zellij/layouts/mission-control.kdl
link .config/systemd/user/env-ctl.service
link .config/systemd/user/sqld.service
link .config/systemd/user/repowire.service
systemctl --user daemon-reload 2>/dev/null || true
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
ok=1
for p in .gitconfig .config/nushell/config.nu .config/nushell/rtk-wrappers.nu .config/kasetto/kasetto.yaml .config/yazelix/settings.jsonc .config/systemd/user/env-ctl.service .config/systemd/user/sqld.service; do
  [ "$(readlink -f "$M/$p" 2>/dev/null)" = "$(readlink -f "$T/$p" 2>/dev/null)" ] || { echo "NOT META_ROOT-LINKED: $p"; ok=0; }
done
[ $ok = 1 ]
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
for p in .gitconfig .config/ghostty/config.ghostty .config/nushell/config.nu .config/nushell/rtk-wrappers.nu .config/kasetto/kasetto.yaml .config/yazelix/settings.jsonc .config/yazelix/shell_bash.sh .config/yazelix/shell_nu.nu .config/yazelix/terminal_ghostty.conf .config/yazelix/tombi.toml .config/systemd/user/env-ctl.service .config/systemd/user/sqld.service .config/systemd/user/repowire.service; do
  [ -L "$M/$p" ] && rm "$M/$p"
done
systemctl --user daemon-reload 2>/dev/null || true
'''

[[component]]
id = "home-bin-links"
name = "retired per-tool home bin links"
description = "Compatibility id only. Per-tool real-home bin links are retired; tools must install under $META_ROOT/.local/bin and be exposed through the single real-home .local link."
requires = ["home-local-single-link"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
script = '''
echo "home-bin-links retired: use META_ROOT/.local/bin plus home-local-single-link"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "rtk-config-links"
name = "RTK config -> META_ROOT home tree"
description = "Links META_ROOT/.config/rtk to $META_ROOT/envctl/home/.config/rtk. RTK state remains under META_ROOT-local state."
requires = ["home-config-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.config/rtk" 2>/dev/null)" = "$(readlink -f "$T/.config/rtk" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
src="$T/.config/rtk"
dst="$M/.config/rtk"
ARCH="$M/.local/state/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
[ -d "$src" ] || { echo "SKIP rtk-config-links: missing $src"; exit 0; }
[ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ] && exit 0
mkdir -p "$(dirname "$dst")"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then
  mkdir -p "$ARCH/.config"
  mv "$dst" "$ARCH/.config/rtk"
  echo "archived META_ROOT .config/rtk"
elif [ -L "$dst" ]; then
  rm "$dst"
fi
ln -s "$src" "$dst"
echo "linked META_ROOT .config/rtk"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.config/rtk" 2>/dev/null)" = "$(readlink -f "$T/.config/rtk" 2>/dev/null)" ] && rtk gain >/dev/null
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
[ -L "$M/.config/rtk" ] && rm "$M/.config/rtk"
'''

[[component]]
id = "meta-tool-links"
name = "retired per-tool meta binary links"
description = "Compatibility id only. The old per-tool real-home bin/cargo link farm is retired; binaries must be installed directly in META_ROOT-owned prefixes."
requires = ["home-local-single-link"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
script = '''
echo "meta-tool-links retired: install binaries into META_ROOT/.local/bin or META_ROOT/.toolchains"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "claude-global-links"
name = "Claude META_ROOT settings links"
description = "Links Claude files inside the META_ROOT home view only. Real-home Claude paths are not mutated by envctl."
requires = ["home-config-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.claude/settings.json" 2>/dev/null)" = "$(readlink -f "$T/.claude/settings.json" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
ARCH="$M/.local/state/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
if [ -f "$T/.claude/settings.json.tmpl" ]; then
  sed "s|\${META_ROOT}|$M|g" "$T/.claude/settings.json.tmpl" > "$T/.claude/settings.json"
  echo "rendered .claude/settings.json from tmpl (META_ROOT=$M)"
fi
for p in .claude/settings.json .claude/CLAUDE.md .claude/RTK.md .claude/commands/recall.md .claude/commands/remember.md .claude/commands/speak.md; do
  src="$T/$p"
  dst="$M/$p"
  [ -e "$src" ] || { echo "SKIP missing source: $p"; continue; }
  [ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ] && continue
  mkdir -p "$(dirname "$dst")"
  if [ -e "$dst" ] && [ ! -L "$dst" ]; then
    mkdir -p "$ARCH/$(dirname "$p")"
    mv "$dst" "$ARCH/$p"
    echo "archived META_ROOT file: $p"
  fi
  [ -L "$dst" ] && rm "$dst"
  ln -s "$src" "$dst"
  echo "linked META_ROOT file: $p"
done
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.claude/settings.json" 2>/dev/null)" = "$(readlink -f "$T/.claude/settings.json" 2>/dev/null)" ]
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
for p in .claude/settings.json .claude/CLAUDE.md .claude/RTK.md .claude/commands/recall.md .claude/commands/remember.md .claude/commands/speak.md; do
  [ -L "$M/$p" ] && rm "$M/$p"
done
'''

[[component]]
id = "usrlocal-script-links"
name = "retired system-depth helper script links"
description = "Compatibility id only. /usr/local/bin symlink creation is retired; helper scripts must be launched from META_ROOT or installed into META_ROOT/.local/bin."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
script = '''
echo "usrlocal-script-links retired: no system-depth symlinks are created"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "group-portability"
name = "META_ROOT portability layer"
requires = ["home-local-single-link", "home-config-links", "rtk-config-links", "claude-global-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -L "$M/.gitconfig" ] && [ -L "$M/.config/rtk" ] && [ -L "$M/.claude/settings.json" ] || exit 1
[ -z "$R" ] || [ "$R" = "$M" ] || [ "$(readlink -f "$R/.local" 2>/dev/null)" = "$(readlink -f "$M/.local" 2>/dev/null)" ]
''']
