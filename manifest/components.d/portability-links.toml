args = ["-lc", "true"]

[[component]]
id = "usrlocal-script-links"
name = "retired system-depth helper script links"
description = "Compatibility id only. System-depth helper links and alternate binary prefixes are retired; installed commands must resolve through the Yazelix-owned Nix profile."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
