id = "meta-tool-links"
name = "retired per-tool meta binary links"
description = "Compatibility id only. The old per-tool binary link farm and alternate toolchain prefixes are retired; installed commands must resolve through the Yazelix-owned Nix profile."
requires = ["home-local-single-link"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
