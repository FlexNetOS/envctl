# portability-links.toml — META_ROOT-hosted portability boundary.
#
# Current policy (2026-06-26): envctl lifecycle hooks execute with HOME=$META_ROOT
# and META_ROOT exported by the runner. Host-user/global installs are not a target.
# Yazelix owns the active Nix profile under the real home:
#   $ENVCTL_REAL_HOME/.nix-profile -> $ENVCTL_REAL_HOME/.local/state/nix/profiles/profile
# Never replace the whole real-home .local tree. Envctl may only archive known
# per-tool user-bin shadows after their profile/META_ROOT frontdoors are present.

[[component]]
id = "home-local-single-link"
name = "Yazelix real-home Nix profile guard"
description = "Compatibility id retained. Preserves the Yazelix-owned real-home Nix profile state and archives known per-tool user-bin shadows instead of replacing the whole real-home .local tree."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
set -e
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -n "$R" ] && [ "$R" != "$M" ] || exit 0
if [ -L "$R/.nix-profile" ]; then
  target="$(readlink "$R/.nix-profile" 2>/dev/null || true)"
  case "$target" in
    "$R/.local/state/nix/profiles/profile"|"$R/.local/state/nix/profiles/"*) ;;
    *) echo "unexpected .nix-profile target: $target" >&2; exit 1 ;;
  esac
fi
for name in agent bun bunx codex codex-alpha git-kb kache-rustc-wrapper loop meta meta-git meta-mcp meta-project meta-release meta-rust rtk; do
  t="$R/.local/bin/$name"
  [ ! -e "$t" ] && [ ! -L "$t" ] || { echo "stale real-home user-bin shadow: $t" >&2; exit 1; }
done
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -n "$R" ] && [ "$R" != "$M" ] || { echo "SKIP home-local-single-link: real home unavailable or already META_ROOT"; exit 0; }
if [ -L "$R/.nix-profile" ]; then
  target="$(readlink "$R/.nix-profile" 2>/dev/null || true)"
  case "$target" in
    "$R/.local/state/nix/profiles/profile"|"$R/.local/state/nix/profiles/"*) ;;
    *) echo "REFUSE home-local-single-link: unexpected .nix-profile target: $target" >&2; exit 1 ;;
  esac
fi
ARCH="$M/var/lib/envctl/legacy-archives/real-home-bin-$(date -u +%Y-%m-%d)/.local/bin"
changed=0
for name in agent bun bunx codex codex-alpha git-kb kache-rustc-wrapper loop meta meta-git meta-mcp meta-project meta-release meta-rust rtk; do
  t="$R/.local/bin/$name"
  if [ -e "$t" ] || [ -L "$t" ]; then
    if [ ! -e "$R/.nix-profile/bin/$name" ] && [ ! -L "$R/.nix-profile/bin/$name" ] && \
       [ ! -e "$M/usr/bin/$name" ] && [ ! -L "$M/usr/bin/$name" ]; then
      echo "REFUSE home-local-single-link: no replacement frontdoor for stale real-home user-bin shadow: $t" >&2
      exit 1
    fi
    install -d -m 755 "$ARCH"
    dest="$ARCH/$name"
    if [ -e "$dest" ] || [ -L "$dest" ]; then
      dest="$ARCH/$name.$(date -u +%H%M%S).$$"
    fi
    mv "$t" "$dest"
    echo "archived stale real-home user-bin shadow: $dest"
    changed=1
  fi
done
[ "$changed" = 1 ] || echo "no stale real-home user-bin shadows found"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
set -e
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -n "$R" ] && [ "$R" != "$M" ] || exit 0
if [ -L "$R/.nix-profile" ]; then
  target="$(readlink "$R/.nix-profile" 2>/dev/null || true)"
  case "$target" in
    "$R/.local/state/nix/profiles/profile"|"$R/.local/state/nix/profiles/"*) ;;
    *) echo "unexpected .nix-profile target: $target" >&2; exit 1 ;;
  esac
fi
for name in agent bun bunx codex codex-alpha git-kb kache-rustc-wrapper loop meta meta-git meta-mcp meta-project meta-release meta-rust rtk; do
  t="$R/.local/bin/$name"
  [ ! -e "$t" ] && [ ! -L "$t" ] || { echo "stale real-home user-bin shadow: $t" >&2; exit 1; }
done
''']

[[component]]
id = "home-config-links"
name = "META_ROOT config links"
description = "Links META_ROOT-scoped config files from $META_ROOT/envctl/home into the META_ROOT home view. Hooks run with HOME=$META_ROOT; this never writes real-home config paths."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.gitconfig" 2>/dev/null)" = "$(readlink -f "$T/.gitconfig" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
ARCH="$M/var/lib/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
link() {
  src="$T/$1"
  dst="$M/$1"
  [ -e "$src" ] || { echo "SKIP (missing source): $1"; return 0; }
  if [ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ]; then return 0; fi
  mkdir -p "$(dirname "$dst")"
  if [ -e "$dst" ] && [ ! -L "$dst" ]; then
    mkdir -p "$ARCH/$(dirname "$1")"
    mv "$dst" "$ARCH/$1"
    echo "archived META_ROOT file: $1"
  elif [ -L "$dst" ]; then
    rm "$dst"
  fi
  ln -s "$src" "$dst"
  echo "linked META_ROOT file: $1"
}
link .gitconfig
link .config/ghostty/config.ghostty
link .config/nushell/config.nu
link .config/nushell/rtk-wrappers.nu
link .config/nushell/meta-usr-path.nu
link .config/kasetto/kasetto.yaml
link .config/yazelix/settings.jsonc
link .config/yazelix/shell_bash.sh
link .config/yazelix/shell_nu.nu
link .config/yazelix/terminal_ghostty.conf
link .config/yazelix/tombi.toml
link .config/yazelix/helix/steel_plugins/README.md
link .config/yazelix/configs/zellij/layouts/mission-control.kdl
link .config/systemd/user/env-ctl.service
link .config/systemd/user/sqld.service
link .config/systemd/user/repowire.service
systemctl --user daemon-reload 2>/dev/null || true
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
ok=1
for p in .gitconfig .config/nushell/config.nu .config/nushell/rtk-wrappers.nu .config/nushell/meta-usr-path.nu .config/kasetto/kasetto.yaml .config/yazelix/settings.jsonc .config/systemd/user/env-ctl.service .config/systemd/user/sqld.service; do
  [ "$(readlink -f "$M/$p" 2>/dev/null)" = "$(readlink -f "$T/$p" 2>/dev/null)" ] || { echo "NOT META_ROOT-LINKED: $p"; ok=0; }
done
[ $ok = 1 ]
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
for p in .gitconfig .config/ghostty/config.ghostty .config/nushell/config.nu .config/nushell/rtk-wrappers.nu .config/nushell/meta-usr-path.nu .config/kasetto/kasetto.yaml .config/yazelix/settings.jsonc .config/yazelix/shell_bash.sh .config/yazelix/shell_nu.nu .config/yazelix/terminal_ghostty.conf .config/yazelix/tombi.toml .config/systemd/user/env-ctl.service .config/systemd/user/sqld.service .config/systemd/user/repowire.service; do
  [ -L "$M/$p" ] && rm "$M/$p"
done
systemctl --user daemon-reload 2>/dev/null || true
'''

[[component]]
id = "home-bin-links"
name = "retired per-tool home bin links"
description = "Compatibility id only. Per-tool real-home bin links are retired; tools must install under the Yazelix profile or META_ROOT-owned prefixes."
requires = ["home-local-single-link"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
script = '''
echo "home-bin-links retired: use the Yazelix profile or META_ROOT/usr/bin"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "rtk-config-links"
name = "RTK config -> META_ROOT home tree"
description = "Links META_ROOT/.config/rtk to $META_ROOT/envctl/home/.config/rtk. RTK state remains under META_ROOT-local state."
requires = ["home-config-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.config/rtk" 2>/dev/null)" = "$(readlink -f "$T/.config/rtk" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
src="$T/.config/rtk"
dst="$M/.config/rtk"
ARCH="$M/var/lib/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
[ -d "$src" ] || { echo "SKIP rtk-config-links: missing $src"; exit 0; }
[ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ] && exit 0
mkdir -p "$(dirname "$dst")"
if [ -e "$dst" ] && [ ! -L "$dst" ]; then
  mkdir -p "$ARCH/.config"
  mv "$dst" "$ARCH/.config/rtk"
  echo "archived META_ROOT .config/rtk"
elif [ -L "$dst" ]; then
  rm "$dst"
fi
ln -s "$src" "$dst"
echo "linked META_ROOT .config/rtk"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.config/rtk" 2>/dev/null)" = "$(readlink -f "$T/.config/rtk" 2>/dev/null)" ] && rtk gain >/dev/null
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
[ -L "$M/.config/rtk" ] && rm "$M/.config/rtk"
'''

[[component]]
id = "meta-tool-links"
name = "retired per-tool meta binary links"
description = "Compatibility id only. The old per-tool real-home bin/cargo link farm is retired; binaries must be installed directly in META_ROOT-owned prefixes."
requires = ["home-local-single-link"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
script = '''
echo "meta-tool-links retired: install binaries into META_ROOT/usr/bin, META_ROOT/opt, or legacy META_ROOT/.toolchains"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "claude-global-links"
name = "Claude META_ROOT settings links"
description = "Links Claude files inside the META_ROOT home view only. Real-home Claude paths are not mutated by envctl."
requires = ["home-config-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.claude/settings.json" 2>/dev/null)" = "$(readlink -f "$T/.claude/settings.json" 2>/dev/null)" ]
''']
[component.install]
kind = "script"
script = '''
set -e
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
ARCH="$M/var/lib/envctl/archives/home-links-$(date +%Y%m%d-%H%M%S)"
if [ -f "$T/.claude/settings.json.tmpl" ]; then
  sed "s|\${META_ROOT}|$M|g" "$T/.claude/settings.json.tmpl" > "$T/.claude/settings.json"
  echo "rendered .claude/settings.json from tmpl (META_ROOT=$M)"
fi
for p in .claude/settings.json .claude/CLAUDE.md .claude/RTK.md .claude/commands/recall.md .claude/commands/remember.md .claude/commands/speak.md; do
  src="$T/$p"
  dst="$M/$p"
  [ -e "$src" ] || { echo "SKIP missing source: $p"; continue; }
  [ "$(readlink -f "$dst" 2>/dev/null)" = "$(readlink -f "$src" 2>/dev/null)" ] && continue
  mkdir -p "$(dirname "$dst")"
  if [ -e "$dst" ] && [ ! -L "$dst" ]; then
    mkdir -p "$ARCH/$(dirname "$p")"
    mv "$dst" "$ARCH/$p"
    echo "archived META_ROOT file: $p"
  fi
  [ -L "$dst" ] && rm "$dst"
  ln -s "$src" "$dst"
  echo "linked META_ROOT file: $p"
done
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
T="${ENVCTL_HOME_TREE:-$M/envctl/home}"
[ "$(readlink -f "$M/.claude/settings.json" 2>/dev/null)" = "$(readlink -f "$T/.claude/settings.json" 2>/dev/null)" ]
''']
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
for p in .claude/settings.json .claude/CLAUDE.md .claude/RTK.md .claude/commands/recall.md .claude/commands/remember.md .claude/commands/speak.md; do
  [ -L "$M/$p" ] && rm "$M/$p"
done
'''

[[component]]
id = "usrlocal-script-links"
name = "retired system-depth helper script links"
description = "Compatibility id only. /usr/local/bin symlink creation is retired; helper scripts must be launched from META_ROOT or installed into META_ROOT/usr/bin."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "true"]
[component.install]
kind = "script"
script = '''
echo "usrlocal-script-links retired: no system-depth symlinks are created"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "true"]

[[component]]
id = "group-portability"
name = "META_ROOT portability layer"
requires = ["home-local-single-link", "home-config-links", "rtk-config-links", "claude-global-links"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-}"
[ -L "$M/.gitconfig" ] && [ -L "$M/.config/rtk" ] && [ -L "$M/.claude/settings.json" ] || exit 1
if [ -n "$R" ] && [ "$R" != "$M" ] && [ -L "$R/.nix-profile" ]; then
  target="$(readlink "$R/.nix-profile" 2>/dev/null || true)"
  case "$target" in
    "$R/.local/state/nix/profiles/profile"|"$R/.local/state/nix/profiles/"*) ;;
    *) exit 1 ;;
  esac
fi
''']
