[[component]]
id = "git"
name = "Git SCM (meta-hosted binary tree)"
description = "Git 2.54.0 copied into $META_ROOT/.toolchains/git as a real binary tree. $META_ROOT/usr/bin/git is a regular executable frontdoor wrapper for the meta-hosted git executable."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/git/bin/git\" ] && [ -x \"$META_ROOT/usr/bin/git\" ] && [ ! -L \"$META_ROOT/usr/bin/git\" ] && grep -Fqx \"exec \\\"$M/.toolchains/git/bin/git\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/git\""]
[component.install]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/git"
install -d -m 755 "$META_ROOT/usr/bin"
PATH="$(printf '%s' "$PATH" | tr ':' '
' | grep -v -E "^$META_ROOT/usr/bin$" | paste -sd: -)"
src_bin="$(readlink -f "$(command -v git)")"
case "$src_bin" in "$DEST"/*) src_bin="$(find /nix/store -path '*/bin/git' -type f 2>/dev/null | grep 'git-2.54.0' | head -n1)";; esac
[ -n "$src_bin" ] || { echo "FATAL: no Git 2.54.0 source binary found"; exit 1; }
src_root="$(cd "$(dirname "$src_bin")/.." && pwd)"
rm -rf "$DEST"
mkdir -p "$DEST"
cp -a "$src_root/." "$DEST/"
envctl_frontdoor "$DEST/bin/git" "$META_ROOT/usr/bin/git"

'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$M/usr/bin:$PATH\"; [ -x \"$M/usr/bin/git\" ] && [ ! -L \"$M/usr/bin/git\" ] && grep -Fqx \"exec \\\"$M/.toolchains/git/bin/git\\\" \\\"\\$@\\\"\" \"$M/usr/bin/git\" && git --version | grep -q '2\\.54\\.0'"]
[component.fix]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/git"
install -d -m 755 "$META_ROOT/usr/bin"
PATH="$(printf '%s' "$PATH" | tr ':' '
' | grep -v -E "^$META_ROOT/usr/bin$" | paste -sd: -)"
src_bin="$(readlink -f "$(command -v git)")"
case "$src_bin" in "$DEST"/*) src_bin="$(find /nix/store -path '*/bin/git' -type f 2>/dev/null | grep 'git-2.54.0' | head -n1)";; esac
[ -n "$src_bin" ] || { echo "FATAL: no Git 2.54.0 source binary found"; exit 1; }
src_root="$(cd "$(dirname "$src_bin")/.." && pwd)"
rm -rf "$DEST"
mkdir -p "$DEST"
cp -a "$src_root/." "$DEST/"
envctl_frontdoor "$DEST/bin/git" "$META_ROOT/usr/bin/git"

'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$META_ROOT/usr/bin/git\"; src=\"$M/.toolchains/git/bin/git\"; if { [ -L \"$t\" ] && [ \"$(readlink -f \"$t\" 2>/dev/null || true)\" = \"$(readlink -f \"$src\" 2>/dev/null || true)\" ]; } || { [ -f \"$t\" ] && grep -Fqx \"exec \\\"$src\\\" \\\"\\$@\\\"\" \"$t\"; }; then rm -f \"$t\"; fi; rm -rf \"$M/.toolchains/git\""]
[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]

[[component]]
id = "curl"
name = "curl (static meta binary)"
description = "Static curl binary installed under $META_ROOT/.toolchains/curl. $META_ROOT/usr/bin/curl is a regular executable frontdoor wrapper for the meta-hosted curl binary."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/curl/bin/curl\" ] && [ -x \"$META_ROOT/usr/bin/curl\" ] && [ ! -L \"$META_ROOT/usr/bin/curl\" ] && grep -Fqx \"exec \\\"$M/.toolchains/curl/bin/curl\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/curl\""]
[component.install]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
VER="${CURL_VERSION:-8.21.0}"
DEST="$M/.toolchains/curl"
ARCH="$(uname -m)"; case "$ARCH" in x86_64) A=x86_64;; aarch64) A=aarch64;; *) echo "unsupported arch: $ARCH"; exit 1;; esac
URL="https://github.com/stunnel/static-curl/releases/download/$VER/curl-linux-$A-musl-$VER.tar.xz"
cache="$M/.cache/curl"; install -d -m 755 "$cache" "$DEST/bin" "$META_ROOT/usr/bin"
tarball="$cache/curl-linux-$A-musl-$VER.tar.xz"
[ -s "$tarball" ] || /usr/bin/curl -fSL "$URL" -o "$tarball"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
tar -xJf "$tarball" -C "$tmp"
src="$(find "$tmp" -type f -name curl -perm -111 | head -n1)"
install -m 755 "$src" "$DEST/bin/curl"
envctl_frontdoor "$DEST/bin/curl" "$META_ROOT/usr/bin/curl"

'''
