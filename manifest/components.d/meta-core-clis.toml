[[component]]
id = "git"
name = "Git SCM (meta-hosted binary tree)"
description = "Git 2.54.0 copied into $META_ROOT/.toolchains/git as a real binary tree. $META_ROOT/.local/bin/git is a regular meta-local frontdoor copied from the meta-hosted git executable."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$META_ROOT/.local/bin/git\"; [ -x \"$M/.toolchains/git/bin/git\" ] && [ -x \"$t\" ] && [ ! -L \"$t\" ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/git"
install -d -m 755 "$META_ROOT/.local/bin"
PATH="$(printf '%s' "$PATH" | tr ':' '
' | grep -v -E "^$META_ROOT/.local/bin$" | paste -sd: -)"
src_bin="$(readlink -f "$(command -v git)")"
case "$src_bin" in "$DEST"/*) src_bin="$(find /nix/store -path '*/bin/git' -type f 2>/dev/null | grep 'git-2.54.0' | head -n1)";; esac
[ -n "$src_bin" ] || { echo "FATAL: no Git 2.54.0 source binary found"; exit 1; }
src_root="$(cd "$(dirname "$src_bin")/.." && pwd)"
rm -rf "$DEST"
mkdir -p "$DEST"
cp -a "$src_root/." "$DEST/"
install -m 755 "$DEST/bin/git" "$META_ROOT/.local/bin/git"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$META_ROOT/.local/bin:$PATH\"; p=\"$(command -v git)\"; [ \"$(realpath -e \"$p\")\" = \"$META_ROOT/.local/bin/git\" ] && [ ! -L \"$META_ROOT/.local/bin/git\" ] && git --version | grep -q '2\\.54\\.0'"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/git"
install -d -m 755 "$META_ROOT/.local/bin"
PATH="$(printf '%s' "$PATH" | tr ':' '
' | grep -v -E "^$META_ROOT/.local/bin$" | paste -sd: -)"
src_bin="$(readlink -f "$(command -v git)")"
case "$src_bin" in "$DEST"/*) src_bin="$(find /nix/store -path '*/bin/git' -type f 2>/dev/null | grep 'git-2.54.0' | head -n1)";; esac
[ -n "$src_bin" ] || { echo "FATAL: no Git 2.54.0 source binary found"; exit 1; }
src_root="$(cd "$(dirname "$src_bin")/.." && pwd)"
rm -rf "$DEST"
mkdir -p "$DEST"
cp -a "$src_root/." "$DEST/"
install -m 755 "$DEST/bin/git" "$META_ROOT/.local/bin/git"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$META_ROOT/.local/bin/git\"; [ -L \"$t\" ] && readlink \"$t\" | grep -q \"$M/.toolchains/git\" && rm -f \"$t\"; rm -rf \"$M/.toolchains/git\""]
[component.wiring]
path_entries = ["$META_ROOT/.local/bin"]

[[component]]
id = "curl"
name = "curl (static meta binary)"
description = "Static curl binary installed under $META_ROOT/.toolchains/curl. $META_ROOT/.local/bin/curl is a regular meta-local frontdoor copied from the meta-hosted curl binary."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$META_ROOT/.local/bin/curl\"; [ -x \"$M/.toolchains/curl/bin/curl\" ] && [ -x \"$t\" ] && [ ! -L \"$t\" ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
VER="${CURL_VERSION:-8.21.0}"
DEST="$M/.toolchains/curl"
ARCH="$(uname -m)"; case "$ARCH" in x86_64) A=x86_64;; aarch64) A=aarch64;; *) echo "unsupported arch: $ARCH"; exit 1;; esac
URL="https://github.com/stunnel/static-curl/releases/download/$VER/curl-linux-$A-musl-$VER.tar.xz"
cache="$M/.cache/curl"; install -d -m 755 "$cache" "$DEST/bin" "$META_ROOT/.local/bin"
tarball="$cache/curl-linux-$A-musl-$VER.tar.xz"
[ -s "$tarball" ] || /usr/bin/curl -fSL "$URL" -o "$tarball"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
tar -xJf "$tarball" -C "$tmp"
src="$(find "$tmp" -type f -name curl -perm -111 | head -n1)"
install -m 755 "$src" "$DEST/bin/curl"
install -m 755 "$DEST/bin/curl" "$META_ROOT/.local/bin/curl"
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$META_ROOT/.local/bin:$PATH\"; p=\"$(command -v curl)\"; [ \"$(realpath -e \"$p\")\" = \"$META_ROOT/.local/bin/curl\" ] && [ ! -L \"$META_ROOT/.local/bin/curl\" ] && curl --version | grep -q '8\\.21\\.0'"]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
VER="${CURL_VERSION:-8.21.0}"
DEST="$M/.toolchains/curl"
ARCH="$(uname -m)"; case "$ARCH" in x86_64) A=x86_64;; aarch64) A=aarch64;; *) echo "unsupported arch: $ARCH"; exit 1;; esac
URL="https://github.com/stunnel/static-curl/releases/download/$VER/curl-linux-$A-musl-$VER.tar.xz"
cache="$M/.cache/curl"; install -d -m 755 "$cache" "$DEST/bin" "$META_ROOT/.local/bin"
tarball="$cache/curl-linux-$A-musl-$VER.tar.xz"
[ -s "$tarball" ] || /usr/bin/curl -fSL "$URL" -o "$tarball"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
tar -xJf "$tarball" -C "$tmp"
src="$(find "$tmp" -type f -name curl -perm -111 | head -n1)"
install -m 755 "$src" "$DEST/bin/curl"
install -m 755 "$DEST/bin/curl" "$META_ROOT/.local/bin/curl"
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; t=\"$META_ROOT/.local/bin/curl\"; [ -L \"$t\" ] && readlink \"$t\" | grep -q \"$M/.toolchains/curl\" && rm -f \"$t\"; rm -rf \"$M/.toolchains/curl\""]
[component.wiring]
path_entries = ["$META_ROOT/.local/bin"]
