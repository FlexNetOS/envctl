# secretd.toml — lifecycle hooks for the secrets vault daemon
# Managed by envctl; installs as a systemd user service.
# Depends on [env-ctl] which builds the binary first.

[[component]]
id = "secretd"
name = "secretd — secrets vault daemon"
description = "Pure-Rust gRPC secrets vault + credential broker, served as a systemd user service."
requires = ["env-ctl"]  # env-ctl builds the binary; this manages the running daemon

[component.detect]
kind = "command"
command = "bash"
args = [
  "-lc",
  '''M="${META_ROOT:?META_ROOT required}"; PRIV="$M/.local/lib/envctl/secrets/bin"; META_BIN="$M/.local/bin"; test -x "$PRIV/secretd" && test -x "$PRIV/secretctl" && test -f "$META_ROOT/.config/systemd/user/env-ctl.service" && [ "$(readlink -f "$META_BIN/secretd" 2>/dev/null)" = "$(readlink -f "$PRIV/secretd" 2>/dev/null)" ] && [ "$(readlink -f "$META_BIN/secretctl" 2>/dev/null)" = "$(readlink -f "$PRIV/secretctl" 2>/dev/null)" ]'''
]

[component.verify]
kind = "command"
command = "bash"
args = [
  "-lc",
  '''M="${META_ROOT:?META_ROOT required}"; "$M/.local/lib/envctl/secrets/bin/secretd" --self-check && "$M/.local/lib/envctl/secrets/bin/secretctl" --help >/dev/null'''
]

[component.install]
kind = "script"
script = '''
set -e
echo "enabling env-ctl.service for secretd ..."
systemctl --user daemon-reload 2>/dev/null || true
systemctl --user enable env-ctl.service
systemctl --user start env-ctl.service
echo "secretd service enabled and started"
'''

[component.fix]
kind = "script"
script = '''
set -e
systemctl --user daemon-reload 2>/dev/null || true
systemctl --user enable env-ctl.service 2>/dev/null || true
systemctl --user start env-ctl.service 2>/dev/null || true
'''

[component.remove]
kind = "script"
script = '''
set -e
echo "disabling env-ctl.service for secretd ..."
systemctl --user stop env-ctl.service 2>/dev/null || true
systemctl --user disable env-ctl.service 2>/dev/null || true
echo "secretd service disabled"
'''
