# handoff-hf.toml — install the meta/handoff continuity kernel front door.
#
# The Hugging Face CLI intentionally does not claim the bare `hf` name in envctl: that name belongs
# to the handoff continuity kernel. Keep the executable exposed at $META_ROOT/usr/bin/hf, with the
# legacy $META_ROOT/.local/bin bridge pointing back into META_ROOT only.

[[component]]
id = "handoff-hf"
name = "handoff continuity kernel (hf)"
description = "Builds the meta/handoff Rust continuity kernel and exposes the canonical hf and hf-mcp front doors under $META_ROOT/usr/bin; never links hf to real-home Cargo state."
requires = ["rustup"]
path_entries = ["$META_ROOT/usr/bin"]

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; [ -x "$M/usr/bin/hf" ] && [ -x "$M/usr/bin/hf-mcp" ] && case "$(readlink -f "$M/usr/bin/hf" 2>/dev/null)" in "$M"/*) ;; *) exit 1;; esac && "$M/usr/bin/hf" version >/dev/null''']

[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
repo="${HANDOFF_REPO:-$M/handoff}"
[ -f "$repo/Cargo.toml" ] || { echo "handoff-hf: missing handoff repo at $repo" >&2; exit 1; }
export CARGO_HOME="$M/.toolchains/cargo"
export CARGO_TARGET_DIR="$M/var/cache/envctl/cargo-target/handoff"
export PATH="$M/usr/bin:$CARGO_HOME/bin:$PATH"
cargo build --release -p hf --manifest-path "$repo/Cargo.toml" --locked --target-dir "$CARGO_TARGET_DIR"
install -d -m 755 "$M/usr/bin" "$M/.local/bin"
for bin in hf hf-mcp; do
  src="$CARGO_TARGET_DIR/release/$bin"
  [ -x "$src" ] || { echo "handoff-hf: missing built binary $src" >&2; exit 1; }
  link="$M/usr/bin/$bin"
  if [ -e "$link" ] && [ "$(readlink -f "$link" 2>/dev/null || true)" != "$(readlink -f "$src")" ]; then
    arch="$M/var/lib/envctl/legacy-archives/usr-bin-$(date -u +%Y-%m-%d)/usr/bin"
    install -d -m 755 "$arch"
    mv "$link" "$arch/$bin"
    echo "handoff-hf: archived previous $link to $arch/$bin"
  fi
  ln -sfn "$src" "$link"
done
ln -sfn "$M/usr/bin/hf" "$M/.local/bin/hf"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; export PATH="$M/usr/bin:$PATH"; [ "$(readlink -f "$M/.local/bin/hf" 2>/dev/null)" = "$(readlink -f "$M/usr/bin/hf" 2>/dev/null)" ] && case "$(readlink -f "$M/usr/bin/hf" 2>/dev/null)" in "$M"/*) ;; *) echo "handoff-hf: hf resolves outside META_ROOT" >&2; exit 1;; esac && "$M/usr/bin/hf" version && "$M/usr/bin/hf-mcp" --help >/dev/null 2>&1''']

[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
repo="${HANDOFF_REPO:-$M/handoff}"
[ -f "$repo/Cargo.toml" ] || { echo "handoff-hf: missing handoff repo at $repo" >&2; exit 1; }
export CARGO_HOME="$M/.toolchains/cargo"
export CARGO_TARGET_DIR="$M/var/cache/envctl/cargo-target/handoff"
export PATH="$M/usr/bin:$CARGO_HOME/bin:$PATH"
cargo build --release -p hf --manifest-path "$repo/Cargo.toml" --locked --target-dir "$CARGO_TARGET_DIR"
install -d -m 755 "$M/usr/bin" "$M/.local/bin"
ln -sfn "$CARGO_TARGET_DIR/release/hf" "$M/usr/bin/hf"
ln -sfn "$CARGO_TARGET_DIR/release/hf-mcp" "$M/usr/bin/hf-mcp"
ln -sfn "$M/usr/bin/hf" "$M/.local/bin/hf"
'''

[component.remove]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; rm -f "$M/usr/bin/hf" "$M/usr/bin/hf-mcp"; if [ "$(readlink "$M/.local/bin/hf" 2>/dev/null || true)" = "$M/usr/bin/hf" ]; then rm -f "$M/.local/bin/hf"; fi''']
