[[component]]
id = "codex-global-baseline"
name = "Codex global baseline (META_ROOT-owned settings, plugin, MCP, features)"
description = "Owns the Codex global surface for meta: ~/.codex symlink, Rust CLI env vars, supported feature flags, MCP baseline, FlexNetOS Codex marketplace/plugin, hooks, and trust entries for every meta repo."
requires = ["codex-cli"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-$HOME}"
C="$M/.local/share/codex/config.toml"
H="$M/.local/share/codex/hooks.json"
[ "$(readlink -f "$R/.codex" 2>/dev/null)" = "$(readlink -f "$M/.local/share/codex" 2>/dev/null)" ] || exit 1
[ "$(readlink -f "$R/.local/bin/codex" 2>/dev/null)" = "$(readlink -f "$M/usr/bin/codex" 2>/dev/null)" ] || exit 1
[ -f "$C" ] && [ -f "$H" ] || exit 1
grep -q '^model = "gpt-5.5"' "$C" || exit 1
grep -q '^service_tier = "fast"' "$C" || exit 1
grep -q '^model_auto_compact_token_limit = 3000000' "$C" || exit 1
grep -q '^web_search = "live"' "$C" || exit 1
for f in apps auto_compaction browser_use browser_use_external computer_use enable_request_compression fast_mode goals guardian_approval hooks image_generation in_app_browser mentions_v2 multi_agent personality plugin_sharing plugins prevent_idle_sleep remote_compaction_v2 secret_auth_storage shell_snapshot shell_tool skill_mcp_dependency_install tool_call_mcp_elicitation tool_suggest unified_exec workspace_dependencies memories network_proxy; do
  grep -q "^$f = true" "$C" || { echo "missing feature: $f"; exit 1; }
done
for s in meta gitkb icm vox context7 weave openaiDeveloperDocs; do
  grep -q "^\[mcp_servers\.$s\]" "$C" || { echo "missing mcp: $s"; exit 1; }
done
grep -q '^\[marketplaces\.flexnetos-codex\]' "$C" || exit 1
grep -q '^\[plugins\."meta@flexnetos-codex"\]' "$C" || exit 1
grep -q '^\[plugins\."harness@harness-marketplace"\]' "$C" || exit 1
grep -q '^enabled = true' "$C" || exit 1
grep -q '^default_permissions = "meta-workspace"' "$C" || exit 1
for a in meta-worker pr-explorer reviewer docs-researcher codex-baseline-researcher; do [ -f "$M/.local/share/codex/agents/$a.toml" ] || { echo "missing agent: $a"; exit 1; }; done
CODEX_HOME="$M/.local/share/codex" CODEX_SQLITE_HOME="$M/.local/state/codex" "$M/usr/bin/codex" plugin list | grep -q 'meta@flexnetos-codex  installed, enabled' || exit 1
CODEX_HOME="$M/.local/share/codex" CODEX_SQLITE_HOME="$M/.local/state/codex" "$M/usr/bin/codex" plugin list | grep -q 'harness@harness-marketplace  installed, enabled' || exit 1
CODEX_HOME="$M/.local/share/codex" CODEX_SQLITE_HOME="$M/.local/state/codex" "$M/usr/bin/codex" mcp list >/dev/null || exit 1
! find "$M/.toolchains/bun" "$M/.toolchains/.bun" -path '*/@openai/codex*' -print -quit 2>/dev/null | grep -q .
''']
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-$HOME}"
CODEX_HOME_DIR="$M/.local/share/codex"
CODEX_STATE_DIR="$M/.local/state/codex"
install -d -m 700 "$CODEX_HOME_DIR" "$CODEX_STATE_DIR" "$CODEX_HOME_DIR/agents"
install -d -m 755 "$R/.local/bin"
if [ -e "$R/.codex" ] && [ "$(readlink -f "$R/.codex" 2>/dev/null)" != "$(readlink -f "$CODEX_HOME_DIR" 2>/dev/null)" ]; then
  ARCH="$M/var/lib/envctl/legacy-archives/codex-home-$(date -u +%Y%m%d-%H%M%S)"
  install -d -m 700 "$ARCH"
  mv "$R/.codex" "$ARCH/.codex"
  echo "archived previous real-home .codex: $ARCH/.codex"
fi
[ -L "$R/.codex" ] || ln -s "$CODEX_HOME_DIR" "$R/.codex"
if [ -e "$R/.local/bin/codex" ] && [ "$(readlink -f "$R/.local/bin/codex" 2>/dev/null)" != "$(readlink -f "$M/usr/bin/codex" 2>/dev/null)" ]; then
  ARCH="$M/var/lib/envctl/legacy-archives/codex-bin-$(date -u +%Y%m%d-%H%M%S)/.local/bin"
  install -d -m 755 "$ARCH"
  mv "$R/.local/bin/codex" "$ARCH/codex"
  echo "archived previous real-home codex: $ARCH/codex"
fi
ln -sfn "$M/usr/bin/codex" "$R/.local/bin/codex"
python3 - <<'PY'
import json, subprocess
from pathlib import Path
M = Path(__import__('os').environ['META_ROOT'])
home = M / '.local/share/codex'
config = home / 'config.toml'
hooks = home / 'hooks.json'
projects = [M]
try:
    out = subprocess.check_output(['rtk','meta','project','list','--json'], cwd=M, text=True, stderr=subprocess.DEVNULL)
    data = json.loads(out)
    projects = [Path(data['root'])] + [Path(data['root']) / p['path'] for p in data.get('projects', [])]
except Exception:
    pass
features = [
    'apps', 'auto_compaction', 'browser_use', 'browser_use_external', 'computer_use',
    'enable_request_compression', 'fast_mode', 'goals', 'guardian_approval', 'hooks',
    'image_generation', 'in_app_browser', 'mentions_v2', 'multi_agent', 'personality',
    'plugin_sharing', 'plugins', 'prevent_idle_sleep', 'remote_compaction_v2',
    'secret_auth_storage', 'shell_snapshot', 'shell_tool', 'skill_mcp_dependency_install',
    'tool_call_mcp_elicitation', 'tool_suggest', 'unified_exec', 'workspace_dependencies',
    'memories', 'network_proxy'
]
lines = [
    'model = "gpt-5.5"',
    'model_reasoning_effort = "medium"',
    'approvals_reviewer = "user"',
    'personality = "friendly"',
    'approval_policy = "on-request"',
    'model_context_window = 4000000',
    'model_auto_compact_token_limit = 3000000',
    'model_auto_compact_token_limit_scope = "total"',
    'web_search = "live"',
    f'model_catalog_json = "{home}/model-catalog.json"',
    'notify = ["weave", "hook", "wake"]',
    'service_tier = "fast"',
    'default_permissions = "meta-workspace"',
    '',
    '[permissions.meta-read-only]',
    'description = "Read-only meta workspace profile with limited network for documentation and source lookup."',
    'extends = ":read-only"',
    '',
    '[permissions.meta-read-only.workspace_roots]',
    f'"{M}" = true',
    '',
    '[permissions.meta-read-only.network]',
    'enabled = true',
    '',
    '[permissions.meta-read-only.network.domains]',
    '"developers.openai.com" = "allow"',
    '"api.openai.com" = "allow"',
    '"github.com" = "allow"',
    '"*.github.com" = "allow"',
    '"objects.githubusercontent.com" = "allow"',
    '',
    '[permissions.meta-workspace]',
    'description = "Default FlexNetOS meta workspace profile: write inside workspace roots, deny env/secrets, allow vetted developer network endpoints."',
    'extends = ":workspace"',
    '',
    '[permissions.meta-workspace.workspace_roots]',
    f'"{M}" = true',
    '',
    '[permissions.meta-workspace.filesystem.":workspace_roots"]',
    '"**/.env" = "deny"',
    '"**/.env.*" = "deny"',
    '"**/*secret*" = "deny"',
    '"**/*token*" = "deny"',
    '".codex" = "read"',
    '".codex/tmp" = "write"',
    '".local/share/codex" = "read"',
    '".local/state/codex" = "write"',
    '',
    '[permissions.meta-workspace.network]',
    'enabled = true',
    '',
    '[permissions.meta-workspace.network.domains]',
    '"api.openai.com" = "allow"',
    '"developers.openai.com" = "allow"',
    '"github.com" = "allow"',
    '"*.github.com" = "allow"',
    '"objects.githubusercontent.com" = "allow"',
    '"registry.npmjs.org" = "allow"',
    '"crates.io" = "allow"',
    '"static.crates.io" = "allow"',
    '',
    '[permissions.meta-full-trusted]',
    'description = "Explicit high-trust escape hatch for owner-approved meta maintenance only."',
    'extends = ":danger-full-access"',
    '',
    '[features]',
]
lines += [f'{f} = true' for f in features]
lines += [
    '',
    '[mcp_servers.meta]', 'command = "meta-mcp"', 'args = []',
    '',
    '[mcp_servers.gitkb]', 'command = "git"', 'args = ["kb", "mcp"]',
    '',
    '[mcp_servers.icm]', 'command = "icm"', 'args = ["serve"]',
    '',
    '[mcp_servers.vox]', 'command = "vox"', 'args = ["serve"]',
    '',
    '[mcp_servers.context7]', 'command = "bunx"', 'args = ["-y", "@upstash/context7-mcp"]',
    '',
    '[mcp_servers.weave]', 'command = "weave"', 'args = ["mcp"]',
    '',
    '[mcp_servers.openaiDeveloperDocs]', 'url = "https://developers.openai.com/mcp"',
    '',
    '[agents]', 'max_threads = 6', 'max_depth = 1', 'job_max_runtime_seconds = 1800',
    '',
    '[tui]',
    'status_line = ["model-with-reasoning", "context-used", "used-tokens", "five-hour-usage", "weekly-usage", "fast-mode"]',
    'status_line_use_colors = true',
    '',
    '[marketplaces.flexnetos-codex]',
    'source_type = "local"',
    f'source = "{M}/codex-plugins"',
    '',
    '[marketplaces.gitkb]',
    'source_type = "local"',
    f'source = "{M}/claude-plugins"',
    '',
    '[marketplaces.harness-marketplace]',
    'source_type = "local"',
    f'source = "{M}/harness_hub/harness"',
    '',
    '[plugins."meta@flexnetos-codex"]', 'enabled = true',
    '',
    '[plugins."gitkb@gitkb"]', 'enabled = true',
    '',
    '[plugins."meta@gitkb"]', 'enabled = true',
    '',
    '[plugins."harness@harness-marketplace"]', 'enabled = true',
    '',
    '[skills]', 'include_instructions = true',
    '',
    '[memories]', 'use_memories = true', 'generate_memories = true',
    '',
    '[hooks.state]',
]
for p in projects:
    lines += ['', f'[projects."{p}"]', 'trust_level = "trusted"']
config.write_text('\n'.join(lines) + '\n')
agent_dir = home / 'agents'
agent_dir.mkdir(parents=True, exist_ok=True)
agent_src = M / '.codex/agents'
if agent_src.exists():
    for src in agent_src.glob('*.toml'):
        (agent_dir / src.name).write_text(src.read_text())
else:
    raise SystemExit(f'missing project Codex agent source: {agent_src}')
hooks.write_text(json.dumps({
  'hooks': {
    'SessionStart': [{'hooks': [{'type': 'command', 'command': 'icm hook start'}]}],
    'PreToolUse': [{'matcher': 'Bash', 'hooks': [{'type': 'command', 'command': 'icm hook pre'}]}],
    'PostToolUse': [{'hooks': [{'type': 'command', 'command': 'icm hook post'}]}],
    'UserPromptSubmit': [{'hooks': [{'type': 'command', 'command': 'icm hook prompt'}]}],
    'PreCompact': [{'hooks': [{'type': 'command', 'command': 'icm hook compact'}]}],
    'Stop': [{'hooks': [{'type': 'command', 'command': 'weave hook wake'}]}],
    'SubagentStop': [{'hooks': [{'type': 'command', 'command': 'weave hook wake'}]}]
  }
}, indent=2) + '\n')
PY
export CODEX_HOME="$CODEX_HOME_DIR" CODEX_SQLITE_HOME="$CODEX_STATE_DIR"
"$M/usr/bin/codex" plugin marketplace add "$M/codex-plugins" --json >/dev/null || true
"$M/usr/bin/codex" plugin add meta@flexnetos-codex >/dev/null || true
"$M/usr/bin/codex" plugin add gitkb@gitkb >/dev/null || true
"$M/usr/bin/codex" plugin add meta@gitkb >/dev/null || true
"$M/usr/bin/codex" plugin add harness@harness-marketplace >/dev/null || true
"$M/usr/bin/codex" mcp list >/dev/null
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
R="${ENVCTL_REAL_HOME:-$HOME}"
C="$M/.local/share/codex/config.toml"
H="$M/.local/share/codex/hooks.json"
[ "$(readlink -f "$R/.codex" 2>/dev/null)" = "$(readlink -f "$M/.local/share/codex" 2>/dev/null)" ]
[ "$(readlink -f "$R/.local/bin/codex" 2>/dev/null)" = "$(readlink -f "$M/usr/bin/codex" 2>/dev/null)" ]
[ -f "$C" ] && [ -f "$H" ]
for f in apps auto_compaction browser_use browser_use_external computer_use enable_request_compression fast_mode goals guardian_approval hooks image_generation in_app_browser mentions_v2 multi_agent personality plugin_sharing plugins prevent_idle_sleep remote_compaction_v2 secret_auth_storage shell_snapshot shell_tool skill_mcp_dependency_install tool_call_mcp_elicitation tool_suggest unified_exec workspace_dependencies memories network_proxy; do grep -q "^$f = true" "$C"; done
for s in meta gitkb icm vox context7 weave openaiDeveloperDocs; do grep -q "^\[mcp_servers\.$s\]" "$C"; done
grep -q '^\[marketplaces\.flexnetos-codex\]' "$C"
grep -q '^\[plugins\."meta@flexnetos-codex"\]' "$C"
grep -q '^\[plugins\."harness@harness-marketplace"\]' "$C"
grep -q '^default_permissions = "meta-workspace"' "$C"
for a in meta-worker pr-explorer reviewer docs-researcher codex-baseline-researcher; do [ -f "$M/.local/share/codex/agents/$a.toml" ]; done
CODEX_HOME="$M/.local/share/codex" CODEX_SQLITE_HOME="$M/.local/state/codex" "$M/usr/bin/codex" plugin list | grep -q 'meta@flexnetos-codex  installed, enabled'
CODEX_HOME="$M/.local/share/codex" CODEX_SQLITE_HOME="$M/.local/state/codex" "$M/usr/bin/codex" plugin list | grep -q 'harness@harness-marketplace  installed, enabled'
CODEX_HOME="$M/.local/share/codex" CODEX_SQLITE_HOME="$M/.local/state/codex" "$M/usr/bin/codex" mcp list >/dev/null
! find "$M/.toolchains/bun" "$M/.toolchains/.bun" -path '*/@openai/codex*' -print -quit 2>/dev/null | grep -q .
''']
