[[component]]
id = "codex-global-baseline"
name = "Codex active-home policy and runtime-shadow retirement"
description = "Preserves editable active-home Codex policy, delegates profile ownership to Yazelix, and rejects unauthorized runtime shadows. It does not create, configure, or dispatch lifecycle hooks."
requires = ["codex-cli"]

[component.detect]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["detect"]

[component.install]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["install"]

[component.verify]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["verify"]

[component.fix]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["fix"]

[component.remove]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["remove"]
