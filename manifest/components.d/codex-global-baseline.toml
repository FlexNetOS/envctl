[[component]]
id = "codex-global-baseline"
name = "Codex profile-owned runtime compatibility guard"
description = "Validates that Codex and RTK resolve only through the Yazelix-owned Nix profile and that their profile binaries share one immutable store owner. This compatibility component is read-only: it does not create agent homes, project configuration, plugin trees, marketplaces, state roots, binaries, or runtime shadows."
requires = ["codex-cli"]

# The retained component id preserves manifest/lock compatibility. Ownership
# and materialization belong to canonical Yazelix source and its Nix profile;
# envctl only validates the installed result through the lifecycle script.
[component.detect]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["detect"]

[component.install]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["install"]

[component.verify]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["verify"]

[component.fix]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["fix"]

[component.remove]
kind = "shipped_script"
path = "$ENVCTL_SOURCE_ROOT/assets/scripts/envctl-codex-global-baseline-lifecycle.sh"
args = ["remove"]
