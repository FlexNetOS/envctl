# postgres-ruvector.toml — profile-owned ruvector "global brain" PostgreSQL cluster
# (blueprint R7 / TASK-0091, plan PR #460 §3 row 7, verdict V21).
#
# Yazelix owns the exact PostgreSQL + extension package in the real-home Nix profile.  Envctl
# owns only the lifecycle of the existing META_ROOT PGDATA.  The shipped lifecycle validates
# both ownership boundaries, starts a Unix-socket-only server, and never creates or migrates data.

[[component]]
id = "postgres-ruvector"
name = "postgres-ruvector — global-brain vector store"
description = "Profile-owned PostgreSQL 17.10 socket server for the existing ruvector codebase and episodes lanes under $META_ROOT/var/lib/postgresql."
requires = ["yazelix"]

[component.detect]
kind = "command"
command = "/usr/bin/bash"
args = [
  "-lc",
  '''M="${META_ROOT:?META_ROOT required}"; ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"; exec /usr/bin/bash "$ROOT/assets/scripts/envctl-postgres-ruvector-lifecycle.sh" detect''',
]

[component.install]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
exec /usr/bin/bash "$ROOT/assets/scripts/envctl-postgres-ruvector-lifecycle.sh" install
'''

[component.verify]
kind = "command"
command = "/usr/bin/bash"
args = [
  "-lc",
  '''M="${META_ROOT:?META_ROOT required}"; ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"; exec /usr/bin/bash "$ROOT/assets/scripts/envctl-postgres-ruvector-lifecycle.sh" verify''',
]

[component.fix]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
exec /usr/bin/bash "$ROOT/assets/scripts/envctl-postgres-ruvector-lifecycle.sh" fix
'''

# Removal is stop-only.  It validates the live PID, profile executable, PGDATA, and socket before
# using the profile pg_ctl; all database and ruvector files remain in place.
[component.remove]
kind = "script"
script = '''
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
exec /usr/bin/bash "$ROOT/assets/scripts/envctl-postgres-ruvector-lifecycle.sh" remove
'''
