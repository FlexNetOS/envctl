# ── zsh (shell, meta-owned) ─────────────────────────────────────────────────
# Builds the LATEST stable zsh from source into $META_ROOT/.toolchains/zsh and
# symlinks ~/.local/bin/zsh. Replaces the /nix/store zsh (yazelix bundle + the
# standalone nix zsh) so a meta-owned shell exists OUTSIDE /nix — it survives the
# system-nix→nix-portable teardown and is the terminal that drives that migration.
#
# UNPINNED on purpose: install resolves the newest `zsh-X.Y.Z` tag from
# zsh-users/zsh at install time (currently 5.9.1) rather than hardcoding a version
# — the same auto-latest pattern as the gh-cli / mise components. The static
# prebuilt alternative (romkatv/zsh-bin) is pinned to zsh 5.8 and is rejected for
# that reason. Built against system libc/ncurses (both survive a nix teardown);
# verify asserts ZERO /nix/store linkage.
[[component]]
id = "zsh"
name = "zsh shell (meta-owned)"
description = "Latest stable zsh built from source (zsh-users/zsh) into .toolchains/zsh + ~/.local/bin/zsh. Meta-owned shell outside /nix; the migration terminal. Unpinned: resolves newest tag at install."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/zsh/bin/zsh\" ] && [ \"$(readlink -f \"$HOME/.local/bin/zsh\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/zsh/bin/zsh\")\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
ROOT="$M/envctl"; source "$ROOT/assets/scripts/envctl-gh-fetch.sh"
DEST="$M/.toolchains/zsh"

# 1. Resolve the NEWEST stable tag (exclude *-test pre-releases). No hardcoded
#    version → auto-latest. Token-aware listing to dodge anonymous rate limits.
TAG="$(envctl_gh_api repos/zsh-users/zsh/tags?per_page=100 \
        | grep -oE '"name": *"zsh-[0-9]+\.[0-9]+(\.[0-9]+)?"' \
        | sed -E 's/.*"(zsh-[0-9.]+)"/\1/' \
        | sort -V | tail -1)"
[ -n "$TAG" ] || { echo "envctl[zsh]: could not resolve latest zsh tag" >&2; exit 1; }
VER="${TAG#zsh-}"
echo "envctl[zsh]: building zsh $VER (latest stable, unpinned)" >&2

# 2. Fetch the official release tarball (ships a prebuilt ./configure → no
#    autotools needed). Plain curl: these mirrors are not GitHub. zsh.org primary,
#    SourceForge fallback.
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
TARBALL="zsh-${VER}.tar.xz"
fetched=""
for url in \
  "https://www.zsh.org/pub/${TARBALL}" \
  "https://downloads.sourceforge.net/project/zsh/zsh/${VER}/${TARBALL}"; do
  if curl -fsSL --max-time 180 -L -o "$tmp/$TARBALL" "$url"; then fetched="$url"; break; fi
done
[ -n "$fetched" ] || { echo "envctl[zsh]: failed to download $TARBALL from any mirror" >&2; exit 1; }

# 3. Build into the meta prefix vs system libc/ncurses (NOT /nix). Default cc
#    (system gcc) — do not force the meta clang link-driver here.
tar -xJf "$tmp/$TARBALL" -C "$tmp"
src="$tmp/zsh-${VER}"
( cd "$src" \
  && ./configure --prefix="$DEST" --enable-multibyte >/dev/null \
  && make -j"$(nproc)" >/dev/null \
  && rm -rf "$DEST" && make install >/dev/null )

# 4. Wire into ~/.local/bin (already on PATH via run_env()).
install -d -m 755 "$HOME/.local/bin"
ln -sfn "$DEST/bin/zsh" "$HOME/.local/bin/zsh"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; PATH=\"$HOME/.local/bin:$PATH\"; zsh --version && ! ldd \"$M/.toolchains/zsh/bin/zsh\" | grep -q /nix/store"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
t="$HOME/.local/bin/zsh"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/zsh" && rm -f "$t"
rm -rf "$M/.toolchains/zsh"
'''

[component.wiring]
path_entries = ["$META_ROOT/.local/bin"]
