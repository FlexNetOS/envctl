# meta-env plugin — wires envctl in as a meta subprocess plugin so `meta env <verb>` dispatches into
# envctl (alongside `meta git`/`project`/`rust`/`dashboard`). meta discovers plugins as `meta-*`
# executables on PATH (probed with `--meta-plugin-info`), so this component keeps the private
# payload under $META_ROOT/usr/libexec/envctl/meta-env and exposes only the canonical
# $META_ROOT/usr/bin/meta-env front door. The binary is envctl's own autobin
# (crates/cli/src/bin/meta-env.rs); it forwards each verb to the `envctl` binary verbatim.
[[component]]
id = "meta-env-plugin"
name = "meta env plugin (envctl as a meta subprocess plugin)"
description = "Builds envctl's meta-env subprocess plugin into $META_ROOT/usr/libexec/envctl/meta-env with a $META_ROOT/usr/bin/meta-env front door, so `meta env <verb>` dispatches into envctl (discovered by meta as a meta-* binary on PATH)."
requires = ["rustup"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; dest="$M/usr/libexec/envctl/meta-env/bin/meta-env"; link="$M/usr/bin/meta-env"; [ -x "$dest" ] && [ -x "$link" ] && [ ! -L "$link" ] && grep -Fqx "exec \"$dest\" \"\$@\"" "$link" && "$dest" --meta-plugin-info >/dev/null 2>&1''']
[component.install]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
DEST="$M/usr/libexec/envctl/meta-env"
LINK="$M/usr/bin/meta-env"
export CARGO_HOME="$M/.toolchains/cargo"
export PATH="$M/usr/bin:$CARGO_HOME/bin:$PATH"
# Build only the meta-env autobin from the envctl CLI crate (no GUI → no system libs). wild-linker
# acceleration is inherited via the meta-root $M/.cargo/config.toml.
cargo build --release -p envctl --bin meta-env --manifest-path "$ROOT/Cargo.toml"
install -d -m 755 "$DEST/bin" "$M/usr/bin"
install -m 755 "$ROOT/target/release/meta-env" "$DEST/bin/meta-env"
envctl_frontdoor "$DEST/bin/meta-env" "$LINK"

'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; export PATH="$M/usr/bin:$PATH"; dest="$M/usr/libexec/envctl/meta-env/bin/meta-env"; link="$M/usr/bin/meta-env"; [ -x "$dest" ] && [ -x "$link" ] && [ ! -L "$link" ] && grep -Fqx "exec \"$dest\" \"\$@\"" "$link" && "$dest" --meta-plugin-info >/dev/null 2>&1 && meta env doctor >/dev/null 2>&1''']
[component.fix]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"
DEST="$M/usr/libexec/envctl/meta-env"
LINK="$M/usr/bin/meta-env"
export CARGO_HOME="$M/.toolchains/cargo"
export PATH="$M/usr/bin:$CARGO_HOME/bin:$PATH"
cargo build --release -p envctl --bin meta-env --manifest-path "$ROOT/Cargo.toml"
install -d -m 755 "$DEST/bin" "$M/usr/bin"
install -m 755 "$ROOT/target/release/meta-env" "$DEST/bin/meta-env"
envctl_frontdoor "$DEST/bin/meta-env" "$LINK"

'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; t="$M/usr/bin/meta-env"; dest="$M/usr/libexec/envctl/meta-env"; src="$dest/bin/meta-env"; managed_frontdoor(){ front="$1"; private="$2"; if [ -L "$front" ] && [ "$(readlink -f "$front" 2>/dev/null || true)" = "$(readlink -f "$private" 2>/dev/null || true)" ]; then return 0; fi; [ -f "$front" ] && grep -Fqx "exec \"$private\" \"\$@\"" "$front"; }; if managed_frontdoor "$t" "$src"; then rm -f "$t"; fi; rm -rf "$dest"''']
[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]
