# Epic H — meta-owned toolchain convergence (eliminate system-depth installs).
# Each tool installs into $META_ROOT/.toolchains/<x> and symlinks into ~/.local/bin,
# replacing an apt/system install. See docs/adr-install-locations-and-local-state.md
# (§System-depth convergence plan) and .handoff/loop/backlog.md Epic H.
#
# Install-only by default: components that ALSO change build behavior (wild as the
# linker, kache as RUSTC_WRAPPER) install the binary here but DO NOT auto-wire the
# global build config — wiring is a separate, verified step so an apply can never
# break the workspace's own builds.

# ── gh (GitHub CLI) ── replaces apt `gh` (/usr/bin/gh). Pure tarball, additive.
[[component]]
id = "gh-cli"
name = "GitHub CLI (meta-owned)"
description = "gh from upstream release tarball into .toolchains/gh + ~/.local/bin symlink. Replaces the apt `gh`. Repo: cli/cli."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/gh/bin/gh\" ] && [ \"$(readlink -f \"$HOME/.local/bin/gh\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/gh/bin/gh\")\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/gh"
TAG="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest | sed 's#.*/tag/##')"
VER="${TAG#v}"
URL="https://github.com/cli/cli/releases/download/${TAG}/gh_${VER}_linux_amd64.tar.gz"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
curl -fsSL "$URL" -o "$tmp/gh.tgz"
install -d -m 755 "$DEST"
tar -xzf "$tmp/gh.tgz" -C "$DEST" --strip-components=1
install -d -m 755 "$HOME/.local/bin"
ln -sfn "$DEST/bin/gh" "$HOME/.local/bin/gh"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "PATH=\"$HOME/.local/bin:$PATH\"; gh --version"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
t="$HOME/.local/bin/gh"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/gh" && rm -f "$t"
rm -rf "$M/.toolchains/gh"
'''

[component.wiring]
path_entries = ["~/.local/bin"]

# ── wild (linker) ── owner-preferred replacement for mold. crates.io pkg = `wild-linker`,
# binary = `wild`. INSTALL-ONLY: wiring it as the cargo linker (clang + --ld-path) is a
# separate verified step (see Epic H TASK-0054) so an apply can't break builds.
[[component]]
id = "wild-linker"
name = "wild linker (meta-owned, install-only)"
description = "Fast Rust linker (davidlattimore/wild) via `cargo install --locked wild-linker` into .toolchains/wild. Owner-preferred over mold. Install-only — global linker wiring is a separate step."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/wild/bin/wild\" ] && [ \"$(readlink -f \"$HOME/.local/bin/wild\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/wild/bin/wild\")\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/wild"
cargo install --locked wild-linker --root "$DEST"
install -d -m 755 "$HOME/.local/bin"
ln -sfn "$DEST/bin/wild" "$HOME/.local/bin/wild"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "PATH=\"$HOME/.local/bin:$PATH\"; wild --version"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
t="$HOME/.local/bin/wild"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/wild" && rm -f "$t"
rm -rf "$M/.toolchains/wild"
'''

[component.wiring]
path_entries = ["~/.local/bin"]

# ── kache (compiler cache) ── owner-preferred RUSTC_WRAPPER (kunobi-ninja/kache).
# INSTALL-ONLY: wiring RUSTC_WRAPPER is a separate verified step (Epic H TASK-0055)
# so an apply can't change how the workspace compiles.
[[component]]
id = "kache"
name = "kache compiler cache (meta-owned, install-only)"
description = "Content-addressed Rust compiler cache (kunobi-ninja/kache) via `cargo install kache` into .toolchains/kache. Install-only — RUSTC_WRAPPER wiring is a separate step. sccache only as last-resort fallback."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/kache/bin/kache\" ] && [ \"$(readlink -f \"$HOME/.local/bin/kache\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/kache/bin/kache\")\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/kache"
cargo install kache --root "$DEST"
install -d -m 755 "$HOME/.local/bin"
ln -sfn "$DEST/bin/kache" "$HOME/.local/bin/kache"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "PATH=\"$HOME/.local/bin:$PATH\"; kache --version || kache doctor"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
t="$HOME/.local/bin/kache"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/kache" && rm -f "$t"
rm -rf "$M/.toolchains/kache"
'''

[component.wiring]
path_entries = ["~/.local/bin"]
