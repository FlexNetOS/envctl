# 22.x, so the install pins the latest 21.x tag via the releases API. `envctl env
# --toolchains` also exports LIBCLANG_PATH=.toolchains/llvm/lib so bindgen-style
# consumers find libclang.so (Epic H TASK-0061). Repo: llvm/llvm-project.
