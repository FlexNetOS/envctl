name = "mise (meta-owned)"
description = "mise static binary into .toolchains/mise/bin + ~/.local/bin/mise. MISE_DATA_DIR already meta. Repo: jdx/mise."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/mise/bin/mise\" ] && [ \"$(readlink -f \"$HOME/.local/bin/mise\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/mise/bin/mise\")\" ]"]

