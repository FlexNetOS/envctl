# Epic H — meta-owned toolchain convergence (eliminate system-depth installs).
# Each tool installs into $META_ROOT/.toolchains/<x> and exposes regular frontdoor wrappers in $META_ROOT/usr/bin,
# replacing an apt/system install. See docs/adr-install-locations-and-local-state.md
# (§System-depth convergence plan) and .handoff/loop/backlog.md Epic H.
#
# Install-only by default: components that ALSO change build behavior install the
# binary here. Wiring that changes the global build config is gated behind a build-
# verification step so an apply can never silently break the workspace's own builds.
# wild (the linker) is now FULLY WIRED + verified (Epic H TASK-0054): its install
# writes the meta-root $META_ROOT/.cargo/config.toml linker section and a full
# `cargo build` was confirmed to link via `clang --ld-path=wild` before it landed.
# kache (RUSTC_WRAPPER) is wired and verified: absolute wrapper, meta XDG cache,
# and a meta-owned user systemd unit under $META_ROOT/.config/systemd/user.

# ── gh (GitHub CLI) ── replaces apt `gh` (/usr/bin/gh). Pure tarball, additive.
[[component]]
id = "gh-cli"
name = "GitHub CLI (meta-owned)"
description = "gh from upstream release tarball into .toolchains/gh + a regular $META_ROOT/usr/bin frontdoor wrapper. Replaces the apt `gh`. Repo: cli/cli."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/gh/bin/gh\" ] && [ -x \"$META_ROOT/usr/bin/gh\" ] && [ ! -L \"$META_ROOT/usr/bin/gh\" ] && grep -Fqx \"exec \\\"$M/.toolchains/gh/bin/gh\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/gh\""]

[component.install]
kind = "script"
login_shell = true
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
export PATH=/usr/bin:/bin
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"; source "$ROOT/assets/scripts/envctl-gh-fetch.sh"
DEST="$M/.toolchains/gh"
# Bootstrapping gh itself: the redirect-resolve is a github.com HEAD (not the JSON API) so it
# stays plain curl; the asset download goes through the resolver (bearer when a token is already
# available, identical bytes otherwise).
TAG="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/cli/cli/releases/latest | sed 's#.*/tag/##')"
VER="${TAG#v}"
URL="https://github.com/cli/cli/releases/download/${TAG}/gh_${VER}_linux_amd64.tar.gz"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
envctl_gh_curl "$URL" -o "$tmp/gh.tgz"
install -d -m 755 "$DEST"
tar -xzf "$tmp/gh.tgz" -C "$DEST" --strip-components=1
install -d -m 755 "$META_ROOT/usr/bin"
envctl_frontdoor "$DEST/bin/gh" "$META_ROOT/usr/bin/gh"


'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "PATH=\"$META_ROOT/usr/bin:$PATH\"; gh --version"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:?META_ROOT required}"
t="$META_ROOT/usr/bin/gh"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/gh" && rm -f "$t"
rm -rf "$M/.toolchains/gh"
'''

[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]
# ── wild (linker) ── owner-preferred replacement for mold. crates.io pkg = `wild-linker`,
# binary = `wild`. FULLY WIRED (Epic H TASK-0054): install ALSO writes a delimited block in
# the meta-root $META_ROOT/.cargo/config.toml linker section (`linker = "clang"` +
# `-Clink-arg=--ld-path=wild`) so local cargo builds link via wild; detect/verify assert
# the wiring; remove strips ONLY its block. A full `cargo build` was confirmed to link
# through `clang --ld-path=wild` before this landed (build-verify gate).
[[component]]
id = "wild-linker"
name = "wild linker (meta-owned, wired + verified)"
description = "Fast Rust linker (davidlattimore/wild) via `cargo install --locked wild-linker` into .toolchains/wild, wired as the local cargo linker via a delimited block in the meta-root .cargo/config.toml (clang + --ld-path=wild). Owner-preferred over mold. Wiring is verified — a full cargo build links through wild before it lands; remove strips only the wild block."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/wild/bin/wild\" ] && [ -x \"$META_ROOT/usr/bin/wild\" ] && [ ! -L \"$META_ROOT/usr/bin/wild\" ] && grep -Fqx \"exec \\\"$M/.toolchains/wild/bin/wild\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/wild\" && [ -f \"$M/.cargo/config.toml\" ] && grep -q -- '--ld-path=wild' \"$M/.cargo/config.toml\""]

[component.install]
kind = "script"
login_shell = true
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/wild"
export CARGO_HOME="$M/.toolchains/cargo"
export RUSTUP_HOME="$M/.toolchains/rustup"
export PATH="$CARGO_HOME/bin:$M/.toolchains/cargo/bin:$PATH"
cargo install --locked wild-linker --root "$DEST"
install -d -m 755 "$META_ROOT/usr/bin"
envctl_frontdoor "$DEST/bin/wild" "$META_ROOT/usr/bin/wild"
# Wire wild as the local cargo linker via the meta-root .cargo/config.toml. This file
# lives OUTSIDE the envctl repo (a runtime artifact at $META_ROOT, like .toolchains/); only
# this component def is committed. CI clones each repo standalone so it never sees it. The
# delimited block is written by a NON-CLOBBERING upsert (strip my old block, append fresh),
# so foreign content is preserved.
install -d -m 755 "$M/.cargo"
CFG="$M/.cargo/config.toml"
touch "$CFG"
# One-time migration off the legacy wholesale format (pre-TASK-0055: a single marker line +
# a [target...] section written via `cat >`). Strip exactly those legacy lines, preserving
# anything else. Stop the legacy skip at the next
# [section] OR the next comment line (so a following block's `# >>> ... >>>` marker survives).
if grep -q '^# managed by envctl wild-linker component' "$CFG"; then
  awk '/^# managed by envctl wild-linker component/{leg=1;next} leg&&((/^\[/&&$0!~/^\[target\.x86_64-unknown-linux-gnu\]/)||/^#/){leg=0} leg{next} {print}' "$CFG" > "$CFG.mig" && mv "$CFG.mig" "$CFG"
fi
# Upsert our delimited block idempotently (replace any prior wild block, keep the rest).
BEG="# >>> envctl wild-linker (Epic H TASK-0054) >>>"
END="# <<< envctl wild-linker (Epic H TASK-0054) <<<"
awk -v b="$BEG" -v e="$END" '$0==b{s=1} s&&$0==e{s=0;next} !s{print}' "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG"
printf '%s\n[target.x86_64-unknown-linux-gnu]\nlinker = "clang"\nrustflags = ["-Clink-arg=--ld-path=wild"]\n%s\n' "$BEG" "$END" >> "$CFG"


'''
[component.verify]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
export CARGO_HOME="$M/.toolchains/cargo"
export RUSTUP_HOME="$M/.toolchains/rustup"
export PATH="$META_ROOT/usr/bin:$CARGO_HOME/bin:$M/.toolchains/cargo/bin:$PATH"
# Bypass any interactive `grep` shell-function wrapper (rtk/ugrep hook in login shells):
# `command grep` always invokes the real binary so piped greps in this hook are robust.
g() { command grep "$@"; }
# 1) tools resolve
wild --version
clang --version >/dev/null
# 2) the managed config exists and carries the wild linker section
CFG="$M/.cargo/config.toml"
[ -f "$CFG" ] && g -q -- '--ld-path=wild' "$CFG"
# 3) prove the wiring actually links via wild. Build a tiny throwaway crate in a /tmp dir
#    (outside the meta tree so it never gets pulled into the meta workspace) and apply the
#    meta-root linker config EXPLICITLY via `cargo --config <path>`. Confirm the verbose link
#    line carries `--ld-path=wild`. Self-contained target-dir; cleaned on exit.
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
mkdir -p "$tmp/proj/src"
cat > "$tmp/proj/Cargo.toml" <<EOF
[workspace]

[package]
name = "wild-wire-probe"
version = "0.0.0"
edition = "2021"
[[bin]]
name = "wild-wire-probe"
path = "src/main.rs"
EOF
echo 'fn main() {}' > "$tmp/proj/src/main.rs"
( cd "$tmp/proj" && cargo build -v --config "$CFG" --target-dir "$tmp/td" 2>&1 ) | g -q -- '--ld-path=wild'
'''

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:?META_ROOT required}"
t="$META_ROOT/usr/bin/wild"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/wild" && rm -f "$t"
rm -rf "$M/.toolchains/wild"
# Strip the wild linker block from the config without touching foreign content. It is
# self-guarded by OUR delimiters and also strips the legacy
# wholesale format if present. If nothing is left, remove the file. Drop any obsolete
# pre-wild backup left by the legacy format.
CFG="$M/.cargo/config.toml"
BEG="# >>> envctl wild-linker (Epic H TASK-0054) >>>"
END="# <<< envctl wild-linker (Epic H TASK-0054) <<<"
if [ -f "$CFG" ]; then
  awk -v b="$BEG" -v e="$END" '$0==b{s=1} s&&$0==e{s=0;next} !s{print}' "$CFG" > "$CFG.tmp" && mv "$CFG.tmp" "$CFG"
  if grep -q '^# managed by envctl wild-linker component' "$CFG" 2>/dev/null; then
    awk '/^# managed by envctl wild-linker component/{leg=1;next} leg&&((/^\[/&&$0!~/^\[target\.x86_64-unknown-linux-gnu\]/)||/^#/){leg=0} leg{next} {print}' "$CFG" > "$CFG.mig" && mv "$CFG.mig" "$CFG"
  fi
  grep -q '[^[:space:]]' "$CFG" || rm -f "$CFG"
fi
rm -f "$CFG.pre-wild.bak"
'''

