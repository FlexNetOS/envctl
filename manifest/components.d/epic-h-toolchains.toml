kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/nix-portable/bin/nix-portable\" ] && file \"$M/.toolchains/nix-portable/bin/nix-portable\" | grep -q 'ELF'"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
t="$HOME/.local/bin/nix-portable"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/nix-portable" && rm -f "$t"
rm -rf "$M/.toolchains/nix-portable"
'''

[component.wiring]
path_entries = ["~/.local/bin"]
