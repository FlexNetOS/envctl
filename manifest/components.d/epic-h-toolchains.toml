# `huggingface-cli` binary is now a DEAD deprecation stub in 1.x ("no longer works. Use `hf`"),
# and `hf` itself collides with the handoff continuity kernel ($META_ROOT/usr/bin/hf). So we symlink the
# WORKING `hf` entry point under the non-colliding classic name `huggingface-cli` — the script does
# not gate on its own filename, so `huggingface-cli <args>` runs the real CLI (verified: `version`,
# `env`). `hf` is NEVER placed on $META_ROOT/usr/bin. Repo: huggingface/huggingface_hub.
[[component]]
id = "huggingface-cli"
name = "HuggingFace CLI (meta-owned venv)"
description = "huggingface_hub CLI in an isolated venv at .toolchains/huggingface, exposed as $META_ROOT/usr/bin/huggingface-cli (wrapped to the WORKING `hf` entry point; never `hf`, which collides with the handoff kernel). Repo: huggingface/huggingface_hub."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/huggingface/bin/hf\" ] && [ -x \"$META_ROOT/usr/bin/huggingface-cli\" ] && [ ! -L \"$META_ROOT/usr/bin/huggingface-cli\" ] && grep -Fqx \"exec \\\"$M/.toolchains/huggingface/bin/hf\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/huggingface-cli\""]

[component.install]
kind = "script"
login_shell = true
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/huggingface"
python3 -m venv "$DEST"
"$DEST/bin/pip" install --quiet --upgrade pip
"$DEST/bin/pip" install --quiet --upgrade huggingface_hub
install -d -m 755 "$META_ROOT/usr/bin"
# Expose the WORKING `hf` entry point under the classic, non-colliding name. The classic
# `huggingface-cli` binary is a dead deprecation stub in huggingface_hub 1.x; `hf` itself is
# NEVER symlinked (it collides with $META_ROOT/usr/bin/hf, the handoff kernel).
envctl_frontdoor "$DEST/bin/hf" "$META_ROOT/usr/bin/huggingface-cli"


'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "PATH=\"$META_ROOT/usr/bin:$PATH\"; huggingface-cli version"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/huggingface"
t="$META_ROOT/usr/bin/huggingface-cli"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/huggingface" && rm -f "$t"
rm -rf "$DEST"
'''

[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]
