# `NP_RUNTIME=bwrap` runtime selector is the working path. ADDITIVE only — this NEVER
# touches the host /nix; the destructive migration (remove host /nix, de-nix yazelix)
# is deferred to supervised TASK-0067. Epic H TASK-0066. Repo: DavHau/nix-portable.
