# ── ollama ── meta-owned LLM runner, replaces the root /usr/local/bin/ollama install.
# Ships as a zstd tarball with `bin/ollama` + `lib/ollama/` (the GPU runner .so set,
# incl. cuda_v12/cuda_v13). The binary finds its libs via `../lib/ollama` relative to
# its real path; `$META_ROOT/usr/bin/ollama` is now a small meta-owned wrapper (not a
# symlink) that forces `OLLAMA_MODELS=$META_ROOT/var/lib/ollama/models` before execing
# the toolchain binary. `envctl env --toolchains` also exports OLLAMA_LIBRARY_PATH as a
# belt-and-suspenders GPU .so redirect plus the same OLLAMA_MODELS store (Epic H
# TASK-0060/TASK-0072).
# Repo: ollama/ollama. (The old root binary at /usr/local/bin/ollama is shadowed by the
# $META_ROOT/usr/bin wrapper on PATH; its sudo removal is a separate cleanup step. Do
# not remove ollama until shimmy+ruvllm prove the replacement.)
[[component]]
id = "ollama"
name = "ollama (meta-owned)"
description = "ollama LLM runner from upstream zstd release tarball into .toolchains/ollama (bin/ollama + lib/ollama GPU runners) + $META_ROOT/usr/bin/ollama wrapper that forces OLLAMA_MODELS=$META_ROOT/var/lib/ollama/models. Replaces the root /usr/local/bin/ollama on PATH. Repo: ollama/ollama."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; w=\"$META_ROOT/usr/bin/ollama\"; models=\"$M/var/lib/ollama/models\"; [ -x \"$M/.toolchains/ollama/bin/ollama\" ] && [ -d \"$models\" ] && [ -x \"$w\" ] && [ ! -L \"$w\" ] && grep -F 'export OLLAMA_MODELS=\"$M/var/lib/ollama/models\"' \"$w\" >/dev/null && grep -F 'exec \"$M/.toolchains/ollama/bin/ollama\" \"$@\"' \"$w\" >/dev/null"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ROOT="${ENVCTL_SOURCE_ROOT:-$M/src/envctl}"; source "$ROOT/assets/scripts/envctl-gh-fetch.sh"
DEST="$M/.toolchains/ollama"
MODEL_STORE="$M/var/lib/ollama/models"
WRAPPER="$META_ROOT/usr/bin/ollama"

migrate_ollama_models() {
  # Non-destructive one-time adoption: only copy when the meta store is still empty,
  # and never delete or move a legacy/root daemon store behind envctl's back.
  if [ -n "$(find "$MODEL_STORE" -mindepth 1 -maxdepth 1 -print -quit 2>/dev/null)" ]; then
    return 0
  fi

  for src in \
    "$M/.ollama/models" \
    "${ENVCTL_REAL_HOME:-}/.ollama/models" \
    "/usr/share/ollama/.ollama/models" \
    "/var/lib/ollama/.ollama/models" \
    "/root/.ollama/models"
  do
    [ -n "$src" ] || continue
    [ "$src" = "$MODEL_STORE" ] && continue
    [ -d "$src" ] || continue
    if [ -r "$src" ] && [ -x "$src" ]; then
      cp -a "$src/." "$MODEL_STORE/"
      echo "ollama: copied existing model blobs from $src into $MODEL_STORE (source preserved)"
      return 0
    fi
    echo "ollama: model store exists but is not readable by envctl: $src (source preserved; rerun with access if needed)" >&2
  done
}

write_ollama_wrapper() {
  cat >"$WRAPPER" <<'EOF'
#!/usr/bin/env bash
set -euo pipefail
M="${META_ROOT:-}"
if [ -z "$M" ]; then
  script="$(readlink -f "${BASH_SOURCE[0]}")"
  M="$(cd "$(dirname "$script")/../.." && pwd -P)"
fi
export META_ROOT="$M"
export OLLAMA_MODELS="$M/var/lib/ollama/models"
export OLLAMA_LIBRARY_PATH="$M/.toolchains/ollama/lib/ollama${OLLAMA_LIBRARY_PATH:+:$OLLAMA_LIBRARY_PATH}"
exec "$M/.toolchains/ollama/bin/ollama" "$@"
EOF
  chmod 755 "$WRAPPER"
}

TAG="$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/ollama/ollama/releases/latest | sed 's#.*/tag/##')"
URL="https://github.com/ollama/ollama/releases/download/${TAG}/ollama-linux-amd64.tar.zst"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
envctl_gh_curl "$URL" -o "$tmp/ollama.tar.zst"
rm -rf "$DEST"
install -d -m 755 "$DEST" "$MODEL_STORE" "$META_ROOT/usr/bin"
tar --zstd -xf "$tmp/ollama.tar.zst" -C "$DEST"
migrate_ollama_models
write_ollama_wrapper
'''

[component.verify]
