name = "nix-portable (meta-owned)"
description = "Bwrap-backed isolated nix: the DavHau/nix-portable static binary into .toolchains/nix-portable/bin + $META_ROOT/usr/bin/nix-portable. Provides nix without a host root /nix store (home-dir store, logical /nix/store preserved so the binary cache works). Needs bwrap at runtime (NP_RUNTIME=bwrap). Additive — never touches host /nix; destructive /nix migration deferred to supervised TASK-0067. Repo: DavHau/nix-portable."

