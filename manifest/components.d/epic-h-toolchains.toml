# ── llvm-clang ── meta-owned LLVM/clang toolchain, replaces the apt clang/llvm
# system-depth install. Pure prebuilt tarball into .toolchains/llvm + ~/.local/bin
# symlinks for the clang/lld driver set. The `/releases/latest` redirect now points at
# 22.x, so the install pins the latest 21.x tag via the releases API. `envctl env
# --toolchains` also exports LIBCLANG_PATH=.toolchains/llvm/lib so bindgen-style
# consumers find libclang.so (Epic H TASK-0061). Repo: llvm/llvm-project.
[[component]]
id = "llvm-clang"
name = "LLVM/clang (meta-owned)"
description = "LLVM/clang-21 from upstream prebuilt release tarball into .toolchains/llvm + ~/.local/bin symlinks for the binaries whose runtime libs resolve on this host (clang/clang++/llc/llvm-* always; lld/ld.lld only where libxml2.so.2 exists). Replaces the apt clang/llvm. Pins latest 21.x (the /latest redirect now points at 22.x). Repo: llvm/llvm-project."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/llvm/bin/clang\" ] && [ -L \"$HOME/.local/bin/clang\" ] && case \"$(readlink -f \"$HOME/.local/bin/clang\" 2>/dev/null)\" in \"$M/.toolchains/llvm\"/*) true;; *) false;; esac"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/llvm"
TAG="$(curl -fsSL 'https://api.github.com/repos/llvm/llvm-project/releases?per_page=100' \
  | grep -oE '"tag_name": *"llvmorg-21\.[0-9]+\.[0-9]+"' \
  | grep -oE 'llvmorg-21\.[0-9]+\.[0-9]+' | sort -V | tail -1)"
VER="${TAG#llvmorg-}"
URL="https://github.com/llvm/llvm-project/releases/download/${TAG}/LLVM-${VER}-Linux-X64.tar.xz"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
curl -fsSL "$URL" -o "$tmp/llvm.tar.xz"
rm -rf "$DEST"; install -d -m 755 "$DEST"
tar -xJf "$tmp/llvm.tar.xz" -C "$DEST" --strip-components=1
install -d -m 755 "$HOME/.local/bin"
# only symlink binaries whose runtime libs resolve on this host (the prebuilt lld links
# libxml2.so.2, absent on libxml2.so.16 boxes); the box's strategic linker is wild
# (TASK-0054), and apt lld remains as fallback until apt removal. The `--version` probe
# self-prunes any tarball tool with an unsatisfied shared lib, not just lld.
for b in clang clang++ clang-cpp clang-21 llvm-config llc llvm-ar llvm-nm llvm-objcopy llvm-objdump lld ld.lld; do
  src="$DEST/bin/$b"; dst="$HOME/.local/bin/$b"
  if [ -e "$src" ] && "$src" --version >/dev/null 2>&1; then
    ln -sfn "$src" "$dst"
  else
    # prune a stale symlink into our DEST for a now-unexposed binary (e.g. a prior
    # install that linked lld before libxml2.so.2 went away, or a re-install). Only
    # touch symlinks we own (resolving into $DEST); never remove a foreign/apt binary.
    [ -L "$dst" ] && readlink "$dst" | grep -q "$DEST" && rm -f "$dst"
  fi
done
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "PATH=\"$HOME/.local/bin:$PATH\"; clang --version && llvm-config --version"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
for b in clang clang++ clang-cpp clang-21 llvm-config llc llvm-ar llvm-nm llvm-objcopy llvm-objdump lld ld.lld; do
  t="$HOME/.local/bin/$b"; [ -L "$t" ] && readlink "$t" | grep -q "$M/.toolchains/llvm" && rm -f "$t"
done
rm -rf "$M/.toolchains/llvm"
'''

[component.wiring]
path_entries = ["~/.local/bin"]

# ── libgccjit ── meta-owned libgccjit.so for the rustc_codegen_gcc backend. NOT a
# system GCC build and NOT apt: downloads the prebuilt CI `libgccjit.so` from the
# `rust-lang/gcc` release whose tag is pinned by rustc_codegen_gcc's own
# `libgccjit.version` (so the .so matches the backend exactly, not floating-latest)
# into .toolchains/libgccjit/lib. The payload is a runtime shared object consumed by
# the external rustc_codegen_gcc backend, NOT a CLI binary, so there is NO
# ~/.local/bin symlink and NO `path_entries`. `envctl env --toolchains` exports
# GCC_PATH=.toolchains/libgccjit/lib so the backend (config.toml `gcc-path` /
# LIBRARY_PATH+LD_LIBRARY_PATH) finds it (Epic H TASK-0062). Repo: rust-lang/gcc.
[[component]]
id = "libgccjit"
name = "libgccjit (meta-owned)"
description = "Prebuilt libgccjit.so for the rustc_codegen_gcc backend, from the rust-lang/gcc release pinned by rustc_codegen_gcc's libgccjit.version, into .toolchains/libgccjit/lib. Runtime .so (no CLI binary, no ~/.local/bin symlink); exposed via the GCC_PATH env seam. Replaces a system GCC/libgccjit build. Repo: rust-lang/gcc."

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -f \"$M/.toolchains/libgccjit/lib/libgccjit.so\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/libgccjit"
COMMIT="$(curl -fsSL https://raw.githubusercontent.com/rust-lang/rustc_codegen_gcc/master/libgccjit.version | tr -d '[:space:]')"
[ -n "$COMMIT" ] || { echo "libgccjit: could not resolve commit from libgccjit.version" >&2; exit 1; }
URL="https://github.com/rust-lang/gcc/releases/download/master-${COMMIT}/libgccjit.so"
tmp=$(mktemp -d); trap 'rm -rf "$tmp"' EXIT
curl -fsSL "$URL" -o "$tmp/libgccjit.so"
rm -rf "$DEST"; install -d -m 755 "$DEST/lib"
install -m 644 "$tmp/libgccjit.so" "$DEST/lib/libgccjit.so"
ln -sfn "$DEST/lib/libgccjit.so" "$DEST/lib/libgccjit.so.0"
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -f \"$M/.toolchains/libgccjit/lib/libgccjit.so\" ] && file \"$M/.toolchains/libgccjit/lib/libgccjit.so\" | grep -q 'shared object'"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
rm -rf "$M/.toolchains/libgccjit"
'''

