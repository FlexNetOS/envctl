# ── ohmyzsh (zsh config layer, meta-owned, FULL features) ───────────────────
# The $ZDOTDIR config framework for the meta-owned zsh (the `zsh` component).
# ohmyzsh is NOT a binary source — its installer requires a pre-existing zsh — so
# this component only wires CONFIG: it ensures the FlexNetOS/ohmyzsh fork is present
# (a registered meta project at $META_ROOT/ohmyzsh), clones the canonical add-ons
# into a meta-owned ZSH_CUSTOM, and writes a meta-owned ZDOTDIR with the full
# plugin set enabled.
#
# Add-ons (FlexNetOS forks, full clones into .toolchains/zsh-config/custom):
#   plugins/ : zsh-autosuggestions · zsh-syntax-highlighting · zsh-completions
#   themes/  : powerlevel10k (ZSH_THEME) — Nerd Font already on box; the p10k
#              config wizard runs on first interactive open.
# Bundled omz plugins enabled: git sudo z extract colored-man-pages
#   command-not-found copypath copyfile dirhistory history.
#
# NON-DESTRUCTIVE: does NOT touch ~/.zshrc / ~/.zshenv (owner's ForgeCode setup).
# Launch: ZDOTDIR="$META_ROOT/.toolchains/zsh-config" $META_ROOT/.local/bin/zsh
[[component]]
id = "ohmyzsh"
name = "oh-my-zsh config (meta-owned, full features)"
description = "Meta-owned ZDOTDIR sourcing the FlexNetOS/ohmyzsh fork with the full add-on set (powerlevel10k theme + autosuggestions, syntax-highlighting, completions + rich plugins) in a meta ZSH_CUSTOM. Config only; does not touch ~/.zshrc."
requires = ["zsh"]

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; C=\"$M/.toolchains/zsh-config\"; [ -f \"$M/ohmyzsh/oh-my-zsh.sh\" ] && [ -f \"$C/.zshrc\" ] && [ -f \"$C/custom/plugins/zsh-autosuggestions/zsh-autosuggestions.zsh\" ] && [ -f \"$C/custom/plugins/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh\" ] && [ -d \"$C/custom/plugins/zsh-completions\" ] && [ -f \"$C/custom/themes/powerlevel10k/powerlevel10k.zsh-theme\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
OMZ="$M/ohmyzsh"
ZDD="$M/.toolchains/zsh-config"
CUSTOM="$ZDD/custom"

# 1. Ensure the FlexNetOS/ohmyzsh fork is present (registered meta project; clone
#    as a fallback). FULL clone — never shallow (keeps tags/branches for omz update).
if [ ! -f "$OMZ/oh-my-zsh.sh" ]; then
  git clone git@github.com:FlexNetOS/ohmyzsh.git "$OMZ"
fi

# 2. Clone the canonical add-ons (FlexNetOS forks) into the meta ZSH_CUSTOM.
#    FULL clones so `git pull` updates work. Idempotent.
install -d -m 755 "$CUSTOM/plugins"
for p in zsh-autosuggestions zsh-syntax-highlighting zsh-completions; do
  if [ ! -d "$CUSTOM/plugins/$p/.git" ]; then
    git clone "git@github.com:FlexNetOS/${p}.git" "$CUSTOM/plugins/$p"
  fi
done

# 2b. Powerlevel10k theme (FlexNetOS fork, full clone). Nerd Font already present
#     (JetBrainsMono/FiraCode in $META_ROOT/.local/share/fonts). The p10k config WIZARD is
#     left enabled — it runs on first interactive open; its output (.p10k.zsh) is
#     sourced by the .zshrc below, so the managed .zshrc never needs hand-edits.
install -d -m 755 "$CUSTOM/themes"
if [ ! -d "$CUSTOM/themes/powerlevel10k/.git" ]; then
  git clone "git@github.com:FlexNetOS/powerlevel10k.git" "$CUSTOM/themes/powerlevel10k"
fi

# 3. Meta-owned ZDOTDIR with the FULL plugin set. $OMZ/$CUSTOM baked absolute;
#    runtime $ZSH escaped literal. zsh-syntax-highlighting MUST be the last plugin.
install -d -m 755 "$ZDD"
cat > "$ZDD/.zshrc" <<EOF
# Meta-owned zsh config — generated by the envctl ohmyzsh component. Do not edit.
# Full-feature ohmyzsh for the meta zsh. Launch: ZDOTDIR="$ZDD" zsh
export ZSH="$OMZ"
export ZSH_CUSTOM="$CUSTOM"
ZSH_THEME="powerlevel10k/powerlevel10k"
plugins=(
  git sudo z extract colored-man-pages command-not-found
  copypath copyfile dirhistory history
  zsh-completions
  zsh-autosuggestions
  zsh-syntax-highlighting
)
source "\$ZSH/oh-my-zsh.sh"
# Powerlevel10k: the configuration wizard runs on first interactive open (no
# ~/.p10k.zsh yet). It writes \${ZDOTDIR}/.p10k.zsh, which is sourced here — so the
# wizard's output is honored without editing this managed file.
[[ ! -f "\${ZDOTDIR:-\$HOME}/.p10k.zsh" ]] || source "\${ZDOTDIR:-\$HOME}/.p10k.zsh"
EOF
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; o=$(POWERLEVEL9K_DISABLE_CONFIGURATION_WIZARD=true ZDOTDIR=\"$M/.toolchains/zsh-config\" \"$META_ROOT/.local/bin/zsh\" -ic 'print -r -- \"OMZ=$ZSH P10K=${+functions[p10k]} AS=${+functions[_zsh_autosuggest_start]} HL=${+ZSH_HIGHLIGHT_VERSION}\"' 2>/dev/null); echo \"$o\"; echo \"$o\" | grep -q \"OMZ=$M/ohmyzsh\" && echo \"$o\" | grep -q 'P10K=1' && echo \"$o\" | grep -q 'AS=1' && echo \"$o\" | grep -q 'HL=1'"]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:?META_ROOT required}"
# Removes the generated ZDOTDIR incl. the cloned add-ons under custom/. The
# ohmyzsh repo is a meta project and is NOT deleted here (managed via meta git).
rm -rf "$M/.toolchains/zsh-config"
'''
