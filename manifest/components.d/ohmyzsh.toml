# ── ohmyzsh (zsh config layer, meta-owned) ──────────────────────────────────
# The $ZDOTDIR config framework for the meta-owned zsh (the `zsh` component).
# ohmyzsh is NOT a binary source — its installer requires a pre-existing zsh — so
# this component only wires CONFIG: it ensures the FlexNetOS/ohmyzsh fork is present
# (a registered meta project at $META_ROOT/ohmyzsh) and writes a meta-owned ZDOTDIR
# that sources it.
#
# NON-DESTRUCTIVE: it does NOT touch ~/.zshrc / ~/.zshenv (which already hold the
# owner's ForgeCode setup). The migration terminal opts in by launching with
# ZDOTDIR pointed at the meta config:
#     ZDOTDIR="$META_ROOT/.toolchains/zsh-config" ~/.local/bin/zsh
# Making it the default login shell (chsh / ~/.zshenv export) is a separate opt-in.
[[component]]
id = "ohmyzsh"
name = "oh-my-zsh config (meta-owned)"
description = "Meta-owned ZDOTDIR sourcing the FlexNetOS/ohmyzsh fork ($META_ROOT/ohmyzsh) for the meta zsh. Config layer only (omz needs a pre-existing zsh); does not touch ~/.zshrc."
requires = ["zsh"]

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -f \"$M/ohmyzsh/oh-my-zsh.sh\" ] && [ -f \"$M/.toolchains/zsh-config/.zshrc\" ]"]

[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
OMZ="$M/ohmyzsh"
ZDD="$M/.toolchains/zsh-config"

# 1. Ensure the FlexNetOS/ohmyzsh fork is present. Normally cloned via
#    `meta git update` (it is a registered meta project); clone as a fallback so
#    the component is self-sufficient.
if [ ! -f "$OMZ/oh-my-zsh.sh" ]; then
  git clone git@github.com:FlexNetOS/ohmyzsh.git "$OMZ"
fi

# 2. Meta-owned ZDOTDIR that sources omz from the fork. $OMZ is baked to its
#    absolute path; runtime vars ($ZSH) are escaped so they stay literal.
install -d -m 755 "$ZDD"
cat > "$ZDD/.zshrc" <<EOF
# Meta-owned zsh config — generated by the envctl ohmyzsh component. Do not edit.
# Sources the FlexNetOS/ohmyzsh fork. Launch: ZDOTDIR="$ZDD" zsh
export ZSH="$OMZ"
ZSH_THEME="robbyrussell"
plugins=(git)
source "\$ZSH/oh-my-zsh.sh"
EOF
'''

[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; ZDOTDIR=\"$M/.toolchains/zsh-config\" \"$HOME/.local/bin/zsh\" -ic 'echo OMZ=$ZSH' 2>/dev/null | grep -q \"$M/ohmyzsh\""]

[component.remove]
kind = "script"
login_shell = true
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
# Only removes the generated ZDOTDIR. The ohmyzsh repo is a meta project and is
# NOT deleted here (managed via .meta.yaml / `meta git`).
rm -rf "$M/.toolchains/zsh-config"
'''
