# manifest/env-ctl.toml — env-ctl secrets vault + credential broker (Profile A: on-box, USB unlock)
# Builds the envctl-secrets-* workspace crates (secretd + secretctl; secrets-store-libsql builds
# transitively as a secretd dep) and wires secretd as a systemd USER service.
# detect == verify (binaries + unit present, daemon self-check green) so drift never nudges a
# destructive rebuild. Vault purge is the native data_paths path (reset --purge), NOT a side component.
#
# ENABLED (Phase 6 landed): secretd's main now serves the control plane and answers `--self-check`
# (a non-serving startup pre-flight), so the verify hook below is real and the systemd unit ships
# enable=true. The CI enable gate (ci/gates/enable.sh) asserts the post-Phase-6 invariant: main.rs is
# no longer a `todo!()` scaffold AND an enabled manifest's `secretd --self-check` surface exists.
# (Pre-Phase-6 this stayed enable=false so an auto-enabled unit could not panic-loop into a false
# "vault is up" signal — that scaffold guard is now retired.)

[[component]]
id = "env-ctl"
name = "env-ctl secrets daemon"
description = "Pure-Rust gRPC secrets vault + credential broker (secretd/secretctl). AEAD-at-rest, <=24h peer-bound relay bearers, in-process TLS for the relay edge. Control = UDS + SO_PEERCRED owner-only; data = loopback."
requires = ["rustup", "sqld"]  # cargo + stable >= 1.80 (manifest/base.toml); durable store (manifest/sqld.toml)
destructive = false

# DETECT == the "already installed AND healthy enough to be present" predicate.
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; PRIV=\"$M/usr/libexec/envctl/secrets/bin\"; META_BIN=\"$M/usr/bin\"; frontdoor_ok() { f=\"$1\"; p=\"$2\"; [ -x \"$f\" ] && [ ! -L \"$f\" ] && grep -Fqx \"exec \\\"$p\\\" \\\"\\$@\\\"\" \"$f\"; }; test -x \"$PRIV/secretd\" && test -x \"$PRIV/secretctl\" && test -f \"$META_ROOT/.config/systemd/user/env-ctl.service\" && frontdoor_ok \"$META_BIN/secretd\" \"$PRIV/secretd\" && frontdoor_ok \"$META_BIN/secretctl\" \"$PRIV/secretctl\""]

# INSTALL: MSRV-gate, build from the in-workspace sources, place bins, create XDG dirs (0700).
# Does NOT init the vault or enroll keyslots — those are operator-driven, USB-gated daemon ops.
[component.install]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
# Meta-owned toolchain (Epic H TASK-0069): build with the meta cargo, NOT $META_ROOT/.toolchains/cargo/bin.
M="${META_ROOT:?META_ROOT required}"
export CARGO_HOME="$M/.toolchains/cargo"
META_BIN="$M/usr/bin"
export PATH="$M/.toolchains/cargo/bin:$META_BIN:$META_ROOT/usr/bin:$PATH"
DEST="$M/usr/libexec/envctl/secrets/bin"

# MSRV gate (rust-version = 1.80 in the workspace). Fail closed, do not silently upgrade.
# Pass iff cargo >= 1.80.0: with the MSRV line FIRST, `sort -V -C` succeeds only when the
# pair is ascending (1.80.0 <= $ver). (Operands were reversed, which rejected every cargo
# newer than 1.80 — i.e. always — failing the install on a healthy toolchain.)
ver="$(cargo --version | awk '{print $2}')"
printf '1.80.0\n%s\n' "$ver" | sort -V -C || { echo "FATAL: cargo $ver < MSRV 1.80"; exit 1; }

# Resolve the envctl workspace root. Explicit override wins; otherwise use the meta-hosted
# checkout under $META_ROOT. Do not fall back to a user-home checkout: envctl is a first-class
# meta member and builds from the meta workspace only.
repo="${ENVCTL_SOURCE_ROOT:-$META_ROOT/src/envctl}"
test -d "${repo:-/nonexistent}/crates/secretd" || { echo "FATAL: envctl workspace not found (set ENVCTL_SOURCE_ROOT to the checkout root)"; exit 1; }

# secretd is built WITH `--features seed-factor` so the Cognitum Seed USB unlock factor
# (Profile S) is compiled in. Without it, `RealUsbProbe::keyfile_for` is a no-op stub that
# always returns `None`, so the USB unlock factor can NEVER succeed (the daemon falls back to
# passphrase only) — i.e. a stock build cannot reproduce a USB-unlock-capable daemon. seed-factor
# only pulls pure-Rust ring/rustls (already in the resolved graph, so the no-C trust-boundary gate
# stays green) and degrades cleanly to passphrase-only when no Seed is present, so it is always
# safe to enable. secretctl has no such feature and is built plain.
cargo build --release --manifest-path "$repo/Cargo.toml" -p envctl-secretd --features seed-factor
cargo build --release --manifest-path "$repo/Cargo.toml" -p envctl-secretctl

# Meta-prefix install (Epic H TASK-0069): private binaries live under
# $M/usr/libexec/envctl/secrets/bin, exposed through regular executable wrappers in $M/usr/bin.
# Never install directly into $META_ROOT/.toolchains/cargo/bin (system-depth).
install -Dm755 "$repo/target/release/secretd"   "$DEST/secretd"
install -Dm755 "$repo/target/release/secretctl" "$DEST/secretctl"
install -d -m755 "$META_BIN"
envctl_frontdoor "$DEST/secretd"   "$META_BIN/secretd"
envctl_frontdoor "$DEST/secretctl" "$META_BIN/secretctl"

cleanup_legacy_cargo_bin() {
  b="$1"
  legacy="$META_ROOT/.toolchains/cargo/bin/$b"
  owned="$DEST/$b"
  [ -e "$legacy" ] || return 0
  # If an old symlink already points at the new meta-local binary, remove the duplicate link.
  if [ -L "$legacy" ] && [ "$(readlink -f "$legacy" 2>/dev/null)" = "$(readlink -f "$owned" 2>/dev/null)" ]; then
    rm -f "$legacy"
    echo "removed legacy cargo-bin symlink: $legacy"
    return 0
  fi
  # If the old regular file is byte-identical to the just-installed meta binary, archive it.
  # Different/foreign binaries are left in place and surfaced by verify; strict upgrade-only means
  # never deleting an unproven executable.
  if [ -f "$legacy" ] && [ -f "$owned" ] && cmp -s "$legacy" "$owned"; then
    arch="$META_ROOT/var/lib/envctl/legacy-archives/$(date -u +%Y%m%dT%H%M%SZ)/.cargo/bin"
    install -d -m700 "$arch"
    mv "$legacy" "$arch/$b"
    echo "archived legacy cargo-bin copy: $legacy -> $arch/$b"
  elif [ -e "$legacy" ]; then
    echo "WARNING: legacy cargo-bin $legacy differs from $owned; left in place (strict upgrade-only)"
  fi
}
cleanup_legacy_cargo_bin secretd
cleanup_legacy_cargo_bin secretctl

# XDG dirs, fail-closed perms (ARCHITECTURE layout). RUNTIME dir is created by the unit at start.
install -d -m700 "$META_ROOT/.config/env-ctl"
install -d -m700 "$META_ROOT/var/lib/env-ctl"
install -d -m700 "$META_ROOT/var/lib/env-ctl"

# Durable store config (docs/ops/08): point secretd at the loopback sqld (libSQL remote backend).
# Idempotent: written only if absent (operator edits are preserved). The AUTH TOKEN is NEVER written
# here — it comes from SECRETD_LIBSQL_AUTH_TOKEN[_FILE] only (config.rs refuses a token in this file).
cfg="$META_ROOT/.config/env-ctl/secretd.toml"
if [ ! -f "$cfg" ]; then
  cat > "$cfg" <<'TOML'
# secretd store backend (OI-1 (a)). libSQL `remote` -> a LOOPBACK sqld (see manifest/sqld.toml).
# The auth token is NEVER stored here (credentials come from SECRETD_LIBSQL_AUTH_TOKEN[_FILE]).
[store]
backend = "libsql"
url = "http://127.0.0.1:8080"
TOML
  chmod 0600 "$cfg"
fi

# TASK-0033 (F7 / FS-S21): VPS Profile B install-time fail-closed gate. A `[profile] topology =
# "remote"` (VPS) deployment MUST configure an operator_authorizer_url (the substitute presence
# factor); without it, secretd would SILENTLY downgrade to ungated egress. Refuse the install FATALLY
# rather than ship that downgrade (secretd ALSO refuses to start — this is the earlier, install-time
# guard). On-box (the default, or no [profile] block) is unaffected.
if grep -Eq '^\s*topology\s*=\s*"(remote|vps)"' "$cfg" 2>/dev/null; then
  grep -Eq '^\s*operator_authorizer_url\s*=' "$cfg" \
    || { echo "FATAL: secretd.toml has [profile] topology=remote (VPS) but no operator_authorizer_url (FS-S21 substitute presence factor); refusing to install a silently ungated VPS"; exit 1; }
fi


# VERIFY: bins answer, AND secretd's own non-serving self-check passes. `secretd --self-check` runs
# the daemon's startup pre-flight (ring crypto provider, XDG paths, store-config validation) and
# EXITS — it never binds the socket, connects the store, or serves, so verify cannot block and is safe
# to run while the daemon is live. A misconfigured/un-built daemon reports verify=false (drift
# visible) WITHOUT triggering a destructive fix — detect, not verify, is the install predicate.
#
# SERVING PROBE (non-fatal): additionally, IF the unit is active, confirm a live `secretctl status`
# round-trip — this is what proves the sd-notify READY + durable-store fix actually serves. It is
# strictly best-effort: a not-yet-started/locked daemon must NOT fail verify (locked is HEALTHY; the
# vault is simply unprovisioned), and verify never asserts "unlocked" and never triggers a fix. The
# hard predicate stays the two binary/self-check checks; the serving probe only logs.
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
M="${META_ROOT:?META_ROOT required}"
export PATH="$M/usr/bin:$META_ROOT/usr/bin:$PATH"
# Hard predicate (fail-closed): bins answer + the daemon's offline self-check passes.
secretctl --help >/dev/null && secretd --self-check >/dev/null || exit 1
# Legacy cargo-bin copies must not shadow the meta-local install. They are cleaned by install/fix
# when byte-identical or symlinked to the meta prefix; different foreign binaries are surfaced here
# rather than removed destructively.
for b in secretd secretctl; do
  legacy="$META_ROOT/.toolchains/cargo/bin/$b"
  owned="$M/usr/libexec/envctl/secrets/bin/$b"
  if [ -e "$legacy" ] && [ "$(readlink -f "$legacy" 2>/dev/null)" != "$(readlink -f "$owned" 2>/dev/null)" ]; then
    echo "legacy cargo-bin $b shadows meta-local install: $legacy"
    exit 1
  fi
done
# TASK-0033 (F7 / FS-S21): a VPS Profile B config MUST carry operator_authorizer_url. verify fails
# closed on the same downgrade the install gate refuses (so drift introduced after install is caught).
cfg="$META_ROOT/.config/env-ctl/secretd.toml"
if grep -Eq '^\s*topology\s*=\s*"(remote|vps)"' "$cfg" 2>/dev/null; then
  grep -Eq '^\s*operator_authorizer_url\s*=' "$cfg" \
    || { echo "FATAL: VPS profile (topology=remote) without operator_authorizer_url (FS-S21)"; exit 1; }
fi
# Best-effort serving probe — NEVER fails verify (locked is healthy; daemon may be stopped).
if systemctl --user is-active --quiet env-ctl.service; then
  if secretctl status >/dev/null 2>&1; then
    echo "serving probe: env-ctl.service active and secretctl status round-trips (healthy)"
  else
    echo "serving probe: env-ctl.service active but secretctl status did not round-trip (non-fatal)"
  fi
else
  echo "serving probe: env-ctl.service not active (non-fatal; start it to serve)"
fi
exit 0
''']

# FIX: idempotent rebuild + reinstall (the dev-tools.toml `cargo install --force` analogue).
[component.fix]
kind = "script"
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
# Meta-owned toolchain + prefix (Epic H TASK-0069). See install.
M="${META_ROOT:?META_ROOT required}"
export CARGO_HOME="$M/.toolchains/cargo"
META_BIN="$M/usr/bin"
export PATH="$M/.toolchains/cargo/bin:$META_BIN:$META_ROOT/usr/bin:$PATH"
DEST="$M/usr/libexec/envctl/secrets/bin"
# Resolve the workspace root (override -> meta layout; sentinel-validated). See install.
repo="${ENVCTL_SOURCE_ROOT:-$META_ROOT/src/envctl}"
test -d "${repo:-/nonexistent}/crates/secretd" || { echo "FATAL: envctl workspace not found (set ENVCTL_SOURCE_ROOT)"; exit 1; }
# Rebuild WITH seed-factor (see install note): a plain rebuild would drop the USB unlock factor.
cargo build --release --manifest-path "$repo/Cargo.toml" -p envctl-secretd --features seed-factor
cargo build --release --manifest-path "$repo/Cargo.toml" -p envctl-secretctl
install -Dm755 "$repo/target/release/secretd"   "$DEST/secretd"
install -Dm755 "$repo/target/release/secretctl" "$DEST/secretctl"
install -d -m755 "$META_BIN"
envctl_frontdoor "$DEST/secretd"   "$META_BIN/secretd"
envctl_frontdoor "$DEST/secretctl" "$META_BIN/secretctl"

cleanup_legacy_cargo_bin() {
  b="$1"
  legacy="$META_ROOT/.toolchains/cargo/bin/$b"
  owned="$DEST/$b"
  [ -e "$legacy" ] || return 0
  # If an old symlink already points at the new meta-local binary, remove the duplicate link.
  if [ -L "$legacy" ] && [ "$(readlink -f "$legacy" 2>/dev/null)" = "$(readlink -f "$owned" 2>/dev/null)" ]; then
    rm -f "$legacy"
    echo "removed legacy cargo-bin symlink: $legacy"
    return 0
  fi
  # If the old regular file is byte-identical to the just-installed meta binary, archive it.
  # Different/foreign binaries are left in place and surfaced by verify; strict upgrade-only means
  # never deleting an unproven executable.
  if [ -f "$legacy" ] && [ -f "$owned" ] && cmp -s "$legacy" "$owned"; then
    arch="$META_ROOT/var/lib/envctl/legacy-archives/$(date -u +%Y%m%dT%H%M%SZ)/.cargo/bin"
    install -d -m700 "$arch"
    mv "$legacy" "$arch/$b"
    echo "archived legacy cargo-bin copy: $legacy -> $arch/$b"
  elif [ -e "$legacy" ]; then
    echo "WARNING: legacy cargo-bin $legacy differs from $owned; left in place (strict upgrade-only)"
  fi
}
cleanup_legacy_cargo_bin secretd
cleanup_legacy_cargo_bin secretctl

# Re-assert the durable store config idempotently (write only if absent; operator edits preserved).
install -d -m700 "$META_ROOT/.config/env-ctl"
cfg="$META_ROOT/.config/env-ctl/secretd.toml"
if [ ! -f "$cfg" ]; then
  cat > "$cfg" <<'TOML'
[store]
backend = "libsql"
url = "http://127.0.0.1:8080"
TOML
  chmod 0600 "$cfg"
fi

# REMOVE: fail-closed stop + drop bins; generic wiring drops the unit. The vault is data_paths and
# is touched ONLY on --purge.
'''
[component.remove]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
# The executor runs this hook before generic revert_wiring. Stop first and
# propagate failure so a live daemon can never outlive binaries deleted below.
# Generic revert owns bridge/canonical-unit removal and daemon-reload.
systemctl --user disable --now env-ctl.service
# Self-guarded: drop only managed regular wrappers or legacy symlinks that resolve to the
# canonical meta-local install, then remove the canonical private binaries. Legacy
# .toolchains binaries are strict-upgrade fallbacks and are never removed here.
meta_frontdoor_is_managed() {
  front="$1"
  private="$2"
  private_real="$(readlink -f "$private" 2>/dev/null || true)"
  if [ -L "$front" ] && [ -n "$private_real" ] && [ "$(readlink -f "$front" 2>/dev/null || true)" = "$private_real" ]; then
    return 0
  fi
  [ -f "$front" ] && grep -Fqx "exec \"$private\" \"\$@\"" "$front"
}
for b in secretd secretctl; do
  private="$M/usr/libexec/envctl/secrets/bin/$b"
  meta_link="$M/usr/bin/$b"
  host_link="$META_ROOT/usr/bin/$b"
  if meta_frontdoor_is_managed "$host_link" "$private"; then rm -f "$host_link"; fi
  if [ "$meta_link" != "$host_link" ] && meta_frontdoor_is_managed "$meta_link" "$private"; then rm -f "$meta_link"; fi
done
rm -f "$M/usr/libexec/envctl/secrets/bin/secretd" "$M/usr/libexec/envctl/secrets/bin/secretctl"
# vault.db / ca/ / audit are data_paths+config_paths below — envctl deletes them ONLY with --purge,
# after a UUID re-verify. remove() never touches user data (THREAT-MODEL: user data is never touched).
'''

# ---- WIRING (engine-owned, reversible: backup-then-excise on reset; see engine/src/wiring.rs) ----
[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]

[[component.wiring.shell_rc]]
file = "$META_ROOT/.bashrc"
marker = "env-ctl"     # engine writes "BEGIN env-ctl (added by envctl)" / "END env-ctl" guard lines
# SOCKET NAME FIX: the real control socket is `secretd.sock` (Paths::control_socket()), NOT
# `control.sock`. The old name pointed secretctl at a path the daemon never binds, so every
# round-trip failed "is secretd running?" even with a healthy daemon.
content = '''
export SECRETCTL_SOCK="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/env-ctl/secretd.sock"
'''

[[component.wiring.systemd_user]]
name = "env-ctl.service"
enable = true           # Phase 6 landed: secretd serves + answers --self-check (CI-asserted invariant).
content = '''
[Unit]
Description=env-ctl secrets vault + credential broker
Documentation=https://github.com/FlexNetOS/envctl/blob/master/docs/ARCHITECTURE.md
# No network ordering for the control/data planes (UDS + loopback). Only the relay HTTPS
# edge needs the network, and that is operator-enabled, not a startup dependency.
After=default.target
# Durable-store ownership is strict: secretd must never report ready against an in-memory fallback
# or outlive the envctl-owned loopback sqld. `After` orders startup, `Requires` pulls sqld in, and
# `BindsTo` + `After` stop secretd when sqld becomes inactive. Type=notify below keeps this unit in
# "activating" until build_engine has authenticated to sqld and provisioned the schema.
Requires=sqld.service
BindsTo=sqld.service
After=sqld.service
# Refuse before ExecStart when either half of the managed JWT pair is missing. Ownership/mode are
# checked again by secretd when it reads the client token and by sqld when it reads the public key.
ConditionPathExists="${META_ROOT}/.config/sqld/auth-jwt-key.pem"
ConditionPathExists="${META_ROOT}/.config/sqld/client.jwt"

[Service]
Type=notify
NotifyAccess=main
# Meta-local binary (Epic H TASK-0069). The engine resolves the explicit
# ${META_ROOT} token when it materializes this user unit.
ExecStart="${META_ROOT}/usr/libexec/envctl/secrets/bin/secretd"
# Cognitum Seed Device-CA pin lives under the meta-local share prefix, NOT /usr/local (TASK-0075b,
# no-system-depth doctrine). seam.rs `ca_path()` reads ENVCTL_SEED_CA; cognitum-seed-trust pins here.
Environment="ENVCTL_SEED_CA=${META_ROOT}/etc/envctl/secrets/ca/cognitum-ca.crt"
Environment="META_ROOT=${META_ROOT}"
Environment="XDG_CONFIG_HOME=${META_ROOT}/.config"
Environment="XDG_DATA_HOME=${META_ROOT}/var/lib"
Environment="XDG_STATE_HOME=${META_ROOT}/var/lib"
# Pin the system service to the envctl-owned durable store. Environment precedence intentionally
# overrides an operator's stale `inmem`/alternate-URL TOML so READY=1 proves authenticated access to
# this unit's required sqld.service, not merely that the control socket bound successfully.
Environment="SECRETD_STORE_BACKEND=libsql"
Environment="SECRETD_LIBSQL_URL=http://127.0.0.1:8080"
Environment="SECRETD_LIBSQL_AUTH_TOKEN_FILE=${META_ROOT}/.config/sqld/client.jwt"
Restart=on-failure
RestartSec=10
# Bound the Type=notify readiness proof: a missing/unhealthy/auth-incompatible sqld fails startup
# instead of leaving secretd in an unbounded activating state.
TimeoutStartSec=60
# Fail-closed memory hygiene is enforced IN secretd (mlockall + RLIMIT_CORE=0 + MADV_DONTDUMP;
# the daemon refuses to start if mlockall fails — FS-S4). The unit only RAISES the ceiling the
# daemon needs; it never substitutes for the in-process refusal.
LimitMEMLOCK=infinity
LimitCORE=0
# Defense-in-depth sandbox (does not weaken the in-process TCB story):
NoNewPrivileges=true
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths="${META_ROOT}/var/lib/env-ctl" "${META_ROOT}/var/lib/env-ctl" %t/env-ctl
# Belt-and-suspenders read access to the Seed Device-CA dir (TASK-0075b). NOT ReadWritePaths — the
# daemon must never overwrite its trust root; survives any future ProtectHome=tmpfs hardening.
ReadOnlyPaths="${META_ROOT}/etc/envctl/secrets/ca"
ReadOnlyPaths="${META_ROOT}/.config/sqld/client.jwt"
RuntimeDirectory=env-ctl
RuntimeDirectoryMode=0700
PrivateTmp=true
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true
# Pulling the enrolled USB auto-relocks within the drain grace; stop must allow the daemon to
# drain in-flight relays/streams.
TimeoutStopSec=30
KillMode=mixed

[Install]
WantedBy=default.target
'''

# ---- VAULT DATA: deleted ONLY by `envctl reset env-ctl --purge` (after UUID re-verify) ----
[[component.wiring.data_paths]]
path = "$META_ROOT/var/lib/env-ctl"   # vault.db (0600), ca/ (local CA private material)
[[component.wiring.data_paths]]
path = "$META_ROOT/var/lib/env-ctl"   # secretd.log, durable hash-chained audit mirror

# ---- CONFIG: kept with `--keep-config`, else engine-removed on reset ----
# This is where docs/ops/08's secretd.toml store-backend selection lives; auth tokens are NEVER
# stored here.
[[component.wiring.config_paths]]
path = "$META_ROOT/.config/env-ctl"

# ---- GUARD: USB/storage PARTUUID pre-filter on destructive phases. This is a fast pre-flight ----
# ---- ONLY; the daemon proves keyfile POSSESSION cryptographically (REQ-SEC-3, FS-S9). ----
[[component.guards]]
kind = "hook_succeeds"
[component.guards.hook]
kind = "command"
command = "bash"
args = ["-lc", "lsblk -dno PARTUUID | grep -q . || { echo 'FATAL: no PARTUUID storage for USB keyslot pre-filter'; exit 1; }"]
