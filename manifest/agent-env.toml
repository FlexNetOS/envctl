# agent-env.toml — the AI-agent environment layer.
#
# The agent-env layer is the declarative + idempotent + content-locked twin of envctl, one layer
# up — it manages the agent's own toolkit (skills + MCP baseline) instead of the OS toolchain.
# This component wires it INTO envctl's component system so a green box also has its agent
# environment provisioned and locked, surfaced under the same `doctor`/`auto-detect`.
#
# RETIRED external `kasetto` binary (TASK-0018, Epic C): kasetto v3.2.0 is now ABSORBED into envctl
# (`crates/agent-env` + `Engine::agent_*`), so this component drives the BUILT-IN `envctl agent`
# verbs — no `cargo install kasetto`, no external binary, no `rustup` requirement just for this layer.
#
#   detect : the owned private envctl payload + an agent-env config exist.
#   verify : the exact owned payload runs `agent lock --scope project --check --locked`.
#   install/fix : that payload runs `agent sync --scope project --apply`.
#   remove : that payload runs `agent clean --scope project --apply`.
# The explicit dependency chain makes Yazelix's one-profile Nu/RTK route the only runtime
# foundation before agent assets are checked or rendered; no hook resolves ambient PATH.
#
# NOTE: `agent-env.yaml`/`agent-env.lock` are the absorbed envctl-agent filenames. The retired
# `kasetto.yaml`/`kasetto.lock` names are historical only (TASK-0040).
# TASK-0016 decision: keep `agent-env.lock` as the standalone SHA-256 agent-asset lock; the
# component lock remains `manifest/envctl.lock` with its existing FNV-1a component hashes.

[[component]]
id = "kasetto"
name = "agent-env toolkit (envctl agent — kasetto v3.2.0 absorbed)"
description = "Declarative AI-agent environment layer; provisions the skills + MCP baseline from agent-env.yaml via the exact meta-owned envctl-cli payload. verify = zero-network project-scope lock check; ambient PATH generations are never used. External kasetto binary retired (TASK-0018)."
requires = ["envctl-cli", "yazelix", "rtk", "codex-global-baseline"]
[component.detect]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ENVCTL="$M/usr/libexec/envctl/cli/bin/envctl"
[ -f "$ENVCTL" ] && [ -x "$ENVCTL" ] && [ ! -L "$ENVCTL" ] && [ -f agent-env.yaml ]
'''
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ENVCTL="$M/usr/libexec/envctl/cli/bin/envctl"
[ -f "$ENVCTL" ] && [ -x "$ENVCTL" ] && [ ! -L "$ENVCTL" ]
"$ENVCTL" agent sync --config agent-env.yaml --scope project --apply
'''
[component.verify]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ENVCTL="$M/usr/libexec/envctl/cli/bin/envctl"
[ -f "$ENVCTL" ] && [ -x "$ENVCTL" ] && [ ! -L "$ENVCTL" ]
"$ENVCTL" agent lock --config agent-env.yaml --scope project --check --locked
'''
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ENVCTL="$M/usr/libexec/envctl/cli/bin/envctl"
[ -f "$ENVCTL" ] && [ -x "$ENVCTL" ] && [ ! -L "$ENVCTL" ]
"$ENVCTL" agent sync --config agent-env.yaml --scope project --apply
'''
[component.remove]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
ENVCTL="$M/usr/libexec/envctl/cli/bin/envctl"
[ -f "$ENVCTL" ] && [ -x "$ENVCTL" ] && [ ! -L "$ENVCTL" ]
"$ENVCTL" agent clean --scope project --apply
'''
