# agent-env.toml — the AI-agent environment layer.
#
# The agent-env layer is the declarative + idempotent + content-locked twin of envctl, one layer
# up — it manages the agent's own toolkit (skills + MCP baseline) instead of the OS toolchain.
# This component wires it INTO envctl's component system so a green box also has its agent
# environment provisioned and locked, surfaced under the same `doctor`/`auto-detect`.
#
# RETIRED external `kasetto` binary (TASK-0018, Epic C): kasetto v3.2.0 is now ABSORBED into envctl
# (`crates/agent-env` + `Engine::agent_*`), so this component drives the BUILT-IN `envctl agent`
# verbs — no `cargo install kasetto`, no external binary, no `rustup` requirement just for this layer.
#
#   detect : envctl present + an agent-env config exists (the agent engine is built into envctl).
#   verify : `envctl agent lock --config agent-env.yaml --check --locked` proves lock drift closed.
#   install/fix : `envctl agent sync --config agent-env.yaml --apply` (provision/refresh .claude/.codex).
#   remove : `envctl agent clean --scope project --apply` (unprovision the installed skills/MCPs).
#
# NOTE: `agent-env.yaml`/`agent-env.lock` are the absorbed envctl-agent filenames. The retired
# `kasetto.yaml`/`kasetto.lock` names are historical only (TASK-0040).
# TASK-0016 decision: keep `agent-env.lock` as the standalone SHA-256 agent-asset lock; the
# component lock remains `manifest/envctl.lock` with its existing FNV-1a component hashes.

[[component]]
id = "kasetto"
name = "agent-env toolkit (envctl agent — kasetto v3.2.0 absorbed)"
description = "Declarative AI-agent environment layer; provisions the skills + MCP baseline from agent-env.yaml into .claude/.codex via the built-in `envctl agent` (kasetto v3.2.0 absorbed). detect = envctl present + config; verify = zero-network `envctl agent lock --config agent-env.yaml --check --locked`. External kasetto binary retired (TASK-0018)."
requires = []
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v envctl >/dev/null 2>&1 && [ -f agent-env.yaml ]"]
[component.install]
kind = "script"
script = '''
export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
envctl agent sync --config agent-env.yaml --apply
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$PATH\"; envctl agent lock --config agent-env.yaml --check --locked"]
[component.fix]
kind = "script"
script = '''
export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
envctl agent sync --config agent-env.yaml --apply
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$PATH\"; envctl agent clean --scope project --apply"]
