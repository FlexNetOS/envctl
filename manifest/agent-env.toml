# agent-env.toml — the AI-agent environment layer.
#
# The agent-env layer is the declarative + idempotent + content-locked twin of envctl, one layer
# up — it manages the agent's own toolkit (skills + MCP baseline) instead of the OS toolchain.
# This component wires it INTO envctl's component system so a green box also has its agent
# environment provisioned and locked, surfaced under the same `doctor`/`auto-detect`.
#
# RETIRED external `kasetto` binary (TASK-0018, Epic C): kasetto v3.2.0 is now ABSORBED into envctl
# (`crates/agent-env` + `Engine::agent_*`), so this component drives the BUILT-IN `envctl agent`
# verbs — no `cargo install kasetto`, no external binary, no `rustup` requirement just for this layer.
#
#   detect : envctl present + an agent-env config exists (the agent engine is built into envctl).
#   verify : `envctl agent sync --config kasetto.yaml --locked` — zero-network drift gate against
#            the committed agent-env.lock (kasetto's old `sync --locked` verify, now envctl-native).
#   install/fix : `envctl agent sync --config kasetto.yaml --apply` (provision/refresh .claude/.codex).
#   remove : `envctl agent clean --scope project --apply` (unprovision the installed skills/MCPs).
#
# NOTE: commands pass `--config kasetto.yaml` explicitly — `envctl agent` defaults to
# `agent-env.yaml`, but this repo's project config is `kasetto.yaml` (scope: project). The
# committed `agent-env.lock` (skills + all 7 MCP baseline servers) is what `--locked` verifies.
# (The earlier `github`-MCP lock-drop that forced a weaker verify is FIXED — rebuild_lock now
# records MCP assets; `agent-env.lock` is committed and `sync --locked` is clean end-to-end.)

[[component]]
id = "kasetto"
name = "agent-env toolkit (envctl agent — kasetto v3.2.0 absorbed)"
description = "Declarative AI-agent environment layer; provisions the skills + MCP baseline from kasetto.yaml into .claude/.codex via the built-in `envctl agent` (kasetto v3.2.0 absorbed). detect = envctl present + config; verify = `envctl agent sync --config kasetto.yaml --locked` (zero-network drift gate vs agent-env.lock). External kasetto binary retired (TASK-0018)."
requires = []
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v envctl >/dev/null 2>&1 && { [ -f agent-env.yaml ] || [ -f kasetto.yaml ]; }"]
[component.install]
kind = "script"
script = '''
export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
envctl agent sync --config kasetto.yaml --apply
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$PATH\"; envctl agent sync --config kasetto.yaml --locked"]
[component.fix]
kind = "script"
script = '''
export PATH="$HOME/.cargo/bin:$HOME/.local/bin:$PATH"
envctl agent sync --config kasetto.yaml --apply
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$HOME/.local/bin:$PATH\"; envctl agent clean --scope project --apply"]
