# manifest/cognitum-seed-trust.toml — Cognitum Seed Device-CA auto-refresh.
#
# WHY THIS EXISTS
# secretd's USB-unlock factor validates the Seed's TLS strictly against a pinned Cognitum Device
# CA at ${META_ROOT:-$HOME/Desktop/meta}/.toolchains/secrets/ca/cognitum-ca.crt (the meta path the
# secretd unit sets via ENVCTL_SEED_CA; crates/secrets-engine/src/seam.rs `ca_path()` honors that
# env override). When the Seed rotates its Device CA, the host pin goes stale, the
# TLS handshake fails fail-closed and SILENT, custody/sign fails, usb_possessed=false, and
# `secretctl unlock` returns the no-oracle generic `unlock failed` (EngineError::UnlockFailed).
# The owner has hand-re-pinned several times via the USB's trust/install-trust.sh. This component
# codifies that: re-pin from the physically-present USB anchor automatically.
# Possession-rooted, additive, absent-Seed = clean no-op (exit 0).
#
# CANONICAL OPERATION (what install-trust.sh did, now relocated to the meta path):
#   cp <COGNITUM mount>/trust/cognitum-ca.pem \
#      ${META_ROOT:-$HOME/Desktop/meta}/.toolchains/secrets/ca/cognitum-ca.crt
#   update-ca-certificates   # (best-effort; the daemon pins the meta path directly via ENVCTL_SEED_CA)
#
# DESIGN
# A self-healing worker (/usr/local/sbin/cognitum-seed-trust-refresh) that locates the COGNITUM
# USB trust anchor, and re-pins ONLY when the pin differs from the anchor (idempotent). It runs on
# boot (systemd oneshot) and on every Seed hotplug (udev rule keyed on the same cdc_ncm NIC trigger
# as cognitum-seed-net). Absent Seed => clean no-op. Root-owned artifacts under /etc + /usr/local,
# so every action phase is `needs_sudo`.
#
# DETECT == "artifacts present" (the install predicate). NOT "Seed reachable" — the Seed may be
# unplugged, which is healthy. So drift never nudges a needless reinstall when the box is fine.
#
# NO-SYSTEM-DEPTH NOTE: this pins to the meta toolchains prefix
# (${META_ROOT:-$HOME/Desktop/meta}/.toolchains/secrets/ca/cognitum-ca.crt), NOT /usr/local. The
# secretd unit sets ENVCTL_SEED_CA to that path (manifest/env-ctl.toml), so the daemon's
# seam.rs `ca_path()` reads the pin from meta. The relocation off the system-depth /usr/local path
# is DONE (this IS TASK-0075b) — it is no longer tracked as a follow-up. The worker still honors an
# explicit ENVCTL_SEED_CA override and auto-creates the …/ca/ dir.
#
# RELATION TO cognitum-seed-net.toml: that sibling provides the host-side link-local addressing for
# the Seed custody API; this one keeps the pinned Device CA fresh. Both are optional, possession-
# rooted, additive, and absent-Seed no-ops (no hard `requires` link).

[[component]]
id = "cognitum-seed-trust"
name = "Cognitum Seed Device-CA auto-refresh"
description = "Auto-refreshes the pinned Cognitum Device CA (the meta path ${META_ROOT:-$HOME/Desktop/meta}/.toolchains/secrets/ca/cognitum-ca.crt that secretd reads via ENVCTL_SEED_CA) from the USB trust anchor (COGNITUM/trust/cognitum-ca.pem) on boot + Seed hotplug, so the vault USB-unlock factor keeps working across Seed CA rotation. Additive; never removes other CAs; absent Seed = no-op."
requires = []
destructive = false

[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "test -x /usr/local/sbin/cognitum-seed-trust-refresh && test -f /etc/systemd/system/cognitum-seed-trust.service && test -f /etc/udev/rules.d/99-cognitum-seed-trust.rules"]

# INSTALL: write the self-healing worker + oneshot unit + udev rule, reload udev/systemd, enable
# for boot, and re-pin now. Idempotent.
[component.install]
kind = "script"
needs_sudo = true
script = '''
set -euo pipefail

install -d -m755 /usr/local/sbin
cat > /usr/local/sbin/cognitum-seed-trust-refresh <<'WORKER'
#!/usr/bin/env bash
# cognitum-seed-trust-refresh — re-pin the secretd Device CA from the COGNITUM USB trust anchor.
# Idempotent (re-pins only on diff); exits 0 when the Seed/anchor is absent.
set -euo pipefail

# Locate the Cognitum trust anchor (honor COGNITUM_TRUST_DIR override first).
if [ -n "${COGNITUM_TRUST_DIR:-}" ] && [ -d "$COGNITUM_TRUST_DIR" ]; then
  TRUST_DIR="$COGNITUM_TRUST_DIR"
else
  TRUST_DIR=""
  for d in /run/media/"${USER:-}"/COGNITUM/trust /run/media/*/COGNITUM/trust /media/*/COGNITUM/trust; do
    if [ -d "$d" ] && [ -f "$d/cognitum-ca.pem" ]; then TRUST_DIR="$d"; break; fi
  done
fi

if [ -z "${TRUST_DIR:-}" ]; then
  echo "cognitum-seed-trust: no Cognitum trust anchor present (no-op)"; exit 0
fi

SRC="$TRUST_DIR/cognitum-ca.pem"
DST="${ENVCTL_SEED_CA:-${META_ROOT:-$HOME/Desktop/meta}/.toolchains/secrets/ca/cognitum-ca.crt}"

if cmp -s "$SRC" "$DST"; then
  echo "cognitum-seed-trust: pin already current (no-op)"; exit 0
fi

install -d -m755 "$(dirname "$DST")"
cp "$SRC" "$DST"
command -v update-ca-certificates >/dev/null 2>&1 && update-ca-certificates >/dev/null 2>&1 || true
echo "cognitum-seed-trust: re-pinned Device CA from $TRUST_DIR"
exit 0
WORKER
chmod 0755 /usr/local/sbin/cognitum-seed-trust-refresh

cat > /etc/systemd/system/cognitum-seed-trust.service <<'UNIT'
[Unit]
Description=Cognitum Seed Device CA auto-refresh (envctl secretd USB-unlock factor)
Documentation=https://github.com/FlexNetOS/envctl/blob/main/manifest/cognitum-seed-trust.toml
After=systemd-udevd.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/cognitum-seed-trust-refresh

[Install]
WantedBy=multi-user.target
UNIT

cat > /etc/udev/rules.d/99-cognitum-seed-trust.rules <<'RULE'
# When the Cognitum Seed USB-Ethernet (cdc_ncm) NIC appears, start the oneshot that re-pins the
# Device CA from the USB trust anchor (same trigger as cognitum-seed-linklocal).
ACTION=="add", SUBSYSTEM=="net", ENV{ID_NET_DRIVER}=="cdc_ncm", ENV{ID_MODEL}=="Cognitum_Seed", TAG+="systemd", ENV{SYSTEMD_WANTS}+="cognitum-seed-trust.service"
RULE

udevadm control --reload-rules || true
systemctl daemon-reload || true
systemctl enable cognitum-seed-trust.service || true
systemctl start cognitum-seed-trust.service || true
'''

# VERIFY: hard predicate = artifacts present (fail-closed). Best-effort probe: IF the USB trust
# anchor is present, byte-compare the pin against it — log only, NEVER fail (a stale/absent pin
# with the Seed unplugged is healthy).
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
test -x /usr/local/sbin/cognitum-seed-trust-refresh \
  && test -f /etc/systemd/system/cognitum-seed-trust.service \
  && test -f /etc/udev/rules.d/99-cognitum-seed-trust.rules || exit 1

if [ -n "${COGNITUM_TRUST_DIR:-}" ] && [ -d "$COGNITUM_TRUST_DIR" ]; then
  TRUST_DIR="$COGNITUM_TRUST_DIR"
else
  TRUST_DIR=""
  for d in /run/media/"${USER:-}"/COGNITUM/trust /run/media/*/COGNITUM/trust /media/*/COGNITUM/trust; do
    if [ -d "$d" ] && [ -f "$d/cognitum-ca.pem" ]; then TRUST_DIR="$d"; break; fi
  done
fi

if [ -z "${TRUST_DIR:-}" ]; then
  echo "pin probe: no Cognitum Seed anchor present (non-fatal; re-pin applies on hotplug)"; exit 0
fi

DST="${ENVCTL_SEED_CA:-${META_ROOT:-$HOME/Desktop/meta}/.toolchains/secrets/ca/cognitum-ca.crt}"
if cmp -s "$TRUST_DIR/cognitum-ca.pem" "$DST"; then
  echo "pin probe: Device CA pin MATCHES USB anchor (healthy)"
else
  echo "pin probe: Device CA pin STALE vs USB anchor (non-fatal; run fix to re-pin)"
fi
# Always exit 0 — the probe never fails verify.
exit 0
''']

# FIX: idempotent re-provision (rewrite artifacts, reload, re-enable, re-pin now).
[component.fix]
kind = "script"
needs_sudo = true
script = '''
set -euo pipefail

install -d -m755 /usr/local/sbin
cat > /usr/local/sbin/cognitum-seed-trust-refresh <<'WORKER'
