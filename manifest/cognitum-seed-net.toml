'''

# REMOVE: disable + drop the unit, udev rule, and worker; best-effort pull the secondary addr.
# Never touches the Seed device or any other network config (additive-only stays additive-only).
[component.remove]
kind = "script"
needs_sudo = true
script = '''
set -euo pipefail
systemctl disable --now cognitum-seed-linklocal.service 2>/dev/null || true
# Best-effort: remove the secondary addr we added, if a Seed NIC currently carries it.
for d in /sys/class/net/*/device/driver; do
  [ -e "$d" ] || continue
  [ "$(basename "$(readlink -f "$d")")" = "cdc_ncm" ] || continue
  ifc="$(basename "$(dirname "$(dirname "$d")")")"
  [ "$(udevadm info -q property -p "/sys/class/net/$ifc" 2>/dev/null | sed -n 's/^ID_MODEL=//p')" = "Cognitum_Seed" ] || continue
  ip addr del 169.254.42.2/24 dev "$ifc" 2>/dev/null || true
done
rm -f /usr/local/sbin/cognitum-seed-linklocal \
      /etc/systemd/system/cognitum-seed-linklocal.service \
      /etc/udev/rules.d/99-cognitum-seed-linklocal.rules
udevadm control --reload-rules || true
systemctl daemon-reload || true
'''
