# manifest/cognitum-seed-net.toml — host-side link-local addressing for the Cognitum Seed.
#
# WHY THIS EXISTS
# secretd proves the **USB unlock factor** (Profile S / seed-factor) by calling the Cognitum
# Seed's custody REST API at `https://169.254.42.1:8443/api/v1/custody/sign` over the Seed's
# **USB CDC-NCM Ethernet gadget** (driver `cdc_ncm`, `ID_MODEL=Cognitum_Seed`). It is NOT read
# from the Seed's mass-storage mount. That link needs a host IPv4 on `169.254.42.0/24`; without
# it, requests to `169.254.42.1` fall through to the default gateway and die, so the vault
# cannot USB-unlock — surfacing only as the no-oracle generic `unlock failed`
# (`EngineError::UnlockFailed`). Root-caused 2026-06-17.
#
# DESIGN: NM-OWNED PROFILE (durable) WITH AN ADDITIVE FALLBACK
# This box manages the Seed NIC with NetworkManager. A raw `ip addr add` is **flushed when NM
# bounces the link** (carrier cycle / autoconnect), so it does NOT survive — verified live. The
# durable mechanism is therefore an **NM-owned connection profile**: NM itself persists and
# reasserts `169.254.42.2/24` across carrier cycles, replug, and reboot, and it is the
# single-owner approach (no fighting NM). The profile sets `ipv4.never-default` so the Seed can
# never capture the default route. On a box where NM is NOT the active manager, the worker falls
# back to a non-destructive additive `ip addr add` (no interface claim, no route, no removal of
# other addresses). Either way the worker is self-healing: it runs on boot (systemd oneshot), on
# every Seed hotplug (udev rule), and at install/fix. Absent Seed ⇒ clean no-op (exit 0),
# mirroring env-ctl's "locked is healthy" stance.
#
# Root-owned artifacts under /etc + /usr/local/sbin, so every action phase is `needs_sudo`.
#
# NETWORK GOVERNANCE: this box configures the network from several owners (envctl, lane,
# network-control, NetworkManager/netplan, host settings). Owning the Seed link via an NM profile
# is the least-conflicting choice on an NM-managed box; a broader single-source-of-truth
# consolidation across those managers is tracked as separate follow-up work.
#
# RELATION TO env-ctl.toml: the USB unlock factor depends on this addressing AND on secretd being
# built `--features seed-factor` (env-ctl.toml). The passphrase factor needs neither, so this is
# an optional, separate component (no hard `requires` link).

[[component]]
id = "cognitum-seed-net"
name = "Cognitum Seed USB link-local addressing"
description = "Ensures host-side 169.254.42.2/24 on the Cognitum Seed's cdc_ncm USB NIC so secretd can reach the Seed custody API (169.254.42.1:8443) for the USB unlock factor. Durable via an NM-owned connection profile (additive ip-addr fallback when NM is absent); never sets a default route or removes other addresses."
requires = []
destructive = false

# DETECT == "artifacts present" (the install predicate). NOT "Seed reachable" — the Seed may be
# unplugged, which is healthy. So drift never nudges a needless reinstall when the box is fine.
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "test -x /usr/local/sbin/cognitum-seed-linklocal && test -f /etc/systemd/system/cognitum-seed-linklocal.service && test -f /etc/udev/rules.d/99-cognitum-seed-linklocal.rules"]

# INSTALL: write the self-healing worker + unit + udev rule, reload udev/systemd, enable for boot,
# apply now (which establishes the NM profile if a Seed is present). Idempotent.
[component.install]
kind = "script"
needs_sudo = true
script = '''
set -euo pipefail

install -d -m755 /usr/local/sbin
cat > /usr/local/sbin/cognitum-seed-linklocal <<'WORKER'
#!/usr/bin/env bash
# cognitum-seed-linklocal — ensure host-side 169.254.42.2/24 on the Cognitum Seed cdc_ncm NIC so
# secretd can reach the Seed custody API (169.254.42.1:8443) for the USB unlock factor.
#   * NetworkManager active -> ensure an NM-OWNED connection profile (NM persists + reasserts the
#     addr across carrier cycles + reboot; a raw `ip addr add` would be flushed). never-default.
#   * else -> additive `ip addr add` (no interface claim, no route, no removal of other addrs).
# Idempotent; exits 0 when the Seed is absent.
set -euo pipefail
ADDR="${COGNITUM_SEED_HOST_ADDR:-169.254.42.2/24}"
CON="cognitum-seed-linklocal"
seed_ifc=""
for d in /sys/class/net/*/device/driver; do
  [ -e "$d" ] || continue
  [ "$(basename "$(readlink -f "$d")")" = "cdc_ncm" ] || continue
  ifc="$(basename "$(dirname "$(dirname "$d")")")"
  [ "$(udevadm info -q property -p "/sys/class/net/$ifc" 2>/dev/null | sed -n 's/^ID_MODEL=//p')" = "Cognitum_Seed" ] && { seed_ifc="$ifc"; break; }
done
if [ -z "$seed_ifc" ]; then
  echo "cognitum-seed-linklocal: no Cognitum Seed cdc_ncm interface present (no-op)"; exit 0
fi
if command -v nmcli >/dev/null 2>&1 && systemctl is-active --quiet NetworkManager 2>/dev/null; then
  if nmcli -g connection.id connection show "$CON" >/dev/null 2>&1; then
    nmcli connection modify "$CON" connection.interface-name "$seed_ifc" \
      ipv4.method manual ipv4.addresses "$ADDR" ipv4.never-default yes \
      ipv6.method link-local connection.autoconnect yes >/dev/null 2>&1 || true
  else
    nmcli connection add type ethernet ifname "$seed_ifc" con-name "$CON" \
      ipv4.method manual ipv4.addresses "$ADDR" ipv4.never-default yes \
      ipv6.method link-local connection.autoconnect yes >/dev/null 2>&1 || true
  fi
  nmcli connection up "$CON" >/dev/null 2>&1 || true
  echo "cognitum-seed-linklocal: NM profile '$CON' active on $seed_ifc"
else
  ip link set "$seed_ifc" up 2>/dev/null || true
  if ip -4 addr show dev "$seed_ifc" 2>/dev/null | grep -qw "${ADDR%%/*}"; then
    echo "cognitum-seed-linklocal: ${ADDR%%/*} already on $seed_ifc"
  else
    ip addr add "$ADDR" dev "$seed_ifc" && echo "cognitum-seed-linklocal: added $ADDR to $seed_ifc"
  fi
fi
exit 0
WORKER
chmod 0755 /usr/local/sbin/cognitum-seed-linklocal

cat > /etc/systemd/system/cognitum-seed-linklocal.service <<'UNIT'
[Unit]
Description=Cognitum Seed USB link-local host addressing (envctl secretd USB-unlock factor)
Documentation=https://github.com/FlexNetOS/envctl/blob/main/manifest/cognitum-seed-net.toml
After=systemd-udevd.service NetworkManager.service
Wants=NetworkManager.service

[Service]
Type=oneshot
ExecStart=/usr/local/sbin/cognitum-seed-linklocal

[Install]
WantedBy=multi-user.target
UNIT

cat > /etc/udev/rules.d/99-cognitum-seed-linklocal.rules <<'RULE'
# When the Cognitum Seed USB-Ethernet (cdc_ncm) NIC appears, start the oneshot that ensures the
# host-side 169.254.42.0/24 link-local addressing (NM profile, or additive ip-addr fallback).
ACTION=="add", SUBSYSTEM=="net", ENV{ID_NET_DRIVER}=="cdc_ncm", ENV{ID_MODEL}=="Cognitum_Seed", TAG+="systemd", ENV{SYSTEMD_WANTS}+="cognitum-seed-linklocal.service"
RULE

udevadm control --reload-rules || true
systemctl daemon-reload || true
systemctl enable cognitum-seed-linklocal.service || true
systemctl start cognitum-seed-linklocal.service || true
'''

# VERIFY: hard predicate = artifacts present (fail-closed). Best-effort serving probe: IF a
# Cognitum Seed cdc_ncm NIC is present, confirm the host addr is assigned and the custody port
# answers — log only, NEVER fail verify (the Seed may be unplugged, which is healthy).
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", '''
test -x /usr/local/sbin/cognitum-seed-linklocal \
  && test -f /etc/systemd/system/cognitum-seed-linklocal.service \
  && test -f /etc/udev/rules.d/99-cognitum-seed-linklocal.rules || exit 1
seed_ifc=""
for d in /sys/class/net/*/device/driver; do
  [ -e "$d" ] || continue
  [ "$(basename "$(readlink -f "$d")")" = "cdc_ncm" ] || continue
  ifc="$(basename "$(dirname "$(dirname "$d")")")"
  [ "$(udevadm info -q property -p "/sys/class/net/$ifc" 2>/dev/null | sed -n 's/^ID_MODEL=//p')" = "Cognitum_Seed" ] && { seed_ifc="$ifc"; break; }
done
if [ -z "$seed_ifc" ]; then
  echo "serving probe: no Cognitum Seed plugged (non-fatal; addressing applies on hotplug)"
  exit 0
fi
if ip -4 addr show dev "$seed_ifc" 2>/dev/null | grep -qw 169.254.42.2; then
  echo "serving probe: 169.254.42.2 present on $seed_ifc"
else
  echo "serving probe: Seed on $seed_ifc but 169.254.42.2 NOT assigned (non-fatal; run fix)"
fi
if timeout 5 bash -c "cat < /dev/null > /dev/tcp/169.254.42.1/8443" 2>/dev/null; then
  echo "serving probe: Seed custody API 169.254.42.1:8443 reachable (healthy)"
else
  echo "serving probe: 169.254.42.1:8443 not reachable (non-fatal; Seed may be booting/unpaired)"
fi
exit 0
''']

