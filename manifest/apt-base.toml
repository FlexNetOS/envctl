# OS-install apt base (autoinstall.yaml). These are installed at OS-install time;
# modeled here so auto-detect reports them and so components that depend on them
# (yazelix→ghostty, nvidia-container-toolkit→podman) have valid `requires` edges.

[[component]]
id = "ghostty"
name = "Ghostty terminal"
description = "Default terminal emulator; yazelix's batteries-included variant."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v ghostty"]
[component.install]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "-y", "ghostty"]
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "ghostty --version"]


[[component]]
id = "podman"
name = "Podman (rootless containers)"
description = "Rootless container stack from the static podman release, installed under $META_ROOT/.toolchains/podman. No wrapper: $META_ROOT/.local/bin/podman is a direct symlink to the meta-hosted podman binary; helper binaries and containers config are also meta-hosted."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/podman/usr/local/bin/podman\" ] && [ \"$(readlink -f \"$META_ROOT/.local/bin/podman\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/podman/usr/local/bin/podman\")\" ]"]
[component.install]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/podman"
VER="${PODMAN_STATIC_VERSION:-v5.8.3}"
ARCH="$(uname -m)"; case "$ARCH" in x86_64) A=amd64;; aarch64) A=arm64;; *) echo "unsupported arch: $ARCH"; exit 1;; esac
URL="https://github.com/mgoltzsche/podman-static/releases/download/$VER/podman-linux-$A.tar.gz"
cache="$M/.cache/podman"; install -d -m 755 "$cache"
tarball="$cache/podman-linux-$A-$VER.tar.gz"
[ -s "$tarball" ] || curl -fSL "$URL" -o "$tarball"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
tar -xzf "$tarball" -C "$tmp"
rm -rf "$DEST"; install -d -m 755 "$DEST"
cp -a "$tmp/podman-linux-$A/." "$DEST/"

# Relocated, meta-hosted config. The podman binary is direct; config is read via
# normal XDG/user config symlinks, not a launcher wrapper.
install -d -m 755 "$DEST/etc/containers" "$META_ROOT/.config/containers" "$META_ROOT/.local/bin"
cat > "$DEST/etc/containers/containers.conf" <<EOF
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
conmon_path = ["$DEST/usr/local/lib/podman/conmon"]
helper_binaries_dir = ["$DEST/usr/local/lib/podman", "$DEST/usr/local/libexec/podman", "$DEST/usr/local/bin"]
network_cmd_path = "$DEST/usr/local/bin/pasta"
runtime = "crun"

[engine.runtimes]
crun = ["$DEST/usr/local/bin/crun"]
runc = ["$DEST/usr/local/bin/runc"]
EOF
cat > "$DEST/etc/containers/storage.conf" <<EOF
[storage]
driver = "overlay"
runroot = "$M/.toolchains/podman/runroot"
graphroot = "$M/.toolchains/podman/graphroot"
rootless_storage_path = "$M/.toolchains/podman/rootless-storage"

[storage.options.overlay]
ignore_chown_errors = "true"
mount_program = "$DEST/usr/local/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
EOF
for f in containers.conf storage.conf registries.conf policy.json; do
  [ -f "$DEST/etc/containers/$f" ] && ln -sfn "$DEST/etc/containers/$f" "$META_ROOT/.config/containers/$f"
done
ln -sfn "$DEST/usr/local/bin/podman" "$META_ROOT/.local/bin/podman"
for b in crun runc fuse-overlayfs fusermount3 pasta; do
  [ -x "$DEST/usr/local/bin/$b" ] && ln -sfn "$DEST/usr/local/bin/$b" "$META_ROOT/.local/bin/$b"
done
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; export PATH=\"$META_ROOT/.local/bin:$PATH\"; [ \"$(readlink -f \"$(command -v podman)\" 2>/dev/null)\" = \"$(readlink -f \"$M/.toolchains/podman/usr/local/bin/podman\")\" ] && podman --version | grep -q '5\\.8\\.3' && podman info --format '{{.Host.Conmon.Path}} {{.Host.OCIRuntime.Path}}' | grep -q \"$M/.toolchains/podman\""]
[component.fix]
kind = "script"
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/podman"
VER="${PODMAN_STATIC_VERSION:-v5.8.3}"
ARCH="$(uname -m)"; case "$ARCH" in x86_64) A=amd64;; aarch64) A=arm64;; *) echo "unsupported arch: $ARCH"; exit 1;; esac
URL="https://github.com/mgoltzsche/podman-static/releases/download/$VER/podman-linux-$A.tar.gz"
cache="$M/.cache/podman"; install -d -m 755 "$cache"
tarball="$cache/podman-linux-$A-$VER.tar.gz"
[ -s "$tarball" ] || curl -fSL "$URL" -o "$tarball"
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
tar -xzf "$tarball" -C "$tmp"
rm -rf "$DEST"; install -d -m 755 "$DEST"
cp -a "$tmp/podman-linux-$A/." "$DEST/"
install -d -m 755 "$DEST/etc/containers" "$META_ROOT/.config/containers" "$META_ROOT/.local/bin"
cat > "$DEST/etc/containers/containers.conf" <<EOF
[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
conmon_path = ["$DEST/usr/local/lib/podman/conmon"]
helper_binaries_dir = ["$DEST/usr/local/lib/podman", "$DEST/usr/local/libexec/podman", "$DEST/usr/local/bin"]
network_cmd_path = "$DEST/usr/local/bin/pasta"
runtime = "crun"

[engine.runtimes]
crun = ["$DEST/usr/local/bin/crun"]
runc = ["$DEST/usr/local/bin/runc"]
EOF
cat > "$DEST/etc/containers/storage.conf" <<EOF
[storage]
driver = "overlay"
runroot = "$M/.toolchains/podman/runroot"
graphroot = "$M/.toolchains/podman/graphroot"
rootless_storage_path = "$M/.toolchains/podman/rootless-storage"

[storage.options.overlay]
ignore_chown_errors = "true"
mount_program = "$DEST/usr/local/bin/fuse-overlayfs"
mountopt = "nodev,fsync=0"
EOF
for f in containers.conf storage.conf registries.conf policy.json; do
  [ -f "$DEST/etc/containers/$f" ] && ln -sfn "$DEST/etc/containers/$f" "$META_ROOT/.config/containers/$f"
done
ln -sfn "$DEST/usr/local/bin/podman" "$META_ROOT/.local/bin/podman"
for b in crun runc fuse-overlayfs fusermount3 pasta; do
  [ -x "$DEST/usr/local/bin/$b" ] && ln -sfn "$DEST/usr/local/bin/$b" "$META_ROOT/.local/bin/$b"
done
'''
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; for b in podman crun runc fuse-overlayfs fusermount3 pasta; do t=\"$META_ROOT/.local/bin/$b\"; [ -L \"$t\" ] && readlink \"$t\" | grep -q \"$M/.toolchains/podman\" && rm -f \"$t\"; done; for f in containers.conf storage.conf registries.conf policy.json; do t=\"$META_ROOT/.config/containers/$f\"; [ -L \"$t\" ] && readlink \"$t\" | grep -q \"$M/.toolchains/podman\" && rm -f \"$t\"; done; rm -rf \"$M/.toolchains/podman\""]
[component.wiring]
path_entries = ["$META_ROOT/.local/bin"]


[[component]]
id = "keepassxc"
name = "KeePassXC"
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v keepassxc"]
[component.install]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "-y", "keepassxc"]


[[component]]
id = "virt-stack"
name = "QEMU/KVM + libvirt"
description = "Virtualization stack (qemu-system-x86 + libvirt + ovmf)."
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v qemu-system-x86_64 && command -v virsh"]
[component.install]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "-y", "qemu-system-x86", "qemu-utils", "libvirt-daemon-system", "libvirt-clients", "bridge-utils", "dnsmasq-base", "ovmf"]
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "qemu-system-x86_64 --version"]


# OpenSSL dev headers — build dependency for EXTERNAL tools whose deps link system OpenSSL
# (e.g. grit's aws/azure SDKs pull openssl-sys). This is a *system* package, NOT linked into any
# envctl crate, so it does not affect the no-C trust-boundary invariant (ci/gates/no-c.sh reads
# the envctl workspace's cargo graph only; grit is excluded from that workspace).
[[component]]
id = "libssl-dev"
name = "OpenSSL dev headers (libssl-dev)"
description = "OpenSSL development headers + pkg-config metadata, so external tools that link system OpenSSL (grit's aws/azure SDKs → openssl-sys) can build. System package; not in the envctl trust boundary."
# DETECT: the functional predicate grit's build needs — pkg-config can resolve openssl.pc
# (provided by libssl-dev). Requires pkg-config itself, which we also install.
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v pkg-config >/dev/null && pkg-config --exists openssl"]
[component.install]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "-y", "libssl-dev", "pkg-config"]
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "pkg-config --modversion openssl >/dev/null"]


# Precondition meta: the tools the wizard assumes from the apt base.
[[component]]
id = "meta-base-sanity"
name = "Base preconditions"
description = "Asserts the apt-base tools the wizard depends on are present."
requires = ["ghostty", "podman"]
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v git && command -v curl && command -v unzip && command -v jq && command -v python3"]
