[[component]]
id = "cuda-toolkit"
name = "CUDA toolkit 13.3 (meta-owned)"
# Epic H TASK-0063: relocated from the apt `cuda-toolkit-13-3` system-depth install to a
# meta-owned prefix ($META_ROOT/.toolchains/cuda) via NVIDIA's runfile in TOOLKIT-ONLY,
# user-prefix mode (`--toolkit --toolkitpath=… --override`, NO sudo, NO driver). The
# nvidia-open KERNEL driver stays apt (the irreducible system floor — a kernel module can't
# live in a userspace prefix; the runfile is invoked toolkit-only so it never touches it).
# libcuda (the proprietary user-mode driver) also stays with the apt driver. id is unchanged
# so the `requires = [..., "cuda-toolkit", ...]` edges (cuda-oxide, group-gpu-stack) resolve.
# The old apt toolkit is removed by the owner separately (`sudo apt-get remove -y
# cuda-toolkit-13-3 && sudo apt-get autoremove -y`) — a sudo step kept out of every hook.
description = "CUDA toolkit (nvcc, cuBLAS/cuDNN, nsys/ncu) from NVIDIA's runfile into .toolchains/cuda (toolkit-only, no-sudo, no-driver). Replaces the apt cuda-toolkit-13-3 system-depth install. Owns the cuda env shell block (meta-prefix first, apt fallback)."
# rust-native GPU stack: the toolkit feeds `cuda-oxide` (Rust→PTX via nightly), so the rust
# toolchain is provisioned first. (Replaces the dropped apt `nvidia-cuda-repo` ordering dep — the
# runfile is self-contained — and keeps the topo invariant `rustup < cuda-toolkit`.)
requires = ["rustup"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; [ -x \"$M/.toolchains/cuda/bin/nvcc\" ]"]
[component.install]
kind = "script"
login_shell = true
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/cuda"
VER="13.3.0"; DRV="610.43.02"
MD5="16d68669cf659157777d2e7adaff179d"
RUN="cuda_${VER}_${DRV}_linux.run"
URL="https://developer.download.nvidia.com/compute/cuda/${VER}/local_installers/${RUN}"
# Cache the ~4GB runfile under $M/.cache so a retry/fix never re-downloads. Verify md5 each
# time; re-fetch only if missing or corrupt. The download + integrity check happen BEFORE we
# touch the existing prefix, so a bad download is fail-closed and never destroys a good install.
cache="$M/.cache/cuda"; install -d -m 755 "$cache"
if ! ( [ -s "$cache/$RUN" ] && echo "${MD5}  $cache/$RUN" | md5sum -c - >/dev/null 2>&1 ); then
  curl -fSL "$URL" -o "$cache/$RUN"
  echo "${MD5}  $cache/$RUN" | md5sum -c -
fi
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
# Toolkit-only, user-prefix, no-sudo install. --toolkit (NOT --driver/--samples) so the apt
# nvidia-open kernel driver (system floor) is never touched; --override skips the host
# compiler/distro checks; --nox11 + </dev/null stop the makeself wrapper from trying to spawn
# an xterm when stdout is not a TTY (headless/CI); --tmpdir keeps the ~7GB self-extraction
# off a small /tmp. NOTE: invoked with `sh`; --nox11 is the load-bearing headless flag.
rm -rf "$DEST"; install -d -m 755 "$DEST"
sh "$cache/$RUN" --silent --toolkit --toolkitpath="$DEST" --override --no-opengl-libs --no-man-page --nox11 --tmpdir="$tmp" </dev/null
# Curated bin tools → $META_ROOT/usr/bin (nvcc resolves its sibling nvvm/targets via realpath).
install -d -m 755 "$META_ROOT/usr/bin"
for t in nvcc nsys ncu cuda-gdb compute-sanitizer cuobjdump; do
  [ -x "$DEST/bin/$t" ] && envctl_frontdoor "$DEST/bin/$t" "$META_ROOT/usr/bin/$t"
done
if [ -x /usr/bin/nvidia-smi ]; then
  install -m 755 /usr/bin/nvidia-smi "$DEST/bin/nvidia-smi"
  envctl_frontdoor "$DEST/bin/nvidia-smi" "$META_ROOT/usr/bin/nvidia-smi"
fi

'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; D=\"$M/.toolchains/cuda\"; \"$D/bin/nvcc\" --version | command grep -q 'release 13.3' && { ls \"$D\"/targets/x86_64-linux/lib/libcublas.so* >/dev/null 2>&1 || ls \"$D\"/lib64/libcublas.so* >/dev/null 2>&1; } && { [ ! -x /usr/bin/nvidia-smi ] || [ -x \"$META_ROOT/usr/bin/nvidia-smi\" ] && [ ! -L \"$META_ROOT/usr/bin/nvidia-smi\" ] && grep -Fqx \"exec \\\"$D/bin/nvidia-smi\\\" \\\"\\$@\\\"\" \"$META_ROOT/usr/bin/nvidia-smi\"; }"]
[component.fix]
kind = "script"
login_shell = true
script = '''
envctl_frontdoor() { src="$1"; dst="$2"; printf '%s\n' '#!/bin/sh' "exec \"$src\" \"\$@\"" > "$dst"; chmod 755 "$dst"; }
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
DEST="$M/.toolchains/cuda"
VER="13.3.0"; DRV="610.43.02"
MD5="16d68669cf659157777d2e7adaff179d"
RUN="cuda_${VER}_${DRV}_linux.run"
URL="https://developer.download.nvidia.com/compute/cuda/${VER}/local_installers/${RUN}"
cache="$M/.cache/cuda"; install -d -m 755 "$cache"
if ! ( [ -s "$cache/$RUN" ] && echo "${MD5}  $cache/$RUN" | md5sum -c - >/dev/null 2>&1 ); then
  curl -fSL "$URL" -o "$cache/$RUN"
  echo "${MD5}  $cache/$RUN" | md5sum -c -
fi
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
rm -rf "$DEST"; install -d -m 755 "$DEST"
sh "$cache/$RUN" --silent --toolkit --toolkitpath="$DEST" --override --no-opengl-libs --no-man-page --nox11 --tmpdir="$tmp" </dev/null
install -d -m 755 "$META_ROOT/usr/bin"
for t in nvcc nsys ncu cuda-gdb compute-sanitizer cuobjdump; do
  [ -x "$DEST/bin/$t" ] && envctl_frontdoor "$DEST/bin/$t" "$META_ROOT/usr/bin/$t"
done
if [ -x /usr/bin/nvidia-smi ]; then
  install -m 755 /usr/bin/nvidia-smi "$DEST/bin/nvidia-smi"
  envctl_frontdoor "$DEST/bin/nvidia-smi" "$META_ROOT/usr/bin/nvidia-smi"
fi

'''
[component.remove]
kind = "script"
script = '''
set -u
M="${META_ROOT:?META_ROOT required}"
for t in nvcc nsys ncu cuda-gdb compute-sanitizer cuobjdump nvidia-smi; do
  tt="$META_ROOT/usr/bin/$t"; [ -L "$tt" ] && readlink "$tt" | grep -q "$M/.toolchains/cuda" && rm -f "$tt"
done
rm -rf "$M/.toolchains/cuda"
'''
[component.wiring]
path_entries = ["$META_ROOT/usr/bin"]
[[component.wiring.shell_rc]]
file = "$META_ROOT/.bashrc"
marker = "cuda env"
# Resolve CUDA_HOME meta-prefix-first, with apt fallback so consumers (cuda-oxide, pytorch)
# keep working during/after the migration off the apt toolkit. Epic H TASK-0063.
content = '''
M="${META_ROOT:?META_ROOT required}"
CUDA_HOME="$M/.toolchains/cuda"; [ -d "$CUDA_HOME/bin" ] || CUDA_HOME=/usr/local/cuda; [ -d "$CUDA_HOME/bin" ] || CUDA_HOME="$(ls -d /usr/local/cuda-* 2>/dev/null | sort -V | tail -n1)"
export CUDA_HOME
export PATH="$CUDA_HOME/bin:$PATH"
export LD_LIBRARY_PATH="$CUDA_HOME/lib64:$CUDA_HOME/targets/x86_64-linux/lib:${LD_LIBRARY_PATH:-}"
export CUDA_OXIDE_LLC="$(command -v llc-22 || command -v llc-21 || command -v llc || ls /usr/lib/llvm-2*/bin/llc 2>/dev/null | sort -V | tail -n1)"
'''


[[component]]
id = "nvidia-open"
name = "nvidia-open driver (rolling latest)"
# UNPINNED, rolling: the CUDA repo's `nvidia-open` metapackage tracks forward to the repo's
# latest GA OPEN kernel modules (currently 610.43.02 for Blackwell sm_120) — the owner's
# "same track as rust nightly" intent: a rolling channel, never a number-pin. Supersedes the
# Ubuntu-archive `nvidia-driver-595-open` lineage (apt removes it during the swap). REBOOT to
# load a freshly installed/upgraded module (the live module can't hot-swap while the GPU is in use).
description = "Rolling OPEN kernel modules (Blackwell sm_120) from the CUDA repo's UNPINNED nvidia-open metapackage — always the repo's latest, currently 610.43.02. REBOOT to load. Supersedes archive nvidia-driver-595-open."
requires = ["nvidia-cuda-repo"]
gpu_required = true
# Candidate-aware roll-forward: 'present' ONLY when the installed nvidia-open equals the repo
# CANDIDATE (latest). A newer candidate (610 > 595, or a future 611) makes detect false => envctl
# upgrades. Deliberately drops the old `|| nvidia-smi -L` blanket fallback, which let ANY live
# driver satisfy detect and silently froze the box at its current version. apt-cache is read-only.
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "inst=$(apt-cache policy nvidia-open 2>/dev/null | awk '/Installed:/{print $2}'); cand=$(apt-cache policy nvidia-open 2>/dev/null | awk '/Candidate:/{print $2}'); [ -n \"$inst\" ] && [ \"$inst\" != \"(none)\" ] && [ \"$inst\" = \"$cand\" ]"]
[component.install]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "-y", "nvidia-open"]
# Reboot-tolerant + truthful. Package must be installed. Then: if nvidia-smi enumerates the GPUs,
# healthy (post-reboot steady state). If it does NOT, that's only OK when a reboot is pending —
# after upgrading the userspace libs to the new version while the kernel module is still the old
# one, the userspace probe fails until reboot. So we tolerate the failure IFF the LOADED module
# version differs from the INSTALLED package version (pending reboot). If they match and nvidia-smi
# still fails, that's a genuine breakage → FAIL. Post-reboot loaded==installed and nvidia-smi works
# → first check passes.
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "dpkg -l nvidia-open 2>/dev/null | grep -q '^ii' || exit 1; command -v nvidia-smi >/dev/null || exit 1; nvidia-smi -L >/dev/null 2>&1 && exit 0; loaded=$(grep -oE '[0-9]+\\.[0-9]+\\.[0-9]+' /proc/driver/nvidia/version 2>/dev/null | head -1); pkg=$(dpkg-query -W -f='${Version}' nvidia-open 2>/dev/null | grep -oE '^[0-9]+\\.[0-9]+\\.[0-9]+'); [ -n \"$loaded\" ] && [ -n \"$pkg\" ] && [ \"$loaded\" != \"$pkg\" ]"]
[component.fix]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "--reinstall", "-y", "nvidia-open"]
[component.remove]
kind = "script"
script = "sudo apt-get remove -y nvidia-open && sudo apt-get autoremove -y"


