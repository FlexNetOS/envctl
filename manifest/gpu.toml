# GPU / CUDA stack (yazelix-setup.sh section 3b + 3f). All gpu_required: the whole
# set auto-skips (with reason) on a non-NVIDIA box. CUDA 13.3 + nvidia-open 610,
# cuda-oxide, container toolkit + CDI, PyTorch cu132. nvidia-open verify is
# reboot-gated (nvidia-smi only goes live after a reboot).

[[component]]
id = "nvidia-cuda-repo"
name = "NVIDIA CUDA apt repo"
description = "cuda-keyring + ubuntu2604 sources; foundation for the toolkit/driver."
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "ls /etc/apt/sources.list.d/cuda*.list >/dev/null 2>&1 || dpkg -l cuda-keyring 2>/dev/null | grep -q '^ii'"]
[component.install]
kind = "script"
script = '''
set -e
cd "$(mktemp -d)"
curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2604/x86_64/cuda-keyring_1.1-1_all.deb
sudo dpkg -i cuda-keyring_1.1-1_all.deb
sudo apt-get update -y
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "apt-cache policy cuda-toolkit-13-3 2>/dev/null | grep -q developer.download.nvidia.com"]
[component.remove]
kind = "script"
script = "sudo dpkg -P cuda-keyring; sudo rm -f /etc/apt/sources.list.d/cuda-ubuntu2604-x86_64.list; sudo apt-get update -y"


[[component]]
id = "cuda-toolkit"
name = "CUDA toolkit 13.3 (meta-owned)"
# Epic H TASK-0063: relocated from the apt `cuda-toolkit-13-3` system-depth install to a
# meta-owned prefix ($META_ROOT/.toolchains/cuda) via NVIDIA's runfile in TOOLKIT-ONLY,
# user-prefix mode (`--toolkit --toolkitpath=… --override`, NO sudo, NO driver). The
# nvidia-open KERNEL driver stays apt (the irreducible system floor — a kernel module can't
# live in a userspace prefix; the runfile is invoked toolkit-only so it never touches it).
# libcuda (the proprietary user-mode driver) also stays with the apt driver. id is unchanged
# so the `requires = [..., "cuda-toolkit", ...]` edges (cuda-oxide, group-gpu-stack) resolve.
# The old apt toolkit is removed by the owner separately (`sudo apt-get remove -y
# cuda-toolkit-13-3 && sudo apt-get autoremove -y`) — a sudo step kept out of every hook.
description = "CUDA toolkit (nvcc, cuBLAS/cuDNN, nsys/ncu) from NVIDIA's runfile into .toolchains/cuda (toolkit-only, no-sudo, no-driver). Replaces the apt cuda-toolkit-13-3 system-depth install. Owns the cuda env shell block (meta-prefix first, apt fallback)."
# rust-native GPU stack: the toolkit feeds `cuda-oxide` (Rust→PTX via nightly), so the rust
# toolchain is provisioned first. (Replaces the dropped apt `nvidia-cuda-repo` ordering dep — the
# runfile is self-contained — and keeps the topo invariant `rustup < cuda-toolkit`.)
requires = ["rustup"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; [ -x \"$M/.toolchains/cuda/bin/nvcc\" ]"]
[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/cuda"
VER="13.3.0"; DRV="610.43.02"
MD5="16d68669cf659157777d2e7adaff179d"
RUN="cuda_${VER}_${DRV}_linux.run"
URL="https://developer.download.nvidia.com/compute/cuda/${VER}/local_installers/${RUN}"
# Cache the ~4GB runfile under $M/.cache so a retry/fix never re-downloads. Verify md5 each
# time; re-fetch only if missing or corrupt. The download + integrity check happen BEFORE we
# touch the existing prefix, so a bad download is fail-closed and never destroys a good install.
cache="$M/.cache/cuda"; install -d -m 755 "$cache"
if ! ( [ -s "$cache/$RUN" ] && echo "${MD5}  $cache/$RUN" | md5sum -c - >/dev/null 2>&1 ); then
  curl -fSL "$URL" -o "$cache/$RUN"
  echo "${MD5}  $cache/$RUN" | md5sum -c -
fi
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
# Toolkit-only, user-prefix, no-sudo install. --toolkit (NOT --driver/--samples) so the apt
# nvidia-open kernel driver (system floor) is never touched; --override skips the host
# compiler/distro checks; --nox11 + </dev/null stop the makeself wrapper from trying to spawn
# an xterm when stdout is not a TTY (headless/CI); --tmpdir keeps the ~7GB self-extraction
# off a small /tmp. NOTE: invoked with `sh`; --nox11 is the load-bearing headless flag.
rm -rf "$DEST"; install -d -m 755 "$DEST"
sh "$cache/$RUN" --silent --toolkit --toolkitpath="$DEST" --override --no-opengl-libs --no-man-page --nox11 --tmpdir="$tmp" </dev/null
# Curated bin tools → ~/.local/bin (nvcc resolves its sibling nvvm/targets via realpath).
install -d -m 755 "$HOME/.local/bin"
for t in nvcc nsys ncu cuda-gdb compute-sanitizer cuobjdump; do
  [ -x "$DEST/bin/$t" ] && ln -sfn "$DEST/bin/$t" "$HOME/.local/bin/$t"
done
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:-$HOME/Desktop/meta}\"; D=\"$M/.toolchains/cuda\"; \"$D/bin/nvcc\" --version | command grep -q 'release 13.3' && { ls \"$D\"/targets/x86_64-linux/lib/libcublas.so* >/dev/null 2>&1 || ls \"$D\"/lib64/libcublas.so* >/dev/null 2>&1; }"]
[component.fix]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:-$HOME/Desktop/meta}"
DEST="$M/.toolchains/cuda"
VER="13.3.0"; DRV="610.43.02"
MD5="16d68669cf659157777d2e7adaff179d"
RUN="cuda_${VER}_${DRV}_linux.run"
URL="https://developer.download.nvidia.com/compute/cuda/${VER}/local_installers/${RUN}"
cache="$M/.cache/cuda"; install -d -m 755 "$cache"
if ! ( [ -s "$cache/$RUN" ] && echo "${MD5}  $cache/$RUN" | md5sum -c - >/dev/null 2>&1 ); then
  curl -fSL "$URL" -o "$cache/$RUN"
  echo "${MD5}  $cache/$RUN" | md5sum -c -
fi
tmp="$(mktemp -d)"; trap 'rm -rf "$tmp"' EXIT
rm -rf "$DEST"; install -d -m 755 "$DEST"
sh "$cache/$RUN" --silent --toolkit --toolkitpath="$DEST" --override --no-opengl-libs --no-man-page --nox11 --tmpdir="$tmp" </dev/null
install -d -m 755 "$HOME/.local/bin"
for t in nvcc nsys ncu cuda-gdb compute-sanitizer cuobjdump; do
  [ -x "$DEST/bin/$t" ] && ln -sfn "$DEST/bin/$t" "$HOME/.local/bin/$t"
done
'''
[component.remove]
kind = "script"
script = '''
set -u
M="${META_ROOT:-$HOME/Desktop/meta}"
for t in nvcc nsys ncu cuda-gdb compute-sanitizer cuobjdump; do
  tt="$HOME/.local/bin/$t"; [ -L "$tt" ] && readlink "$tt" | grep -q "$M/.toolchains/cuda" && rm -f "$tt"
done
rm -rf "$M/.toolchains/cuda"
'''
[component.wiring]
path_entries = ["~/.local/bin"]
[[component.wiring.shell_rc]]
file = "~/.bashrc"
marker = "cuda env"
# Resolve CUDA_HOME meta-prefix-first, with apt fallback so consumers (cuda-oxide, pytorch)
# keep working during/after the migration off the apt toolkit. Epic H TASK-0063.
content = '''
M="${META_ROOT:-$HOME/Desktop/meta}"
CUDA_HOME="$M/.toolchains/cuda"; [ -d "$CUDA_HOME/bin" ] || CUDA_HOME=/usr/local/cuda; [ -d "$CUDA_HOME/bin" ] || CUDA_HOME="$(ls -d /usr/local/cuda-* 2>/dev/null | sort -V | tail -n1)"
export CUDA_HOME
export PATH="$CUDA_HOME/bin:$PATH"
export LD_LIBRARY_PATH="$CUDA_HOME/lib64:$CUDA_HOME/targets/x86_64-linux/lib:${LD_LIBRARY_PATH:-}"
export CUDA_OXIDE_LLC="$(command -v llc-22 || command -v llc-21 || command -v llc || ls /usr/lib/llvm-2*/bin/llc 2>/dev/null | sort -V | tail -n1)"
'''


[[component]]
id = "nvidia-open"
name = "nvidia-open 610 driver"
description = "GA-matched OPEN kernel modules for Blackwell sm_120. REBOOT to load."
requires = ["nvidia-cuda-repo"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "dpkg -l nvidia-open 2>/dev/null | grep -q '^ii' || (command -v nvidia-smi >/dev/null && nvidia-smi -L >/dev/null 2>&1)"]
[component.install]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "-y", "nvidia-open"]
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "command -v nvidia-smi >/dev/null && nvidia-smi -L >/dev/null 2>&1"]
[component.fix]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["install", "--reinstall", "-y", "nvidia-open"]
[component.remove]
kind = "script"
script = "sudo apt-get remove -y nvidia-open && sudo apt-get autoremove -y"


# NOTE: the `llvm-clang` component is now meta-owned (prebuilt LLVM/clang-21 tarball
# into .toolchains/llvm) and lives in components.d/epic-h-toolchains.toml — Epic H
# TASK-0061 replaced the apt `llvm-21`/`clang-21`/`libclang-*-dev` system-depth install
# that used to be defined here. The id is unchanged, so the `requires = [..., "llvm-clang",
# ...]` references below (cuda-oxide, gpu-stack) still resolve.


[[component]]
id = "rust-nightly-cuda-oxide"
name = "Rust nightly + components (cuda-oxide)"
description = "Pinned nightly-2026-04-03 + rust-src/rustc-dev/llvm-tools."
requires = ["rustup"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$PATH\"; rustup toolchain list 2>/dev/null | grep -q nightly-2026-04-03"]
[component.install]
kind = "script"
script = "export PATH=\"$HOME/.cargo/bin:$PATH\"; rustup toolchain install nightly-2026-04-03; rustup component add rust-src rustc-dev llvm-tools --toolchain nightly-2026-04-03"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$PATH\"; rustup component list --toolchain nightly-2026-04-03 --installed | grep -q rust-src"]
[component.fix]
kind = "script"
script = "export PATH=\"$HOME/.cargo/bin:$PATH\"; rustup component add rust-src rustc-dev llvm-tools --toolchain nightly-2026-04-03"
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$PATH\"; rustup toolchain uninstall nightly-2026-04-03"]


[[component]]
id = "cuda-oxide"
name = "cuda-oxide (cargo-oxide)"
requires = ["rust-nightly-cuda-oxide", "cuda-toolkit", "llvm-clang", "nvidia-open"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v cargo-oxide || [ -x \"$HOME/.cargo/bin/cargo-oxide\" ]"]
[component.install]
kind = "script"
# Pin the nightly toolchain explicitly: cuda-oxide's cuda-core uses `#![feature(f16)]`,
# which only compiles on nightly. `cargo +<toolchain>` overrides RUSTUP_TOOLCHAIN and any
# stable default/rust-toolchain.toml, so this builds correctly regardless of the caller's
# environment (relying on the repo's own toolchain file is fragile — an inherited
# RUSTUP_TOOLCHAIN silently overrides it and the build fails E0554 on stable).
script = "export PATH=\"$HOME/.cargo/bin:$PATH\"; cargo +nightly-2026-04-03 install --git https://github.com/NVlabs/cuda-oxide.git cargo-oxide"
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$PATH\"; cargo-oxide --version"]
[component.fix]
kind = "script"
script = "export PATH=\"$HOME/.cargo/bin:$PATH\"; cargo +nightly-2026-04-03 install --force --git https://github.com/NVlabs/cuda-oxide.git cargo-oxide"
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "export PATH=\"$HOME/.cargo/bin:$PATH\"; cargo uninstall cargo-oxide"]


[[component]]
id = "nvidia-container-toolkit"
name = "NVIDIA Container Toolkit + CDI"
description = "Rootless Podman GPU via --device nvidia.com/gpu=all."
requires = ["nvidia-open", "podman"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "command -v nvidia-ctk || dpkg -l nvidia-container-toolkit 2>/dev/null | grep -q '^ii'"]
[component.install]
kind = "script"
script = '''
set -e
curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey | sudo gpg --dearmor -o /usr/share/keyrings/nvidia-container-toolkit-keyring.gpg
curl -fsSL https://nvidia.github.io/libnvidia-container/stable/deb/nvidia-container-toolkit.list | sed "s#deb https://#deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://#g" | sudo tee /etc/apt/sources.list.d/nvidia-container-toolkit.list >/dev/null
sudo apt-get update -y
sudo apt-get install -y nvidia-container-toolkit
sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml || true
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "command -v nvidia-ctk >/dev/null && [ -f /etc/cdi/nvidia.yaml ]"]
[component.fix]
kind = "command"
needs_sudo = true
command = "nvidia-ctk"
args = ["cdi", "generate", "--output=/etc/cdi/nvidia.yaml"]
[component.remove]
kind = "command"
needs_sudo = true
command = "apt-get"
args = ["remove", "-y", "nvidia-container-toolkit"]
# Declarative system-scope wiring: the apt repo (.list + armored keyring) and the
# generated CDI spec. reset reverts them in the safe order + backs up first.
[[component.wiring.apt_repos]]
list_file = "nvidia-container-toolkit.list"
list_line = "deb [signed-by=/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg] https://nvidia.github.io/libnvidia-container/stable/deb/$(ARCH) /"
keyring_path = "/usr/share/keyrings/nvidia-container-toolkit-keyring.gpg"
keyring_url = "https://nvidia.github.io/libnvidia-container/gpgkey"
dearmor = true
[[component.wiring.cdi_specs]]
output = "/etc/cdi/nvidia.yaml"


[[component]]
id = "pytorch-venv"
name = "PyTorch cu132 (isolated venv)"
description = "torch+torchvision cu132 in ~/.venvs/torch (bundles its own CUDA runtime)."
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "[ -x \"$HOME/.venvs/torch/bin/python\" ] && \"$HOME/.venvs/torch/bin/python\" -c 'import torch' 2>/dev/null"]
[component.install]
kind = "script"
script = '''
set -e
python3 -m venv "$HOME/.venvs/torch"
"$HOME/.venvs/torch/bin/pip" install --upgrade pip
"$HOME/.venvs/torch/bin/pip" install torch torchvision --index-url https://download.pytorch.org/whl/cu132
'''
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "\"$HOME/.venvs/torch/bin/python\" -c 'import torch; print(torch.__version__)'"]
[component.fix]
kind = "script"
script = "\"$HOME/.venvs/torch/bin/pip\" install --upgrade --force-reinstall torch torchvision --index-url https://download.pytorch.org/whl/cu132"
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "rm -rf \"$HOME/.venvs/torch\""]


[[component]]
id = "gpu-verify-scripts"
name = "GPU smoke-test scripts"
description = "~/.local/bin/yazelix-gpu-verify.sh + launcher + post-reboot one-shot autostart. install/fix REGENERATE them from the shipped yazelix-gpu-verify-install.sh (declarative port of yazelix-setup.sh 3f); detect/verify/remove unchanged. GPU-gated (no-op on a non-NVIDIA box)."
requires = ["nvidia-open", "pytorch-venv", "cuda-oxide", "nvidia-container-toolkit"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "[ -x \"$HOME/.local/bin/yazelix-gpu-verify.sh\" ]"]
# install/fix regenerate the smoke-test + launcher + autostart from the shipped
# installer (port of yazelix-setup.sh 3f). The installer self-gates on lspci nvidia.
[component.install]
kind = "shipped_script"
path = "/usr/local/bin/yazelix-gpu-verify-install.sh"
[component.fix]
kind = "shipped_script"
path = "/usr/local/bin/yazelix-gpu-verify-install.sh"
# verify runs the shipped smoke test with $HOME expanded (ShippedScript paths are
# NOT shell-expanded, so this is a Command hook); </dev/null answers its final read.
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "\"$HOME/.local/bin/yazelix-gpu-verify.sh\" </dev/null"]
[component.remove]
kind = "command"
command = "bash"
args = ["-lc", "rm -f \"$HOME/.local/bin/yazelix-gpu-verify.sh\" \"$HOME/.local/bin/yazelix-gpu-verify-launch.sh\" \"$HOME/.config/autostart/yazelix-gpu-verify.desktop\""]


# Group/meta: the whole GPU stack in dependency order. Skips on a non-NVIDIA box.
[[component]]
id = "group-gpu-stack"
name = "Full GPU stack"
description = "Meta: repo + toolkit + driver + llvm + cuda-oxide + container toolkit + torch + verify."
requires = ["nvidia-cuda-repo", "cuda-toolkit", "nvidia-open", "llvm-clang", "rust-nightly-cuda-oxide", "cuda-oxide", "nvidia-container-toolkit", "pytorch-venv", "gpu-verify-scripts"]
gpu_required = true
[component.detect]
kind = "command"
command = "bash"
# Resolve nvcc by its installed path (same dynamic CUDA_HOME as cuda-toolkit's verify),
# NOT bare `command -v nvcc`: envctl runs detect via a non-interactive `bash -lc`, which
# hits ~/.bashrc's interactivity guard and returns BEFORE the "cuda env" PATH block — so
# `command -v nvcc` false-negatives even though the toolkit is installed and wired.
args = ["-lc", "CUDA_HOME=/usr/local/cuda; [ -d \"$CUDA_HOME/bin\" ] || CUDA_HOME=\"$(ls -d /usr/local/cuda-* 2>/dev/null | sort -V | tail -n1)\"; [ -x \"$CUDA_HOME/bin/nvcc\" ] && command -v nvidia-smi >/dev/null && command -v cargo-oxide >/dev/null"]
