args = ["-lc", '''M="${META_ROOT:?META_ROOT required}"; export CARGO_HOME="$M/.toolchains/cargo" RUSTUP_HOME="$M/.toolchains/rustup" PATH="$CARGO_HOME/bin:$PATH"; cargo uninstall cargo-oxide || true; t="$M/usr/bin/cargo-oxide"; src="$CARGO_HOME/bin/cargo-oxide"; { [ -L "$t" ] && [ "$(readlink -f "$t" 2>/dev/null)" = "$src" ]; } || { [ -f "$t" ] && grep -Fqx "exec \"$src\" \"\$@\"" "$t"; } && rm -f "$t" || true''']


