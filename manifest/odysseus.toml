# Odysseus — a self-hosted AI workspace (chat/agents/research/docs/email/notes/calendar +
# local models), adopted as a PINNED, SANDBOXED, REVERSIBLE service managed by envctl.
#
# Provenance + verdict: rusty-idd's plan-loop evaluated github.com/pewdiepie-archdaemon/odysseus
# and returned QUALIFY / sandbox-adopt — a reversible envctl-managed service behind LifeOS, NOT a
# source merge (it is AGPL-3.0-or-later: no code merge until a license decision), bound to
# 127.0.0.1, with the Docker-socket / privileged seams gated. See docs/odysseus-adoption.md and
# rusty-idd/.handoff/loop/plan/reports/odysseus-front-door-evaluation.md.
#
# Engine: the box's existing META-LOCAL rootless **Podman** (manifest apt-base.toml `podman`,
# $META_ROOT/.toolchains/podman) is the container engine — chosen over rootless Docker because it
# needs ZERO system-depth changes (rootless Docker on Ubuntu 26.04 requires a system AppArmor
# userns profile; Podman uses setuid newuidmap and Just Works). Odysseus's docker-compose is run
# via `podman compose` (Docker Compose v2 semantics over the Podman engine), and its hardcoded
# `/var/run/docker.sock` mount is REDIRECTED (compose `!override`) to the rootless Podman API
# socket — so Cookbook's model-serving seam talks to the meta-local engine, never the root daemon.
#
# State layout (all under $META_ROOT/.local/share/odysseus — meta-local policy):
#   src/   pinned clone (detached at ODYSSEUS_REF; never floating dev/latest)
#   data/  app data, db, auth, ssh, huggingface cache, cookbook-installed CLIs  (data_path)
#   logs/  app logs                                                              (data_path)
#   src/.env + src/compose.meta.yml  generated (gitignored upstream): loopback binds, meta data
#          dirs, AUTH on, LOCALHOST_BYPASS off, side services internal-only, podman-socket redirect
#
# Hardening (rusty-idd's gates, enforced here): APP_BIND=127.0.0.1; AUTH_ENABLED=true;
# LOCALHOST_BYPASS=false; SearXNG/ntfy host ports dropped (internal-only per Odysseus SECURITY.md,
# also avoids the sqld:8080 clash); secrets come from the envctl secret stack at runtime, never a
# committed .env. Promotion to a default LifeOS /ai surface stays gated (see the adoption doc).

[[component]]
id = "odysseus"
name = "Odysseus (self-hosted AI workspace, sandboxed)"
description = "Pinned, reversible Odysseus stack (AGPL, NOT source-merged) run via podman compose on the meta-local rootless Podman engine. Loopback-only (127.0.0.1:7000), AUTH on, side services internal-only, docker-socket redirected to the Podman API socket. State under $META_ROOT/.local/share/odysseus. QUALIFY adoption — not yet the default LifeOS front door."
destructive = false
# NB: intentionally NOT `requires = ["podman"]`. The podman component's `install` was destructive
# (`rm -rf $DEST`, incl. its container graphroot) and its `detect` mis-resolves the bridge path on
# a post-#271 layout (now both fixed in apt-base.toml). To avoid ANY dependency-driven podman
# reinstall (one wiped the live container store during development), we require podman as a
# FAIL-CLOSED PRECONDITION in `install` (below) instead — explicit + safe.

# DETECT — read-only, fast: pinned clone present, the odysseus container is running on the
# meta-local engine, and the loopback UI answers. (No compose invocation — cheap `podman ps`.)
# Podman is resolved via PATH (the meta bridge) with a toolchains fallback — never a hardcoded
# $M/usr/bin/podman, which does not exist on a box that bridges via .local/bin.
[component.detect]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; S=\"$M/.local/share/odysseus/src\"; P=\"$(command -v podman 2>/dev/null || echo \"$M/.toolchains/podman/usr/local/bin/podman\")\"; [ -d \"$S/.git\" ] && [ \"$(git -C \"$S\" rev-parse HEAD 2>/dev/null)\" = \"${ODYSSEUS_REF:-ebead8083e84f58f7e1012f22c9a9266a13fa1ee}\" ] && \"$P\" ps --format '{{.Names}}' 2>/dev/null | grep -q odysseus && curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:7000"]

# INSTALL — clone (pinned) → generate meta .env + compose override → bring the stack up on Podman.
# needs_sudo = false (wholly rootless/user-scope). NOTE: the first `up --build` compiles the
# Odysseus image + pulls chromadb/searxng/ntfy — minutes. Run from a context with a generous
# phase timeout (ENVCTL_HOOK_TIMEOUT) or pre-pull; idempotent on re-run.
[component.install]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
rt="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
# Prepend the meta podman bridges so a bare `podman` resolves even in a stripped engine env.
export PATH="$M/.local/bin:$M/.toolchains/podman/usr/local/bin:$M/usr/bin:$PATH"
ROOT="$M/.local/share/odysseus"; SRC="$ROOT/src"; DATA="$ROOT/data"; LOGS="$ROOT/logs"
REPO="${ODYSSEUS_REPO:-https://github.com/pewdiepie-archdaemon/odysseus.git}"
REF="${ODYSSEUS_REF:-ebead8083e84f58f7e1012f22c9a9266a13fa1ee}"
SOCK="$rt/podman/podman.sock"

# 0) fail-closed precondition: the meta-local podman engine must be present (we do NOT declare it
#    as a hard `requires`, to avoid the destructive podman-reinstall footgun — see the note above).
command -v podman >/dev/null 2>&1 || { echo "odysseus needs the meta-local podman engine; run: envctl install podman"; exit 1; }

# 1) Docker-API endpoint on the meta-local Podman engine (rootless; no sudo) + reboot persistence.
systemctl --user enable --now podman.socket 2>/dev/null || true
loginctl enable-linger "$(id -un)" 2>/dev/null || true
# the compose services declare `restart: unless-stopped`; podman-restart.service (+ linger) brings
# them back after a reboot. Without it the stack stays down post-reboot.
systemctl --user enable podman-restart.service 2>/dev/null || true

# 2) meta-local state dirs.
#
# Rootless Podman can leave bind-mounted volume trees owned by shifted IDs after a run. Re-running
# install must not downgrade the service by chmod/chowning existing data/log paths back from the
# namespace owner (or failing when the host user cannot chmod them). Create missing dirs only; leave
# existing state untouched. The podman-unshare fallback lets rootless Podman create a missing child
# below a shifted-ID parent without any system-depth privilege escalation.
install -d -m 700 "$ROOT"

odysseus_ensure_state_dir() {
  d="$1"
  if [ -d "$d" ]; then
    return 0
  fi

  if mkdir -p "$d" 2>/dev/null; then
    chmod 700 "$d" 2>/dev/null || true
    return 0
  fi

  podman unshare mkdir -p "$d"
  podman unshare chmod 700 "$d" 2>/dev/null || true
}

odysseus_ensure_state_dir "$DATA"
odysseus_ensure_state_dir "$LOGS"
odysseus_ensure_state_dir "$DATA/ssh"
odysseus_ensure_state_dir "$DATA/huggingface"
odysseus_ensure_state_dir "$DATA/local"

# 3) pinned clone (idempotent; detached at the exact SHA — never floating).
if [ -d "$SRC/.git" ]; then git -C "$SRC" remote set-url origin "$REPO" || true; else git clone "$REPO" "$SRC"; fi
git -C "$SRC" fetch --depth 1 origin "$REF" 2>/dev/null || git -C "$SRC" fetch origin
git -C "$SRC" checkout --detach "$REF"

# 4) generate the meta .env (gitignored upstream; secrets are NOT written here — AUTH stays on
#    with an auto-generated admin password printed in the logs; provider keys come from secretctl
#    at runtime if/when wired). Loopback + meta data dirs + safe defaults.
cat > "$SRC/.env" <<EOF
# generated by envctl manifest/odysseus.toml — do not commit (upstream .gitignore covers .env)
APP_BIND=127.0.0.1
APP_PORT=7000
APP_DATA_DIR=$DATA
APP_LOGS_DIR=$LOGS
AUTH_ENABLED=true
LOCALHOST_BYPASS=false
SECURE_COOKIES=false
PUID=$(id -u)
PGID=$(id -g)
OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
EOF
chmod 600 "$SRC/.env"

# 5) compose override: replace the odysseus volume list (compose `!override`) so the hardcoded
#    /var/run/docker.sock becomes the rootless PODMAN socket (never the root daemon), drop the
#    docker-GID group_add (no docker group under rootless podman), and make SearXNG/ntfy
#    internal-only (no host port → avoids the sqld:8080 clash; SECURITY.md wants them internal).
#    `logging: json-file` on every service: the meta-local static conmon has NO journald support,
#    and the podman socket service defaults to journald → conmon exits 1; json-file maps to
#    podman's k8s-file driver and makes the stack start. (Set per-service so it reaches the socket
#    service that actually creates the containers — a CONTAINERS_CONF_OVERRIDE env would not.)
cat > "$SRC/compose.meta.yml" <<EOF
services:
  odysseus:
    logging: { driver: json-file }
    volumes: !override
      - "$DATA:/app/data:z"
      - "$LOGS:/app/logs:z"
      - "$DATA/ssh:/app/.ssh:z"
      - "$DATA/huggingface:/app/.cache/huggingface:z"
      - "$DATA/local:/app/.local:z"
      - "$SOCK:/var/run/docker.sock"
    group_add: !reset null
  searxng:
    logging: { driver: json-file }
    ports: !reset null
  ntfy:
    logging: { driver: json-file }
    ports: !reset null
  chromadb:
    logging: { driver: json-file }
EOF

# 6) bring the stack up on the meta-local Podman engine.
cd "$SRC"
podman compose -f docker-compose.yml -f compose.meta.yml up -d --build

# 7) observability: best-effort health event to the planning loops (weave is on PATH or skip).
command -v weave >/dev/null 2>&1 && weave notify --from envctl --to all --subject "odysseus-ready" \
  --body "odysseus up via podman compose @127.0.0.1:7000 (sandboxed, AGPL, QUALIFY)" 2>/dev/null || true
echo "odysseus stack started; admin password in: podman logs \$(podman ps --filter name=odysseus -q | head -1)"
'''

# VERIFY — read-only: the odysseus container is running on the meta-local engine and the loopback
# UI answers; assert nothing is published off-loopback. Podman resolved via PATH + toolchains.
[component.verify]
kind = "command"
command = "bash"
args = ["-lc", "M=\"${META_ROOT:?META_ROOT required}\"; P=\"$(command -v podman 2>/dev/null || echo \"$M/.toolchains/podman/usr/local/bin/podman\")\"; \"$P\" ps --format '{{.Names}} {{.Ports}}' 2>/dev/null | grep -q odysseus && curl -fsS -o /dev/null --max-time 8 http://127.0.0.1:7000 && ! (\"$P\" ps --format '{{.Ports}}' 2>/dev/null | grep -qE '0\\.0\\.0\\.0:|\\[::\\]:')"]

# FIX — idempotent: ensure the socket + stack are up (re-runs compose up; rebuilds only if needed).
[component.fix]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"; rt="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
export PATH="$M/.local/bin:$M/.toolchains/podman/usr/local/bin:$M/usr/bin:$PATH"
ROOT="$M/.local/share/odysseus"; SRC="$ROOT/src"; DATA="$ROOT/data"; LOGS="$ROOT/logs"
command -v podman >/dev/null 2>&1 || { echo "odysseus needs the meta-local podman engine; run: envctl install podman"; exit 1; }
systemctl --user enable --now podman.socket 2>/dev/null || true
[ -d "$SRC/.git" ] || { echo "odysseus not installed; run install"; exit 1; }

odysseus_ensure_state_dir() {
  d="$1"
  if [ -d "$d" ]; then
    return 0
  fi

  if mkdir -p "$d" 2>/dev/null; then
    chmod 700 "$d" 2>/dev/null || true
    return 0
  fi

  podman unshare mkdir -p "$d"
  podman unshare chmod 700 "$d" 2>/dev/null || true
}

odysseus_ensure_state_dir "$DATA"
odysseus_ensure_state_dir "$LOGS"
odysseus_ensure_state_dir "$DATA/ssh"
odysseus_ensure_state_dir "$DATA/huggingface"
odysseus_ensure_state_dir "$DATA/local"

cd "$SRC"
podman compose -f docker-compose.yml -f compose.meta.yml up -d
'''

# REMOVE — tear the stack down; KEEP the data volumes (data_paths; only `reset --purge` deletes
# them). Drops the clone + generated config, leaving the box reversible.
[component.remove]
kind = "script"
login_shell = true
script = '''
set -euo pipefail
M="${META_ROOT:?META_ROOT required}"
export PATH="$M/.local/bin:$M/.toolchains/podman/usr/local/bin:$M/usr/bin:$PATH"
SRC="$M/.local/share/odysseus/src"
if [ -d "$SRC" ] && command -v podman >/dev/null 2>&1; then
  ( cd "$SRC" && podman compose -f docker-compose.yml -f compose.meta.yml down 2>/dev/null ) || true
fi
rm -rf "$SRC"
# data/ + logs/ are data_paths — intentionally preserved here (reversible).
echo "odysseus stack removed; data preserved under $M/.local/share/odysseus (use reset --purge to delete)"
'''

[component.wiring]
# Persistent app state — only `reset --purge` deletes (backup/restore-testable).
[[component.wiring.data_paths]]
path = "$META_ROOT/.local/share/odysseus/data"
[[component.wiring.data_paths]]
path = "$META_ROOT/.local/share/odysseus/logs"
