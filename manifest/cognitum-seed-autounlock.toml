systemctl enable cognitum-seed-autounlock.service || true
systemctl restart cognitum-seed-autounlock.service || true
'''

# REMOVE: disable + drop the unit, worker, and udev rule. Removing this component ONLY stops the
# auto-unlock mechanism — it NEVER locks or wipes a currently-open vault.
[component.remove]
kind = "script"
needs_sudo = true
script = '''
set -euo pipefail
systemctl disable --now cognitum-seed-autounlock.service 2>/dev/null || true
M="${META_ROOT:?META_ROOT required by envctl hook}"
rm -f "$M/usr/libexec/envctl/cognitum-seed-autounlock"
rm -f /etc/systemd/system/cognitum-seed-autounlock.service
rm -f /etc/udev/rules.d/99-cognitum-seed-autounlock.rules
udevadm control --reload-rules || true
systemctl daemon-reload || true
# NOTE: this only removes the auto-unlock mechanism; a currently-open vault is left untouched
# (no lock, no wipe). Re-locking happens via the daemon's own relock paths, not here.
'''
