# envctl .handoff Tier-A — autonomous-loop hook descriptors (ADR-0004 §2, OPTIONAL).
#
# RESIDENCY (ADR-0004 §3 / ADR-0018 D1 / META-ORG-POLICY P7): this file is git-committed TEXT.
# Ledger-mutating verbs below operate on this member repo's local `.handoff/ledger.db` rebuild cache,
# then export the durable `.handoff/ledger.events.jsonl` for git. The binary cache is legitimate and
# expected, but never committed; `hf sync` rolls member events up to the fleet ledger when needed.

schema = "handoff.hooks.v1"

[[hooks]]
event = "SessionStart"
command = "hf resume --compact"
timeout_seconds = 10
fail_mode = "warn"

[[hooks]]
event = "TaskClaim"
command = "hf policy check-claim --json"
timeout_seconds = 15
fail_mode = "block"

[[hooks]]
event = "PreEdit"
command = "hf policy check-edit --json"
timeout_seconds = 5
fail_mode = "block"

[[hooks]]
event = "PostEdit"
command = "hf checkpoint --auto --changed-files"
timeout_seconds = 30
fail_mode = "warn"

[[hooks]]
event = "PreHandoff"
command = "hf drift --json && hf policy check-handoff --json"
timeout_seconds = 30
fail_mode = "block"

[[hooks]]
event = "SessionStop"
command = "hf checkpoint --auto && hf handoff --auto"
timeout_seconds = 60
fail_mode = "warn"
