# Codex project configuration for envctl.
# Source-checked against the OpenAI Codex manual fetched 2026-06-26.
# Personal credentials/provider redirects stay in ~/.codex/config.toml.

# Core model/context defaults for long-running agentic work.
model = "gpt-5.5"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
model_reasoning_summary = "auto"
model_verbosity = "medium"
model_context_window = 128000
model_auto_compact_token_limit = 64000
tool_output_token_limit = 12000
background_terminal_max_timeout = 300000

# Keep the root AGENTS.md (currently ~37 KiB) from being truncated at the 32 KiB default.
project_doc_max_bytes = 65536
project_doc_fallback_filenames = [".agents.md", "CLAUDE.md"]

# Trusted envctl worktrees need write access plus current docs/web research, but not full-access.
approval_policy = "on-request"
sandbox_mode = "workspace-write"
web_search = "live"

[agents]
max_depth = 1
max_threads = 12
job_max_runtime_seconds = 3600

[agents.docs_researcher]
config_file = "agents/docs-researcher.toml"
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."

[agents.explorer]
config_file = "agents/explorer.toml"
description = "Read-only codebase explorer for gathering evidence before changes are proposed."

[agents.reviewer]
config_file = "agents/reviewer.toml"
description = "PR reviewer focused on correctness, security, and missing tests."

[features]
hooks = true
memories = true
multi_agent = true
shell_snapshot = true
unified_exec = true
fast_mode = true
shell_tool = true

[history]
persistence = "save-all"
max_bytes = 104857600

[memories]
generate_memories = true
use_memories = true
disable_on_external_context = false
min_rate_limit_remaining_percent = 15

[tui]
notifications = ["agent-turn-complete", "approval-requested"]
status_line = ["model-with-reasoning", "context-remaining", "git-branch"]
terminal_title = ["spinner", "project", "git-branch"]

[sandbox_workspace_write]
network_access = true
exclude_tmpdir_env_var = false
exclude_slash_tmp = false

# Envctl's standard MCP baseline, provisioned from agent-env.yaml/agent-skills.
[mcp_servers.context7]
args = [
    "-y",
    "@upstash/context7-mcp@latest",
]
command = "npx"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.github]
args = [
    "-y",
    "@modelcontextprotocol/server-github",
]
command = "npx"

[mcp_servers.memory]
args = [
    "-y",
    "@modelcontextprotocol/server-memory",
]
command = "npx"

[mcp_servers.n8n-mcp]
args = [
    "-lc",
    'export PATH="$HOME/.bun/bin:$HOME/.local/bin:$PATH"; export N8N_API_URL=http://localhost:5678; export N8N_API_KEY="$(secretctl secret get n8n-api-key --reveal --apply)"; exec npx -y n8n-mcp',
]
command = "bash"

[mcp_servers.playwright]
args = [
    "-y",
    "@playwright/mcp@latest",
    "--extension",
]
command = "npx"

[mcp_servers.sequential-thinking]
args = [
    "-y",
    "@modelcontextprotocol/server-sequential-thinking",
]
command = "npx"
