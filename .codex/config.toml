approval_policy = "on-request"
background_terminal_max_timeout = 300000
model = "gpt-5.5"
model_auto_compact_token_limit = 64000
model_context_window = 128000
model_reasoning_effort = "high"
model_reasoning_summary = "auto"
model_verbosity = "medium"
plan_mode_reasoning_effort = "xhigh"
project_doc_fallback_filenames = [
    ".agents.md",
    "CLAUDE.md",
]
project_doc_max_bytes = 65536
sandbox_mode = "workspace-write"
tool_output_token_limit = 12000
web_search = "live"

[agents]
job_max_runtime_seconds = 3600
max_depth = 1
max_threads = 12

[agents.docs_researcher]
config_file = "agents/docs-researcher.toml"
description = "Documentation specialist that verifies APIs, framework behavior, and release notes."

[agents.explorer]
config_file = "agents/explorer.toml"
description = "Read-only codebase explorer for gathering evidence before changes are proposed."

[agents.reviewer]
config_file = "agents/reviewer.toml"
description = "PR reviewer focused on correctness, security, and missing tests."

[features]
fast_mode = true
hooks = true
memories = true
multi_agent = true
shell_snapshot = true
shell_tool = true
unified_exec = true

[history]
max_bytes = 104857600
persistence = "save-all"

[mcp_servers.context7]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/drdave/Desktop/meta}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$ROOT/.local/bin:$PATH"; exec "$ROOT/usr/bin/bunx" @upstash/context7-mcp@latest',
]
command = "bash"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.github]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/drdave/Desktop/meta}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$ROOT/.local/bin:$PATH"; exec "$ROOT/usr/bin/bunx" @modelcontextprotocol/server-github',
]
command = "bash"

[mcp_servers.memory]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/drdave/Desktop/meta}"; exec "$ROOT/envctl/assets/scripts/envctl-mcp-memory-server"',
]
command = "bash"

[mcp_servers.n8n-mcp]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/drdave/Desktop/meta}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$ROOT/.local/bin:$PATH"; export N8N_API_URL="${N8N_API_URL:-http://localhost:5678}"; if [ -z "${N8N_API_KEY:-}" ] && [ -x "$ROOT/usr/bin/secretctl" ]; then N8N_API_KEY="$("$ROOT/usr/bin/secretctl" secret get n8n-api-key --reveal --apply 2>/dev/null || true)"; export N8N_API_KEY; fi; exec "$ROOT/usr/bin/bunx" n8n-mcp',
]
command = "bash"

[mcp_servers.playwright]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/drdave/Desktop/meta}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$ROOT/.local/bin:$PATH"; exec "$ROOT/usr/bin/bunx" @playwright/mcp@latest --extension',
]
command = "bash"

[mcp_servers.sequential-thinking]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/drdave/Desktop/meta}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$ROOT/.local/bin:$PATH"; exec "$ROOT/usr/bin/bunx" @modelcontextprotocol/server-sequential-thinking',
]
command = "bash"

[memories]
disable_on_external_context = false
generate_memories = true
min_rate_limit_remaining_percent = 15
use_memories = true

[sandbox_workspace_write]
exclude_slash_tmp = false
exclude_tmpdir_env_var = false
network_access = true

[tui]
notifications = [
    "agent-turn-complete",
    "approval-requested",
]
status_line = [
    "model-with-reasoning",
    "context-remaining",
    "git-branch",
]
terminal_title = [
    "spinner",
    "project",
    "git-branch",
]
