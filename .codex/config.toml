[mcp_servers.context7]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/flexnetos/FlexNetOS}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$PATH"; exec "$ROOT/usr/bin/bunx" @upstash/context7-mcp@latest',
]
command = "bash"

[mcp_servers.exa]
url = "https://mcp.exa.ai/mcp"

[mcp_servers.github]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/flexnetos/FlexNetOS}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$PATH"; exec "$ROOT/usr/bin/bunx" @modelcontextprotocol/server-github',
]
command = "bash"

[mcp_servers.memory]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/flexnetos/FlexNetOS}"; exec "$ROOT/src/envctl/assets/scripts/envctl-mcp-memory-server"',
]
command = "bash"

[mcp_servers.playwright]
args = [
    "-lc",
    'ROOT="${META_ROOT:-/home/flexnetos/FlexNetOS}"; export META_ROOT="$ROOT"; export PATH="$ROOT/usr/bin:$ROOT/.toolchains/.bun/bin:$ROOT/.toolchains/node/bin:$PATH"; exec "$ROOT/usr/bin/bunx" @playwright/mcp@latest --extension',
]
command = "bash"

[mcp_servers.sequential-thinking]
