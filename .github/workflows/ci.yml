name: CI

# Required-check workflow for the `develop` branch. develop is the integration branch and
# GitHub default; once these contexts are required by branch protection, a PR can arm
# auto-merge (`gh pr merge <n> --auto`) and it lands itself fail-closed when they go green.
# CI is the authoritative superset of the local gates.
#
# Feature note: this workspace uses MUTUALLY-EXCLUSIVE cargo features
# (crates/secrets-store-libsql: `remote` ships, `embedded` is an unbuilt placeholder), so CI
# never uses `--all-features` (it would trip the crate's `compile_error!`). Default features
# (= `remote`) are the shipping wiring.

on:
  pull_request:
  push:
    branches: [develop]

# Keep protected develop runs complete, but cancel stale PR/head runs before
# they waste GitHub-hosted minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"        # debuggable backtraces when a CI test panics
  # The repository is checked out below META_ROOT on self-hosted runners, so Cargo
  # discovers META_ROOT/.cargo/config.toml while walking parent directories. Keep CI
  # independent from its optional host-local Wild/Kache acceleration: stale profile
  # paths must not break linking, and a long-lived wrapper daemon must not mix rustc
  # versions inside an otherwise isolated target directory.
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: cc
  CARGO_BUILD_RUSTC_WRAPPER: ""
  RUSTFLAGS: ""
  # loop_lib is consumed at its default branch HEAD (setup-meta-deps.sh default). The old
  # LOOP_LIB_REF pin pointed at a merged+reaped upgrade branch (404) and every job paid a
  # failed fetch + WARN before falling back to exactly this behavior (audit 2026-07-12).

jobs:
  # Operator directive 2026-07-09: LOCAL-FIRST CI IS MANDATORY. Every required context
  # (compile + test + gates) runs on the FlexNetOS self-hosted runners (flexnetos_runner
  # fleet) for all trusted refs — pushes and same-repo PRs. GitHub-hosted ubuntu-latest is
  # FALLBACK ONLY: fork PRs (untrusted code never executes on local runners — these repos
  # are PUBLIC) and the CI_FORCE_HOSTED=1 repo-variable escape hatch for local-runner
  # outages. Enforced fail-closed by ci/gates/runner-routing.sh.
  rustfmt:
    name: rustfmt
    runs-on: ${{ vars.CI_FORCE_HOSTED == '1' && 'ubuntu-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","local","flexnetos"]') || 'ubuntu-latest') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: isolate Cargo target for this persistent-runner job
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/envctl-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: setup meta path dependencies
        env:
          META_DEPS_TOKEN: ${{ secrets.PARENT_REPO_PAT || github.token }}
        run: bash ci/setup-meta-deps.sh
      # Self-hosted runners are pre-provisioned with Rust components; avoid
      # per-job rustup network installs that can fail before the actual check.
      - name: use runner-provisioned rustfmt
        run: |
          rustc --version
          cargo --version
          rustfmt --version
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ${{ vars.CI_FORCE_HOSTED == '1' && 'ubuntu-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","local","flexnetos"]') || 'ubuntu-latest') }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: isolate Cargo target for this persistent-runner job
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/envctl-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: setup meta path dependencies
        env:
          META_DEPS_TOKEN: ${{ secrets.PARENT_REPO_PAT || github.token }}
        run: bash ci/setup-meta-deps.sh
      # Self-hosted runners are pre-provisioned with Rust components; avoid
      # per-job rustup network installs that can fail before the actual check.
      - name: use runner-provisioned clippy
        run: |
          rustc --version
          cargo --version
          cargo clippy --version
      - uses: Swatinem/rust-cache@v2
      # Default features (= `remote`), workspace-wide. No `--all-features` (mutually-exclusive
      # features) and no `--all-targets` (kept a strict superset of the green preflight set).
      - name: cargo clippy --workspace -- -D warnings
        run: cargo clippy --workspace -- -D warnings

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ${{ vars.CI_FORCE_HOSTED == '1' && 'ubuntu-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","local","flexnetos"]') || 'ubuntu-latest') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: isolate Cargo target for this persistent-runner job
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/envctl-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: setup meta path dependencies
        env:
          META_DEPS_TOKEN: ${{ secrets.PARENT_REPO_PAT || github.token }}
        run: bash ci/setup-meta-deps.sh
      # The self-hosted fleet owns an already-provisioned exact 1.89.0 rustup
      # lane under META_ROOT. Hosted runners retain their standard rustup home.
      - name: select the exact MSRV toolchain owner
        env:
          ENVCTL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [ "$ENVCTL_RUNNER_ENVIRONMENT" = self-hosted ]; then
            echo 'CARGO_HOME=/home/flexnetos/meta/.toolchains/cargo' >> "$GITHUB_ENV"
            echo 'RUSTUP_HOME=/home/flexnetos/meta/.toolchains/rustup' >> "$GITHUB_ENV"
            echo '/home/flexnetos/meta/.toolchains/cargo/bin' >> "$GITHUB_PATH"
          fi
      - uses: Swatinem/rust-cache@v2
      # `check`, not `build`: the floor is compiler acceptance for the locked shipping graph.
      # No `--all-features`: crates/secrets-store-libsql has mutually-exclusive store features.
      # `Cargo.toml` declares rust-version=1.89; compile with that exact lane.
      - name: cargo check --workspace --locked (MSRV 1.89 toolchain)
        run: cargo +1.89.0 check --workspace --locked

  cargo-audit:
    name: cargo audit
    runs-on: ${{ vars.CI_FORCE_HOSTED == '1' && 'ubuntu-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","local","flexnetos"]') || 'ubuntu-latest') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: isolate Cargo target for this persistent-runner job
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/envctl-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: setup meta path dependencies
        env:
          META_DEPS_TOKEN: ${{ secrets.PARENT_REPO_PAT || github.token }}
        run: bash ci/setup-meta-deps.sh
      # Self-hosted runners are pre-provisioned with Rust; avoid per-job rustup
      # network installs that can fail before cargo-audit executes.
      - name: use runner-provisioned Rust toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: cargo audit gate
        run: bash ci/gates/cargo-audit.sh

  test:
    name: test
    runs-on: ${{ vars.CI_FORCE_HOSTED == '1' && 'ubuntu-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","local","flexnetos"]') || 'ubuntu-latest') }}
    # Generous but bounded: the cold build dominates and the parallel test run is now substantial
    # (secrets-engine alone ~5 min — the argon2 memory-hard KDF + daemon e2e tests). A real hang
    # (e.g. an await-forever in an e2e stream drain) still fails the check well before the 6h default.
    # NEVER run --test-threads=1 here: the argon2 (memory-hard KDF) crypto tests in
    # secrets-engine/secretd take 20-50s EACH, so serial execution balloons the job to 25-30 min.
    # 30 (was 20): as the suite grew (TASK-0035 grpc e2e, F6 jti, enroll round-trip) the cold-build +
    # parallel-test wall crept to ~18-20 min, so a green run was being CANCELED at the 20-min wall.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: isolate Cargo target for this persistent-runner job
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/envctl-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: setup meta path dependencies
        env:
          META_DEPS_TOKEN: ${{ secrets.PARENT_REPO_PAT || github.token }}
        run: bash ci/setup-meta-deps.sh
      # Self-hosted runners are pre-provisioned with Rust; avoid per-job rustup
      # network installs that can fail before the test suite executes.
      - name: use runner-provisioned Rust toolchain
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      # Parallel (default). The few tests that touch process-global env are made hermetic at the
      # source (locate_walks_up clears $META_FILE; runtime XDG test isolates its own var) so the
      # suite is deterministic without serializing it.
      # TASK-0032: the `low-cost-kdf-tests` feature on envctl-secrets-engine lowers the Argon2 floor
      # + Default params so the memory-hard KDF derivations (which dominated this job) cost ~8 KiB×t1
      # instead of 256 MiB-1 GiB. Cargo feature unification propagates it to secretd/libsql e2e, which
      # inherit the cheap engine. Production crypto is UNCHANGED — every other job (clippy, rustfmt,
      # gates) and all release/manifest builds use default features (full 256 MiB floor); the
      # `kdf-feature-off` gate proves the feature is never a default, and a release build with it set
      # trips a compile_error!.
      - name: cargo test --workspace
        run: cargo test --workspace --features envctl-secrets-engine/low-cost-kdf-tests

  gates:
    name: gates
    runs-on: ${{ vars.CI_FORCE_HOSTED == '1' && 'ubuntu-latest' || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","x64","local","flexnetos"]') || 'ubuntu-latest') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: normalize fail-closed tracked helper modes
        run: chmod 0755 assets/scripts/envctl-sqld-hermetic-cargo.sh
      - name: isolate Cargo target for this persistent-runner job
        run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/envctl-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: setup meta path dependencies
        env:
          META_DEPS_TOKEN: ${{ secrets.PARENT_REPO_PAT || github.token }}
        run: bash ci/setup-meta-deps.sh
      # The gates job runs shell/policy gates, not a compilation gate. On the
      # self-hosted fleet, dtolnay/rust-toolchain@stable may try to reinstall
      # stable under the isolated runner HOME and can fail on transient
      # static.rust-lang.org connectivity before any gate executes. Use the
      # runner-provisioned toolchain and prove it is present instead.
      - name: use runner-provisioned Rust toolchain for shell gates
        run: |
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
      # Fail-closed supply-chain / shape / enable / p7-conformance gates (ci/gates/*.sh).
      - name: runner-routing gate (hybrid hosted/local policy)
        run: bash ci/gates/runner-routing.sh
      - name: no-c gate (no C in the trust boundary)
        run: bash ci/gates/no-c.sh
      - name: meta-substrates gate (loop_lib + meta_plugin_protocol wiring)
        run: bash ci/gates/meta-substrates.sh
      - name: shape gate (TLS / edge module invariants)
        run: bash ci/gates/shape.sh
      - name: enable gate (secretd systemd-unit invariant)
        run: bash ci/gates/enable.sh
      - name: p7-conformance gate (.handoff Tier-A schema + ledger residency)
        run: bash ci/gates/p7.sh
      - name: kdf-feature-off gate (test-speed Argon2 floor must be off by default)
        run: bash ci/gates/kdf-feature-off.sh
      - name: agent-env gate (agent-env.yaml matches agent-env.lock; no kasetto drift)
        env:
          ENVCTL_GATE_ROOT: ${{ github.workspace }}
          ENVCTL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [ "$ENVCTL_RUNNER_ENVIRONMENT" = self-hosted ]; then
            export META_ROOT=/home/flexnetos/meta
            export HOME=/home/flexnetos
          fi
          bash ci/gates/agent-env.sh
      - name: manifest-lock gate (envctl.lock matches manifest without mutation)
        run: bash ci/gates/manifest-lock.sh
      - name: meta-local policy gate (META_ROOT-hosted installs only)
        run: bash ci/gates/meta-local-policy.sh
      - name: add-repo policy gate (owned repos register as .meta.yaml peers, not child components)
        run: bash ci/gates/add-repo-policy.sh
      - name: loop-state gate (forge-loop counter integrity)
        run: bash ci/gates/loop-state.sh
      - name: harness-scripts gate (merge-driver + reaper + loop-state safety invariants)
        run: bash ci/gates/harness-scripts.sh
      - name: yazelix-codex runtime ownership gate (home/.claude + home/.codex user-space drift)
        run: bash ci/gates/yazelix-codex-runtime.sh
      - name: actionlint gate (workflow syntax + custom runner labels; skips if linter absent)
        run: bash ci/gates/actionlint.sh
